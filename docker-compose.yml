# LowenSSH 本地一键启动
# 用法：复制 .env.example 为 .env，填写三个必需密钥，再 docker compose up
services:
  mysql:
    image: mysql:8.4
    environment:
      # root 密码 + 自动建库 lowenssh
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: lowenssh
    ports:
      - "3306:3306"
    volumes:
      # 容器首次启动时在 lowenssh 库执行建表脚本
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      # 指向 mysql 容器（覆盖默认 localhost）
      DB_HOST: mysql
      # 密钥从宿主环境透传，compose 文件里不含明文
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      GLM_API_KEY: ${GLM_API_KEY}
      # AES-GCM 主密钥是生产必填项，缺失时应用按失败关闭原则拒绝启动。
      XWSSH_CRYPTO_KEY: ${XWSSH_CRYPTO_KEY}
      # 密钥轮换时可配置 v2=new,v1=old，并把活动版本切到 v2。
      XWSSH_CRYPTO_KEYS: ${XWSSH_CRYPTO_KEYS:-}
      XWSSH_ACTIVE_CRYPTO_KEY_VERSION: ${XWSSH_ACTIVE_CRYPTO_KEY_VERSION:-v1}
      # Host Key 信任记录放在命名卷中，容器重建后仍然保留。
      XWSSH_KNOWN_HOSTS: /app/security/known_hosts
    volumes:
      - ssh-security:/app/security
    depends_on:
      mysql:
        # 等 MySQL 就绪再启动，避免连接失败
        condition: service_healthy

volumes:
  mysql-data:
  ssh-security:
