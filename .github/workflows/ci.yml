name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: 桌面端（Flutter）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/app
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 拉依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 单测
        run: flutter test
