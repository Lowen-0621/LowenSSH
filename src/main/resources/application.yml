server:
  # 8080 被本机常驻的 Tomcat 占用，换 8081
  port: 8081

spring:
  application:
    name: lowenssh

  # SFTP 上传：默认 1MB 太小，运维传包/日志放宽到 100MB
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 本机 MySQL，库 lowenssh 已建，密码走环境变量 MYSQL_PASSWORD
  datasource:
    # allowPublicKeyRetrieval：MySQL9 默认 caching_sha2 认证，非SSL连接需开此项取公钥加密密码（本地连接安全）
    # DB_HOST：本地直跑默认 localhost；docker-compose 下设为 mysql 指向容器
    url: jdbc:mysql://${DB_HOST:localhost}:3306/lowenssh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      # 模型无关设计：统一走 OpenAI 兼容协议，换模型只改下面三处即可，零代码改动
      #   智谱GLM(当前):  base-url=https://open.bigmodel.cn/api/paas/v4   model=glm-4.6
      #   通义千问:      base-url=https://dashscope.aliyuncs.com/compatible-mode/v1   model=qwen-plus
      #   DeepSeek:     base-url=https://api.deepseek.com   model=deepseek-chat
      # 选 GLM：agent 命门是 tool_call 稳定性，GLM 原生 function calling 口碑最稳；
      # 真测下来若漂，切上面任一个，零代码改动。
      base-url: https://open.bigmodel.cn/api/paas/v4
      # API key 从环境变量读，不要写死在配置里
      api-key: ${GLM_API_KEY}
      chat:
        # GLM 端点是 .../paas/v4/chat/completions，没有 /v1；
        # 覆盖 Spring AI 默认的 /v1/chat/completions，否则会 404
        completions-path: /chat/completions
        options:
          model: glm-4.7
          temperature: 0.7

# 日志：方便看 Spring AI 发出的请求
logging:
  level:
    org.springframework.ai: INFO

# 应用自监控：暴露 health + 关键 metrics 给前端"监控"页读取（仅本机/内网，不鉴权）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 上下文管理（M3）：防止多轮 loop 把模型上下文撑爆
# 联调验证压缩逻辑时把阈值调小即可快速触发：
#   tool-result-max-chars 调到 2000、max-context-tokens 调到 2000
xwssh:
  # 启动时自动建立/迁移业务表；测试可关闭并使用隔离 Schema。
  schema:
    enabled: true
  agent:
    # agentic loop 最大循环轮数，防模型反复调工具停不下来。
    # 注意：轮数直接乘 token——第 N 轮要把前 N-1 轮历史全发一遍，是 O(N²) 累积。
    # 25 对复杂运维够用，又能挡住失控的烧钱长循环。
    max-rounds: 25
    # 会话空闲超时（分钟）：超过这么久没活动的常驻 SSH 连接会被定时回收，防连接泄漏。
    # 设 120（2h）让演示/续聊期间基本不会中途断；断了也能点"新会话"用同样信息秒重连。
    session-idle-timeout-minutes: 120
    # HTTP Idempotency-Key 的响应保留时间；期限内同 Key 同请求返回首次结果，不重复创建任务。
    idempotency-retention: 24h
    # ASK 等待用户决定的默认期限；超时后审批和任务都会持久化为超时状态。
    approval-timeout: 2m
    # 兜底扫描遗留 PENDING 审批；正常等待线程也会在 deadline 到达时主动触发过期 CAS。
    approval-expiry-scan-interval: 5s
    # 整个持久化 Agent 任务的最长执行时间。
    task-timeout: 10m
    # 兜底扫描超过整体截止时间但尚未自行退出的任务。
    task-timeout-scan-interval: 5s
    # 服务重启后扫描非终态任务；EXECUTING 不自动重放，只进入人工复核。
    recovery-initial-delay: 5s
    recovery-scan-interval: 5s
    # 防止模型反复绕路调用工具，达到上限后进入总结。
    max-tool-calls: 30
    # 连续工具失败达到上限后停止继续尝试。
    max-consecutive-failures: 3
  ssh:
    # 建立 SSH Session/Channel 的超时。
    connect-timeout: 10s
    # 单条命令最长执行时间；tail -f、ping、top 等不会无限占用工作线程。
    command-timeout: 30s
    # stdout 与 stderr 共用此字节预算，超限后继续排空但不再增长内存。
    max-output-bytes: 1048576
    # 生产默认严格校验 Host Key；首次连接前必须显式导入并核对指纹。
    strict-host-key-checking: true
    known-hosts-path: ${XWSSH_KNOWN_HOSTS:${user.home}/.lowenssh/known_hosts}
  security:
    # 超长 Shell 难以人工审计，也常用于混淆/注入。
    max-command-length: 4096
    # actionDigest 和审计记录绑定策略版本；规则改变后旧审批不能授权新语义。
    policy-version: v1
  crypto:
    # 生产禁止内置默认密钥。轮换时用 XWSSH_CRYPTO_KEYS=v2=new,v1=old，
    # 并把 active-key-version 切到 v2；旧密文仍按前缀选择 v1 解密。
    allow-insecure-development-key: ${XWSSH_ALLOW_INSECURE_DEV_KEY:false}
    active-key-version: ${XWSSH_ACTIVE_CRYPTO_KEY_VERSION:v1}
  context:
    # Layer 0：最近几条工具结果回灌给模型的最大字符数，超出截掉中段（完整内容仍存 t_message）。
    # 这条最关键：工具结果每轮都重发，留得越大、轮数越多，token 烧得越凶。
    # 3000 字符≈1200token，运维命令输出大多看头尾就够判断，调小立竿见影省钱。
    tool-result-max-chars: 3000
    # Layer 0：更早（保留区之外）的工具结果用更小阈值大力收紧——旧命令模型已读过、结论已在历史里，
    # 没必要每轮全量重发。800 字符≈320token，让上下文不随轮数线性膨胀。
    old-tool-result-max-chars: 800
    # Layer 4：整段上下文估算 token 超此值触发 LLM 压缩历史。
    # 12000 比原来 32000 早压缩，但压缩本身也要调一次模型，不宜过小，否则频繁压缩反而费钱。
    max-context-tokens: 12000
    # Layer 4：压缩时保留最近多少条消息原文（不进摘要）
    keep-recent-messages: 4
    # Layer 4：摘要 LLM 连续失败达此次数后熔断，停止压缩裸跑兜底
    circuit-limit: 3

# MyBatis-Plus：开发期打印 SQL 方便调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
