(\n                key: const ValueKey('lock'),\n                onUnlocked: () => setState(() => _unlocked = true),\n              ),\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["通过锁或运行标记避免共享资源被并发操作。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"src/main/java/com/lowenssh/LowenSshApplication.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:20,order:0,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:14,endLine:15,code:'/**\n * LowenSSH 启动类 —— AI SSH 智能运维 Agent\n */\n@SpringBootApplication\n@EnableScheduling  // 开启定时任务：SessionManager 定时回收超时的常驻 SSH 连接\n@MapperScan("com.lowenssh.persistence.mapper")  // 扫描 MyBatis Mapper 接口\npublic class LowenSshApplication {',purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"main",kind:"方法 / 函数",startLine:16,endLine:18,code:"public static void main(String[] args) {\n        SpringApplication.run(LowenSshApplication.class, args);\n    }",purpose:"应用入口：完成框架初始化并启动顶层应用。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/pubspec.yaml",layer:"Flutter 配置",summary:"依赖与构建清单，定义技术栈边界",lineCount:99,order:1,logicBlocks:[{name:"environment",kind:"配置分组",startLine:21,endLine:29,code:"environment:\n  sdk: ^3.12.1\n\n# Dependencies specify other packages that your package needs in order to work.\n# To automatically upgrade your package dependencies to the latest versions\n# consider running `flutter pub upgrade --major-versions`. Alternatively,\n# dependencies can be manually updated by changing the version numbers below to\n# the latest version available on pub.dev. To see which dependencies have newer\n# versions available, run `flutter pub outdated`.",purpose:"配置“environment”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"dependencies",kind:"配置分组",startLine:30,en 、终端 TUI 和桌面应用三种独立运行形态。"],risks:[]}]},{path:"pom.xml",layer:"工程与文档",summary:"依赖与构建清单，定义技术栈边界",lineCount:99,order:1,logicBlocks:[{name:"依赖与构建边界",kind:"工程配置",startLine:1,endLine:99,code:'<?xml version="1.0" encoding="UTF-8"?>\n<project xmlns="http://maven.apache.org/POM/4.0.0"\n         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">\n    <modelVersion>4.0.0</modelVersion>\n\n    <parent>\n        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-starter-parent</artifactId>\n        <version>3.4.3</version>\n        <relativePath/>\n    </parent>\n\n    <groupId>com.lowenssh</groupId>\n    <artifactId>lowenssh</artifactId>\n    <version>0.0.1-SNAPSHOT</version>\n    <name>lowenssh</name>\n    <description>AI SSH 智能运维 Agent</description>\n\n    <properties>\n        <java.version>17</java.version>\n        \x3c!-- Spring AI 版本，按 MVP 计划用 1.1.5；BOM 统一管理 --\x3e\n        <spring-ai.version>1.1.5</spring-ai.version>\n    </properties>\n\n    <dependencyManagement>\n        <dependencies>\n            <dependency>\n                <groupId>org.springframework.ai</groupId>\n                <artifactId>spring-ai-bom</artifactId>\n                <version>${spring-ai.version}</version>\n                <type>pom</type>\n                <scope>import</scope>\n            </dependency>\n        </dependencies>\n    </dependencyManagement>\n\n    <dependencies>\n        \x3c!-- Web：REST 接口 + 后续 WebSocket --\x3e\n        <dependency>\n            <groupId>org.springframework.boot</groupId>\n            <artifactId>spring-boot-starter-web</artifactId>\n        </dependency>\n\n        \x3c!-- Actuator：应用自监控（健康检查 + JVM/HTTP 指标），配合 Micrometer 暴露 metrics --\x3e\n        <dependency>\n            <groupId>org.springframework.boot</groupId>\n            <artifactId>spring-boot-starter-actuator</artifactId>\n        </dependency>\n\n        \x3c!-- Spring AI：走 OpenAI 兼容协议对接 DeepSeek --\x3e\n        <dependency>\n            <groupId>org.springframework.ai</groupId>\n            <artifactId>spring-ai-starter-model-openai</artifactId>\n        </dependency>\n\n        \x3c!-- SSH/SFTP 客户端（M1 第二步用，先引入备用） --\x3e\n        <dependency>\n            <groupId>com.github.mwiede</groupId>\n            <artifactId>jsch</artifactId>\n            <version>0.2.21</version>\n        </dependency>\n\n        <dependency>\n            <groupId>org.springframework.boot</groupId>\n            <artifactId>spring-boot-starter-test</artifactId>\n            <scope>test</scope>\n        </dependency>\n\n        \x3c!-- 持久化：MyBatis-Plus + MySQL 驱动 --\x3e\n        <dependency>\n            <groupId>com.baomidou</groupId>\n            <artifactId>mybatis-plus-spring-boot3-starter</artifactId>\n            <version>3.5.9</version>\n        </dependency>\n        <dependency>\n            <groupId>com.mysql</groupId>\n            <artifactId>mysql-connector-j</artifactId>\n            <scope>runtime</scope>\n        </dependency>\n\n        \x3c!-- Lombok：消除实体 getter/setter 样板，Java 后端事实标准 --\x3e\n        <dependency>\n            <groupId>org.projectlombok</groupId>\n            <artifactId>lombok</artifactId>\n            <optional>true</optional>\n        </dependency>\n    </dependencies>\n\n    <build>\n        <plugins>\n            <plugin>\n                <groupId>org.springframework.boot</groupId>\n                <artifactId>spring-boot-maven-plugin</artifactId>\n            </plugin>\n        </plugins>\n    </build>\n</project>',purpose:"声明运行时依赖、开发工具、版本要求与构建命令，确定该子项目的技术边界。",steps:["解析项目元信息与语言版本。","安装运行依赖和开发依赖。","由构建工具执行测试、编译或打包。"],designNotes:["依赖选择分别服务于后端 API、终端 TUI 和桌面应用三种独立运行形态。"],risks:[]}]},{path:"src/main/resources/application.yml",layer:"后端配置",summary:"Spring Boot、数据源、模型、监控与上下文参数配置",lineCount:90,order:1,logicBlocks:[{name:"server",kind:"配置分组",startLine:1,endLine:4,code:"server:\n  # 8080 被本机常驻的 Tomcat 占用，换 8081\n  port: 8081",purpose:"配置“server”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"spring",kind:"配置分组",startLine:5,endLine:43,code:"spring:\n  application:\n    name: lowenssh\n\n  # SFTP 上传：默认 1MB 太小，运维传包/日志放宽到 100MB\n  servlet:\n    multipart:\n      max-file-size: 100MB\n      max-request-size: 100MB\n\n  # 本机 MySQL，库 lowenssh 已建，密码走环境变量 MYSQL_PASSWORD\n  datasource:\n    # allowPublicKeyRetrieval：MySQL9 默认 caching_sha2 认证，非SSL连接需开此项取公钥加密密码（本地连接安全）\n    # DB_HOST：本地直跑默认 localhost；docker-compose 下设为 mysql 指向容器\n    url: jdbc:mysql://${DB_HOST:localhost}:3306/lowenssh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8\n    username: root\n    password: ${MYSQL_PASSWORD}\n    driver-class-name: com.mysql.cj.jdbc.Driver\n\n  ai:\n    openai:\n      # 模型无关设计：统一走 OpenAI 兼容协议，换模型只改下面三处即可，零代码改动\n      #   智谱GLM(当前):  base-url=https://open.bigmodel.cn/api/paas/v4   model=glm-4.6\n      #   通义千问:      base-url=https://dashscope.aliyuncs.com/compatible-mode/v1   model=qwen-plus\n      #   DeepSeek:     base-url=https://api.deepseek.com   model=deepseek-chat\n      # 选 GLM：agent 命门是 tool_call 稳定性，GLM 原生 function calling 口碑最稳；\n      # 真测下来若漂，切上面任一个，零代码改动。\n      base-url: https://open.bigmodel.cn/api/paas/v4\n      # API key 从环境变量读，不要写死在配置里\n      api-key: ${GLM_API_KEY}\n      chat:\n        # GLM 端点是 .../paas/v4/chat/completions，没有 /v1；\n        # 覆盖 Spring AI 默认的 /v1/chat/completions，否则会 404\n        completions-path: /chat/completions\n        options:\n          model: glm-4.7\n          temperature: 0.7\n\n# 日志：方便看 Spring AI 发出的请求",purpose:"配置“spring”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"logging",kind:"配置分组",startLine:44,endLine:48,code:'logging:\n  level:\n    org.springframework.ai: INFO\n\n# 应用自监控：暴露 health + 关键 metrics 给前端"监控"页读取（仅本机/内网，不鉴权）',purpose:"配置“logging”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"management",kind:"配置分组",startLine:49,endLine:60,code:"management:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics\n  endpoint:\n    health:\n      show-details: always\n\n# 上下文管理（M3）：防止多轮 loop 把模型上下文撑爆\n# 联调验证压缩逻辑时把阈值调小即可快速触发：\n#   tool-result-max-chars 调到 2000、max-context-tokens 调到 2000",purpose:"配置“management”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"xwssh",kind:"配置分组",startLine:61,endLine:86,code:'xwssh:\n  agent:\n    # agentic loop 最大循环轮数，防模型反复调工具停不下来。\n    # 注意：轮数直接乘 token——第 N 轮要把前 N-1 轮历史全发一遍，是 O(N²) 累积。\n    # 25 对复杂运维够用，又能挡住失控的烧钱长循环。\n    max-rounds: 25\n    # 会话空闲超时（分钟）：超过这么久没活动的常驻 SSH 连接会被定时回收，防连接泄漏。\n    # 设 120（2h）让演示/续聊期间基本不会中途断；断了也能点"新会话"用同样信息秒重连。\n    session-idle-timeout-minutes: 120\n  context:\n    # Layer 0：最近几条工具结果回灌给模型的最大字符数，超出截掉中段（完整内容仍存 t_message）。\n    # 这条最关键：工具结果每轮都重发，留得越大、轮数越多，token 烧得越凶。\n    # 3000 字符≈1200token，运维命令输出大多看头尾就够判断，调小立竿见影省钱。\n    tool-result-max-chars: 3000\n    # Layer 0：更早（保留区之外）的工具结果用更小阈值大力收紧——旧命令模型已读过、结论已在历史里，\n    # 没必要每轮全量重发。800 字符≈320token，让上下文不随轮数线性膨胀。\n    old-tool-result-max-chars: 800\n    # Layer 4：整段上下文估算 token 超此值触发 LLM 压缩历史。\n    # 12000 比原来 32000 早压缩，但压缩本身也要调一次模型，不宜过小，否则频繁压缩反而费钱。\n    max-context-tokens: 12000\n    # Layer 4：压缩时保留最近多少条消息原文（不进摘要）\n    keep-recent-messages: 4\n    # Layer 4：摘要 LLM 连续失败达此次数后熔断，停止压缩裸跑兜底\n    circuit-limit: 3\n\n# MyBatis-Plus：开发期打印 SQL 方便调试',purpose:"配置“xwssh”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]},{name:"mybatis-plus",kind:"配置分组",startLine:87,endLine:90,code:"mybatis-plus:\n  configuration:\n    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl",purpose:"配置“mybatis-plus”相关的运行参数，并允许通过环境变量或默认值适配不同部署环境。",steps:["声明配置层级与默认值。","由框架在启动时绑定到对应组件或依赖。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/AgentController.java",layer:"Java 后端",summary:"Agent REST/SSE 接口与会话首轮/续聊编排",lineCount:188,order:2,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:34,endLine:42,code:"/**\n * Agent 接口。\n *\n * 流式端点支持多轮对话：\n *  - 首轮：sessionId 为空，带 host/port/user/password，SessionManager 建会话 + 连一次 SSH，\n *    把连接常驻；先回 session_ready 事件把 sessionId 给前端。\n *  - 续聊：sessionId 非空，复用该会话的常驻连接（保留 cd 等上下文），历史从库里回灌给模型。\n *\n * 连接生命周期归 SessionManager 管（超时回收 / 显式关闭），不再随单次请求开关。\n */\n@RestController\npublic class AgentController {\n\n    private final AgentService agentService;\n    private final SessionManager sessionManager;\n    private final SessionMapper sessionMapper;\n    private final AuditService auditService;\n    private final MessageService messageService;\n    private final CommandGuard guard;",purpose:"Agent REST/SSE 接口与会话首轮/续聊编排。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"AgentController",kind:"方法 / 函数",startLine:43,endLine:52,code:"public AgentController(AgentService agentService, SessionManager sessionManager,\n                           SessionMapper sessionMapper, AuditService auditService,\n                           MessageService messageService, CommandGuard guard) {\n        this.agentService = agentService;\n        this.sessionManager = sessionManager;\n        this.sessionMapper = sessionMapper;\n        this.auditService = auditService;\n        this.messageService = messageService;\n        this.guard = guard;\n    }",purpose:"接口方法“AgentController”：校验/转换请求，调用领域服务并组织对外响应。",steps:["在副作用发生前执行安全策略判断。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"sessions",kind:"方法 / 函数",startLine:56,endLine:73,code:'/**\n     * 列出会话，按更新时间倒序（左侧历史栏用）。\n     * 带 hostId 则只列该主机的会话（历史按主机隔离）；不带则列全部（兼容旧调用）。\n     * 只读查库，不碰 SSH。\n     */\n    @GetMapping("/api/agent/sessions")\n    public List<SessionDto.SessionItem> sessions(\n            @org.springframework.web.bind.annotation.RequestParam(value = "hostId", required = false) Long hostId) {\n        LambdaQueryWrapper<SessionEntity> wrapper = new LambdaQueryWrapper<SessionEntity>()\n                .eq(hostId != null, SessionEntity::getHostId, hostId)\n                .orderByDesc(SessionEntity::getUpdatedAt)\n                .orderByDesc(SessionEntity::getId);  // updatedAt 为空时退而按 id 排\n        return sessionMapper.selectList(wrapper).stream()\n                .map(s -> new SessionDto.SessionItem(\n                        s.getId(), s.getTitle(), s.getSshHost(), s.getSshUser(), s.getSshPort(),\n                        s.getUpdatedAt() == null ? null : s.getUpdatedAt().format(TS_FMT)))\n                .toList();\n    }',purpose:"接口方法“sessions”：校验/转换请求，调用领域服务并组织对外响应。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"sessionMessages",kind:"方法 / 函数",startLine:75,endLine:90,code:'/**\n     * 拉某会话的历史消息 + 连接信息 + 常驻连接是否存活（左栏点开旧会话回看用）。\n     * live=true 表示常驻连接还在，可直接续聊；false 则前端提示需重连。\n     * 只读查库 + 查内存连接状态，不碰 SSH 执行。\n     */\n    @GetMapping("/api/agent/sessions/{id}/messages")\n    public SessionDto.SessionDetail sessionMessages(@PathVariable("id") Long id) {\n        SessionEntity s = sessionMapper.selectById(id);\n        if (s == null) {\n            return new SessionDto.SessionDetail(id, null, null, null, false, List.of());\n        }\n        boolean live = sessionManager.get(id) != null;\n        return new SessionDto.SessionDetail(\n                id, s.getSshHost(), s.getSshPort(), s.getSshUser(), live,\n                messageService.loadHistoryForView(id));\n    }',purpose:"接口方法“sessionMessages”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"run",kind:"方法 / 函数",startLine:92,endLine:114,code:'@PostMapping("/api/agent/run")\n    public String run(@RequestBody RunRequest req) {\n        int port = req.port() == 0 ? 22 : req.port();\n\n        // 先建会话拿 id：审计要 session_id 关联\n        SessionEntity session = new SessionEntity();\n        session.setTitle(SessionManager.toTitle(req.task()));\n        session.setSshHost(req.host());\n        session.setSshPort(port);\n        session.setSshUser(req.user());\n        sessionMapper.insert(session);\n        Long sessionId = session.getId();\n\n        // try-with-resources：loop 跑完自动关连接（同步接口是一次性测试用，不参与多轮常驻）\n        try (SshClient ssh = new SshClient()) {\n            ssh.connect(req.host(), port, req.user(), req.password());\n            SshTools tools = new SshTools(ssh, sessionId, auditService, guard);\n            // REST 场景用自动确认：deny 已被门禁拦死，ask 态自动放行以便自动化测试\n            return agentService.run(sessionId, req.task(), tools, new AutoConfirmationHandler());\n        } catch (Exception e) {\n            return "任务执行失败: " + e.getMessage();\n        }\n    }',purpose:"执行 Agentic Loop：反复让模型决策、调用工具、回灌结果，直到产生最终结论或达到轮数上限。",steps:["在副作用发生前执行安全策略判断。","读写持久化状态，使会话、配置或审计能够恢复。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"stream",kind:"方法 / 函数",startLine:116,endLine:173,code:'/**\n     * 流式 + 多轮：用 SSE 把 agent 执行过程逐事件吐出来。\n     *\n     * 首轮（curl 示例，sessionId 不传）：\n     *   curl -N -X POST http://localhost:8081/api/agent/stream \\\n     *     -H \'Content-Type: application/json\' \\\n     *     -d \'{"host":"1.2.3.4","user":"root","password":"xxx","task":"看下根分区还剩多少空间"}\'\n     * 续聊：带上首轮拿到的 sessionId，连接信息可省：\n     *     -d \'{"sessionId":1,"task":"那内存呢"}\'\n     *\n     * 连接由 SessionManager 常驻，这里不再 doFinally 关连接。\n     */\n    @PostMapping(value = "/api/agent/stream", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n    public Flux<ServerSentEvent<AgentEvent>> stream(@RequestBody RunRequest req) {\n        SessionManager.LiveSession live;\n        boolean firstTurn = req.sessionId() == null;\n\n        if (firstTurn) {\n            // 首轮：复用进主机时建好的预连接；没有（curl 直连）则现连一次。再落库建会话行（title=任务摘要）。\n            int port = req.port() == 0 ? 22 : req.port();\n            try {\n                live = sessionManager.getByHost(req.hostId());\n                if (live == null) {\n                    live = sessionManager.connectHost(req.hostId(), req.host(), port, req.user(), req.password());\n                }\n            } catch (Exception e) {\n                return Flux.just(sse(new AgentEvent.Error("SSH 连接失败: " + e.getMessage())));\n            }\n            // 落库与连接分开归类：落库失败不能误报成连接失败，否则排查方向全错\n            try {\n                sessionManager.attachSession(live, req.task());\n            } catch (Exception e) {\n                return Flux.just(sse(new AgentEvent.Error("创建会话失败: " + e.getMessage())));\n            }\n        } else {\n            // 续聊：取常驻连接；不存在/已过期则提示前端重连\n            live = sessionManager.get(req.sessionId());\n            if (live == null) {\n                return Flux.just(sse(new AgentEvent.SessionExpired(req.sessionId(),\n                        "常驻连接已断开（空闲超时回收），请在右侧开新会话重连")));\n            }\n        }\n\n        Long sessionId = live.sessionId();\n        // 每轮新建 SshTools，但底层复用 manager 里同一个常驻 SshClient（保留 cd 等上下文）。\n        // 传 live.lock() 让 SFTP 工具与人工面板/监控串行化，避免抢同一条 Session。\n        SshTools tools = new SshTools(live.ssh(), sessionId, auditService, guard, live.lock());\n\n        Flux<ServerSentEvent<AgentEvent>> events = agentService\n                .runStream(sessionId, req.task(), tools, new AutoConfirmationHandler())\n                .map(this::sse);\n\n        // 首轮在事件流最前面插一个 session_ready，把 sessionId 交给前端用于后续续聊\n        if (firstTurn) {\n            events = Flux.concat(Flux.just(sse(new AgentEvent.SessionReady(sessionId))), events);\n        }\n        return events;\n    }',purpose:"建立流式执行链，把模型增量、工具调用、拦截和完成状态实时推送给客户端。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","在副作用发生前执行安全策略判断。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["使用事件流解耦耗时任务与展示层，调用方无需等待完整任务结束。","显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"sse",kind:"方法 / 函数",startLine:175,endLine:181,code:"/** 把领域事件包成 SSE：event 名取事件 type，方便前端按类型分发 */\n    private ServerSentEvent<AgentEvent> sse(AgentEvent event) {\n        return ServerSentEvent.<AgentEvent>builder()\n                .event(event.type())\n                .data(event)\n                .build();\n    }",purpose:"接口方法“sse”：校验/转换请求，调用领域服务并组织对外响应。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/HostController.java",layer:"Java 后端",summary:"主机簿 CRUD、密码加解密与预连接入口",lineCount:111,order:2,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:29,endLine:34,code:"/**\n * 主机簿接口 —— 管理常用服务器 + 进入主机时建立连接。\n *\n *  - GET    /api/hosts            列出主机（不回传密码）\n *  - POST   /api/hosts            新增主机（密码 AES 加密落库）\n *  - DELETE /api/hosts/{id}       删除主机\n *  - POST   /api/hosts/{id}/connect  进入主机：解密密码 → 建/复用常驻连接 → 回 sessionId\n *\n * 密码只在 connect 时解密用一次去连 SSH，不回传前端、不落明文。\n */\n@RestController\npublic class HostController {\n\n    private final HostMapper hostMapper;\n    private final SessionManager sessionManager;\n    private final CryptoUtil crypto;",purpose:"主机簿 CRUD、密码加解密与预连接入口。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"HostController",kind:"方法 / 函数",startLine:35,endLine:39,code:"public HostController(HostMapper hostMapper, SessionManager sessionManager, CryptoUtil crypto) {\n        this.hostMapper = hostMapper;\n        this.sessionManager = sessionManager;\n        this.crypto = crypto;\n    }",purpose:"接口方法“HostController”：校验/转换请求，调用领域服务并组织对外响应。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"list",kind:"方法 / 函数",startLine:41,endLine:52,code:'/** 列主机，按更新时间倒序。hasPassword 标记是否存了密码（迁移出的老主机没有，前端提示补填）。 */\n    @GetMapping("/api/hosts")\n    public List<HostDto.HostItem> list() {\n        LambdaQueryWrapper<HostEntity> wrapper = new LambdaQueryWrapper<HostEntity>()\n                .orderByDesc(HostEntity::getUpdatedAt)\n                .orderByDesc(HostEntity::getId);\n        return hostMapper.selectList(wrapper).stream()\n                .map(h -> new HostDto.HostItem(\n                        h.getId(), h.getAlias(), h.getSshHost(), h.getSshPort(), h.getSshUser(),\n                        h.getPasswordEnc() != null && !h.getPasswordEnc().isBlank()))\n                .toList();\n    }',purpose:"接口方法“list”：校验/转换请求，调用领域服务并组织对外响应。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"create",kind:"方法 / 函数",startLine:54,endLine:66,code:'/** 新增主机：密码加密存。返回新主机 id。 */\n    @PostMapping("/api/hosts")\n    public HostDto.HostItem create(@RequestBody HostDto.CreateRequest req) {\n        HostEntity h = new HostEntity();\n        h.setAlias(req.alias());\n        h.setSshHost(req.host());\n        h.setSshPort(req.port() == null || req.port() == 0 ? 22 : req.port());\n        h.setSshUser(req.user());\n        h.setPasswordEnc(crypto.encrypt(req.password()));  // 明文不落库\n        hostMapper.insert(h);\n        return new HostDto.HostItem(h.getId(), h.getAlias(), h.getSshHost(), h.getSshPort(),\n                h.getSshUser(), h.getPasswordEnc() != null);\n    }',purpose:"接口方法“create”：校验/转换请求，调用领域服务并组织对外响应。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"delete",kind:"方法 / 函数",startLine:68,endLine:73,code:'/** 删除主机（历史会话仍在库里，只是从主机簿移除入口） */\n    @DeleteMapping("/api/hosts/{id}")\n    public ResponseEntity<Void> delete(@PathVariable("id") Long id) {\n        hostMapper.deleteById(id);\n        return ResponseEntity.noContent().build();\n    }',purpose:"接口方法“delete”：校验/转换请求，调用领域服务并组织对外响应。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"connect",kind:"方法 / 函数",startLine:75,endLine:109,code:'/**\n     * 进入主机：解密密码连一次 SSH（或复用该主机已活预连接），只建连不落库。\n     * 会话行延迟到首条任务才建（lazy create），所以这里返回的 sessionId 恒为 null。\n     * 没存密码（迁移出的老主机）则要求前端带 password 进来补连。\n     */\n    @PostMapping("/api/hosts/{id}/connect")\n    public ResponseEntity<?> connect(@PathVariable("id") Long id,\n                                     @RequestBody(required = false) HostDto.ConnectRequest req) {\n        HostEntity h = hostMapper.selectById(id);\n        if (h == null) {\n            return ResponseEntity.status(404).body(new HostDto.ConnectResult(null, "主机不存在"));\n        }\n        // 优先用库里存的密码；没存则用前端补填的\n        String password;\n        try {\n            String stored = crypto.decrypt(h.getPasswordEnc());\n            password = (stored != null && !stored.isBlank())\n                    ? stored\n                    : (req == null ? null : req.password());\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(new HostDto.ConnectResult(null, "密码解密失败，请重新保存主机密码"));\n        }\n        if (password == null || password.isBlank()) {\n            return ResponseEntity.status(400).body(new HostDto.ConnectResult(null, "该主机未保存密码，请补填密码后连接"));\n        }\n\n        try {\n            sessionManager.connectHost(\n                    id, h.getSshHost(), h.getSshPort() == null ? 22 : h.getSshPort(), h.getSshUser(), password);\n            // 只建连不落库，sessionId 留给首条任务时 attach；这里回 null 表示「连上了，等首条任务」\n            return ResponseEntity.ok(new HostDto.ConnectResult(null, null));\n        } catch (Exception e) {\n            return ResponseEntity.status(502).body(new HostDto.ConnectResult(null, "SSH 连接失败: " + e.getMessage()));\n        }\n    }',purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/MonitorController.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:43,order:2,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:18,endLine:21,code:"/**\n * 远程主机监控接口（给人用）：前端轮询拉一次快照，自己在内存里攒历史画趋势。\n *\n *  - GET /api/monitor/{hostId}/metrics  采集一次 CPU/内存/磁盘/负载/uptime\n *\n * 复用主机常驻连接，lock 串行化，避免和 SFTP/Agent 抢同一 Session。\n */\n@RestController\npublic class MonitorController {\n\n    private final SessionManager sessionManager;",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"MonitorController",kind:"方法 / 函数",startLine:22,endLine:24,code:"public MonitorController(SessionManager sessionManager) {\n        this.sessionManager = sessionManager;\n    }",purpose:"接口方法“MonitorController”：校验/转换请求，调用领域服务并组织对外响应。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"metrics",kind:"方法 / 函数",startLine:26,endLine:41,code:'@GetMapping("/api/monitor/{hostId}/metrics")\n    public ResponseEntity<?> metrics(@PathVariable("hostId") Long hostId) {\n        SessionManager.LiveSession ls = sessionManager.getByHost(hostId);\n        if (ls == null) {\n            return ResponseEntity.status(409).body(Map.of("error", "该主机未连接，请先从主机簿进入"));\n        }\n        ls.lock().lock();\n        try {\n            HostMetrics m = MetricsCollector.collect(ls.ssh());\n            return ResponseEntity.ok(m);\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "采集失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n    }',purpose:"接口方法“metrics”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/SftpController.java",layer:"Java 后端",summary:"SFTP API/状态管理与按主机隔离",lineCount:154,order:2,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:37,endLine:40,code:"/**\n * SFTP 文件管理接口（给人用）—— 复用主机的常驻 SSH 连接开 sftp 通道，不重连。\n *\n *  - GET    /api/sftp/{hostId}/list?path=/xxx     列目录\n *  - POST   /api/sftp/{hostId}/upload             上传（multipart：file + path）\n *  - GET    /api/sftp/{hostId}/download?path=/xxx 下载（流式）\n *  - DELETE /api/sftp/{hostId}/file?path=/xxx     删除文件\n *  - POST   /api/sftp/{hostId}/mkdir              建目录（body: {path}）\n *\n * 关键：SFTP / Agent 命令 / 监控共用同一条 JSch Session，必须用 LiveSession.lock()\n * 串行化，否则 channel 会串数据。每个接口都在 lock 内操作。\n */\n@RestController\npublic class SftpController {\n\n    private final SessionManager sessionManager;",purpose:"SFTP API/状态管理与按主机隔离。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"SftpController",kind:"方法 / 函数",startLine:41,endLine:43,code:"public SftpController(SessionManager sessionManager) {\n        this.sessionManager = sessionManager;\n    }",purpose:"接口方法“SftpController”：校验/转换请求，调用领域服务并组织对外响应。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"live",kind:"方法 / 函数",startLine:45,endLine:48,code:"/** 取该主机的常驻连接，没连上返回 null */\n    private SessionManager.LiveSession live(Long hostId) {\n        return sessionManager.getByHost(hostId);\n    }",purpose:"接口方法“live”：校验/转换请求，调用领域服务并组织对外响应。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"list",kind:"方法 / 函数",startLine:50,endLine:65,code:'/** 列目录 */\n    @GetMapping("/api/sftp/{hostId}/list")\n    public ResponseEntity<?> list(@PathVariable("hostId") Long hostId,\n                                  @RequestParam(value = "path", defaultValue = "/") String path) {\n        SessionManager.LiveSession ls = live(hostId);\n        if (ls == null) return notConnected();\n        ls.lock().lock();\n        try {\n            List<RemoteFile> files = ls.ssh().listDir(path);\n            return ResponseEntity.ok(Map.of("path", path, "files", files));\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "列目录失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n    }',purpose:"接口方法“list”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"upload",kind:"方法 / 函数",startLine:67,endLine:84,code:'/** 上传文件到指定目录 */\n    @PostMapping("/api/sftp/{hostId}/upload")\n    public ResponseEntity<?> upload(@PathVariable("hostId") Long hostId,\n                                    @RequestParam("file") MultipartFile file,\n                                    @RequestParam("path") String dir) {\n        SessionManager.LiveSession ls = live(hostId);\n        if (ls == null) return notConnected();\n        String remote = (dir.endsWith("/") ? dir : dir + "/") + file.getOriginalFilename();\n        ls.lock().lock();\n        try {\n            ls.ssh().upload(file.getInputStream(), remote);\n            return ResponseEntity.ok(Map.of("path", remote));\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "上传失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n    }',purpose:"接口方法“upload”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"download",kind:"方法 / 函数",startLine:86,endLine:110,code:'/** 下载文件。先在 lock 内读进内存再返回，避免流式期间长期占着 lock。 */\n    @GetMapping("/api/sftp/{hostId}/download")\n    public ResponseEntity<?> download(@PathVariable("hostId") Long hostId,\n                                      @RequestParam("path") String path) {\n        SessionManager.LiveSession ls = live(hostId);\n        if (ls == null) return notConnected();\n        ByteArrayOutputStream buf = new ByteArrayOutputStream();\n        ls.lock().lock();\n        try {\n            ls.ssh().download(path, buf);\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "下载失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n        String name = path.substring(path.lastIndexOf(\'/\') + 1);\n        byte[] data = buf.toByteArray();\n        HttpHeaders headers = new HttpHeaders();\n        headers.setContentDisposition(ContentDisposition.attachment().filename(name).build());\n        return ResponseEntity.ok()\n                .headers(headers)\n                .contentType(MediaType.APPLICATION_OCTET_STREAM)\n                .contentLength(data.length)\n                .body(new InputStreamResource(new ByteArrayInputStream(data)));\n    }',purpose:"接口方法“download”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:["命令缺少超时/输出上限时，可能长时间占线程或内存。"]},{name:"delete",kind:"方法 / 函数",startLine:112,endLine:127,code:'/** 删除文件 */\n    @DeleteMapping("/api/sftp/{hostId}/file")\n    public ResponseEntity<?> delete(@PathVariable("hostId") Long hostId,\n                                    @RequestParam("path") String path) {\n        SessionManager.LiveSession ls = live(hostId);\n        if (ls == null) return notConnected();\n        ls.lock().lock();\n        try {\n            ls.ssh().deleteFile(path);\n            return ResponseEntity.noContent().build();\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "删除失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n    }',purpose:"接口方法“delete”：校验/转换请求，调用领域服务并组织对外响应。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"mkdir",kind:"方法 / 函数",startLine:129,endLine:148,code:'/** 新建目录 */\n    @PostMapping("/api/sftp/{hostId}/mkdir")\n    public ResponseEntity<?> mkdir(@PathVariable("hostId") Long hostId,\n                                   @RequestBody Map<String, String> body) {\n        String path = body.get("path");\n        if (path == null || path.isBlank()) {\n            return ResponseEntity.status(400).body(Map.of("error", "path 不能为空"));\n        }\n        SessionManager.LiveSession ls = live(hostId);\n        if (ls == null) return notConnected();\n        ls.lock().lock();\n        try {\n            ls.ssh().mkdir(path);\n            return ResponseEntity.ok(Map.of("path", path));\n        } catch (Exception e) {\n            return ResponseEntity.status(500).body(Map.of("error", "建目录失败: " + e.getMessage()));\n        } finally {\n            ls.lock().unlock();\n        }\n    }',purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"notConnected",kind:"方法 / 函数",startLine:150,endLine:152,code:'private ResponseEntity<?> notConnected() {\n        return ResponseEntity.status(409).body(Map.of("error", "该主机未连接，请先从主机簿进入"));\n    }',purpose:"接口方法“notConnected”：校验/转换请求，调用领域服务并组织对外响应。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/SessionManager.java",layer:"Java 后端",summary:"会话生命周期：常驻连接、懒建会话、锁与超时回收",lineCount:237,order:3,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:36,endLine:50,code:"/**\n * 会话管理器 —— 支撑多轮对话的「连接常驻」：\n * 进主机时连一次 SSH，把连接挂成「预连接」常驻，首条任务到来才落库建会话行（lazy create），\n * 后续轮复用同一连接（保留 cd 等上下文），会话结束或超时无活动才关闭。\n *\n * 为什么 lazy create：进主机就建会话行会堆出一堆没消息、没标题的空会话。改成\n * 「进主机只连不落库，首条任务才落库（title=任务）」，标题和消息天然落在同一个 sessionId 上。\n *\n * 两张表：\n *   byHost   —— 进主机建的预连接（hostId→连接），还没发首条任务，sessionId 仍为 null。\n *   bySession —— 首条任务 attach 后的正式会话（sessionId→连接），续聊按它查。\n * 一条预连接首条任务后从 byHost 移出、登记进 bySession，不会同时在两张表里。\n *\n * 并发：SshClient 非线程安全。每个 LiveSession 自带一把锁，同一会话的多个请求串行执行。\n * 连接泄漏防护：@Scheduled 定时扫两张表，关掉超时无活动的连接。\n */\n@Component\npublic class SessionManager {\n\n    private static final Logger log = LoggerFactory.getLogger(SessionManager.class);\n\n    private final SessionMapper sessionMapper;\n\n    /** 会话空闲超时（分钟）：超过这么久没活动的连接会被定时任务回收 */\n    private final long idleTimeoutMinutes;\n\n    /** hostId -> 进主机时建的预连接（已连 SSH、未发首条任务）。首条任务 attach 后移出。 */\n    private final Map<Long, LiveSession> byHost = new ConcurrentHashMap<>();\n\n    /** sessionId -> 已绑定会话的活连接，续聊按它查。 */\n    private final Map<Long, LiveSession> bySession = new ConcurrentHashMap<>();",purpose:"会话生命周期：常驻连接、懒建会话、锁与超时回收。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"SessionManager",kind:"方法 / 函数",startLine:51,endLine:55,code:'public SessionManager(SessionMapper sessionMapper,\n                          @Value("${xwssh.agent.session-idle-timeout-minutes:30}") long idleTimeoutMinutes) {\n        this.sessionMapper = sessionMapper;\n        this.idleTimeoutMinutes = idleTimeoutMinutes;\n    }',purpose:"实现“SessionManager”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"sessionId",kind:"方法 / 函数",startLine:80,endLine:82,code:"public Long sessionId() {\n            return sessionId;\n        }",purpose:"封装“sessionId”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"hostId",kind:"方法 / 函数",startLine:84,endLine:86,code:"public Long hostId() {\n            return hostId;\n        }",purpose:"封装“hostId”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"ssh",kind:"方法 / 函数",startLine:88,endLine:90,code:"public SshClient ssh() {\n            return ssh;\n        }",purpose:"封装“ssh”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"lock",kind:"方法 / 函数",startLine:92,endLine:94,code:"public ReentrantLock lock() {\n            return lock;\n        }",purpose:"封装“lock”对应的业务计算，并向调用方返回处理结果。",steps:["通过锁或运行标记避免共享资源被并发操作。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。"],risks:[]},{name:"connectHost",kind:"方法 / 函数",startLine:101,endLine:128,code:'/**\n     * 进主机：复用该主机的预连接（若仍连通），否则连一次 SSH 建预连接。不落库。\n     * 真正的会话行延迟到首条任务 attachSession 时才插，避免堆空会话。\n     * hostId 为 null（curl 直连调试）时不进 byHost，连完直接返回。\n     * 连接失败抛异常，调用方转成 error 事件。\n     */\n    public LiveSession connectHost(Long hostId, String host, int port, String user, String password) throws Exception {\n        if (hostId != null) {\n            LiveSession existing = byHost.get(hostId);\n            if (existing != null && existing.ssh.isConnected()) {\n                existing.touch();\n                return existing;  // 复用该主机现有预连接\n            }\n        }\n        SshClient ssh = new SshClient();\n        try {\n            ssh.connect(host, port, user, password);\n        } catch (Exception e) {\n            ssh.close();\n            throw e;\n        }\n        LiveSession live = new LiveSession(hostId, host, port, user, ssh);\n        if (hostId != null) {\n            byHost.put(hostId, live);\n        }\n        log.info("预连接已建立 hostId={} host={}", hostId, host);\n        return live;\n    }',purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"getByHost",kind:"方法 / 函数",startLine:130,endLine:141,code:"/** 取该主机进主机时建的预连接（尚未发首条任务）；无或已断返回 null。 */\n    public LiveSession getByHost(Long hostId) {\n        if (hostId == null) {\n            return null;\n        }\n        LiveSession live = byHost.get(hostId);\n        if (live != null && live.ssh.isConnected()) {\n            live.touch();\n            return live;\n        }\n        return null;\n    }",purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"attachSession",kind:"方法 / 函数",startLine:143,endLine:164,code:'/**\n     * 首条任务：把预连接升级为正式会话 —— 落库拿 sessionId（title=首条任务），\n     * 回填到 live、移出 byHost、登记进 bySession。返回 sessionId。\n     */\n    public Long attachSession(LiveSession live, String task) {\n        SessionEntity session = new SessionEntity();\n        session.setHostId(live.hostId);\n        session.setTitle(toTitle(task));  // 标题是会话名摘要，截断防超列长（title VARCHAR(255)）\n        session.setSshHost(live.host);\n        session.setSshPort(live.port);\n        session.setSshUser(live.user);\n        sessionMapper.insert(session);\n        Long sessionId = session.getId();\n\n        live.sessionId = sessionId;\n        if (live.hostId != null) {\n            byHost.remove(live.hostId, live);  // 出预连接槽（仅当仍是当前预连接）\n        }\n        bySession.put(sessionId, live);\n        log.info("会话已绑定 sessionId={} hostId={} 当前活跃会话数={}", sessionId, live.hostId, bySession.size());\n        return sessionId;\n    }',purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["根据输入、连接或业务状态选择处理分支。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toTitle",kind:"方法 / 函数",startLine:166,endLine:174,code:'/** 任务文本压成会话标题：取首行、超 40 字截断加省略号，远小于 title 列上限避免落库截断报错 */\n    public static String toTitle(String task) {\n        if (task == null) return "新会话";\n        String t = task.strip();\n        int nl = t.indexOf(\'\\n\');\n        if (nl >= 0) t = t.substring(0, nl).strip();\n        if (t.isEmpty()) return "新会话";\n        return t.length() > 40 ? t.substring(0, 40) + "…" : t;\n    }',purpose:"封装“toTitle”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"get",kind:"方法 / 函数",startLine:176,endLine:193,code:'/**\n     * 续聊：取已绑定会话的常驻连接。\n     * 返回 null 表示会话不存在或已过期（前端据此提示重新连接）。\n     */\n    public LiveSession get(Long sessionId) {\n        LiveSession live = bySession.get(sessionId);\n        if (live == null) {\n            return null;\n        }\n        // 连接可能已被对端断开，校验一下\n        if (!live.ssh.isConnected()) {\n            log.warn("会话连接已断开 sessionId={}，移除", sessionId);\n            close(sessionId);\n            return null;\n        }\n        live.touch();\n        return live;\n    }',purpose:"封装“get”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"close",kind:"方法 / 函数",startLine:195,endLine:205,code:'/** 关闭并移除一个会话（显式结束 / 连接失效时调用） */\n    public void close(Long sessionId) {\n        LiveSession live = bySession.remove(sessionId);\n        if (live != null) {\n            live.ssh.close();\n            if (live.hostId != null) {\n                byHost.remove(live.hostId, live);\n            }\n            log.info("会话已关闭 sessionId={} 剩余活跃会话数={}", sessionId, bySession.size());\n        }\n    }',purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"reapIdleSessions",kind:"方法 / 函数",startLine:207,endLine:215,code:'/** 定时回收超时无活动的连接（含从未发任务的预连接），防连接泄漏。每 5 分钟扫一次。 */\n    @Scheduled(fixedDelay = 5 * 60 * 1000)\n    public void reapIdleSessions() {\n        Instant deadline = Instant.now().minus(Duration.ofMinutes(idleTimeoutMinutes));\n        int reaped = reap(byHost, deadline) + reap(bySession, deadline);\n        if (reaped > 0) {\n            log.info("回收超时连接 {} 个，剩余活跃会话 {} 个", reaped, bySession.size());\n        }\n    }',purpose:"实现“reapIdleSessions”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"reap",kind:"方法 / 函数",startLine:217,endLine:230,code:"/** 扫一张表，关掉超时或已断开的连接 */\n    private int reap(Map<Long, LiveSession> map, Instant deadline) {\n        Iterator<Map.Entry<Long, LiveSession>> it = map.entrySet().iterator();\n        int reaped = 0;\n        while (it.hasNext()) {\n            LiveSession live = it.next().getValue();\n            if (live.lastActiveAt.isBefore(deadline) || !live.ssh.isConnected()) {\n                live.ssh.close();\n                it.remove();\n                reaped++;\n            }\n        }\n        return reaped;\n    }",purpose:"封装“reap”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"activeCount",kind:"方法 / 函数",startLine:232,endLine:235,code:"/** 当前活跃会话数（监控/测试用） */\n    public int activeCount() {\n        return bySession.size();\n    }",purpose:"封装“activeCount”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/SessionManagerTest.java",layer:"Java 测试",summary:"会话生命周期：常驻连接、懒建会话、锁与超时回收",lineCount:106,order:3,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:24,endLine:27,code:"/**\n * SessionManager 单测 —— open() 要连真 SSH，这里不测；聚焦不依赖真连接的逻辑：\n * get（命中/不存在/连接已断）、close（关连接 + 幂等）、reap（回收超时/断开会话）。\n *\n * 用反射把 mock 的 LiveSession 塞进内部 map，绕开 open() 的真实 SSH 连接。\n */\nclass SessionManagerTest {\n\n    private final SessionMapper sessionMapper = mock(SessionMapper.class);",purpose:"会话生命周期：常驻连接、懒建会话、锁与超时回收。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"sessionsOf",kind:"方法 / 函数",startLine:28,endLine:34,code:'/** 反射取出内部 bySession map（已绑定会话的活连接） */\n    @SuppressWarnings("unchecked")\n    private Map<Long, SessionManager.LiveSession> sessionsOf(SessionManager mgr) throws Exception {\n        Field f = SessionManager.class.getDeclaredField("bySession");\n        f.setAccessible(true);\n        return (Map<Long, SessionManager.LiveSession>) f.get(mgr);\n    }',purpose:"测试场景“sessionsOf”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"injectSession",kind:"方法 / 函数",startLine:36,endLine:44,code:'/** 造一个挂了 mock SshClient 的 LiveSession（回填 sessionId）并塞进 manager */\n    private SshClient injectSession(SessionManager mgr, Long id, boolean connected) throws Exception {\n        SshClient ssh = mock(SshClient.class);\n        when(ssh.isConnected()).thenReturn(connected);\n        SessionManager.LiveSession live = new SessionManager.LiveSession(1L, "h", 22, "root", ssh);\n        live.sessionId = id;\n        sessionsOf(mgr).put(id, live);\n        return ssh;\n    }',purpose:"测试场景“injectSession”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/core/agent.dart",layer:"Flutter 核心",summary:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流",lineCount:311,order:4,logicBlocks:[{name:"_runTool",kind:"方法 / 函数",startLine:94,endLine:118,code:"/// 执行一个工具调用，返回喂回模型的文本结果。只读工具直接跑；execCommand 已过门禁。\nFuture<String> _runTool(SshClient ssh, String name, Map<String, dynamic> args) async {\n  try {\n    switch (name) {\n      case 'execCommand':\n        return _formatExec(await ssh.exec((args['command'] ?? '').toString()));\n      case 'readRemoteFile':\n        return _formatExec(await ssh.exec(\"cat '${args['path']}'\"));\n      case 'tailLog':\n        final lines = (args['lines'] as num?)?.toInt() ?? 100;\n        return _formatExec(await ssh.exec(\"tail -n $lines '${args['path']}'\"));\n      case 'listFiles':\n        final files = await ssh.listDir((args['path'] ?? '').toString());\n        if (files.isEmpty) return '（空目录）${args['path']}';\n        final lines = files.map((f) =>\n            '${f.isDir ? '[d]' : '[f]'} ${f.name}  ${f.isDir ? '-' : '${f.size}B'}  ${f.perms}');\n        return '目录 ${args['path']} 共 ${files.length} 项:\\n${lines.join('\\n')}';\n      default:\n        return '未知工具: $name';\n    }\n  } catch (e) {\n    // 工具内部异常不抛给 loop，作为\"工具结果\"回灌，让模型知道这步失败\n    return '命令执行异常: $e';\n  }\n}",purpose:"封装“_runTool”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"_formatExec",kind:"方法 / 函数",startLine:120,endLine:125,code:"String _formatExec(ExecResult r) {\n  var s = 'exitCode=${r.exitCode}\\n';\n  if (r.stdout.isNotEmpty) s += 'stdout:\\n${r.stdout}';\n  if (r.stderr.isNotEmpty) s += 'stderr:\\n${r.stderr}';\n  return s;\n}",purpose:"封装“_formatExec”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_extractCommand",kind:"方法 / 函数",startLine:127,endLine:135,code:"/// 从 tool_call 参数 JSON 取出 command 字段\nString _extractCommand(String argsJson) {\n  try {\n    final obj = jsonDecode(argsJson) as Map<String, dynamic>;\n    return obj['command'] as String? ?? '';\n  } catch (_) {\n    return '';\n  }\n}",purpose:"封装“_extractCommand”对应的业务计算，并向调用方返回处理结果。",steps:["捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"runAgent",kind:"方法 / 函数",startLine:160,endLine:169,code:"/// 跑一轮 agent 任务，返回实时事件流。\n/// 用 StreamController 让 token/reasoning 在到达时立即推给 UI（真流式），\n/// 而非攒到整轮结束再一次性吐出。loop 跑完或抛错都会 close → 触发 onDone。\nStream<AgentEvent> runAgent(String task, AgentDeps deps) {\n  late final StreamController<AgentEvent> controller;\n  controller = StreamController<AgentEvent>(\n    onListen: () => _runLoop(task, deps, controller),\n  );\n  return controller.stream;\n}",purpose:"执行 Agentic Loop：反复让模型决策、调用工具、回灌结果，直到产生最终结论或达到轮数上限。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:["使用事件流解耦耗时任务与展示层，调用方无需等待完整任务结束。"],risks:[]},{name:"_runLoop",kind:"方法 / 函数",startLine:171,endLine:258,code:"Future<void> _runLoop(\n  String task,\n  AgentDeps deps,\n  StreamController<AgentEvent> out,\n) async {\n  final llm = deps.llm;\n  final ssh = deps.ssh;\n  final ctx = ContextManager(llm);\n\n  // 本轮 user 输入，先暂存；本轮新增的 assistant/tool 消息累加到 newTurn，\n  // 结束时一次性回写 deps.history，供下一轮续聊（修复多轮历史从不落回的 bug）。\n  final userMsg = ChatMessage.user(task);\n  final newTurn = <ChatMessage>[userMsg];\n\n  var messages = <ChatMessage>[\n    ChatMessage.system(systemPrompt),\n    ...(deps.history ?? const []),\n    userMsg,\n  ];\n\n  try {\n    for (var round = 1; round <= maxRounds; round++) {\n      // 进模型前整理上下文：Layer 0 截断 + Layer 4 压缩\n      messages = ctx.truncateToolResponses(messages);\n      messages = await ctx.compressIfNeeded(messages);\n\n      // 一次流式调用：token/reasoning 实时推给 UI\n      final result = await llm.stream(\n        messages,\n        tools,\n        StreamHandlers(\n          onToken: (t) => out.add(TokenEvent(t)),\n          onReasoning: (t) => out.add(ReasoningEvent(t)),\n        ),\n      );\n\n      // 没有 tool_call：模型给出最终结论，结束。\n      // 正文通常已通过 TokenEvent 流式显示，DoneEvent 仅作结束信号，UI 层去重。\n      if (result.toolCalls.isEmpty) {\n        // GLM 有时把最终结论全放进 reasoning_content、正文 content 为空。\n        // 这种情况下用 reasoning 兜底作为结论，并补发 TokenEvent 让它显示成正文，\n        // 否则结论只会留在折叠的思考块里（用户看不到结果）。\n        var finalText = result.text.trim();\n        if (finalText.isEmpty && result.reasoning.trim().isNotEmpty) {\n          finalText = result.reasoning.trim();\n          out.add(TokenEvent(finalText));\n        }\n        if (finalText.isNotEmpty) {\n          newTurn.add(ChatMessage.assistant(finalText));\n        }\n        deps.history?.addAll(newTurn);\n        out.add(DoneEvent(finalText));\n        return;\n      }\n\n      // 落 assistant（文字 + tool_calls）\n      final assistant = ChatMessage.assistant(\n        result.text.isNotEmpty ? result.text : null,\n        toolCalls: result.toolCalls,\n      );\n      // 先把本轮要调的工具吐出去\n      for (final call in result.toolCalls) {\n        out.add(ToolCallEvent(call.name, call.arguments));\n      }\n\n      // —— 门禁预检 + 执行（事件实时 add）——\n      final toolResponses = <ChatMessage>[];\n      for (final call in result.toolCalls) {\n        final r = await _screenAndRun(call, ssh, deps.confirmer, out.add);\n        toolResponses.add(ChatMessage.tool(call.id, r.content));\n      }\n\n      // 回灌历史：assistant + 所有 tool 结果（被拒的也回灌\"拒绝\"文本，让模型换方案）\n      messages.add(assistant);\n      messages.addAll(toolResponses);\n      // 同步累加到本轮新增，供结束时回写 deps.history\n      newTurn.add(assistant);\n      newTurn.addAll(toolResponses);\n    }\n\n    deps.history?.addAll(newTurn);\n    out.add(DoneEvent('已达到最大循环轮数（$maxRounds），任务可能未完成。请拆分任务后重试。'));\n  } catch (e) {\n    out.add(ErrorEvent(e.toString()));\n  } finally {\n    await out.close();\n  }\n}",purpose:"执行 Agentic Loop：反复让模型决策、调用工具、回灌结果，直到产生最终结论或达到轮数上限。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["使用事件流解耦耗时任务与展示层，调用方无需等待完整任务结束。","核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"_screenAndRun",kind:"方法 / 函数",startLine:260,endLine:306,code:"/// 对单个 tool_call 过门禁并执行。通过 emit 推 blocked / tool_result 事件。\nFuture<_ScreenResult> _screenAndRun(\n  ToolCall call,\n  SshClient ssh,\n  Confirmer confirmer,\n  void Function(AgentEvent) emit,\n) async {\n  final name = call.name;\n  Map<String, dynamic> args = {};\n  try {\n    args = jsonDecode(call.arguments) as Map<String, dynamic>;\n  } catch (_) {\n    // 参数解析失败，交给工具自己处理（会报错回灌）\n  }\n\n  // 非 execCommand 的工具（读文件/看日志/列目录）只读，直接放行\n  if (name != _execTool) {\n    final content = await _runTool(ssh, name, args);\n    emit(ToolResultEvent(name, _summarize(content), true));\n    return _ScreenResult(content, false);\n  }\n\n  final command = _extractCommand(call.arguments);\n  final verdict = evaluate(command);\n\n  if (verdict.decision == Decision.deny) {\n    final reason = verdict.reason;\n    emit(BlockedEvent(command, reason));\n    // 同时回填工具卡，停止其转圈并标记为未执行（已阻止）\n    emit(ToolResultEvent(name, '已被安全门禁阻止', false));\n    return _ScreenResult('命令被安全门禁拒绝执行（$reason）。请改用更安全的方式。', true);\n  }\n\n  if (verdict.decision == Decision.ask) {\n    final ok = await confirmer(command, verdict.reason);\n    if (!ok) {\n      emit(BlockedEvent(command, '用户拒绝: ${verdict.reason}'));\n      emit(ToolResultEvent(name, '用户拒绝执行', false));\n      return const _ScreenResult('用户拒绝执行该命令。请换一种方式或询问用户。', true);\n    }\n  }\n\n  // ALLOW 或 ASK 已批准：执行\n  final content = await _runTool(ssh, name, args);\n  emit(ToolResultEvent(name, _summarize(content), true));\n  return _ScreenResult(content, false);\n}",purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","在副作用发生前执行安全策略判断。","发送类型化事件，驱动调用方或界面实时更新。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"_summarize",kind:"方法 / 函数",startLine:308,endLine:309,code:"/// 工具结果摘要：超 500 字符截断（仅用于事件展示，回灌给模型的是完整内容）\nString _summarize(String data) =>",purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/agent_provider.dart",layer:"Flutter 状态",summary:"桌面端 Agent 会话状态、事件归并、确认桥与历史管理",lineCount:479,order:4,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:14,endLine:31,code:'/// UI 对话项类型 —— 对应 ai_pane 的几种卡片\nenum ChatItemKind { user, assistant, reasoning, tool, blocked, ask }\n\n/// UI 对话项（一条对话流里的一个气泡/卡片）\nclass ChatItem {\n  final ChatItemKind kind;\n  String text; // 正文（assistant/user/reasoning/blocked.reason）\n  // tool 卡专用\n  final String? toolName;\n  String? toolArgs;\n  String? toolResult;\n  bool toolExecuted;\n  // blocked/ask 卡专用\n  final String? command;\n  final String? reason;\n  // reasoning 专用：开始时刻 + 思考耗时（秒），用于折叠标题"思考 Xs"\n  final DateTime? reasoningStart;\n  int? reasoningSec;',purpose:"桌面端 Agent 会话状态、事件归并、确认桥与历史管理。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"ChatItem",kind:"方法 / 函数",startLine:32,endLine:43,code:"ChatItem({\n    required this.kind,\n    this.text = '',\n    this.toolName,\n    this.toolArgs,\n    this.toolResult,\n    this.toolExecuted = false,\n    this.command,\n    this.reason,\n    this.reasoningStart,\n    this.reasoningSec,\n  });",purpose:"状态方法“ChatItem”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:45,endLine:56,code:"/// 持久化序列化。reasoningStart 是运行时计时用，不存（存结果 reasoningSec 即可）。\n  Map<String, dynamic> toJson() => {\n        'kind': kind.name,\n        'text': text,\n        if (toolName != null) 'toolName': toolName,\n        if (toolArgs != null) 'toolArgs': toolArgs,\n        if (toolResult != null) 'toolResult': toolResult,\n        'toolExecuted': toolExecuted,\n        if (command != null) 'command': command,\n        if (reason != null) 'reason': reason,\n        if (reasoningSec != null) 'reasoningSec': reasoningSec,\n      };",purpose:"状态方法“toJson”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"PendingAsk",kind:"方法 / 函数",startLine:76,endLine:106,code:"PendingAsk(this.command, this.reason) : completer = Completer<bool>();\n}\n\n/// 会话状态\nclass AgentState {\n  final List<ChatItem> items;\n  final bool running;\n  final PendingAsk? pendingAsk; // 非 null 时 UI 显示确认卡\n  final String? error;\n\n  const AgentState({\n    this.items = const [],\n    this.running = false,\n    this.pendingAsk,\n    this.error,\n  });\n\n  AgentState copyWith({\n    List<ChatItem>? items,\n    bool? running,\n    PendingAsk? pendingAsk,\n    bool clearPending = false,\n    String? error,\n  }) =>\n      AgentState(\n        items: items ?? this.items,\n        running: running ?? this.running,\n        pendingAsk: clearPending ? null : (pendingAsk ?? this.pendingAsk),\n        error: error,\n      );\n}",purpose:"状态方法“PendingAsk”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"build",kind:"UI 生命周期",startLine:128,endLine:142,code:"@override\n  AgentState build() {\n    // 监听主机切换：切到哪台就把 state 换成那台会话的快照\n    ref.listen(connectionProvider.select((s) => s.host?.id), (prev, next) {\n      _currentHostId = next;\n      _syncState();\n    });\n    _currentHostId = ref.read(connectionProvider).host?.id;\n    ref.onDispose(() {\n      for (final s in _sessions.values) {\n        s.sub?.cancel();\n      }\n    });\n    return _snapshot(_currentHostId);\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_persist",kind:"方法 / 函数",startLine:155,endLine:160,code:"/// 把某主机会话落盘（每轮结束/中断后调用）\n  void _persist(String hostId) {\n    final s = _sessions[hostId];\n    if (s == null) return;\n    saveChat(hostId, s.items, s.history);\n  }",purpose:"状态方法“_persist”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"isBusy",kind:"方法 / 函数",startLine:162,endLine:163,code:"/// 某主机是否有 AI 任务正在运行（供连接池 LRU 判断「忙的不踢」）\n  bool isBusy(String hostId) => _sessions[hostId]?.running ?? false;",purpose:"状态方法“isBusy”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_hostName",kind:"方法 / 函数",startLine:165,endLine:174,code:"/// 取主机显示名（别名优先），用于审计标注来源\n  String _hostName(String hostId) {\n    final cfg = ref.read(configProvider);\n    for (final h in cfg.hosts) {\n      if (h.id == hostId) {\n        return h.alias?.isNotEmpty == true ? h.alias! : h.host;\n      }\n    }\n    return hostId;\n  }",purpose:"状态方法“_hostName”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_readableCmd",kind:"方法 / 函数",startLine:176,endLine:188,code:"/// 从工具名 + 参数 JSON 提取可读命令，用于审计展示。\n  /// execCommand 取 command；只读工具取 path；解析失败退回工具名。\n  String _readableCmd(String tool, String? argsJson) {\n    if (argsJson == null) return tool;\n    try {\n      final obj = jsonDecode(argsJson) as Map<String, dynamic>;\n      final cmd = obj['command'] ?? obj['path'];\n      if (cmd != null) return tool == 'execCommand' ? '$cmd' : '$tool: $cmd';\n      return tool;\n    } catch (_) {\n      return tool;\n    }\n  }",purpose:"状态方法“_readableCmd”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"_snapshot",kind:"方法 / 函数",startLine:190,endLine:200,code:"/// 把某会话投影成对外 AgentState（会触发懒加载，恢复落盘的对话）\n  AgentState _snapshot(String? hostId) {\n    if (hostId == null) return const AgentState();\n    final s = _session(hostId); // 首次访问自动从磁盘恢复\n    return AgentState(\n      items: s.items,\n      running: s.running,\n      pendingAsk: s.pendingAsk,\n      error: s.error,\n    );\n  }",purpose:"状态方法“_snapshot”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_refreshIfCurrent",kind:"方法 / 函数",startLine:202,endLine:205,code:"/// 若传入的 hostId 正是当前展示主机，则刷新对外 state（驱动 UI 重建）\n  void _refreshIfCurrent(String hostId) {\n    if (hostId == _currentHostId) _syncState();\n  }",purpose:"状态方法“_refreshIfCurrent”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"_syncState",kind:"方法 / 函数",startLine:207,endLine:210,code:"/// 用当前展示主机的会话刷新对外 state\n  void _syncState() {\n    state = _snapshot(_currentHostId);\n  }",purpose:"状态方法“_syncState”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"send",kind:"方法 / 函数",startLine:212,endLine:264,code:"/// 用户发送一条运维任务（落到当前展示主机的会话）\n  Future<void> send(String task) async {\n    if (task.trim().isEmpty) return;\n\n    final conn = ref.read(connectionProvider);\n    final hostId = conn.host?.id;\n    if (hostId == null || !conn.isConnected) {\n      // 未连接：临时挂一条阻断提示到当前会话（若有），否则忽略\n      if (hostId != null) {\n        final s = _session(hostId);\n        s.items.add(ChatItem(\n            kind: ChatItemKind.blocked,\n            command: task,\n            reason: '尚未连接主机，请先在左栏选择并连接一台主机。'));\n        _refreshIfCurrent(hostId);\n      }\n      return;\n    }\n\n    final s = _session(hostId);\n    if (s.running) return; // 该主机已有任务在跑\n\n    final cfg = ref.read(configProvider);\n    // 记录撤回点（user 气泡之前），中断时回到这里\n    s.undoMark = s.items.length;\n    s.items.add(ChatItem(kind: ChatItemKind.user, text: task));\n    s.running = true;\n    s.error = null;\n    _refreshIfCurrent(hostId);\n\n    final deps = AgentDeps(\n      llm: GlmClient(cfg.llm),\n      ssh: conn.client!,\n      confirmer: (cmd, reason) => _confirm(hostId, cmd, reason), // ASK 桥接（绑定 hostId）\n      history: s.history,\n    );\n\n    // 消费事件流：所有回调绑定 hostId，写进对应会话\n    s.sub = runAgent(task, deps).listen(\n      (ev) => _onEvent(hostId, ev),\n      onError: (e) {\n        s.error = e.toString();\n        s.running = false;\n        _refreshIfCurrent(hostId);\n        _persist(hostId); // 出错也落盘（保留已产生的对话）\n      },\n      onDone: () {\n        s.running = false;\n        _refreshIfCurrent(hostId);\n        _persist(hostId); // 一轮结束落盘\n      },\n    );\n  }",purpose:"接收用户输入并触发对应业务流程，同时管理忙碌、错误和结果状态。",steps:["根据输入、连接或业务状态选择处理分支。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"_confirm",kind:"方法 / 函数",startLine:266,endLine:273,code:"/// Confirmer：loop 遇到 ASK 命令时调用，挂起等 UI 决断\n  Future<bool> _confirm(String hostId, String command, String reason) {\n    ref.read(guardProvider.notifier).recordAsk(); // 记一次待确认\n    final ask = PendingAsk(command, reason);\n    _session(hostId).pendingAsk = ask;\n    _refreshIfCurrent(hostId);\n    return ask.completer.future;\n  }",purpose:"状态方法“_confirm”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"resolveAsk",kind:"方法 / 函数",startLine:275,endLine:285,code:"/// UI 点击 ASK 卡片的「允许/拒绝」（作用于当前展示主机）\n  void resolveAsk(bool allow) {\n    final hostId = _currentHostId;\n    if (hostId == null) return;\n    final s = _sessions[hostId];\n    final ask = s?.pendingAsk;\n    if (s == null || ask == null || ask.completer.isCompleted) return;\n    ask.completer.complete(allow);\n    s.pendingAsk = null;\n    _refreshIfCurrent(hostId);\n  }",purpose:"状态方法“resolveAsk”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"abort",kind:"方法 / 函数",startLine:287,endLine:308,code:"/// 中断当前展示主机的任务：停止流，撤回本轮的用户输入与 AI 输出\n  void abort() {\n    final hostId = _currentHostId;\n    if (hostId == null) return;\n    final s = _sessions[hostId];\n    if (s == null) return;\n    s.sub?.cancel();\n    s.sub = null;\n    // 若有挂起确认，按拒绝处理\n    final ask = s.pendingAsk;\n    if (ask != null && !ask.completer.isCompleted) {\n      ask.completer.complete(false);\n    }\n    s.pendingAsk = null;\n    // 撤回到本轮发送前的对话项\n    if (s.undoMark <= s.items.length) {\n      s.items.removeRange(s.undoMark, s.items.length);\n    }\n    s.running = false;\n    _refreshIfCurrent(hostId);\n    _persist(hostId); // 撤回后落盘（与磁盘保持一致）\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_onEvent",kind:"方法 / 函数",startLine:310,endLine:368,code:"// 把 core 事件映射成 UI 对话项，写进指定 hostId 的会话\n  void _onEvent(String hostId, AgentEvent ev) {\n    final s = _sessions[hostId];\n    if (s == null) return;\n    // reasoning 块在下一个非 reasoning 事件到来时定格耗时，避免一直显示「思考中…」\n    if (ev is! ReasoningEvent) _sealReasoning(s);\n    switch (ev) {\n      case ReasoningEvent(:final text):\n        _appendOrExtend(hostId, s, ChatItemKind.reasoning, text);\n      case TokenEvent(:final text):\n        _appendOrExtend(hostId, s, ChatItemKind.assistant, text);\n      case ToolCallEvent(:final name, :final args):\n        s.items.add(ChatItem(\n            kind: ChatItemKind.tool, toolName: name, toolArgs: args));\n        _refreshIfCurrent(hostId);\n      case ToolResultEvent(:final name, :final summary, :final executed):\n        // 回填最近一个同名 tool 卡，并取出其命令文本用于审计\n        String? auditCmd;\n        for (var i = s.items.length - 1; i >= 0; i--) {\n          if (s.items[i].kind == ChatItemKind.tool &&\n              s.items[i].toolName == name &&\n              s.items[i].toolResult == null) {\n            s.items[i].toolResult = summary;\n            s.items[i].toolExecuted = executed;\n            auditCmd = _readableCmd(name, s.items[i].toolArgs);\n            break;\n          }\n        }\n        if (executed) {\n          // 成功执行计入已放行 + 落审计（带具体命令）\n          ref.read(guardProvider.notifier).recordAllow(\n              auditCmd ?? name,\n              host: _hostName(hostId));\n        }\n        _refreshIfCurrent(hostId);\n      case BlockedEvent(:final command, :final reason):\n        ref\n            .read(guardProvider.notifier)\n            .recordDeny(command, host: _hostName(hostId)); // 计入已阻止+历史+审计\n        s.items.add(ChatItem(\n            kind: ChatItemKind.blocked, command: command, reason: reason));\n        _refreshIfCurrent(hostId);\n      case DoneEvent(:final finalText):\n        final t = finalText.trim();\n        if (t.isEmpty) break; // 空结论：正文已流式显示完，无需追加\n        // 去重：若最后一条 assistant 正文已是同样内容（流式已显示过），不再重复追加\n        final last = s.items.isNotEmpty ? s.items.last : null;\n        if (last != null &&\n            last.kind == ChatItemKind.assistant &&\n            last.text.trim() == t) {\n          break;\n        }\n        s.items.add(ChatItem(kind: ChatItemKind.assistant, text: t));\n        _refreshIfCurrent(hostId);\n      case ErrorEvent(:final message):\n        s.error = message;\n        _refreshIfCurrent(hostId);\n    }\n  }",purpose:"状态方法“_onEvent”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"_sealReasoning",kind:"方法 / 函数",startLine:370,endLine:387,code:"/// 定格最后一个 reasoning 块的耗时（思考结束、转入工具/正文时调用）。\n  /// 避免「思考中…」不消失：用 reasoningStart 算最终秒数，不足 1 秒按 1 秒计。\n  /// 顺便丢弃纯空白的思考块（GLM 偶尔吐单个换行的空 reasoning，会显示成空白块）。\n  void _sealReasoning(_HostSession s) {\n    if (s.items.isEmpty) return;\n    final last = s.items.last;\n    if (last.kind != ChatItemKind.reasoning) return;\n    if (last.text.trim().isEmpty) {\n      s.items.removeLast(); // 空思考块，丢弃\n      return;\n    }\n    if (last.reasoningStart != null) {\n      final sec = DateTime.now().difference(last.reasoningStart!).inSeconds;\n      last.reasoningSec = sec < 1 ? 1 : sec;\n    } else {\n      last.reasoningSec ??= 1;\n    }\n  }",purpose:"状态方法“_sealReasoning”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_appendOrExtend",kind:"方法 / 函数",startLine:389,endLine:410,code:"/// 同类型连续增量（reasoning/assistant 流式 token）拼到末尾同类项。\n  /// reasoning 额外记录开始时刻并实时更新耗时（秒）。\n  void _appendOrExtend(\n      String hostId, _HostSession s, ChatItemKind kind, String delta) {\n    final items = s.items;\n    if (items.isNotEmpty && items.last.kind == kind) {\n      items.last.text += delta;\n      if (kind == ChatItemKind.reasoning && items.last.reasoningStart != null) {\n        items.last.reasoningSec =\n            DateTime.now().difference(items.last.reasoningStart!).inSeconds;\n      }\n    } else {\n      items.add(ChatItem(\n        kind: kind,\n        text: delta,\n        reasoningStart:\n            kind == ChatItemKind.reasoning ? DateTime.now() : null,\n        reasoningSec: kind == ChatItemKind.reasoning ? 0 : null,\n      ));\n    }\n    _refreshIfCurrent(hostId);\n  }",purpose:"状态方法“_appendOrExtend”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"archiveAndClear",kind:"方法 / 函数",startLine:412,endLine:429,code:"/// 关闭智能体面板：把当前展示主机的会话归档到历史，然后清空当前会话。\n  /// 当前会话存盘(chat_store)也一并清空，重启后当前会话为空（历史仍在）。\n  void archiveAndClear() {\n    final hostId = _currentHostId;\n    if (hostId == null) return;\n    final s = _sessions[hostId];\n    if (s == null) return;\n    if (s.running) return; // 任务运行中不归档，避免截断\n    // 有内容才归档\n    if (s.items.isNotEmpty) {\n      appendAgentHistory(hostId, List.of(s.items), List.of(s.history));\n    }\n    s.items.clear();\n    s.history.clear();\n    s.error = null;\n    _persist(hostId); // 清空当前会话存档\n    _refreshIfCurrent(hostId);\n  }",purpose:"状态方法“archiveAndClear”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"historyEntries",kind:"方法 / 函数",startLine:431,endLine:436,code:"/// 读取当前展示主机的历史会话列表（供历史面板展示）。\n  List<AgentHistoryEntry> historyEntries() {\n    final hostId = _currentHostId;\n    if (hostId == null) return [];\n    return loadAgentHistory(hostId);\n  }",purpose:"状态方法“historyEntries”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"restoreHistory",kind:"方法 / 函数",startLine:438,endLine:466,code:"/// 从历史恢复一条会话到当前会话（先把当前会话归档，避免覆盖丢失）。\n  void restoreHistory(String entryId) {\n    final hostId = _currentHostId;\n    if (hostId == null) return;\n    final s = _session(hostId);\n    if (s.running) return;\n    final entries = loadAgentHistory(hostId);\n    AgentHistoryEntry? target;\n    for (final e in entries) {\n      if (e.id == entryId) {\n        target = e;\n        break;\n      }\n    }\n    if (target == null) return;\n    // 当前会话非空则先归档，再载入历史\n    if (s.items.isNotEmpty) {\n      appendAgentHistory(hostId, List.of(s.items), List.of(s.history));\n    }\n    s.items\n      ..clear()\n      ..addAll(target.items);\n    s.history\n      ..clear()\n      ..addAll(target.history);\n    s.error = null;\n    _persist(hostId);\n    _refreshIfCurrent(hostId);\n  }",purpose:"状态方法“restoreHistory”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"deleteHistory",kind:"方法 / 函数",startLine:468,endLine:474,code:"/// 删除一条历史会话。\n  void deleteHistory(String entryId) {\n    final hostId = _currentHostId;\n    if (hostId == null) return;\n    deleteAgentHistoryEntry(hostId, entryId);\n    _refreshIfCurrent(hostId);\n  }",purpose:"状态方法“deleteHistory”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/core/agent.ts",layer:"CLI",summary:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流",lineCount:291,order:4,logicBlocks:[{name:"runTool",kind:"方法 / 函数",startLine:104,endLine:135,code:"/** 执行一个工具调用，返回喂回模型的文本结果。只读工具直接跑；execCommand 已过门禁。 */\nasync function runTool(ssh: SshClient, name: string, args: Record<string, unknown>): Promise<string> {\n  try {\n    switch (name) {\n      case 'execCommand': {\n        const r = await ssh.exec(String(args.command ?? ''))\n        return formatExec(r)\n      }\n      case 'readRemoteFile': {\n        const r = await ssh.exec(`cat '${args.path}'`)\n        return formatExec(r)\n      }\n      case 'tailLog': {\n        const r = await ssh.exec(`tail -n ${Number(args.lines) || 100} '${args.path}'`)\n        return formatExec(r)\n      }\n      case 'listFiles': {\n        const files = await ssh.listDir(String(args.path ?? ''))\n        if (files.length === 0) return '（空目录）' + args.path\n        const lines = files.map(\n          (f) => `${f.isDir ? '[d]' : '[f]'} ${f.name}  ${f.isDir ? '-' : f.size + 'B'}  ${f.perms}`,\n        )\n        return `目录 ${args.path} 共 ${files.length} 项:\\n` + lines.join('\\n')\n      }\n      default:\n        return `未知工具: ${name}`\n    }\n  } catch (e) {\n    // 工具内部异常不抛给 loop，作为\"工具结果\"回灌，让模型知道这步失败\n    return `命令执行异常: ${(e as Error).message}`\n  }\n}",purpose:"封装“runTool”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"formatExec",kind:"方法 / 函数",startLine:137,endLine:142,code:"function formatExec(r: { stdout: string; stderr: string; exitCode: number }): string {\n  let s = `exitCode=${r.exitCode}\\n`\n  if (r.stdout) s += `stdout:\\n${r.stdout}`\n  if (r.stderr) s += `stderr:\\n${r.stderr}`\n  return s\n}",purpose:"封装“formatExec”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"extractCommand",kind:"方法 / 函数",startLine:144,endLine:152,code:"/** 从 tool_call 参数 JSON 取出 command 字段 */\nfunction extractCommand(argsJson: string): string {\n  try {\n    const obj = JSON.parse(argsJson) as { command?: string }\n    return obj.command ?? ''\n  } catch {\n    return ''\n  }\n}",purpose:"封装“extractCommand”对应的业务计算，并向调用方返回处理结果。",steps:["捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"runAgent",kind:"方法 / 函数",startLine:162,endLine:231,code:"/**\n * 跑一轮 agent 任务，以 async generator 吐事件流。\n * 调用方 for-await 消费事件；事件语义见 events.ts。\n */\nexport async function* runAgent(task: string, deps: AgentDeps): AsyncGenerator<AgentEvent> {\n  const { llm, ssh, confirmer } = deps\n  const ctx = new ContextManager(llm)\n\n  let messages: ChatMessage[] = [\n    { role: 'system', content: SYSTEM_PROMPT },\n    ...(deps.history ?? []),\n    { role: 'user', content: task },\n  ]\n\n  for (let round = 1; round <= MAX_ROUNDS; round++) {\n    // 进模型前整理上下文：Layer 0 截断 + Layer 4 压缩\n    messages = ctx.truncateToolResponses(messages)\n    messages = await ctx.compressIfNeeded(messages)\n\n    // 一次流式调用：边推 token/reasoning 边聚合\n    const pending: AgentEvent[] = []\n    const result = await llm.stream(messages, TOOLS, {\n      onToken: (t) => pending.push({ type: 'token', text: t }),\n      onReasoning: (t) => pending.push({ type: 'reasoning', text: t }),\n    })\n    // 把流式期间攒的增量事件吐出去\n    for (const ev of pending) yield ev\n\n    // 没有 tool_call：模型给出最终结论，结束\n    if (result.toolCalls.length === 0) {\n      const text = result.text?.trim() || '模型暂时没有返回内容，请重试。'\n      yield { type: 'done', finalText: text }\n      return\n    }\n\n    // 落 assistant（文字 + tool_calls）\n    const assistant: ChatMessage = {\n      role: 'assistant',\n      content: result.text || null,\n      tool_calls: result.toolCalls,\n    }\n    // 先把本轮要调的工具吐出去\n    for (const call of result.toolCalls) {\n      yield { type: 'tool_call', name: call.function.name, args: call.function.arguments }\n    }\n\n    // —— 门禁预检 + 执行 ——\n    const toolResponses: ChatMessage[] = []\n    let anyRejected = false\n\n    for (const call of result.toolCalls) {\n      const reject = await screenAndRun(call, ssh, confirmer, (ev) => pending.push(ev))\n      // screenAndRun 把 blocked/tool_result 事件塞进 pending\n      toolResponses.push({ role: 'tool', tool_call_id: call.id, content: reject.content })\n      if (reject.rejected) anyRejected = true\n    }\n    // 吐出执行阶段攒的事件（blocked / tool_result）\n    for (const ev of pending) yield ev\n    pending.length = 0\n\n    // 回灌历史：assistant + 所有 tool 结果（被拒的也回灌\"拒绝\"文本，让模型换方案）\n    messages.push(assistant, ...toolResponses)\n    void anyRejected // 拒绝与否都已通过 tool 结果回灌，loop 自然继续\n  }\n\n  yield {\n    type: 'done',\n    finalText: `已达到最大循环轮数（${MAX_ROUNDS}），任务可能未完成。请拆分任务后重试。`,\n  }\n}",purpose:"执行 Agentic Loop：反复让模型决策、调用工具、回灌结果，直到产生最终结论或达到轮数上限。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","发送类型化事件，驱动调用方或界面实时更新。","返回领域结果或提前结束当前控制流。"],designNotes:["使用事件流解耦耗时任务与展示层，调用方无需等待完整任务结束。","核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"screenAndRun",kind:"方法 / 函数",startLine:233,endLine:242,code:"/**\n * 对单个 tool_call 过门禁并执行。\n * 返回 { content, rejected }：content 是回灌给模型的文本，rejected 表示被拒未执行。\n * 通过 emit 推 blocked / tool_result 事件。\n */\nasync function screenAndRun(\n  call: ToolCall,\n  ssh: SshClient,\n  confirmer: Confirmer,\n  emit: (ev: AgentEvent) => void,",purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"summarize",kind:"方法 / 函数",startLine:285,endLine:288,code:"/** 工具结果摘要：超 500 字符截断（仅用于事件展示，回灌给模型的是完整内容） */\nfunction summarize(data: string): string {\n  return data.length > 500 ? data.slice(0, 500) + '…' : data\n}",purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/AgentService.java",layer:"Java 后端",summary:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流",lineCount:521,order:4,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:49,endLine:87,code:'/**\n * Agent 核心 —— 手写的 agentic loop + 安全门禁。\n *\n * 为什么手写而不用 Spring AI 的自动循环：自动循环把 tool_call 在框架内部执行掉，\n * 我们插不进"执行前人工确认 / 危险命令拦截"这一刀。关键开关：\n * options.internalToolExecutionEnabled(false) —— 关掉自动执行，让 tool_call\n * 回到我们手里，先过门禁、再由 ToolCallingManager.executeToolCalls 显式执行。\n *\n * 循环结构（Claude Code 同款状态机思路）：\n *   请求 → 模型返回 → 有 tool_call？\n *     有 → 门禁预检 → 全放行才执行工具 → 结果回灌 → 带新历史再请求\n *            任一被拒 → 不执行，手动回灌"拒绝"作为工具结果 → loop 继续让模型换方案\n *     无 → 模型给出最终结论，循环结束\n * 加最大轮数上限防死循环。\n *\n * 安全是独立代码路径：门禁不写进工具方法、不靠模型自觉，越狱也绕不过。\n */\n@Service\npublic class AgentService {\n\n    private static final org.slf4j.Logger log = org.slf4j.LoggerFactory.getLogger(AgentService.class);\n\n    /** 最大循环轮数，防止模型反复调工具停不下来。可配置：xwssh.agent.max-rounds */\n    private final int maxRounds;\n\n    /** 只对这个工具的命令做门禁；其余（读文件/看日志）天然只读，放行 */\n    private static final String EXEC_TOOL = "execCommand";\n\n    private static final String SYSTEM_PROMPT = """\n            ## 身份\n            你是 LowenSSH，一个面向 Linux 服务器的 SSH/SFTP 智能体。\n            你帮用户远程排查问题、执行命令、读取文件、查看日志，并在用户授权下完成文件传输等运维操作。\n            你的能力随工具集扩展——当前可用的工具见工具列表，只调用列表里实际存在的工具，不要臆造工具。\n\n            ## 环境与安全\n            你执行的每条命令都会经过一道独立的安全门禁，危险命令会被拦截。\n            被拦时换一个更安全的方式达成目标，不要重复同一条被拒命令，也不要改用等价的危险命令绕过拦截。\n\n            ## 工作方式\n            - 先理解任务目标再决定查什么，每步拿到结果后判断下一步，不要一次堆一堆命令。\n            - 优先用只读命令探查（df / free / ps / cat / tail），看清现状再动有副作用的操作。\n            - 命令输出可能被截断（节省 token），抓关键信息即可，需要时再精确查询。\n\n            ## 输出格式\n            - 用中文，给出结论，不要只罗列原始命令输出。\n            - 简单结果用自然语言简短回答，多维度信息才用列表或表格。\n            - 关键数字（磁盘占用 %、内存、负载等）直接点出来，别让用户自己从输出里找。\n            """;\n\n    private final OpenAiChatModel chatModel;\n    private final ToolCallingManager toolCallingManager;\n    private final CommandGuard guard;\n    private final AuditService auditService;\n    private final MessageService messageService;\n    private final ContextManager contextManager;\n    private final ObjectMapper objectMapper = new ObjectMapper();',purpose:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"AgentService",kind:"方法 / 函数",startLine:88,endLine:100,code:'// OpenAiChatModel 和 ToolCallingManager 都由 starter 自动配置好，直接注入\n    public AgentService(OpenAiChatModel chatModel, ToolCallingManager toolCallingManager,\n                        CommandGuard guard, AuditService auditService, MessageService messageService,\n                        ContextManager contextManager,\n                        @org.springframework.beans.factory.annotation.Value("${xwssh.agent.max-rounds:40}") int maxRounds) {\n        this.chatModel = chatModel;\n        this.toolCallingManager = toolCallingManager;\n        this.guard = guard;\n        this.auditService = auditService;\n        this.messageService = messageService;\n        this.contextManager = contextManager;\n        this.maxRounds = maxRounds;\n    }',purpose:"实现“AgentService”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["在副作用发生前执行安全策略判断。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"run",kind:"方法 / 函数",startLine:102,endLine:172,code:'/**\n     * 跑一轮 agent 任务。\n     *\n     * @param sessionId   本次会话 id（审计落库用）\n     * @param task        用户的运维任务\n     * @param tools       会话级工具集（已绑定连好的 SSH 会话）\n     * @param confirmer   ask 态命令的人工确认入口（控制台真人 / REST 自动放行）\n     * @return 模型的最终结论文本\n     */\n    public String run(Long sessionId, String task, SshTools tools, ConfirmationHandler confirmer) {\n        ToolCallback[] callbacks = ToolCallbacks.from(tools);\n\n        // 关键：internalToolExecutionEnabled(false) 关掉框架自动执行工具。\n        // options 在循环外只构建一次：工具 schema 是 GLM 上下文缓存前缀的一部分，\n        // 若每轮重建导致 schema 序列化抖动，会让缓存前缀失配、整段历史按全价重算。\n        OpenAiChatOptions options = OpenAiChatOptions.builder()\n                .toolCallbacks(callbacks)\n                .internalToolExecutionEnabled(false)\n                .build();\n\n        List<Message> messages = new ArrayList<>();\n        messages.add(new SystemMessage(SYSTEM_PROMPT));\n        messages.addAll(m
