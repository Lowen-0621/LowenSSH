essageService.loadHistory(sessionId));  // 还原历史，支持多轮续聊\n        messages.add(new UserMessage(task));\n        messageService.saveUser(sessionId, task);   // 落用户任务\n\n        for (int round = 1; round <= maxRounds; round++) {\n            // 进模型前整理上下文：Layer 0 截断大工具结果 + Layer 4 历史超阈值则压缩\n            messages = contextManager.truncateToolResponses(messages);\n            messages = contextManager.compressIfNeeded(messages);\n\n            Prompt prompt = new Prompt(messages, options);\n            ChatResponse response = chatModel.call(prompt);\n            logUsage(response);   // 测缓存命中\n\n            // 没有 tool_call 了，模型给出最终结论，结束\n            if (!response.hasToolCalls()) {\n                String text = response.getResult().getOutput().getText();\n                // 兜底：模型可能给出空结论（尤其命令被反复拦截后），别返回空串误导调用方\n                if (text == null || text.isBlank()) {\n                    text = "模型暂时没有返回内容，请重试。";\n                    messageService.saveAssistant(sessionId, text, null);\n                    return text;\n                }\n                messageService.saveAssistant(sessionId, text, null);   // 落最终结论\n                return text;\n            }\n\n            AssistantMessage assistant = response.getResult().getOutput();\n            persistAssistant(sessionId, assistant);   // 落 assistant（文字 + tool_calls）\n\n            // —— 门禁预检：逐个 tool_call 判定，收集被拒的 ——\n            List<ToolResponseMessage.ToolResponse> rejected = screen(sessionId, assistant, confirmer, null);\n\n            if (!rejected.isEmpty()) {\n                // 有被拒的：不调框架执行（executeToolCalls 是整批执行，没法只跑一部分）。\n                // 手动把 assistant 的 tool_call 消息 + 拒绝结果回灌，loop 继续让模型换方案。\n                messages.add(assistant);\n                messages.add(ToolResponseMessage.builder().responses(rejected).build());\n                persistToolResponses(sessionId, rejected);   // 落拒绝结果（还原"想跑啥被拦了"）\n                continue;\n            }\n\n            // 全放行：交给框架执行，拿回灌后的完整历史\n            ToolExecutionResult execResult = toolCallingManager.executeToolCalls(prompt, response);\n            persistLastToolResponses(sessionId, execResult);   // 落本轮工具执行结果\n            messages = new ArrayList<>(execResult.conversationHistory());\n        }\n\n        return "已达到最大循环轮数（" + maxRounds + "），任务可能未完成。请拆分任务后重试。";\n    }',purpose:"执行 Agentic Loop：反复让模型决策、调用工具、回灌结果，直到产生最终结论或达到轮数上限。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["关闭框架自动工具执行，目的是把安全门禁插入不可绕过的执行前位置。","核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"runStream",kind:"方法 / 函数",startLine:174,endLine:295,code:'/**\n     * 流式版本：把同步 run() 的执行过程拆成带类型事件流对外推送（SSE 用）。\n     *\n     * 架构（混合线程）：\n     *  - 对外用 Sinks.Many 造一条 Flux<AgentEvent>，方法立刻返回，不阻塞。\n     *  - 真正的 agentic loop 是命令式 while，放到独立线程里跑（loop 内部有 block 调用，\n     *    不能跑在 reactor 调度线程上）。\n     *  - 每轮 chatModel.stream 拿到 token 流，用 MessageAggregator 边推 Token 事件、\n     *    边把碎片聚合成完整 ChatResponse（含 tool_call），聚合完再走门禁/执行。\n     *\n     * 注意：SSH 连接的关闭由调用方在 Flux.doFinally 里做——这里是异步的，方法返回时 loop 还没跑完，\n     * 不能用 try-with-resources。\n     */\n    public Flux<AgentEvent> runStream(Long sessionId, String task, SshTools tools, ConfirmationHandler confirmer) {\n        Sinks.Many<AgentEvent> sink = Sinks.many().unicast().onBackpressureBuffer();\n\n        Thread worker = new Thread(() -> {\n            try {\n                ToolCallback[] callbacks = ToolCallbacks.from(tools);\n                // 同步版同款：循环外构建一次，保住缓存前缀稳定\n                OpenAiChatOptions options = OpenAiChatOptions.builder()\n                        .toolCallbacks(callbacks)\n                        .internalToolExecutionEnabled(false)\n                        .build();\n\n                List<Message> messages = new ArrayList<>();\n                messages.add(new SystemMessage(SYSTEM_PROMPT));\n                messages.addAll(messageService.loadHistory(sessionId));  // 还原历史，支持多轮续聊\n                messages.add(new UserMessage(task));\n                messageService.saveUser(sessionId, task);   // 落用户任务\n\n                for (int round = 1; round <= maxRounds; round++) {\n                    // 进模型前整理上下文：Layer 0 截断大工具结果 + Layer 4 历史超阈值则压缩\n                    messages = contextManager.truncateToolResponses(messages);\n                    messages = contextManager.compressIfNeeded(messages);\n\n                    Prompt prompt = new Prompt(messages, options);\n\n                    // 一次流式模型调用：边推 token 边聚合，返回完整 ChatResponse\n                    ChatResponse response = streamOnce(prompt, sink);\n\n                    // 没有 tool_call：模型给出最终结论，结束\n                    if (response == null || !response.hasToolCalls()) {\n                        String text = response == null ? null : response.getResult().getOutput().getText();\n                        // 空响应可能是模型偶发抖动（返回空 choice），重试一次再判定\n                        if (text == null || text.isBlank()) {\n                            log.warn("模型返回空结论，重试一次 sessionId={} round={}", sessionId, round);\n                            response = streamOnce(prompt, sink);\n                            text = response == null ? null : response.getResult().getOutput().getText();\n                            // 重试后又冒出 tool_call，回主循环正常处理\n                            if (response != null && response.hasToolCalls()) {\n                                AssistantMessage retried = response.getResult().getOutput();\n                                persistAssistant(sessionId, retried);\n                                for (AssistantMessage.ToolCall call : retried.getToolCalls()) {\n                                    sink.tryEmitNext(new AgentEvent.ToolCall(call.name(), call.arguments()));\n                                }\n                                List<ToolResponseMessage.ToolResponse> rj =\n                                        screen(sessionId, retried, confirmer, sink::tryEmitNext);\n                                if (!rj.isEmpty()) {\n                                    messages.add(retried);\n                                    messages.add(ToolResponseMessage.builder().responses(rj).build());\n                                    persistToolResponses(sessionId, rj);\n                                    continue;\n                                }\n                                Prompt retryPrompt = new Prompt(messages, options);\n                                ToolExecutionResult er = toolCallingManager.executeToolCalls(retryPrompt, response);\n                                emitToolResults(er, sink);\n                                persistLastToolResponses(sessionId, er);\n                                messages = new ArrayList<>(er.conversationHistory());\n                                continue;\n                            }\n                        }\n                        if (text == null || text.isBlank()) {\n                            // 重试仍空：中性文案，不再误导为"被安全策略阻止"\n                            text = "模型暂时没有返回内容，请重试。";\n                        }\n                        messageService.saveAssistant(sessionId, text, null);   // 落最终结论\n                        sink.tryEmitNext(new AgentEvent.Done(text));\n                        sink.tryEmitComplete();\n                        return;\n                    }\n\n                    AssistantMessage assistant = response.getResult().getOutput();\n                    persistAssistant(sessionId, assistant);   // 落 assistant（文字 + tool_calls）\n                    // 先把本轮要调的工具吐出去，让前端看到"准备执行什么"\n                    for (AssistantMessage.ToolCall call : assistant.getToolCalls()) {\n                        sink.tryEmitNext(new AgentEvent.ToolCall(call.name(), call.arguments()));\n                    }\n\n                    // 门禁预检：DENY/用户拒绝会通过 onBlocked 推 Blocked 事件\n                    List<ToolResponseMessage.ToolResponse> rejected =\n                            screen(sessionId, assistant, confirmer, sink::tryEmitNext);\n\n                    if (!rejected.isEmpty()) {\n                        // 有被拒：整批不执行，把 assistant + 拒绝结果回灌，让模型换方案\n                        messages.add(assistant);\n                        messages.add(ToolResponseMessage.builder().responses(rejected).build());\n                        persistToolResponses(sessionId, rejected);   // 落拒绝结果\n                        continue;\n                    }\n\n                    // 全放行：交框架执行，并把每个工具结果摘要吐给前端\n                    ToolExecutionResult execResult = toolCallingManager.executeToolCalls(prompt, response);\n                    emitToolResults(execResult, sink);\n                    persistLastToolResponses(sessionId, execResult);   // 落本轮工具执行结果\n                    messages = new ArrayList<>(execResult.conversationHistory());\n                }\n\n                sink.tryEmitNext(new AgentEvent.Done(\n                        "已达到最大循环轮数（" + maxRounds + "），任务可能未完成。请拆分任务后重试。"));\n                sink.tryEmitComplete();\n            } catch (Exception e) {\n                log.warn("流式 agent 执行异常 sessionId={}", sessionId, e);\n                sink.tryEmitNext(new AgentEvent.Error(e.getMessage() == null ? e.toString() : e.getMessage()));\n                sink.tryEmitComplete();\n            }\n        }, "agent-stream-" + sessionId);\n        worker.setDaemon(true);\n        worker.start();\n\n        return sink.asFlux();\n    }',purpose:"建立流式执行链，把模型增量、工具调用、拦截和完成状态实时推送给客户端。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","在副作用发生前执行安全策略判断。","发送类型化事件，驱动调用方或界面实时更新。"],designNotes:["关闭框架自动工具执行，目的是把安全门禁插入不可绕过的执行前位置。","使用事件流解耦耗时任务与展示层，调用方无需等待完整任务结束。","核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:["裸线程或无界缓冲在高并发下需要增加资源上限。"]},{name:"streamOnce",kind:"方法 / 函数",startLine:297,endLine:326,code:'/**\n     * 一次流式模型调用：透传 chunk 推 Token 事件，聚合成完整 ChatResponse 返回。\n     * 抽出来供主循环和空响应重试复用。\n     */\n    private ChatResponse streamOnce(Prompt prompt, Sinks.Many<AgentEvent> sink) {\n        AtomicReference<ChatResponse> aggregatedRef = new AtomicReference<>();\n        new MessageAggregator()\n                .aggregate(chatModel.stream(prompt), aggregatedRef::set)\n                .doOnNext(chunk -> {\n                    if (chunk.getResult() == null) {\n                        return;\n                    }\n                    var output = chunk.getResult().getOutput();\n                    // GLM 思考阶段 text 为 null，思考增量在 output.metadata.reasoningContent，\n                    // 单独推 Reasoning 事件，前端实时展示"在想什么"。\n                    Object reasoning = output.getMetadata() == null ? null\n                            : output.getMetadata().get("reasoningContent");\n                    if (reasoning instanceof String rc && !rc.isEmpty()) {\n                        sink.tryEmitNext(new AgentEvent.Reasoning(rc));\n                    }\n                    String t = output.getText();\n                    if (t != null && !t.isEmpty()) {\n                        sink.tryEmitNext(new AgentEvent.Token(t));\n                    }\n                })\n                .blockLast();\n        ChatResponse resp = aggregatedRef.get();\n        logUsage(resp);\n        return resp;\n    }',purpose:"建立流式执行链，把模型增量、工具调用、拦截和完成状态实时推送给客户端。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","发送类型化事件，驱动调用方或界面实时更新。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"logUsage",kind:"方法 / 函数",startLine:328,endLine:354,code:'/**\n     * 打印本轮 token 用量和缓存命中率（省 token 的测量基础）。\n     *\n     * GLM 隐式上下文缓存：命中的 token 按更低价计费，命中数在\n     * usage.prompt_tokens_details.cached_tokens（OpenAI 兼容字段，Spring AI 收进 nativeUsage）。\n     * Spring AI 的标准 Usage 只有 prompt/completion/total，cached 要从 nativeUsage 里挖，\n     * 字段不一定有，全程防御式读取，取不到只打基础值，绝不影响主流程。\n     */\n    private void logUsage(ChatResponse resp) {\n        try {\n            if (resp == null || resp.getMetadata() == null || resp.getMetadata().getUsage() == null) {\n                return;\n            }\n            var usage = resp.getMetadata().getUsage();\n            Integer prompt = usage.getPromptTokens();\n            Integer completion = usage.getCompletionTokens();\n            Integer total = usage.getTotalTokens();\n            long cached = extractCachedTokens(usage.getNativeUsage());\n            String hitRate = (prompt != null && prompt > 0)\n                    ? String.format("%.0f%%", cached * 100.0 / prompt) : "n/a";\n            log.info("token 用量 prompt={} completion={} total={} cached={} 命中率={}",\n                    prompt, completion, total, cached, hitRate);\n        } catch (Exception e) {\n            // 测量失败绝不能拖累主流程\n            log.debug("读取 token 用量失败: {}", e.getMessage());\n        }\n    }',purpose:"封装“logUsage”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"extractCachedTokens",kind:"方法 / 函数",startLine:356,endLine:379,code:'/** 从 nativeUsage（GLM 返回的原始 usage 对象）里挖 prompt_tokens_details.cached_tokens；挖不到返回 0 */\n    private long extractCachedTokens(Object nativeUsage) {\n        if (nativeUsage == null) {\n            return 0;\n        }\n        try {\n            // nativeUsage 一般是 OpenAI SDK 的 Usage 对象，序列化成树后按字段名取，避免硬依赖具体类型\n            var node = objectMapper.valueToTree(nativeUsage);\n            var details = node.get("promptTokensDetails");\n            if (details == null) {\n                details = node.get("prompt_tokens_details");\n            }\n            if (details == null) {\n                return 0;\n            }\n            var cached = details.get("cachedTokens");\n            if (cached == null) {\n                cached = details.get("cached_tokens");\n            }\n            return cached == null ? 0 : cached.asLong();\n        } catch (Exception e) {\n            return 0;\n        }\n    }',purpose:"封装“extractCachedTokens”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"emitToolResults",kind:"方法 / 函数",startLine:381,endLine:395,code:'/** 从框架执行后的会话历史里抽取本轮工具结果，逐个推 ToolResult 事件 */\n    private void emitToolResults(ToolExecutionResult execResult, Sinks.Many<AgentEvent> sink) {\n        List<Message> history = execResult.conversationHistory();\n        if (history.isEmpty()) {\n            return;\n        }\n        Message last = history.get(history.size() - 1);\n        if (last instanceof ToolResponseMessage trm) {\n            for (ToolResponseMessage.ToolResponse resp : trm.getResponses()) {\n                String data = unwrapToolData(resp.responseData());\n                String summary = data.length() > 500 ? data.substring(0, 500) + "…" : data;\n                sink.tryEmitNext(new AgentEvent.ToolResult(resp.name(), summary, true));\n            }\n        }\n    }',purpose:"封装“emitToolResults”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","发送类型化事件，驱动调用方或界面实时更新。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"toolCallsToJson",kind:"方法 / 函数",startLine:397,endLine:408,code:'/** 把 assistant 本轮发起的 tool_call 列表序列化成 JSON 落库；无工具调用返回 null */\n    private String toolCallsToJson(AssistantMessage assistant) {\n        if (assistant.getToolCalls() == null || assistant.getToolCalls().isEmpty()) {\n            return null;\n        }\n        try {\n            return objectMapper.writeValueAsString(assistant.getToolCalls());\n        } catch (Exception e) {\n            // 序列化失败不影响主流程，落个占位串即可\n            return "[\\"tool_calls 序列化失败\\"]";\n        }\n    }',purpose:"封装“toolCallsToJson”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"persistAssistant",kind:"方法 / 函数",startLine:410,endLine:413,code:"/** 落一条 assistant 消息：文字 + 本轮 tool_calls（两者可同时为空/有值） */\n    private void persistAssistant(Long sessionId, AssistantMessage assistant) {\n        messageService.saveAssistant(sessionId, assistant.getText(), toolCallsToJson(assistant));\n    }",purpose:"实现“persistAssistant”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"unwrapToolData",kind:"方法 / 函数",startLine:415,endLine:432,code:'/**\n     * 框架的 resp.responseData() 是 JSON 序列化后的字符串（带外层引号、\\n 被转义成 \\\\n）。\n     * 推给前端、落库前先反序列化成干净文本，避免截断切掉结尾引号导致前端解析失败。\n     */\n    private String unwrapToolData(String data) {\n        if (data == null) {\n            return "";\n        }\n        if (data.startsWith("\\"")) {\n            try {\n                return objectMapper.readValue(data, String.class);\n            } catch (Exception e) {\n                // 解析失败就用原文，至少不丢内容\n                return data;\n            }\n        }\n        return data;\n    }',purpose:"封装“unwrapToolData”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"persistToolResponses",kind:"方法 / 函数",startLine:434,endLine:439,code:"/** 把一批工具结果（执行结果 / 拒绝结果）逐条落 t_message */\n    private void persistToolResponses(Long sessionId, List<ToolResponseMessage.ToolResponse> responses) {\n        for (ToolResponseMessage.ToolResponse resp : responses) {\n            messageService.saveToolResult(sessionId, resp.id(), unwrapToolData(resp.responseData()));\n        }\n    }",purpose:"实现“persistToolResponses”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["遍历集合或持续推进循环，直到满足退出条件。"],designNotes:[],risks:[]},{name:"persistLastToolResponses",kind:"方法 / 函数",startLine:441,endLine:451,code:"/** 从框架执行后的会话历史末尾抽取本轮工具结果落库（数据源同 emitToolResults） */\n    private void persistLastToolResponses(Long sessionId, ToolExecutionResult execResult) {\n        List<Message> history = execResult.conversationHistory();\n        if (history.isEmpty()) {\n            return;\n        }\n        Message last = history.get(history.size() - 1);\n        if (last instanceof ToolResponseMessage trm) {\n            persistToolResponses(sessionId, trm.getResponses());\n        }\n    }",purpose:"封装“persistLastToolResponses”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"screen",kind:"方法 / 函数",startLine:453,endLine:502,code:'/**\n     * 对本轮所有 tool_call 做门禁预检。\n     * 返回被拒绝的 tool_call 对应的"拒绝"工具结果；空列表表示全部放行。\n     *\n     * 注意：只要有一个被拒，本轮就整批不执行（受框架整批执行限制）。所以这里把\n     * 被拒的攒成拒绝结果，放行的不在这里执行——交给外层 executeToolCalls 统一跑。\n     */\n    private List<ToolResponseMessage.ToolResponse> screen(Long sessionId, AssistantMessage assistant,\n                                                          ConfirmationHandler confirmer,\n                                                          Consumer<AgentEvent> onBlocked) {\n        List<ToolResponseMessage.ToolResponse> rejected = new ArrayList<>();\n\n        for (AssistantMessage.ToolCall call : assistant.getToolCalls()) {\n            // 非 execCommand 的工具（读文件/看日志）只读，直接放行\n            if (!EXEC_TOOL.equals(call.name())) {\n                continue;\n            }\n\n            String command = extractCommand(call.arguments());\n            CommandGuard.Verdict verdict = guard.evaluate(command);\n\n            switch (verdict.decision()) {\n                case DENY -> {\n                    // 拦截点审计：模型试图跑危险命令、被门禁拦下——最有价值的审计记录\n                    auditService.logBlocked(sessionId, command, true,\n                            "DENY: " + verdict.reason());\n                    if (onBlocked != null) {\n                        onBlocked.accept(new AgentEvent.Blocked(command, verdict.reason()));\n                    }\n                    rejected.add(reject(call,\n                            "命令被安全门禁拒绝执行（" + verdict.reason() + "）。请改用更安全的方式。"));\n                }\n                case ASK -> {\n                    boolean ok = confirmer.confirm(command, verdict.reason());\n                    if (!ok) {\n                        // 用户拒绝也记一笔（dangerous=true 因为是 ask 态命中副作用规则）\n                        auditService.logBlocked(sessionId, command, true,\n                                "用户拒绝: " + verdict.reason());\n                        if (onBlocked != null) {\n                            onBlocked.accept(new AgentEvent.Blocked(command, "用户拒绝: " + verdict.reason()));\n                        }\n                        rejected.add(reject(call, "用户拒绝执行该命令。请换一种方式或询问用户。"));\n                    }\n                    // 批准则不加入 rejected，留给外层执行（执行点会在 SshTools 落审计）\n                }\n                case ALLOW -> { /* 放行 */ }\n            }\n        }\n        return rejected;\n    }',purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"extractCommand",kind:"方法 / 函数",startLine:504,endLine:514,code:'/** 从 tool_call 的 JSON 参数里取出 command 字段 */\n    private String extractCommand(String argumentsJson) {\n        try {\n            var node = objectMapper.readTree(argumentsJson);\n            var cmd = node.get("command");\n            return cmd == null ? "" : cmd.asText();\n        } catch (Exception e) {\n            // 解析失败当空命令处理（门禁会放行，但实际执行会报错，模型自己会看到）\n            return "";\n        }\n    }',purpose:"封装“extractCommand”对应的业务计算，并向调用方返回处理结果。",steps:["捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"reject",kind:"方法 / 函数",startLine:516,endLine:519,code:'/** 构造一条"拒绝"工具结果，id/name 必须和原 tool_call 对上，模型才知道是哪一步被拒 */\n    private ToolResponseMessage.ToolResponse reject(AssistantMessage.ToolCall call, String reason) {\n        return new ToolResponseMessage.ToolResponse(call.id(), call.name(), reason);\n    }',purpose:"封装“reject”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/AgentServiceTest.java",layer:"Java 测试",summary:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流",lineCount:176,order:4,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:43,endLine:58,code:'/**\n * Agent loop 核心单测 —— 项目卖点是"手写 loop + 安全门禁"，loop 的决策分支必须覆盖：\n *   1. 模型不再调工具 → 给出结论结束\n *   2. DENY 命令 → 不执行、回灌拒绝、loop 继续让模型换方案\n *   3. ASK 命令用户拒绝 → 同 DENY（不执行）\n *   4. ASK 命令用户批准 → 交框架执行\n *   5. MAX_ROUNDS 上限 → 防死循环兜底\n *\n * 全程不连真模型/真 SSH：chatModel、toolCallingManager 用 mock；门禁用真 CommandGuard\n * （它本身已有独立单测，这里用真实判定让用例更接近线上）。\n */\nclass AgentServiceTest {\n\n    private static final Long SID = 1L;\n\n    // —— 依赖：模型和工具执行器 mock，其余给真实/哑实现 ——\n    private final OpenAiChatModel chatModel = mock(OpenAiChatModel.class);\n    private final ToolCallingManager toolCallingManager = mock(ToolCallingManager.class);\n    private final CommandGuard guard = new CommandGuard();\n    private final AuditService auditService = mock(AuditService.class);\n    private final MessageService messageService = mock(MessageService.class);\n    // ContextManager 用真实对象但阈值设到永不压缩，截断也不影响这里的短消息\n    private final ContextManager contextManager = new ContextManager(null, 8000, 800, 999999, 6, 3);\n\n    private final AgentService service = new AgentService(\n            chatModel, toolCallingManager, guard, auditService, messageService, contextManager, 15);',purpose:"Agentic Loop 核心：编排模型、工具、门禁、上下文与事件流。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"tools",kind:"方法 / 函数",startLine:59,endLine:62,code:"// ToolCallbacks.from(tools) 只反射读 @Tool 注解，不真连 SSH，deps 给 null 即可\n    private SshTools tools() {\n        return new SshTools(new SshClient(), SID, auditService, guard);\n    }",purpose:"测试场景“tools”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"textResponse",kind:"方法 / 函数",startLine:64,endLine:70,code:'// —— 造 ChatResponse 的辅助方法 ——\n\n    /** 造一个"模型给出纯文字结论、无 tool_call"的响应 */\n    private ChatResponse textResponse(String text) {\n        return new ChatResponse(List.of(\n                new Generation(new AssistantMessage(t Decision.deny) break; // 已最严，提前结束\n  }\n\n  if (worst == Decision.allow) {\n    return const Verdict(Decision.allow, '只读/安全命令');\n  }\n  return Verdict(worst, worstReason);\n}",purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"_evaluateSingle",kind:"方法 / 函数",startLine:90,endLine:105,code:"/// 单段命令判定：先 deny 再 ask 后 allow\nVerdict _evaluateSingle(String seg) {\n  for (final p in _deny) {\n    final m = p.firstMatch(seg);\n    if (m != null) {\n      return Verdict(Decision.deny, \"命中危险命令拦截规则: '${m[0]}'\");\n    }\n  }\n  for (final p in _ask) {\n    final m = p.firstMatch(seg);\n    if (m != null) {\n      return Verdict(Decision.ask, \"涉及有副作用的操作: '${m[0]}'\");\n    }\n  }\n  return const Verdict(Decision.allow, '');\n}",purpose:"封装“_evaluateSingle”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_splitSegments",kind:"方法 / 函数",startLine:107,endLine:110,code:"/// 按命令分隔符拆段：&& || | ; 换行，分隔符本身丢弃\nList<String> _splitSegments(String command) {\n  return command.split(RegExp(r'&&|\\|\\||[|;\\n]'));\n}",purpose:"封装“_splitSegments”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"GuardRule",kind:"方法 / 函数",startLine:122,endLine:129,code:"GuardRule(Decision.deny, r'\\brm\\s+...-[rf]', 'rm -rf / rm -fr 递归强删'),\n  GuardRule(Decision.deny, r'\\bmkfs\\b', '格式化文件系统'),\n  GuardRule(Decision.deny, r'\\bdd\\b', '块设备读写，易毁盘'),\n  GuardRule(Decision.deny, r'\\bshutdown\\b', '关机'),\n  GuardRule(Decision.deny, r'\\breboot\\b', '重启'),\n  GuardRule(Decision.deny, r'\\bhalt\\b', '停机'),\n  GuardRule(Decision.deny, r'>\\s*/dev/sd', '直接写裸盘'),\n  GuardRule(Decision.deny, r':(){ :|:& };:', 'fork 炸弹'),",purpose:"实现“GuardRule”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["在副作用发生前执行安全策略判断。"],designNotes:[],risks:[]},{name:"GuardRule",kind:"方法 / 函数",startLine:132,endLine:146,code:"GuardRule(Decision.deny, r'\\bfind\\b...-exec rm', 'find -exec rm 批量删除'),\n];\n\n/// ASK 规则清单（与 _ask 一一对应，仅供 UI 展示）\nconst List<GuardRule> askRules = [\n  GuardRule(Decision.ask, r'\\brm\\b', '普通 rm（非 -rf）'),\n  GuardRule(Decision.ask, r'\\bkill\\b', '杀进程'),\n  GuardRule(Decision.ask, r'\\bsystemctl stop|restart|disable', '停/重启/禁用服务'),\n  GuardRule(Decision.ask, r'\\bservice ... stop|restart', '停/重启服务'),\n  GuardRule(Decision.ask, r'\\b(chmod|chown)\\b', '改权限/属主'),\n  GuardRule(Decision.ask, r'\\b(apt|yum|dnf) install|remove', '装/卸软件'),\n  GuardRule(Decision.ask, r'\\btruncate\\b', '清空文件'),\n  GuardRule(Decision.ask, r'>\\s*/', '重定向覆盖写绝对路径文件'),\n];",purpose:"实现“GuardRule”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["在副作用发生前执行安全策略判断。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]}]},{path:"clients/cli/src/core/guard.test.ts",layer:"CLI",summary:"命令安全门禁：deny / ask / allow 三态判定",lineCount:76,order:5,logicBlocks:[]},{path:"clients/cli/src/core/guard.ts",layer:"CLI",summary:"命令安全门禁：deny / ask / allow 三态判定",lineCount:114,order:5,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:14,endLine:53,code:"export interface Verdict {\n  decision: Decision\n  reason: string\n}\n\n/**\n * deny 名单：不可逆的毁灭性操作，直接拒绝。\n * 用 \\b 保证匹配独立命令词而非子串（dd 不误伤 add）。\n */\nconst DENY: RegExp[] = [\n  /\\brm\\s+(-\\w*\\s+)*-\\w*[rf]/, // rm -rf / rm -fr 等带 r/f 组合\n  /\\bmkfs\\b/, //                 格式化文件系统\n  /\\bdd\\b/, //                   块设备读写，易毁盘\n  /\\bshutdown\\b/, //             关机\n  /\\breboot\\b/, //               重启\n  /\\bhalt\\b/, //                 停机\n  />\\s*\\/dev\\/sd/, //            直接写裸盘\n  /:\\(\\)\\s*\\{.*\\}/, //           fork 炸弹 :(){ :|:& };:\n  /\\bmv\\s+.*\\s+\\/dev\\/null/, //  mv 到 /dev/null 销毁数据\n  /\\bfind\\b.*-delete/, //        find ... -delete 批量删除（rm -rf 等价绕过）\n  /\\bfind\\b.*-exec\\s+rm/, //     find ... -exec rm 批量删除\n]\n\n/**\n * ask 名单：有副作用但未必致命，执行前问一句。\n */\nconst ASK: RegExp[] = [\n  /\\brm\\b/, //                              普通 rm（非 -rf）\n  /\\bkill\\b/, //                            杀进程\n  /\\bsystemctl\\s+(stop|restart|disable)/, // 停/重启/禁用服务\n  /\\bservice\\s+\\S+\\s+(stop|restart)/,\n  /\\b(chmod|chown)\\b/, //                   改权限/属主\n  /\\b(apt|apt-get|yum|dnf)\\s+(install|remove|purge)/, // 装/卸软件\n  /\\btruncate\\b/, //                        清空文件\n  />\\s*\\//, //                              重定向覆盖写到绝对路径文件\n]\n\n/** 三态严重程度排序，越小越严：DENY < ASK < ALLOW */\nconst ORDINAL: Record<Decision, number> = { DENY: 0, ASK: 1, ALLOW: 2 }",purpose:"命令安全门禁：deny / ask / allow 三态判定。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"evaluate",kind:"方法 / 函数",startLine:54,endLine:91,code:"/**\n * 判定一条命令。复合命令会被拆段，取最严结果（任一段 deny 则整条 deny）。\n */\nexport function evaluate(command: string): Verdict {\n  if (!command || command.trim() === '') {\n    return { decision: 'ALLOW', reason: '空命令' }\n  }\n\n  // 先对完整命令整体过一遍 DENY：fork 炸弹 :(){ :|:& };: 本身含 | 和 ;，\n  // 拆段会把它切碎导致漏判。DENY 命中即拒，整体多查一次只会更安全。\n  // （相对 Java 版的增强，Java 版 splitSegments 同样会漏 fork 炸弹，待同步修复。）\n  for (const p of DENY) {\n    const m = command.match(p)\n    if (m) {\n      return { decision: 'DENY', reason: `命中危险命令拦截规则: '${m[0]}'` }\n    }\n  }\n\n  let worst: Decision = 'ALLOW'\n  let worstReason = ''\n\n  for (const seg of splitSegments(command)) {\n    const s = seg.trim()\n    if (s === '') continue\n\n    const v = evaluateSingle(s)\n    if (ORDINAL[v.decision] < ORDINAL[worst]) {\n      worst = v.decision\n      worstReason = v.reason\n    }\n    if (worst === 'DENY') break // 已最严，提前结束\n  }\n\n  if (worst === 'ALLOW') {\n    return { decision: 'ALLOW', reason: '只读/安全命令' }\n  }\n  return { decision: worst, reason: worstReason }\n}",purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"evaluateSingle",kind:"方法 / 函数",startLine:93,endLine:108,code:"/** 单段命令判定：先 deny 再 ask 后 allow */\nfunction evaluateSingle(seg: string): Verdict {\n  for (const p of DENY) {\n    const m = seg.match(p)\n    if (m) {\n      return { decision: 'DENY', reason: `命中危险命令拦截规则: '${m[0]}'` }\n    }\n  }\n  for (const p of ASK) {\n    const m = seg.match(p)\n    if (m) {\n      return { decision: 'ASK', reason: `涉及有副作用的操作: '${m[0]}'` }\n    }\n  }\n  return { decision: 'ALLOW', reason: '' }\n}",purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"splitSegments",kind:"方法 / 函数",startLine:110,endLine:113,code:"/** 按命令分隔符拆段：&& || | ; 换行，分隔符本身丢弃 */\nfunction splitSegments(command: string): string[] {\n  return command.split(/&&|\\|\\||[|;\\n]/)\n}",purpose:"封装“splitSegments”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/guard/CommandGuard.java",layer:"Java 后端",summary:"命令安全门禁：deny / ask / allow 三态判定",lineCount:124,order:5,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:20,endLine:61,code:'/**\n * 命令门禁 —— deny / ask / allow 三态判定。Agent 安全的硬边界。\n *\n * 设计原则（抄 Claude Code 并落地）：\n *  1. 安全检查是独立代码路径，不写进工具方法、不靠模型自觉。模型越狱也绕不过这层。\n *  2. 三态评估顺序固定：先查 deny（命中即拒，deny 永远赢）→ 再看是否需 ask → 默认 allow。\n *  3. 只看"实际要执行的命令"，不看模型的话术，防花言巧语骗过门禁。\n *  4. 复合命令（&& | ; 串起来的）拆开逐段查，防"ls && rm -rf /"整条被当成一段漏过。\n *\n * 判定结果是纯函数，无副作用，方便单测。\n */\n@Component\npublic class CommandGuard {\n\n    /** 三态 */\n    public enum Decision { DENY, ASK, ALLOW }\n\n    /** 判定结果：状态 + 原因（原因用于回灌给模型 / 展示给用户） */\n    public record Verdict(Decision decision, String reason) {\n    }\n\n    /**\n     * deny 名单：不可逆的毁灭性操作，直接拒绝，不给确认机会。\n     * 用正则匹配，\\b 保证匹配的是独立命令词而非子串（如 dd 不误伤 add）。\n     */\n    private static final List<Pattern> DENY = List.of(\n            Pattern.compile("\\\\brm\\\\s+(-\\\\w*\\\\s+)*-\\\\w*[rf]"),  // rm -rf / rm -fr 等带 r/f 组合\n            Pattern.compile("\\\\bmkfs\\\\b"),                        // 格式化文件系统\n            Pattern.compile("\\\\bdd\\\\b"),                          // 块设备读写，易毁盘\n            Pattern.compile("\\\\bshutdown\\\\b"),                    // 关机\n            Pattern.compile("\\\\breboot\\\\b"),                      // 重启\n            Pattern.compile("\\\\bhalt\\\\b"),                        // 停机\n            Pattern.compile(">\\\\s*/dev/sd"),                      // 直接写裸盘\n            Pattern.compile(":\\\\(\\\\)\\\\s*\\\\{.*\\\\}"),               // fork 炸弹 :(){ :|:& };:\n            Pattern.compile("\\\\bmv\\\\s+.*\\\\s+/dev/null"),          // mv 到 /dev/null 销毁数据\n            // 真机联调发现：find 是 rm -rf 的等价绕过——模型被拦 rm -rf 后改用 find 删\n            Pattern.compile("\\\\bfind\\\\b.*-delete"),               // find ... -delete 批量删除\n            Pattern.compile("\\\\bfind\\\\b.*-exec\\\\s+rm")            // find ... -exec rm 批量删除\n    );\n\n    /**\n     * ask 名单：有副作用但未必致命，执行前问一句。\n     */\n    private static final List<Pattern> ASK = List.of(\n            Pattern.compile("\\\\brm\\\\b"),                          // 普通 rm（非 -rf，已被 deny 漏下来的）\n            Pattern.compile("\\\\bkill\\\\b"),                        // 杀进程\n            Pattern.compile("\\\\bsystemctl\\\\s+(stop|restart|disable)"), // 停/重启/禁用服务\n            Pattern.compile("\\\\bservice\\\\s+\\\\S+\\\\s+(stop|restart)"),\n            Pattern.compile("\\\\b(chmod|chown)\\\\b"),               // 改权限/属主\n            Pattern.compile("\\\\b(apt|apt-get|yum|dnf)\\\\s+(install|remove|purge)"), // 装/卸软件\n            Pattern.compile("\\\\btruncate\\\\b"),                    // 清空文件\n            Pattern.compile(">\\\\s*/")                             // 重定向覆盖写到绝对路径文件\n    );',purpose:"命令安全门禁：deny / ask / allow 三态判定。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"evaluate",kind:"方法 / 函数",startLine:62,endLine:92,code:'/**\n     * 判定一条命令。复合命令会被拆段，取最严结果（任一段 deny 则整条 deny）。\n     */\n    public Verdict evaluate(String command) {\n        if (command == null || command.isBlank()) {\n            return new Verdict(Decision.ALLOW, "空命令");\n        }\n\n        Decision worst = Decision.ALLOW;\n        String worstReason = "";\n\n        // 复合命令拆段：&& || | ; 都是命令分隔符\n        for (String seg : splitSegments(command)) {\n            String s = seg.trim();\n            if (s.isEmpty()) continue;\n\n            Verdict v = evaluateSingle(s);\n            // 取最严：DENY > ASK > ALLOW（enum ordinal 越小越严）\n            if (v.decision().ordinal() < worst.ordinal()) {\n                worst = v.decision();\n                worstReason = v.reason();\n            }\n            // 已经最严了，提前结束\n            if (worst == Decision.DENY) break;\n        }\n\n        if (worst == Decision.ALLOW) {\n            return new Verdict(Decision.ALLOW, "只读/安全命令");\n        }\n        return new Verdict(worst, worstReason);\n    }',purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"evaluateSingle",kind:"方法 / 函数",startLine:94,endLine:107,code:'/** 单段命令判定：先 deny 再 ask 后 allow */\n    private Verdict evaluateSingle(String seg) {\n        for (Pattern p : DENY) {\n            if (p.matcher(seg).find()) {\n                return new Verdict(Decision.DENY, "命中危险命令拦截规则: " + describe(p, seg));\n            }\n        }\n        for (Pattern p : ASK) {\n            if (p.matcher(seg).find()) {\n                return new Verdict(Decision.ASK, "涉及有副作用的操作: " + describe(p, seg));\n            }\n        }\n        return new Verdict(Decision.ALLOW, "");\n    }',purpose:"在真实执行前进行安全判定，将命令归类为 DENY、ASK 或 ALLOW。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"splitSegments",kind:"方法 / 函数",startLine:109,endLine:113,code:'/** 按命令分隔符拆段，分隔符本身丢弃 */\n    private List<String> splitSegments(String command) {\n        // 用正则一次切掉 && || | ; 以及换行\n        return List.of(command.split("&&|\\\\|\\\\||[|;\\\\n]"));\n    }',purpose:"封装“splitSegments”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"describe",kind:"方法 / 函数",startLine:115,endLine:122,code:'/** 给出命中片段，便于用户/模型理解为什么被拦 */\n    private String describe(Pattern p, String seg) {\n        var m = p.matcher(seg);\n        if (m.find()) {\n            return "\'" + m.group() + "\'";\n        }\n        return p.pattern();\n    }',purpose:"封装“describe”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/guard/CommandGuardTest.java",layer:"Java 测试",summary:"命令安全门禁：deny / ask / allow 三态判定",lineCount:105,order:5,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:13,endLine:16,code:"/**\n * 门禁单测 —— 三态判定是 Agent 安全的硬边界，必须覆盖到位。\n * 不依赖 SSH/模型，纯逻辑，跑得快。\n */\nclass CommandGuardTest {\n\n    private final CommandGuard guard = new CommandGuard();",purpose:"命令安全门禁：deny / ask / allow 三态判定。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"decide",kind:"方法 / 函数",startLine:17,endLine:19,code:"private Decision decide(String cmd) {\n        return guard.evaluate(cmd).decision();\n    }",purpose:"测试场景“decide”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]}]},{path:"clients/app/lib/core/context.dart",layer:"Flutter 核心",summary:"上下文治理：工具结果截断、历史摘要、配对约束与熔断",lineCount:171,order:6,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:20,endLine:50,code:"class ContextOptions {\n  final int toolResultMaxChars; //    Layer 0 近区阈值\n  final int oldToolResultMaxChars; // Layer 0 旧区阈值\n  final int maxContextTokens; //      Layer 4 触发压缩阈值\n  final int keepRecentMessages; //    Layer 4 保留最近条数\n  final int circuitLimit; //          摘要连续失败熔断次数\n\n  const ContextOptions({\n    this.toolResultMaxChars = 8000,\n    this.oldToolResultMaxChars = 800,\n    this.maxContextTokens = 32000,\n    this.keepRecentMessages = 6,\n    this.circuitLimit = 3,\n  });\n}\n\nconst ContextOptions kDefaultContextOptions = ContextOptions();\n\nconst String _summaryPrompt = '''你是上下文压缩器。下面是一段 AI 运维助手与目标服务器之间的历史对话（含用户任务、助手发起的命令调用、命令执行结果）。\n请把它压缩成简洁的中文摘要，必须保留以下信息，丢弃冗长的原始命令输出（只留结论）：\n1. 用户的原始运维目标；\n2. 已执行过的关键命令及其结果结论（例如磁盘占用多少、进程是否存活、配置是否正确）；\n3. 已发现的问题或系统状态；\n4. 被安全门禁拦截的危险操作（如果有）。\n只输出摘要正文，不要解释你在做什么。''';\n\nclass ContextManager {\n  final ContextOptions opts;\n  final GlmClient llm;\n  int _consecutiveFailures = 0;",purpose:"上下文治理：工具结果截断、历史摘要、配对约束与熔断。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"ContextManager",kind:"方法 / 函数",startLine:51,endLine:74,code:"ContextManager(this.llm, [this.opts = kDefaultContextOptions]);\n\n  // ===================== Layer 0：工具结果截断 =====================\n\n  /// 对历史里所有工具结果做截断（幂等）。返回新列表，不改原列表。\n  /// 分级：距末尾 keepRecentMessages 条内用大阈值，更早用小阈值。\n  List<ChatMessage> truncateToolResponses(List<ChatMessage> messages) {\n    final size = messages.length;\n    final result = <ChatMessage>[];\n    for (var i = 0; i < size; i++) {\n      final msg = messages[i];\n      if (msg.role != 'tool') {\n        result.add(msg);\n        continue;\n      }\n      final recent = size - i <= opts.keepRecentMessages;\n      final limit = recent ? opts.toolResultMaxChars : opts.oldToolResultMaxChars;\n      result.add(ChatMessage.tool(\n        msg.toolCallId ?? '',\n        _truncateText(msg.content ?? '', limit),\n      ));\n    }\n    return result;\n  }",purpose:"封装“ContextManager”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上
