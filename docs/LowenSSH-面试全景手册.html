/ ===================== Layer 0：工具结果截断 =====================\n\n  /**\n   * 对历史里所有工具结果做截断（幂等）。返回新数组，不改原数组。\n   * 分级：距末尾 keepRecentMessages 条内用大阈值，更早用小阈值。\n   */\n  truncateToolResponses(messages: ChatMessage[]): ChatMessage[] {\n    const size = messages.length\n    return messages.map((msg, i) => {\n      if (msg.role !== 'tool') return msg\n      const recent = size - i <= this.opts.keepRecentMessages\n      const limit = recent ? this.opts.toolResultMaxChars : this.opts.oldToolResultMaxChars\n      return { ...msg, content: this.truncateText(msg.content, limit) }\n    })\n  }",purpose:"压缩单条工具大输出：保留头尾关键信息，限制它在后续轮次反复占用上下文。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"truncateText",kind:"方法 / 函数",startLine:71,endLine:81,code:"/** 截掉中段，保留头 60% / 尾 40%，中间塞提示。幂等：含哨兵跳过。 */\n  private truncateText(text: string, limit: number): string {\n    if (!text || text.length <= limit) return text\n    if (text.includes(TRUNCATE_MARKER)) return text\n    const headLen = Math.floor(limit * 0.6)\n    const tailLen = limit - headLen\n    const cut = text.length - headLen - tailLen\n    const head = text.slice(0, headLen)\n    const tail = text.slice(text.length - tailLen)\n    return `${head}\\n...[已截断 ${cut} 字符，${TRUNCATE_MARKER}]...\\n${tail}`\n  }",purpose:"压缩单条工具大输出：保留头尾关键信息，限制它在后续轮次反复占用上下文。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"compressIfNeeded",kind:"方法 / 函数",startLine:83,endLine:111,code:"// ===================== Layer 4：历史压缩 =====================\n\n  /** 估算超阈值时压缩历史，否则原样返回。 */\n  async compressIfNeeded(messages: ChatMessage[]): Promise<ChatMessage[]> {\n    if (this.consecutiveFailures >= this.opts.circuitLimit) return messages\n    if (this.estimateTokens(messages) <= this.opts.maxContextTokens) return messages\n    if (messages.length <= this.opts.keepRecentMessages + 1) return messages\n\n    let cutIndex = messages.length - this.opts.keepRecentMessages\n    // 保留区不能以孤儿 tool 消息开头（它的 tool_call 在 assistant 上，会被切走）\n    while (cutIndex > 1 && messages[cutIndex]?.role === 'tool') {\n      cutIndex--\n    }\n    if (cutIndex <= 1) return messages\n\n    const summaryRegion = messages.slice(1, cutIndex)\n    const summary = await this.summarize(summaryRegion)\n    if (summary === null) {\n      this.consecutiveFailures++\n      return messages\n    }\n    this.consecutiveFailures = 0\n\n    return [\n      messages[0]!, // system\n      { role: 'user', content: '以下是早先对话的摘要，供你继续任务时参考：\\n' + summary },\n      ...messages.slice(cutIndex),\n    ]\n  }",purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"summarize",kind:"方法 / 函数",startLine:113,endLine:125,code:"/** 调摘要 LLM 把一段历史压成结论文本；失败返回 null */\n  private async summarize(region: ChatMessage[]): Promise<string | null> {\n    try {\n      const rendered = this.renderRegion(region)\n      const text = await this.llm.complete([\n        { role: 'system', content: SUMMARY_PROMPT },\n        { role: 'user', content: rendered },\n      ])\n      return text && text.trim() !== '' ? text : null\n    } catch {\n      return null\n    }\n  }",purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"renderRegion",kind:"方法 / 函数",startLine:127,endLine:143,code:"/** 把一段消息渲染成纯文本喂给摘要 LLM */\n  private renderRegion(region: ChatMessage[]): string {\n    const lines: string[] = []\n    for (const msg of region) {\n      if (msg.role === 'user') {\n        lines.push('用户: ' + msg.content)\n      } else if (msg.role === 'assistant') {\n        if (msg.content) lines.push('助手: ' + msg.content)\n        for (const call of msg.tool_calls ?? []) {\n          lines.push(`助手调用工具 ${call.function.name}: ${call.function.arguments}`)\n        }\n      } else if (msg.role === 'tool') {\n        lines.push(`工具结果: ${msg.content}`)\n      }\n    }\n    return lines.join('\\n')\n  }",purpose:"封装“renderRegion”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"estimateTokens",kind:"方法 / 函数",startLine:145,endLine:161,code:"// ===================== 工具方法 =====================\n\n  /** 估算整段消息的 token 数（字符数粗估） */\n  estimateTokens(messages: ChatMessage[]): number {\n    let chars = 0\n    for (const msg of messages) {\n      if (msg.role === 'assistant') {\n        chars += msg.content?.length ?? 0\n        for (const call of msg.tool_calls ?? []) {\n          chars += call.function.arguments?.length ?? 0\n        }\n      } else {\n        chars += msg.content?.length ?? 0\n      }\n    }\n    return Math.floor(chars / CHARS_PER_TOKEN)\n  }",purpose:"封装“estimateTokens”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/ContextManager.java",layer:"Java 后端",summary:"上下文治理：工具结果截断、历史摘要、配对约束与熔断",lineCount:291,order:6,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:40,endLine:62,code:'/**\n * 上下文管理 —— 防止 agentic loop 多轮滚下来把模型上下文撑爆。\n *\n * 抄 Claude Code 的思路，只做两层（其余 cache_edits / session memory 是为 prompt cache\n * 做的精细活，DeepSeek/GLM 场景 ROI 低，不做）：\n *\n *  Layer 0 —— 大工具结果截断：单条工具结果（cat 大文件、tail 海量日志）超阈值就截掉中段，\n *             只留头尾 + 一行截断提示。分级：最近 K 条用大阈值保细节，更早的用小阈值大力收紧，\n *             让 token 不随轮数线性膨胀。注意：完整内容我们本来就落了 t_message，\n *             截断只作用于"回灌给模型的副本"，落库的仍是完整内容，可还原。\n *\n *  Layer 4 —— 历史压缩：整段 messages 估算 token 超阈值时，把较早的对话丢给 LLM 摘要成一条，\n *             保留 system + 最近 K 条原文。硬约束：assistant 的 tool_call 和它的\n *             tool_result 必须成对，切割点不能落在中间，否则 GLM 直接报错。\n *             摘要 LLM 连续失败到熔断阈值就停止压缩、裸跑兜底，避免摘要本身挂了拖死主流程。\n *\n * 阈值全部可配置（application 配置项 xwssh.context.*），方便联调时调小快速触发验证。\n * token 用字符数粗估：中英混合约 2.5 字符 / token，不引 tokenizer 依赖。\n */\n@Component\npublic class ContextManager {\n\n    private static final Logger log = LoggerFactory.getLogger(ContextManager.class);\n\n    /** 字符数到 token 的粗估系数：中英混合约 2.5 字符 = 1 token */\n    private static final double CHARS_PER_TOKEN = 2.5;\n\n    private final OpenAiChatModel chatModel;\n\n    /** Layer 0：最近 K 条内的工具结果保留的最大字符数，超出截断中段 */\n    private final int toolResultMaxChars;\n    /** Layer 0：更早（保留区之外）的工具结果用更小的阈值，旧命令输出大力收紧——token 不随轮数膨胀 */\n    private final int oldToolResultMaxChars;\n    /** Layer 4：整段上下文估算 token 超过此值触发压缩 */\n    private final int maxContextTokens;\n    /** Layer 4：压缩时保留最近多少条消息原文（不进摘要） */\n    private final int keepRecentMessages;\n    /** Layer 4：摘要 LLM 连续失败达到此次数后熔断，不再压缩 */\n    private final int circuitLimit;\n\n    /** 摘要 LLM 连续失败计数，成功清零；达到 circuitLimit 触发熔断 */\n    private final AtomicInteger consecutiveFailures = new AtomicInteger(0);',purpose:"上下文治理：工具结果截断、历史摘要、配对约束与熔断。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"ContextManager",kind:"方法 / 函数",startLine:63,endLine:65,code:'public ContextManager(\n            OpenAiChatModel chatModel,\n            @Value("${xwssh.context.tool-result-max-chars:8000}") int toolResultMaxChars,',purpose:"实现“ContextManager”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"truncateToolResponses",kind:"方法 / 函数",startLine:78,endLine:110,code:'// ============================ Layer 0：工具结果截断 ============================\n\n    /**\n     * 对历史里所有工具结果做截断（幂等：已截短的再跑也不变）。\n     * 返回新列表，不改原列表。只重建超长的 ToolResponseMessage，其余消息原样保留。\n     */\n    /**\n     * 对历史里所有工具结果做截断（幂等：已截短的再跑也不变）。\n     * 返回新列表，不改原列表。只重建超长的 ToolResponseMessage，其余消息原样保留。\n     *\n     * 分级截断（省 token 核心 + 缓存友好）：\n     *  - 最近 keepRecentMessages 条内的工具结果：用大阈值 toolResultMaxChars，保住当前推理需要的细节；\n     *  - 更早的工具结果：用小阈值 oldToolResultMaxChars 大力收紧——旧命令输出模型已读过、结论已在历史里，\n     *    没必要每轮全量重发。这样 token 不随轮数线性膨胀。\n     *  判定按"距末尾的距离"而非绝对下标：一旦某条进入"旧区"，后续轮次它只会更旧，\n     *  截断结果跨轮稳定 → 不破坏 GLM 上下文缓存前缀。\n     */\n    public List<Message> truncateToolResponses(List<Message> messages) {\n        List<Message> result = new ArrayList<>(messages.size());\n        int size = messages.size();\n        for (int i = 0; i < size; i++) {\n            Message msg = messages.get(i);\n            if (msg instanceof ToolResponseMessage trm) {\n                // 距末尾 keepRecentMessages 条以内算"近"，用大阈值；否则算"旧"，用小阈值\n                boolean recent = (size - i) <= keepRecentMessages;\n                int limit = recent ? toolResultMaxChars : oldToolResultMaxChars;\n                result.add(truncateOne(trm, limit));\n            } else {\n                result.add(msg);\n            }\n        }\n        return result;\n    }',purpose:"压缩单条工具大输出：保留头尾关键信息，限制它在后续轮次反复占用上下文。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"truncateOne",kind:"方法 / 函数",startLine:112,endLine:121,code:"/** 重建一条 ToolResponseMessage：把每个超长的 responseData 截掉中段 */\n    private ToolResponseMessage truncateOne(ToolResponseMessage trm, int limit) {\n        List<ToolResponseMessage.ToolResponse> truncated = new ArrayList<>();\n        for (ToolResponseMessage.ToolResponse resp : trm.getResponses()) {\n            String data = resp.responseData();\n            truncated.add(new ToolResponseMessage.ToolResponse(\n                    resp.id(), resp.name(), truncateText(data, limit)));\n        }\n        return ToolResponseMessage.builder().responses(truncated).build();\n    }",purpose:"封装“truncateOne”对应的业务计算，并向调用方返回处理结果。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"truncateText",kind:"方法 / 函数",startLine:126,endLine:145,code:'/** 截掉中段，保留头 60% / 尾 40%，中间塞一行提示（指向 t_message 取完整内容） */\n    private String truncateText(String text, int limit) {\n        if (text == null || text.length() <= limit) {\n            return text;\n        }\n        // 幂等：已经截过的（含哨兵）不再处理，否则头尾+提示可能仍超阈值被反复截。\n        // 注意：旧区阈值比近区小，一条"近区截断版"挪到旧区后因含哨兵会保持原样，\n        // 不会再按小阈值二次收紧——可接受：避免反复改写历史、保住缓存比再省几百字符更划算。\n        if (text.contains(TRUNCATE_MARKER)) {\n            return text;\n        }\n        int headLen = (int) (limit * 0.6);\n        int tailLen = limit - headLen;\n        int cut = text.length() - headLen - tailLen;\n        String head = text.substring(0, headLen);\n        String tail = text.substring(text.length() - tailLen);\n        return head\n                + "\\n...[已截断 " + cut + " 字符，" + TRUNCATE_MARKER + "]...\\n"\n                + tail;\n    }',purpose:"压缩单条工具大输出：保留头尾关键信息，限制它在后续轮次反复占用上下文。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"compressIfNeeded",kind:"方法 / 函数",startLine:147,endLine:199,code:'// ============================ Layer 4：历史压缩 ============================\n\n    /**\n     * 估算上下文超阈值时压缩历史，否则原样返回。\n     *\n     * 切割策略：messages[0] 是 system，固定保留；尾部保留 keepRecentMessages 条原文；\n     * 中间较早的对话渲染成纯文本丢给 LLM 摘要，压成一条 UserMessage 插在 system 之后。\n     *\n     * 成对约束：保留区开头不能是 ToolResponseMessage（否则它的 tool_call 落在摘要区被切走，\n     * 模型见到孤儿 tool_result 会报错）。切割点往前移到对应 assistant，让两者一起进保留区。\n     */\n    public List<Message> compressIfNeeded(List<Message> messages) {\n        // 熔断：摘要 LLM 连续挂了就别再试，裸跑兜底\n        if (consecutiveFailures.get() >= circuitLimit) {\n            return messages;\n        }\n        if (estimateTokens(messages) <= maxContextTokens) {\n            return messages;\n        }\n        // 太短没什么可压（至少要有 system + 摘要区 + 保留区）\n        if (messages.size() <= keepRecentMessages + 1) {\n            return messages;\n        }\n\n        int cutIndex = messages.size() - keepRecentMessages;\n        // 把切割点往前挪，避免保留区以孤儿 tool_result 开头\n        while (cutIndex > 1 && messages.get(cutIndex) instanceof ToolResponseMessage) {\n            cutIndex--;\n        }\n        // 挪到头了说明摘要区为空，没东西可压\n        if (cutIndex <= 1) {\n            return messages;\n        }\n\n        List<Message> summaryRegion = messages.subList(1, cutIndex);\n        String summary = summarize(summaryRegion);\n        if (summary == null) {\n            // 摘要失败：计数 +1，本轮放弃压缩，原样返回\n            int fails = consecutiveFailures.incrementAndGet();\n            log.warn("历史摘要失败（连续 {} 次），本轮跳过压缩", fails);\n            return messages;\n        }\n        consecutiveFailures.set(0);   // 成功清零\n\n        List<Message> compressed = new ArrayList<>();\n        compressed.add(messages.get(0));   // system\n        compressed.add(new UserMessage("以下是早先对话的摘要，供你继续任务时参考：\\n" + summary));\n        compressed.addAll(messages.subList(cutIndex, messages.size()));   // 最近 K 条原文\n\n        log.info("上下文压缩：{} 条 -> {} 条（摘要了 {} 条）",\n                messages.size(), compressed.size(), summaryRegion.size());\n        return compressed;\n    }',purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"summarize",kind:"方法 / 函数",startLine:201,endLine:219,code:'/** 调摘要 LLM 把一段历史压成结论文本；失败返回 null（由调用方走熔断逻辑） */\n    private String summarize(List<Message> region) {\n        try {\n            String rendered = renderRegion(region);\n            // 摘要请求不带任何工具，纯文本进纯文本出，避免又触发 tool_call\n            List<Message> prompt = List.of(\n                    new SystemMessage(SUMMARY_PROMPT),\n                    new UserMessage(rendered));\n            ChatResponse resp = chatModel.call(new Prompt(prompt));\n            if (resp == null || resp.getResult() == null) {\n                return null;\n            }\n            String text = resp.getResult().getOutput().getText();\n            return (text == null || text.isBlank()) ? null : text;\n        } catch (Exception e) {\n            log.warn("摘要 LLM 调用异常: {}", e.getMessage());\n            return null;\n        }\n    }',purpose:"在上下文超过阈值时摘要早期历史，同时保留最近消息和工具调用配对。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"renderRegion",kind:"方法 / 函数",startLine:231,endLine:255,code:'/** 把一段消息渲染成纯文本喂给摘要 LLM（按角色标注，工具调用/结果也转成可读文本） */\n    private String renderRegion(List<Message> region) {\n        StringBuilder sb = new StringBuilder();\n        for (Message msg : region) {\n            if (msg instanceof UserMessage um) {\n                sb.append("用户: ").append(um.getText()).append("\\n");\n            } else if (msg instanceof AssistantMessage am) {\n                if (am.getText() != null && !am.getText().isBlank()) {\n                    sb.append("助手: ").append(am.getText()).append("\\n");\n                }\n                if (am.getToolCalls() != null) {\n                    for (AssistantMessage.ToolCall call : am.getToolCalls()) {\n                        sb.append("助手调用工具 ").append(call.name())\n                                .append(": ").append(call.arguments()).append("\\n");\n                    }\n                }\n            } else if (msg instanceof ToolResponseMessage trm) {\n                for (ToolResponseMessage.ToolResponse resp : trm.getResponses()) {\n                    sb.append("工具[").append(resp.name()).append("]结果: ")\n                            .append(resp.responseData()).append("\\n");\n                }\n            }\n        }\n        return sb.toString();\n    }',purpose:"封装“renderRegion”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"estimateTokens",kind:"方法 / 函数",startLine:257,endLine:266,code:"// ============================ 工具方法 ============================\n\n    /** 估算整段消息的 token 数（字符数粗估，不引 tokenizer） */\n    public int estimateTokens(List<Message> messages) {\n        long chars = 0;\n        for (Message msg : messages) {\n            chars += messageChars(msg);\n        }\n        return (int) (chars / CHARS_PER_TOKEN);\n    }",purpose:"封装“estimateTokens”对应的业务计算，并向调用方返回处理结果。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"messageChars",kind:"方法 / 函数",startLine:268,endLine:289,code:"/** 单条消息的字符量：取其文本 + 工具调用参数 + 工具结果内容 */\n    private long messageChars(Message msg) {\n        if (msg instanceof ToolResponseMessage trm) {\n            long n = 0;\n            for (ToolResponseMessage.ToolResponse resp : trm.getResponses()) {\n                String d = resp.responseData();\n                n += d == null ? 0 : d.length();\n            }\n            return n;\n        }\n        if (msg instanceof AssistantMessage am) {\n            long n = am.getText() == null ? 0 : am.getText().length();\n            if (am.getToolCalls() != null) {\n                for (AssistantMessage.ToolCall call : am.getToolCalls()) {\n                    n += call.arguments() == null ? 0 : call.arguments().length();\n                }\n            }\n            return n;\n        }\n        String t = msg.getText();\n        return t == null ? 0 : t.length();\n    }",purpose:"封装“messageChars”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/ContextManagerTest.java",layer:"Java 测试",summary:"上下文治理：工具结果截断、历史摘要、配对约束与熔断",lineCount:228,order:6,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:29,endLine:30,code:"/**\n * 上下文管理单测 —— 截断/压缩/配对/熔断是 M3 的硬逻辑，必须覆盖。\n * Layer 0 截断不调模型，chatModel 传 null；Layer 4 压缩用 mock 模拟摘要返回，纯逻辑不连真模型。\n */\nclass ContextManagerTest {",purpose:"上下文治理：工具结果截断、历史摘要、配对约束与熔断。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"truncator",kind:"方法 / 函数",startLine:31,endLine:37,code:"// ============================ Layer 0：截断 ============================\n\n    /** 截断不调模型，chatModel 给 null 也能跑 */\n    private ContextManager truncator(int maxChars) {\n        // old 阈值给同值：旧用例只放单条工具结果、位置都在保留区内，走 recent 分支，old 不生效\n        return new ContextManager(null, maxChars, maxChars, 999999, 6, 3);\n    }",purpose:"测试场景“truncator”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toolMsg",kind:"方法 / 函数",startLine:39,endLine:44,code:"/** 造一条工具结果消息 */\n    private ToolResponseMessage toolMsg(String id, String name, String data) {\n        return ToolResponseMessage.builder()\n                .responses(List.of(new ToolResponseMessage.ToolResponse(id, name, data)))\n                .build();\n    }",purpose:"测试场景“toolMsg”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toolData",kind:"方法 / 函数",startLine:46,endLine:48,code:"private String toolData(Message msg) {\n        return ((ToolResponseMessage) msg).getResponses().get(0).responseData();\n    }",purpose:"测试场景“toolData”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"mockModel",kind:"方法 / 函数",startLine:113,endLine:122,code:"// ============================ Layer 4：压缩 ============================\n\n    /** 造一个会返回固定摘要文本的 mock 模型 */\n    private OpenAiChatModel mockModel(String summary) {\n        OpenAiChatModel m = mock(OpenAiChatModel.class);\n        ChatResponse resp = new ChatResponse(List.of(\n                new Generation(new AssistantMessage(summary), ChatGenerationMetadata.NULL)));\n        when(m.call(any(org.springframework.ai.chat.prompt.Prompt.class))).thenReturn(resp);\n        return m;\n    }",purpose:"测试场景“mockModel”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]},{name:"longHistory",kind:"方法 / 函数",startLine:124,endLine:133,code:'/** 造一段够长的对话（system + 多轮 user/assistant），确保 token 估算超阈值 */\n    private List<Message> longHistory(int rounds) {\n        java.util.List<Message> msgs = new java.util.ArrayList<>();\n        msgs.add(new SystemMessage("你是运维助手"));\n        for (int i = 0; i < rounds; i++) {\n            msgs.add(new UserMessage("第" + i + "步：" + "内".repeat(100)));\n            msgs.add(new AssistantMessage("回复" + i + "：" + "容".repeat(100)));\n        }\n        return msgs;\n    }',purpose:"测试场景“longHistory”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/SshTools.java",layer:"Java 后端",summary:"面向大模型暴露的工具适配层，承接审计与串行化",lineCount:190,order:7,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:29,endLine:36,code:'/**\n * Agent 的工具集 —— 会话级实例：一个 SshTools 绑定一台已连接的目标机。\n *\n * 为什么不做成 @Service 单例：连接信息是会话级的（"这次会话操作哪台机"），\n * 单例工具没法持有"当前会话的连接"。所以每次发起一轮 agent 任务时 new 一个，\n * 把连好的 SshClient + 本次会话 id + 审计/门禁注进来，loop 结束随会话释放。\n *\n * 审计：execCommand 是真正下发命令的点，在这里记一笔 t_audit（执行点审计）。\n * 能到达这里的命令必经 AgentService.screen 放行，所以危险命令视为已确认。\n *\n * SFTP 工具（listFiles/deleteFile/makeDir/moveFile）走 ChannelSftp。写操作映射成\n * 等价 shell 命令（rm/mkdir/mv）过同一个 CommandGuard：DENY 直接拒，复用现有规则，\n * 审计可读。SFTP 与人工面板共用一条 Session，操作在 lock 内串行化（lock 可为 null，\n * 同步测试场景独占连接无需锁）。\n */\npublic class SshTools {\n\n    private final SshClient ssh;\n    private final Long sessionId;\n    private final AuditService auditService;\n    private final CommandGuard guard;\n    private final Lock lock;   // 与人工 SFTP/监控串行化，可为 null（独占连接时）',purpose:"面向大模型暴露的工具适配层，承接审计与串行化。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"SshTools",kind:"方法 / 函数",startLine:37,endLine:39,code:"public SshTools(SshClient ssh, Long sessionId, AuditService auditService, CommandGuard guard) {\n        this(ssh, sessionId, auditService, guard, null);\n    }",purpose:"实现“SshTools”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["在副作用发生前执行安全策略判断。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"SshTools",kind:"方法 / 函数",startLine:41,endLine:47,code:"public SshTools(SshClient ssh, Long sessionId, AuditService auditService, CommandGuard guard, Lock lock) {\n        this.ssh = ssh;\n        this.sessionId = sessionId;\n        this.auditService = auditService;\n        this.guard = guard;\n        this.lock = lock;\n    }",purpose:"实现“SshTools”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["在副作用发生前执行安全策略判断。","通过锁或运行标记避免共享资源被并发操作。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"execCommand",kind:"方法 / 函数",startLine:49,endLine:56,code:"@Tool(description = \"在目标服务器上执行一条 shell 命令，返回标准输出、错误输出和退出码。用于查看系统状态、进程、磁盘等运维操作。\")\n    public String execCommand(\n            @ToolParam(description = \"要执行的 shell 命令，例如 'df -h' 或 'ps aux | grep java'\") String command) {\n        // execCommand 是可写工具：审计要标注危险性。能执行到这说明已过门禁放行，\n        // 危险命令（非 ALLOW）视为已确认（confirmed=true）。\n        boolean dangerous = guard.evaluate(command).decision() != CommandGuard.Decision.ALLOW;\n        return runAndAudit(command, dangerous, dangerous);\n    }",purpose:"向远程服务器执行命令，收集 stdout、stderr、exitCode，并连接审计链路。",steps:["在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"readRemoteFile",kind:"方法 / 函数",startLine:58,endLine:63,code:'@Tool(description = "读取目标服务器上指定路径的文本文件的完整内容。")\n    public String readRemoteFile(\n            @ToolParam(description = "远程文件的绝对路径，例如 \'/etc/nginx/nginx.conf\'") String path) {\n        // 只读工具：固定非危险、无需确认。单引号包裹防路径里的空格/特殊字符\n        return runAndAudit("cat \'" + path + "\'", false, false);\n    }',purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"tailLog",kind:"方法 / 函数",startLine:65,endLine:70,code:'@Tool(description = "读取目标服务器上日志文件的末尾若干行，用于快速查看最新日志。")\n    public String tailLog(\n            @ToolParam(description = "日志文件的绝对路径，例如 \'/var/log/nginx/error.log\'") String path,\n            @ToolParam(description = "读取末尾的行数，例如 100") int lines) {\n        return runAndAudit("tail -n " + lines + " \'" + path + "\'", false, false);\n    }',purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"listFiles",kind:"方法 / 函数",startLine:72,endLine:93,code:'// —— SFTP 文件操作工具 ——\n\n    @Tool(description = "列出目标服务器上指定目录的文件和子目录，返回每项的名称、是否目录、大小（字节）和权限。")\n    public String listFiles(\n            @ToolParam(description = "要列出的目录绝对路径，例如 \'/var/log\'") String path) {\n        return withLock(() -> {\n            try {\n                List<RemoteFile> files = ssh.listDir(path);\n                if (files.isEmpty()) return "（空目录）" + path;\n                StringBuilder sb = new StringBuilder("目录 ").append(path).append(" 共 ")\n                        .append(files.size()).append(" 项:\\n");\n                for (RemoteFile f : files) {\n                    sb.append(f.isDir() ? "[d] " : "[f] ").append(f.name())\n                      .append("  ").append(f.isDir() ? "-" : f.size() + "B")\n                      .append("  ").append(f.perms()).append("\\n");\n                }\n                return sb.toString();\n            } catch (Exception e) {\n                return "列目录失败: " + e.getMessage();\n            }\n        });\n    }',purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"deleteFile",kind:"方法 / 函数",startLine:95,endLine:103,code:'@Tool(description = "删除目标服务器上的一个文件（不能删目录）。危险操作，会经过安全门禁审查。")\n    public String deleteFile(\n            @ToolParam(description = "要删除的文件绝对路径，例如 \'/tmp/old.log\'") String path) {\n        // 映射成等价 rm 命令过门禁，复用现有删除规则\n        return sftpWrite("rm \'" + path + "\'", () -> {\n            ssh.deleteFile(path);\n            return "已删除文件: " + path;\n        });\n    }',purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"makeDir",kind:"方法 / 函数",startLine:105,endLine:112,code:'@Tool(description = "在目标服务器上创建一个目录。会经过安全门禁审查。")\n    public String makeDir(\n            @ToolParam(description = "要创建的目录绝对路径，例如 \'/opt/app/data\'") String path) {\n        return sftpWrite("mkdir \'" + path + "\'", () -> {\n            ssh.mkdir(path);\n            return "已创建目录: " + path;\n        });\n    }',purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"moveFile",kind:"方法 / 函数",startLine:114,endLine:122,code:'@Tool(description = "重命名或移动目标服务器上的文件/目录。会经过安全门禁审查。")\n    public String moveFile(\n            @ToolParam(description = "源路径绝对路径") String from,\n            @ToolParam(description = "目标路径绝对路径") String to) {\n        return sftpWrite("mv \'" + from + "\' \'" + to + "\'", () -> {\n            ssh.rename(from, to);\n            return "已移动: " + from + " -> " + to;\n        });\n    }',purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["把外部路径拼进 Shell 命令时必须防止引号逃逸和命令注入。"]},{name:"sftpWrite",kind:"方法 / 函数",startLine:124,endLine:148,code:'/**\n     * SFTP 写操作统一入口：先把等价 shell 命令过 CommandGuard，DENY 直接拒绝（复刻线上\n     * AutoConfirmationHandler 语义：ASK 自动放行）。放行后在 lock 内执行 SFTP 动作并落审计。\n     */\n    private String sftpWrite(String equivCommand, SftpAction action) {\n        CommandGuard.Verdict verdict = guard.evaluate(equivCommand);\n        if (verdict.decision() == CommandGuard.Decision.DENY) {\n            auditService.logBlocked(sessionId, equivCommand, true, "DENY: " + verdict.reason());\n            return "操作被安全门禁拒绝（" + verdict.reason() + "）。请改用更安全的方式或询问用户。";\n        }\n        boolean dangerous = verdict.decision() != CommandGuard.Decision.ALLOW;\n        return withLock(() -> {\n            try {\n                String msg = action.run();\n                // SFTP 无 shell exitCode，成功即 0、失败走 catch\n                auditService.logExecuted(sessionId, equivCommand,\n                        new ExecResult(msg, "", 0), dangerous, dangerous);\n                return msg;\n            } catch (Exception e) {\n                auditService.logExecuted(sessionId, equivCommand,\n                        new ExecResult("", e.getMessage(), 1), dangerous, dangerous);\n                return "操作失败: " + e.getMessage();\n            }\n        });\n    }',purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["根据输入、连接或业务状态选择处理分支。","在副作用发生前执行安全策略判断。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"withLock",kind:"方法 / 函数",startLine:150,endLine:159,code:"/** 在 lock 内执行（lock 为 null 时直接执行），与人工 SFTP/监控串行化共用一条 Session */\n    private String withLock(java.util.function.Supplier<String> body) {\n        if (lock == null) return body.get();\n        lock.lock();\n        try {\n            return body.get();\n        } finally {\n            lock.unlock();\n        }\n    }",purpose:"封装“withLock”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。"],risks:[]},{name:"runAndAudit",kind:"方法 / 函数",startLine:167,endLine:188,code:'/**\n     * 执行命令 → 落审计 → 把三件套格式化成文本喂回模型。\n     * 模型靠这段文本判断命令成败、决定下一步，所以 exitCode 和 stderr 都要明确带上。\n     */\n    private String runAndAudit(String command, boolean dangerous, boolean confirmed) {\n        try {\n            ExecResult r = ssh.exec(command);\n            auditService.logExecuted(sessionId, command, r, dangerous, confirmed);\n            StringBuilder sb = new StringBuilder();\n            sb.append("exitCode=").append(r.exitCode()).append("\\n");\n            if (!r.stdout().isEmpty()) {\n                sb.append("stdout:\\n").append(r.stdout());\n            }\n            if (!r.stderr().isEmpty()) {\n                sb.append("stderr:\\n").append(r.stderr());\n            }\n            return sb.toString();\n        } catch (Exception e) {\n            // 工具内部异常不能抛给 loop，要作为"工具结果"回灌，让模型知道这步失败了\n            return "命令执行异常: " + e.getMessage();\n        }\n    }',purpose:"向远程服务器执行命令，收集 stdout、stderr、exitCode，并连接审计链路。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"clients/app/lib/core/glm.dart",layer:"Flutter 核心",summary:"OpenAI 兼容协议客户端、SSE 增量解析与工具调用聚合",lineCount:293,order:8,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:15,endLine:36,code:"/// 对话消息（OpenAI chat 格式子集，够 agent loop 用）。\n/// 用一个类承载四种 role，toJson 按 role 产出对应字段。\nclass ChatMessage {\n  final String role; // system | user | assistant | tool\n  final String? content;\n  final List<ToolCall>? toolCalls; // 仅 assistant\n  final String? toolCallId; // 仅 tool\n\n  const ChatMessage._({\n    required this.role,\n    this.content,\n    this.toolCalls,\n    this.toolCallId,\n  });\n\n  factory ChatMessage.system(String content) =>\n      ChatMessage._(role: 'system', content: content);\n  factory ChatMessage.user(String content) =>\n      ChatMessage._(role: 'user', content: content);\n  factory ChatMessage.assistant(String? content, {List<ToolCall>? toolCalls}) =>\n      ChatMessage._(role: 'assistant', content: content, toolCalls: toolCalls);\n  factory ChatMessage.tool(String toolCallId, String content) =>\n      ChatMessage._(role: 'tool', content: content, toolCallId: toolCallId);",purpose:"OpenAI 兼容协议客户端、SSE 增量解析与工具调用聚合。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:37,endLine:51,code:"Map<String, dynamic> toJson() {\n    switch (role) {\n      case 'assistant':\n        return {\n          'role': 'assistant',\n          'content': content,\n          if (toolCalls != null && toolCalls!.isNotEmpty)\n            'tool_calls': toolCalls!.map((t) => t.toJson()).toList(),\n        };\n      case 'tool':\n        return {'role': 'tool', 'tool_call_id': toolCallId, 'content': content};\n      default:\n        return {'role': role, 'content': content};\n    }\n  }",purpose:"封装“toJson”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:74,endLine:78,code:"Map<String, dynamic> toJson() => {\n        'id': id,\n        'type': 'function',\n        'function': {'name': name, 'arguments': arguments},\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:102,endLine:109,code:"Map<String, dynamic> toJson() => {\n        'type': 'function',\n        'function': {\n          'name': name,\n          'description': description,\n          'parameters': parameters,\n        },\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"GlmClient",kind:"方法 / 函数",startLine:151,endLine:158,code:"GlmClient(LlmConfig cfg)\n      : _model = cfg.model,\n        _dio = Dio(BaseOptions(\n          baseUrl: cfg.baseURL,\n          headers: {\n            'Authorization': 'Bearer ${cfg.apiKey}',\n            'Content-Type': 'application/json',\n          },",purpose:"实现“GlmClient”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"stream",kind:"方法 / 函数",startLine:164,endLine:268,code:"/// 一次流式调用：透传 token / reasoning 增量，聚合成完整结果返回。\n  /// 关闭框架自动工具执行——工具调用聚合后交回上层 loop 过门禁再执行。\n  Future<ChatResult> stream(\n    List<ChatMessage> messages,\n    List<ToolDef> tools,\n    StreamHandlers handlers,\n  ) async {\n    final resp = await _dio.post<ResponseBody>(\n      '/chat/completions',\n      data: {\n        'model': _model,\n        'messages': messages.map((m) => m.toJson()).toList(),\n        if (tools.isNotEmpty) 'tools': tools.map((t) => t.toJson()).toList(),\n        'stream': true,\n        'stream_options': {'include_usage': true},\n      },\n      options: Options(responseType: ResponseType.stream),\n    );\n\n    var text = '';\n    var reasoningText = ''; // 聚合 reasoning_content（GLM 有时把结论放这里）\n    // tool_calls 在流式下分片到达，按 index 累积\n    final toolAcc = <int, _ToolAcc>{};\n    Usage? usage;\n\n    // SSE 按行解析：data: {...}\\n\\n，可能跨 chunk，需缓冲。\n    // 关键：用 utf8.decoder 流式解码，它会自动缓存跨 chunk 的多字节字符尾巴，\n    // 避免一个中文字（3 字节）被 chunk 边界切断后解成乱码 �。\n    final decoded = utf8.decoder.bind(resp.data!.stream);\n    var buffer = '';\n\n    await for (final chunkText in decoded) {\n      buffer += chunkText;\n      // 按 SSE 事件分隔（\\n 行）逐行处理，保留最后不完整行到 buffer\n      final lines = buffer.split('\\n');\n      buffer = lines.removeLast(); // 最后一段可能不完整，留待下个 chunk\n\n      for (final raw in lines) {\n        final line = raw.trim();\n        if (line.isEmpty || !line.startsWith('data:')) continue;\n        final payload = line.substring(5).trim();\n        if (payload == '[DONE]') continue;\n\n        final Map<String, dynamic> json;\n        try {\n          json = jsonDecode(payload) as Map<String, dynamic>;\n        } catch (_) {\n          continue; // 跳过无法解析的行\n        }\n\n        final choices = json['choices'] as List<dynamic>?;\n        if (choices != null && choices.isNotEmpty) {\n          final delta = (choices[0] as Map<String, dynamic>)['delta']\n                  as Map<String, dynamic>? ??\n              {};\n\n          // GLM 思考阶段：reasoning_content 增量，单独推 + 聚合（结论可能在此）\n          final reasoning = delta['reasoning_content'] as String?;\n          if (reasoning != null && reasoning.isNotEmpty) {\n            reasoningText += reasoning;\n            handlers.onReasoning?.call(reasoning);\n          }\n          final content = delta['content'] as String?;\n          if (content != null && content.isNotEmpty) {\n            text += content;\n            handlers.onToken?.call(content);\n          }\n          final tcs = delta['tool_calls'] as List<dynamic>?;\n          if (tcs != null) {\n            for (final tcRaw in tcs) {\n              final tc = tcRaw as Map<String, dynamic>;\n              final index = (tc['index'] as num?)?.toInt() ?? 0;\n              final cur = toolAcc.putIfAbsent(index, () => _ToolAcc());\n              if (tc['id'] != null) cur.id = tc['id'] as String;\n              final fn = tc['function'] as Map<String, dynamic>?;\n              if (fn != null) {\n                if (fn['name'] != null) cur.name = fn['name'] as String;\n                if (fn['arguments'] != null) cur.args += fn['arguments'] as String;\n              }\n            }\n          }\n        }\n\n        // usage 通常在最后一个 chunk（include_usage）\n        final u = json['usage'] as Map<String, dynamic>?;\n        if (u != null) {\n          final details = u['prompt_tokens_details'] as Map<String, dynamic>?;\n          usage = Usage(\n            promptTokens: (u['prompt_tokens'] as num?)?.toInt() ?? 0,\n            completionTokens: (u['completion_tokens'] as num?)?.toInt() ?? 0,\n            totalTokens: (u['total_tokens'] as num?)?.toInt() ?? 0,\n            cachedTokens: (details?['cached_tokens'] as num?)?.toInt() ?? 0,\n          );\n        }\n      }\n    }\n\n    final toolCalls = (toolAcc.entries.toList()\n          ..sort((a, b) => a.key.compareTo(b.key)))\n        .map((e) => ToolCall(id: e.value.id, name: e.value.name, arguments: e.value.args))\n        .toList();\n\n    return ChatResult(\n        text: text, reasoning: reasoningText, toolCalls: toolCalls, usage: usage);\n  }",purpose:"建立流式执行链，把模型增量、工具调用、拦截和完成状态实时推送给客户端。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"complete",kind:"方法 / 函数",startLine:270,endLine:284,code:"/// 非流式调用：用于上下文压缩的摘要请求（纯文本进出，不带工具）\n  Future<String> complete(List<ChatMessage> messages) async {\n    final resp = await _dio.post<Map<String, dynamic>>(\n      '/chat/completions',\n      data: {\n        'model': _model,\n        'messages': messages.map((m) => m.toJson()).toList(),\n        'stream': false,\n      },\n    );\n    final choices = resp.data?['choices'] as List<dynamic>?;\n    if (choices == null || choices.isEmpty) return '';\n    final msg = (choices[0] as Map<String, dynamic>)['message'] as Map<String, dynamic>?;\n    return msg?['content'] as String? ?? '';\n  }",purpose:"封装“complete”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/core/glm.ts",layer:"CLI",summary:"OpenAI 兼容协议客户端、SSE 增量解析与工具调用聚合",lineCount:153,order:8,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:19,endLine:59,code:"/** 一次工具调用 */\nexport interface ToolCall {\n  id: string\n  type: 'function'\n  function: { name: string; arguments: string }\n}\n\n/** 工具定义（function schema） */\nexport interface ToolDef {\n  type: 'function'\n  function: {\n    name: string\n    description: string\n    parameters: Record<string, unknown>\n  }\n}\n\n/** 一次模型响应聚合结果 */\nexport interface ChatResult {\n  /** 模型正文文本 */\n  text: string\n  /** 本轮发起的工具调用（无则空数组） */\n  toolCalls: ToolCall[]\n  /** token 用量（用于缓存命中测量） */\n  usage?: {\n    promptTokens?: number\n    completionTokens?: number\n    totalTokens?: number\n    cachedTokens?: number\n  }\n}\n\n/** 流式回调：边收边推 */\nexport interface StreamHandlers {\n  onToken?: (text: string) => void\n  onReasoning?: (text: string) => void\n}\n\nexport class GlmClient {\n  private client: OpenAI\n  private model: string",purpose:"OpenAI 兼容协议客户端、SSE 增量解析与工具调用聚合。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"constructor",kind:"方法 / 函数",startLine:60,endLine:63,code:"constructor(cfg: LlmConfig) {\n    this.client = new OpenAI({ baseURL: cfg.baseURL, apiKey: cfg.apiKey })\n    this.model = cfg.model\n  }",purpose:"实现“constructor”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"stream",kind:"方法 / 函数",startLine:65,endLine:141,code:"/**\n   * 一次流式调用：透传 token / reasoning 增量，聚合成完整结果返回。\n   * 关闭框架自动工具执行——工具调用聚合后交回上层 loop 过门禁再执行。\n   */\n  async stream(\n    messages: ChatMessage[],\n    tools: ToolDef[],\n    handlers: StreamHandlers,\n  ): Promise<ChatResult> {\n    const stream = await this.client.chat.completions.create({\n      model: this.model,\n      messages: messages as OpenAI.Chat.ChatCompletionMessageParam[],\n      tools: tools.length > 0 ? (tools as OpenAI.Chat.ChatCompletionTool[]) : undefined,\n      stream: true,\n      stream_options: { include_usage: true },\n    })\n\n    let text = ''\n    // tool_calls 在流式下分片到达，按 index 累积\n    const toolAcc = new Map<number, { id: string; name: string; args: string }>()\n    let usage: ChatResult['usage']\n\n    for await (const chunk of stream) {\n      const choice = chunk.choices[0]\n      if (choice) {\n        const delta = choice.delta as {\n          content?: string | null\n          reasoning_content?: string | null\n          tool_calls?: Array<{\n            index: number\n            id?: string\n            function?: { name?: string; arguments?: string }\n          }>\n        }\n\n        // GLM 思考阶段：reasoning_content 增量，单独推\n        if (delta.reasoning_content) {\n          handlers.onReasoning?.(delta.reasoning_content)\n        }\n        if (delta.content) {\n          text += delta.content\n          handlers.onToken?.(delta.content)\n        }\n        if (delta.tool_calls) {\n          for (const tc of delta.tool_calls) {\n            const cur = toolAcc.get(tc.index) ?? { id: '', name: '', args: '' }\n            if (tc.id) cur.id = tc.id\n            if (tc.function?.name) cur.name = tc.function.name\n            if (tc.function?.arguments) cur.args += tc.function.arguments\n            toolAcc.set(tc.index, cur)\n          }\n        }\n      }\n      // usage 通常在最后一个 chunk（include_usage）\n      if (chunk.usage) {\n        const u = chunk.usage as OpenAI.Completions.CompletionUsage & {\n          prompt_tokens_details?: { cached_tokens?: number }\n        }\n        usage = {\n          promptTokens: u.prompt_tokens,\n          completionTokens: u.completion_tokens,\n          totalTokens: u.total_tokens,\n          cachedTokens: u.prompt_tokens_details?.cached_tokens ?? 0,\n        }\n      }\n    }\n\n    const toolCalls: ToolCall[] = [...toolAcc.entries()]\n      .sort((a, b) => a[0] - b[0])\n      .map(([, v]) => ({\n        id: v.id,\n        type: 'function' as const,\n        function: { name: v.name, arguments: v.args },\n      }))\n\n    return { text, toolCalls, usage }\n  }",purpose:"建立流式执行链，把模型增量、工具调用、拦截和完成状态实时推送给客户端。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"complete",kind:"方法 / 函数",startLine:143,endLine:151,code:"/** 非流式调用：用于上下文压缩的摘要请求（纯文本进出，不带工具） */\n  async complete(messages: ChatMessage[]): Promise<string> {\n    const resp = await this.client.chat.completions.create({\n      model: this.model,\n      messages: messages as OpenAI.Chat.ChatCompletionMessageParam[],\n      stream: false,\n    })\n    return resp.choices[0]?.message?.content ?? ''\n  }",purpose:"封装“complete”对应的业务计算，并向调用方返回处理结果。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/core/ssh.dart",layer:"Flutter 核心",summary:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作",lineCount:176,order:9,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:12,endLine:40,code:"/// 命令执行结果三件套\nclass ExecResult {\n  final String stdout;\n  final String stderr;\n  final int exitCode;\n  const ExecResult(this.stdout, this.stderr, this.exitCode);\n}\n\n/// 远程文件项\nclass RemoteFile {\n  final String name;\n  final String path;\n  final int size;\n  final bool isDir;\n  final String perms;\n  const RemoteFile({\n    required this.name,\n    required this.path,\n    required this.size,\n    required this.isDir,\n    required this.perms,\n  });\n}\n\nclass SshClient {\n  SSHClient? _client;\n  SSHSocket? _socket;\n  SftpClient? _sftp;\n  bool _connected = false;",purpose:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"connect",kind:"方法 / 函数",startLine:41,endLine:69,code:"/// 建立连接。10s 超时。\n  /// 传 privateKeyPem 走密钥认证（可带 passphrase）；否则用 password 走密码认证。\n  Future<void> connect(\n    String host,\n    int port,\n    String username,\n    String password, {\n    String? privateKeyPem,\n    String? passphrase,\n  }) async {\n    _socket = await SSHSocket.connect(\n      host,\n      port == 0 ? 22 : port,\n      timeout: const Duration(seconds: 10),\n    );\n    // 有私钥则解析为 identities 走公钥认证，否则回调返回密码\n    final identities = (privateKeyPem != null && privateKeyPem.trim().isNotEmpty)\n        ? SSHKeyPair.fromPem(privateKeyPem, passphrase)\n        : null;\n    _client = SSHClient(\n      _socket!,\n      username: username,\n      identities: identities,\n      onPasswordRequest: () => password,\n      // demo 方便：dartssh2 默认不强制 known_hosts 校验；生产应校验，否则有中间人风险\n    );\n    await _client!.authenticated;\n    _connected = true;\n  }",purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"isConnected",kind:"方法 / 函数",startLine:71,endLine:71,code:"bool isConnected() => _connected && _client != null;",purpose:"实现“isConnected”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"shell",kind:"方法 / 函数",startLine:73,endLine:86,code:"/// 开一个交互式 shell（PTY），供 xterm 双向绑定。\n  /// 与 exec 各走独立 channel：exec 给 agent 拿结构化结果，shell 给用户手敲。\n  Future<SSHSession> shell({\n    int width = 80,\n    int height = 24,\n  }) async {\n    final client = _client;\n    if (client == null || !_connected) {\n      throw StateError('SSH 未连接，先调用 connect()');\n    }\n    return client.shell(\n      pty: SSHPtyConfig(width: width, height: height),\n    );\n  }",purpose:"封装“shell”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"exec",kind:"方法 / 函数",startLine:88,endLine:102,code:"/// 执行一条命令，收集 stdout、stderr、exitCode。\n  Future<ExecResult> exec(String command) async {\n    final client = _client;\n    if (client == null || !_connected) {\n      throw StateError('SSH 未连接，先调用 connect()');\n    }\n    final session = await client.execute(command);\n    // 并发收集 stdout / stderr，等命令结束\n    final outFut = session.stdout.cast<List<int>>().transform(utf8.decoder).join();\n    final errFut = session.stderr.cast<List<int>>().transform(utf8.decoder).join();\n    final stdout = await outFut;\n    final stderr = await errFut;\n    await session.done;\n    return ExecResult(stdout, stderr, session.exitCode ?? 0);\n  }",purpose:"向远程服务器执行命令，收集 stdout、stderr、exitCode，并连接审计链路。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_sftpClient",kind:"方法 / 函数",startLine:104,endLine:111,code:"/// 懒开 SFTP 通道\n  Future<SftpClient> _sftpClient() async {\n    final client = _client;\n    if (client == null || !_connected) {\n      throw StateError('SSH 未连接');\n    }\n    return _sftp ??= await client.sftp();\n  }",purpose:"封装“_sftpClient”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"listDir",kind:"方法 / 函数",startLine:113,endLine:135,code:"/// 列目录。过滤 . 和 ..，目录在前、名称升序。\n  Future<List<RemoteFile>> listDir(String path) async {\n    final sftp = await _sftpClient();\n    final base = path.endsWith('/') ? path : '$path/';\n    final names = await sftp.listdir(path);\n    final files = <RemoteFile>[];\n    for (final e in names) {\n      if (e.filename == '.' || e.filename == '..') continue;\n      files.add(RemoteFile(\n        name: e.filename,\n        path: base + e.filename,\n        size: e.attr.size ?? 0,\n        isDir: e.attr.isDirectory,\n        // longname 首列形如 drwxr-xr-x\n        perms: e.longname.split(RegExp(r'\\s+')).firstOrNull ?? '',\n      ));\n    }\n    files.sort((a, b) {\n      if (a.isDir != b.isDir) return a.isDir ? -1 : 1;\n      return a.name.toLowerCase().compareTo(b.name.toLowerCase());\n    });\n    return files;\n  }",purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"deleteFile",kind:"方法 / 函数",startLine:137,endLine:141,code:"/// 删除文件\n  Future<void> deleteFile(String path) async {\n    final sftp = await _sftpClient();\n    await sftp.remove(path);\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"mkdir",kind:"方法 / 函数",startLine:143,endLine:147,code:"/// 新建目录\n  Future<void> mkdir(String path) async {\n    final sftp = await _sftpClient();\n    await sftp.mkdir(path);\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"rename",kind:"方法 / 函数",startLine:149,endLine:153,code:"/// 重命名/移动\n  Future<void> rename(String from, String to) async {\n    final sftp = await _sftpClient();\n    await sftp.rename(from, to);\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"forwardLocal",kind:"方法 / 函数",startLine:155,endLine:163,code:"/// 开一条本地端口转发 channel：把数据转发到远端 remoteHost:remotePort。\n  /// 由 port_forward.dart 的隧道管理器调用，每个本地连接对应一条 channel。\n  Future<SSHForwardChannel> forwardLocal(String remoteHost, int remotePort) {\n    final client = _client;\n    if (client == null || !_connected) {\n      throw StateError('SSH 未连接，无法开端口转发');\n    }\n    return client.forwardLocal(remoteHost, remotePort);\n  }",purpose:"封装“forwardLocal”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"close",kind:"方法 / 函数",startLine:165,endLine:174,code:"/// 关闭连接\n  void close() {\n    _sftp?.close();\n    _client?.close();\n    _socket?.close();\n    _sftp = null;\n    _client = null;\n    _socket = null;\n    _connected = false;\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/core/ssh.ts",layer:"CLI",summary:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作",lineCount:171,order:9,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:11,endLine:29,code:"/** 命令执行结果三件套 */\nexport interface ExecResult {\n  stdout: string\n  stderr: string\n  exitCode: number\n}\n\n/** 远程文件项 */\nexport interface RemoteFile {\n  name: string\n  path: string\n  size: number\n  isDir: boolean\n  perms: string\n}\n\nexport class SshClient {\n  private conn: Client | null = null\n  private connected = false",purpose:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"connect",kind:"方法 / 函数",startLine:30,endLine:57,code:"/** 建立连接（密码认证）。10s 超时。 */\n  connect(host: string, port: number, username: string, password: string): Promise<void> {\n    return new Promise((resolve, reject) => {\n      const conn = new Client()\n      const cfg: ConnectConfig = {\n        host,\n        port: port || 22,\n        username,\n        password,\n        readyTimeout: 10_000,\n        // demo 方便跳过 host key 校验；生产应校验 known_hosts，否则有中间人风险\n      }\n      conn\n        .on('ready', () => {\n          this.conn = conn\n          this.connected = true\n          resolve()\n        })\n        .on('error', (err) => {\n          this.connected = false\n          reject(err)\n        })\n        .on('close', () => {\n          this.connected = false\n        })\n        .connect(cfg)\n    })\n  }",purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"isConnected",kind:"方法 / 函数",startLine:59,endLine:61,code:"isConnected(): boolean {\n    return this.connected && this.conn !== null\n  }",purpose:"封装“isConnected”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"exec",kind:"方法 / 函数",startLine:63,endLine:93,code:"/**\n   * 执行一条命令，收集 stdout、stderr、exitCode。\n   * ssh2 的 exec 回调给一个 stream，stdout 走 data 事件，stderr 走 stream.stderr，\n   * exitCode 在 close 事件回调里拿。\n   */\n  exec(command: string): Promise<ExecResult> {\n    return new Promise((resolve, reject) => {\n      if (!this.conn || !this.connected) {\n        reject(new Error('SSH 未连接，先调用 connect()'))\n        return\n      }\n      this.conn.exec(command, (err, stream) => {\n        if (err) {\n          reject(err)\n          return\n        }\n        let stdout = ''\n        let stderr = ''\n        stream\n          .on('close', (code: number | null) => {\n            resolve({ stdout, stderr, exitCode: code ?? 0 })\n          })\n          .on('data', (data: Buffer) => {\n            stdout += data.toString('utf8')\n          })\n        stream.stderr.on('data', (data: Buffer) => {\n          stderr += data.toString('utf8')\n        })\n      })\n    })\n  }",purpose:"向远程服务器执行命令，收集 stdout、stderr、exitCode，并连接审计链路。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"sftp",kind:"方法 / 函数",startLine:95,endLine:107,code:"/** 懒开 SFTP 通道 */\n  private sftp(): Promise<SFTPWrapper> {\n    return new Promise((resolve, reject) => {\n      if (!this.conn || !this.connected) {\n        reject(new Error('SSH 未连接'))\n        return\n      }\n      this.conn.sftp((err, sftp) => {\n        if (err) reject(err)\n        else resolve(sftp)\n      })\n    })\n  }",purpose:"封装“sftp”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"listDir",kind:"方法 / 函数",startLine:109,endLine:136,code:"/** 列目录。过滤 . 和 ..，目录在前、名称升序。 */\n  async listDir(path: string): Promise<RemoteFile[]> {\n    const sftp = await this.sftp()\n    const base = path.endsWith('/') ? path : path + '/'\n    const entries = await new Promise<RemoteFile[]>((resolve, reject) => {\n      sftp.readdir(path, (err, list) => {\n        if (err) {\n          reject(err)\n          return\n        }\n        const files: RemoteFile[] = list\n          .filter((e) => e.filename !== '.' && e.filename !== '..')\n          .map((e) => ({\n            name: e.filename,\n            path: base + e.filename,\n            size: e.attrs.size,\n            isDir: e.attrs.isDirectory(),\n            perms: e.longname.split(/\\s+/)[0] ?? '', // longname 首列形如 drwxr-xr-x\n          }))\n        resolve(files)\n      })\n    })\n    entries.sort((a, b) => {\n      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1\n      return a.name.toLowerCase().localeCompare(b.name.toLowerCase())\n    })\n    return entries\n  }",purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"deleteFile",kind:"方法 / 函数",startLine:138,endLine:144,code:"/** 删除文件 */\n  async deleteFile(path: string): Promise<void> {\n    const sftp = await this.sftp()\n    await new Promise<void>((resolve, reject) => {\n      sftp.unlink(path, (err) => (err ? reject(err) : resolve()))\n    })\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"mkdir",kind:"方法 / 函数",startLine:146,endLine:152,code:"/** 新建目录 */\n  async mkdir(path: string): Promise<void> {\n    const sftp = await this.sftp()\n    await new Promise<void>((resolve, reject) => {\n      sftp.mkdir(path, (err) => (err ? reject(err) : resolve()))\n    })\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"rename",kind:"方法 / 函数",startLine:154,endLine:160,code:"/** 重命名/移动 */\n  async rename(from: string, to: string): Promise<void> {\n    const sftp = await this.sftp()\n    await new Promise<void>((resolve, reject) => {\n      sftp.rename(from, to, (err) => (err ? reject(err) : resolve()))\n    })\n  }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:[],risks:[]},{name:"close",kind:"方法 / 函数",startLine:162,endLine:169,code:"/** 关闭连接 */\n  close(): void {\n    if (this.conn) {\n      this.conn.end()\n      this.conn = null\n    }\n    this.connected = false\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/ssh/SshClient.java",layer:"Java 后端",summary:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作",lineCount:189,order:9,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:25,endLine:32,code:"/**\n * SSH 客户端 —— 简化版方案 B：一个实例持有一个长连接，多条命令复用同一会话。\n *\n * 为什么是长连接复用：这是个 agentic 运维 agent，loop 里会连续执行多条命令，\n * 每次重连既慢、又丢上下文。MVP 阶段先不上连接池，够用。\n *\n * 注意：非线程安全，一个 SshClient 实例对应一台机器的一个会话，由上层串行使用。\n */\npublic class SshClient implements AutoCloseable {\n\n    private final JSch jsch = new JSch();\n    private Session session;\n    // SFTP 通道：懒开 + 保持复用（同一 Session 上长期有效），随 close 一并释放。\n    // 上层用 LiveSession.lock() 串行化，这里不另加锁。\n    private ChannelSftp sftp;",purpose:"SSH/SFTP 基础设施：连接、命令执行与远程文件操作。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"connect",kind:"方法 / 函数",startLine:33,endLine:47,code:'/**\n     * 建立连接。密码认证（MVP 够用，后续可加密钥）。\n     */\n    public void connect(String host, int port, String username, String password) throws Exception {\n        session = jsch.getSession(username, host, port);\n        session.setPassword(password);\n\n        // demo 方便：跳过 host key 校验。生产环境要换成 known_hosts 校验，否则有中间人风险\n        Properties config = new Properties();\n        config.put("StrictHostKeyChecking", "no");\n        session.setConfig(config);\n\n        // 连接超时 10s\n        session.connect(10_000);\n    }',purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:["关闭主机指纹校验会暴露中间人攻击风险。"]},{name:"exec",kind:"方法 / 函数",startLine:49,endLine:94,code:'/**\n     * 执行一条命令，同时收集 stdout、stderr、exitCode。\n     *\n     * JSch 的坑：stdout 走 channel 的 InputStream，stderr 要单独用 setErrStream 接，\n     * exitCode 必须等 channel 真正关闭后才能拿到，所以这里要轮询 isClosed。\n     */\n    public ExecResult exec(String command) throws Exception {\n        if (session == null || !session.isConnected()) {\n            throw new IllegalStateException("SSH 未连接，先调用 connect()");\n        }\n\n        ChannelExec channel = (ChannelExec) session.openChannel("exec");\n        channel.setCommand(command);\n\n        ByteArrayOutputStream stdout = new ByteArrayOutputStream();\n        ByteArrayOutputStream stderr = new ByteArrayOutputStream();\n        channel.setErrStream(stderr);          // stderr 直接重定向到内存流\n        InputStream in = channel.getInputStream(); // stdout 手动读\n\n        channel.connect();\n\n        // 边读 stdout 边等命令结束\n        byte[] buf = new byte[4096];\n        while (true) {\n            while (in.available() > 0) {\n                int n = in.read(buf, 0, buf.length);\n                if (n < 0) break;\n                stdout.write(buf, 0, n);\n            }\n            // channel 关闭代表命令执行完毕\n            if (channel.isClosed()) {\n                if (in.available() > 0) continue; // 还有残留数据，再读一轮\n                break;\n            }\n            Thread.sleep(50); // 没数据也没关闭，稍等避免空转\n        }\n\n        int exitCode = channel.getExitStatus();\n        channel.disconnect();\n\n        return new ExecResult(\n                stdout.toString(java.nio.charset.StandardCharsets.UTF_8),\n                stderr.toString(java.nio.charset.StandardCharsets.UTF_8),\n                exitCode\n        );\n    }',purpose:"向远程服务器执行命令，收集 stdout、stderr、exitCode，并连接审计链路。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:["命令缺少超时/输出上限时，可能长时间占线程或内存。"]},{name:"isConnected",kind:"方法 / 函数",startLine:96,endLine:99,code:"/** 当前是否连接中 */\n    public boolean isConnected() {\n        return session != null && session.isConnected();\n    }",purpose:"封装“isConnected”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"sftp",kind:"方法 / 函数",startLine:101,endLine:114,code:'// ===================== SFTP 文件操作 =====================\n    // 复用同一条 SSH Session 开 sftp 通道，不重连。非线程安全，由上层串行调用。\n\n    /** 懒开并复用 sftp 通道；断了就重开 */\n    private ChannelSftp sftp() throws Exception {\n        if (session == null || !session.isConnected()) {\n            throw new IllegalStateException("SSH 未连接，先调用 connect()");\n        }\n        if (sftp == null || !sftp.isConnected()) {\n            sftp = (ChannelSftp) session.openChannel("sftp");\n            sftp.connect(10_000);\n        }\n        return sftp;\n    }',purpose:"封装“sftp”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"listDir",kind:"方法 / 函数",startLine:116,endLine:140,code:'/** 列目录。过滤掉 . 和 ..，按「目录在前、名称升序」排列 */\n    @SuppressWarnings("unchecked")\n    public List<RemoteFile> listDir(String path) throws Exception {\n        Vector<ChannelSftp.LsEntry> entries = sftp().ls(path);\n        String base = path.endsWith("/") ? path : path + "/";\n        List<RemoteFile> result = new ArrayList<>();\n        for (ChannelSftp.LsEntry e : entries) {\n            String name = e.getFilename();\n            if (name.equals(".") || name.equals("..")) continue;\n            var attrs = e.getAttrs();\n            result.add(new RemoteFile(\n                    name,\n                    base + name,\n                    attrs.getSize(),\n                    attrs.isDir(),\n                    attrs.getPermissionsString(),  // 形如 "drwxr-xr-x"\n                    attrs.getMTime()\n            ));\n        }\n        result.sort((a, b) -> {\n            if (a.isDir() != b.isDir()) return a.isDir() ? -1 : 1;\n            return a.name().compareToIgnoreCase(b.name());\n        });\n        return result;\n    }',purpose:"提供面向 Agent 或用户的只读远程文件能力。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"upload",kind:"方法 / 函数",startLine:142,endLine:145,code:"/** 上传：从输入流写到远端路径（覆盖） */\n    public void upload(InputStream in, String remotePath) throws Exception {\n        sftp().put(in, remotePath, ChannelSftp.OVERWRITE);\n    }",purpose:"实现“upload”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"download",kind:"方法 / 函数",startLine:147,endLine:150,code:"/** 下载：把远端文件写到输出流 */\n    public void download(String remotePath, OutputStream out) throws Exception {\n        sftp().get(remotePath, out);\n    }",purpose:"实现“download”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"deleteFile",kind:"方法 / 函数",startLine:152,endLine:155,code:"/** 删除文件 */\n    public void deleteFile(String path) throws Exception {\n        sftp().rm(path);\n    }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"mkdir",kind:"方法 / 函数",startLine:157,endLine:160,code:"/** 新建目录 */\n    public void mkdir(String path) throws Exception {\n        sftp().mkdir(path);\n    }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"rename",kind:"方法 / 函数",startLine:162,endLine:165,code:"/** 重命名/移动 */\n    public void rename(String from, String to) throws Exception {\n        sftp().rename(from, to);\n    }",purpose:"执行远程文件写操作，并在执行前复用安全门禁、执行后记录审计。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"isDir",kind:"方法 / 函数",startLine:167,endLine:176,code:"/** 远端路径是否为目录（不存在也返回 false） */\n    public boolean isDir(String path) {\n        try {\n            return sftp().stat(path).isDir();\n        } catch (SftpException e) {\n            return false;\n        } catch (Exception e) {\n            return false;\n        }\n    }",purpose:"封装“isDir”对应的业务计算，并向调用方返回处理结果。",steps:["捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"close",kind:"方法 / 函数",startLine:178,endLine:187,code:"/** 关闭会话，释放 sftp 通道和连接 */\n    @Override\n    public void close() {\n        if (sftp != null && sftp.isConnected()) {\n            sftp.disconnect();\n        }\n        if (session != null && session.isConnected()) {\n            session.disconnect();\n        }\n    }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/monitor_provider.dart",layer:"Flutter 状态",summary:"远程主机指标采集、解析与速率计算",lineCount:229,order:10,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:6,endLine:47,code:"/// 一台主机的实时监控指标（单次采样结果）\nclass Metrics {\n  final double cpuPct; // CPU 使用率 0-1\n  final double memPct; // 内存使用率 0-1\n  final String memText; // \"882M / 7.6G\"\n  final double diskPct; // 根分区使用率 0-1\n  final String diskText; // \"19G / 79G\"\n  final double load1; // 1 分钟负载\n  final int cores; // 核数（算负载占比用）\n  final double netRxBps; // 入站字节/秒\n  final double netTxBps; // 出站字节/秒\n  final bool loading;\n  final String? error;\n\n  const Metrics({\n    this.cpuPct = 0,\n    this.memPct = 0,\n    this.memText = '-',\n    this.diskPct = 0,\n    this.diskText = '-',\n    this.load1 = 0,\n    this.cores = 1,\n    this.netRxBps = 0,\n    this.netTxBps = 0,\n    this.loading = false,\n    this.error,\n  });\n}\n\n/// 采样间隔\nconst _interval = Duration(seconds: 4);\n\n/// 监控 Notifier —— 定时 SSH 采样当前主机资源指标，按主机隔离。\n/// 仅在面板可见且已连接时运行定时器（start/stop 由 UI 生命周期驱动），避免后台空跑。\nclass MonitorNotifier extends Notifier<Metrics> {\n  Timer? _timer;\n  bool _sampling = false;\n  // 上次网络累计字节 + 时刻，用于算速率（两次采样差值）\n  int? _lastRxBytes;\n  int? _lastTxBytes;\n  DateTime? _lastNetAt;\n  String? _boundHostId; // 当前采样绑定的主机，切主机时重置网络基线",purpose:"远程主机指标采集、解析与速率计算。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:48,endLine:52,code:"@override\n  Metrics build() {\n    ref.onDispose(() => _timer?.cancel());\n    return const Metrics();\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"start",kind:"方法 / 函数",startLine:54,endLine:59,code:"/// 开始定时采样（面板可见时调用）。立即采一次，之后周期采。\n  void start() {\n    _timer?.cancel();\n    _sample();\n    _timer = Timer.periodic(_interval, (_) => _sample());\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"stop",kind:"方法 / 函数",startLine:61,endLine:65,code:"/// 停止采样（面板隐藏/断开时调用）\n  void stop() {\n    _timer?.cancel();\n    _timer = null;\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_sample",kind:"方法 / 函数",startLine:67,endLine:94,code:"Future<void> _sample() async {\n    if (_sampling) return; // 上一次还没回来，跳过\n    final conn = ref.read(connectionProvider);\n    final hostId = conn.host?.id;\n    if (hostId == null || !conn.isConnected) {\n      state = const Metrics(error: '未连接主机');\n      return;\n    }\n    // 切主机：重置网络基线，避免用别的主机的字节数算出错误速率\n    if (hostId != _boundHostId) {\n      _boundHostId = hostId;\n      _lastRxBytes = null;\n      _lastTxBytes = null;\n      _lastNetAt = null;\n      state = const Metrics(loading: true);\n    }\n\n    _sampling = true;\n    try {\n      final r = await conn.client!.exec(_probe);\n      final m = _parse(r.stdout);\n      if (m != null) state = m;\n    } catch (e) {\n      state = Metrics(error: e.toString());\n    } finally {\n      _sampling = false;\n    }\n  }",purpose:"状态方法“_sample”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","通过锁或运行标记避免共享资源被并发操作。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["显式串行化非线程安全资源，避免同一 SSH 会话上的操作互相干扰。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"_parse",kind:"方法 / 函数",startLine:105,endLine:210,code:"/// 解析探针输出。任何一段缺失则该指标退化为 0，不整体失败。\n  Metrics? _parse(String out) {\n    final sections = <String, List<String>>{};\n    String? cur;\n    for (final line in out.split('\\n')) {\n      final t = line.trim();\n      if (t.startsWith('===') && t.endsWith('===')) {\n        cur = t.replaceAll('=', '');\n        sections[cur] = [];\n      } else if (cur != null && t.isNotEmpty) {\n        sections[cur]!.add(t);\n      }\n    }\n\n    // 负载 + 核数\n    double load1 = 0;\n    int cores = 1;\n    final load = sections['LOAD'];\n    if (load != null && load.isNotEmpty) {\n      final parts = load[0].split(RegExp(r'\\s+'));\n      if (parts.isNotEmpty) load1 = double.tryParse(parts[0]) ?? 0;\n      if (load.length > 1) cores = int.tryParse(load[1]) ?? 1;\n    }\n\n    // 内存：MemTotal/MemAvailable（KB）\n    double memPct = 0;\n    String memText = '-';\n    final mem = sections['MEM'];\n    if (mem != null) {\n      int total = 0, avail = 0;\n      for (final l in mem) {\n        final v = int.tryParse(l.replaceAll(RegExp(r'[^0-9]'), '')) ?? 0;\n        if (l.startsWith('MemTotal')) total = v;\n        if (l.startsWith('MemAvailable')) avail = v;\n      }\n      if (total > 0) {\n        memPct = (total - avail) / total;\n        memText = '${_humanKB(total - avail)} / ${_humanKB(total)}';\n      }\n    }\n\n    // 磁盘：df 根分区行 \"Filesystem 1024-blocks Used Available Capacity Mounted\"\n    double diskPct = 0;\n    String diskText = '-';\n    final disk = sections['DISK'];\n    if (disk != null && disk.isNotEmpty) {\n      final p = disk[0].split(RegExp(r'\\s+'));\n      if (p.length >= 5) {\n        final used = int.tryParse(p[2]) ?? 0; // KB\n        final total = (int.tryParse(p[1]) ?? 0) + 0;\n        final usedPlusAvail = used + (int.tryParse(p[3]) ?? 0);\n        diskPct = (double.tryParse(p[4].replaceAll('%', '')) ?? 0) / 100;\n        diskText = '${_humanKB(used)} / ${_humanKB(total > 0 ? total : usedPlusAvail)}';\n      }\n    }\n\n    // CPU：top \"%Cpu(s):  x.x us, ... y.y id, ...\" 取 idle，使用率=100-idle\n    double cpuPct = 0;\n    final cpu = sections['CPU'];\n    if (cpu != null && cpu.isNotEmpty) {\n      final idle = RegExp(r'([\\d.]+)\\s*id').firstMatch(cpu[0]);\n      if (idle != null) {\n        final id = double.tryParse(idle.group(1)!) ?? 100;\n        cpuPct = ((100 - id) / 100).clamp(0, 1);\n      }\n    }\n\n    // 网络：累加所有非 lo 网卡的 rx/tx 字节，与上次比算速率\n    double rxBps = 0, txBps = 0;\n    final net = sections['NET'];\n    if (net != null) {\n      int rx = 0, tx = 0;\n      for (final l in net) {\n        // \"eth0: rxBytes rxPackets ... txBytes ...\" 冒号后第1列rx，第9列tx\n        final afterColon = l.contains(':') ? l.split(':')[1] : l;\n        final f = afterColon.trim().split(RegExp(r'\\s+'));\n        if (f.length >= 9) {\n          rx += int.tryParse(f[0]) ?? 0;\n          tx += int.tryParse(f[8]) ?? 0;\n        }\n      }\n      final now = DateTime.now();\n      if (_lastRxBytes != null && _lastNetAt != null) {\n        final dt = now.difference(_lastNetAt!).inMilliseconds / 1000.0;\n        if (dt > 0) {\n          rxBps = ((rx - _lastRxBytes!) / dt).clamp(0, double.infinity);\n          txBps = ((tx - _lastTxBytes!) / dt).clamp(0, double.infinity);\n        }\n      }\n      _lastRxBytes = rx;\n      _lastTxBytes = tx;\n      _lastNetAt = now;\n    }\n\n    return Metrics(\n      cpuPct: cpuPct,\n      memPct: memPct,\n      memText: memText,\n      diskPct: diskPct,\n      diskText: diskText,\n      load1: load1,\n      cores: cores,\n      netRxBps: rxBps,\n      netTxBps: txBps,\n    );\n  }",purpose:"解析外部协议或系统命令输出，将不稳定文本转换为结构化数据。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_humanKB",kind:"方法 / 函数",startLine:212,endLine:217,code:"/// KB 转人类可读（MemTotal 等单位是 KB）\n  static String _humanKB(int kb) {\n    if (kb >= 1024 * 1024) return '${(kb / 1024 / 1024).toStringAsFixed(1)}G';\n    if (kb >= 1024) return '${(kb / 1024).toStringAsFixed(0)}M';\n    return '${kb}K';\n  }",purpose:"状态方法“_humanKB”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"humanBps",kind:"方法 / 函数",startLine:220,endLine:225,code:"/// 字节/秒 转人类可读速率\nString humanBps(double bps) {\n  if (bps >= 1024 * 1024) return '${(bps / 1024 / 1024).toStringAsFixed(1)} MB/s';\n  if (bps >= 1024) return '${(bps / 1024).toStringAsFixed(0)} KB/s';\n  return '${bps.toStringAsFixed(0)} B/s';\n}",purpose:"状态方法“humanBps”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/MetricsCollector.java",layer:"Java 后端",summary:"远程主机指标采集、解析与速率计算",lineCount:171,order:10,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:15,endLine:16,code:"/**\n * 主机指标采集器：用一条复合 shell 命令把 CPU/内存/磁盘/负载/uptime 的原始数据一次取回，\n * 在 Java 端解析，避免多次 SSH 往返。\n *\n * CPU 使用率需要两次 /proc/stat 采样求差：命令里 sleep 0.3 取前后两行，\n * 解析时算 (busyΔ / totalΔ) * 100。\n *\n * 输出用标记行分隔，逐段解析，避免被 locale / 多余空白干扰。\n */\npublic final class MetricsCollector {",purpose:"远程主机指标采集、解析与速率计算。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"MetricsCollector",kind:"方法 / 函数",startLine:17,endLine:17,code:"private MetricsCollector() {}",purpose:"实现“MetricsCollector”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"collect",kind:"方法 / 函数",startLine:31,endLine:38,code:'/** 在已加锁的 SshClient 上采集一次。调用方负责 lock。 */\n    public static HostMetrics collect(SshClient ssh) throws Exception {\n        ExecResult r = ssh.exec(CMD);\n        if (!r.isSuccess()) {\n            throw new IllegalStateException("采集失败 exit=" + r.exitCode() + " " + r.stderr());\n        }\n        return parse(r.stdout());\n    }',purpose:"封装“collect”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","通过锁或运行标记避免共享资源被并发操作。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"parseCpu",kind:"方法 / 函数",startLine:93,endLine:107,code:"// /proc/stat 行：cpu  user nice system idle iowait irq softirq steal guest guest_nice\n    // 使用率 = (totalΔ - idleΔ) / totalΔ * 100，idle = idle + iowait\n    private static double parseCpu(String l1, String l2) {\n        if (l1 == null || l2 == null) return 0;\n        long[] a = cpuFields(l1);\n        long[] b = cpuFields(l2);\n        if (a == null || b == null) return 0;\n        long idleA = a[3] + (a.length > 4 ? a[4] : 0);\n        long idleB = b[3] + (b.length > 4 ? b[4] : 0);\n        long totalA = sum(a), totalB = sum(b);\n        long totalD = totalB - totalA, idleD = idleB - idleA;\n        if (totalD <= 0) return 0;\n        double pct = (totalD - idleD) * 100.0 / totalD;\n        return clamp(pct);\n    }",purpose:"解析外部协议或系统命令输出，将不稳定文本转换为结构化数据。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"cpuFields",kind:"方法 / 函数",startLine:109,endLine:118,code:'private static long[] cpuFields(String line) {\n        // 去掉开头的 "cpu" 标签\n        String[] p = line.split("\\\\s+");\n        if (p.length < 5) return null;\n        long[] v = new long[p.length - 1];\n        for (int i = 1; i < p.length; i++) {\n            v[i - 1] = parseLong(p[i], 0);\n        }\n        return v;\n    }',purpose:"封装“cpuFields”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"parseLoad",kind:"方法 / 函数",startLine:120,endLine:127,code:'// /proc/loadavg: "0.00 0.01 0.05 1/123 4567"\n    private static double[] parseLoad(String line) {\n        double[] d = {0, 0, 0};\n        if (line == null) return d;\n        String[] p = line.split("\\\\s+");\n        for (int i = 0; i < 3 && i < p.length; i++) d[i] = parseDouble(p[i], 0);\n        return d;\n    }',purpose:"解析外部协议或系统命令输出，将不稳定文本转换为结构化数据。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}
