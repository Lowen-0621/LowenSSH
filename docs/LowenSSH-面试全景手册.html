 {\n    final cfg = loadConfig();\n    final providers = cfg.providers\n        .map((p) => p.id == id\n            ? p.copyWith(apiKey: apiKey, model: model, baseURL: baseURL)\n            : p)\n        .toList();\n    saveConfig(cfg.copyWith(providers: providers));\n    state = loadConfig();\n  }",purpose:"状态方法“updateProvider”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"setActiveProvider",kind:"方法 / 函数",startLine:50,endLine:55,code:"/// 切换当前激活的供应商\n  void setActiveProvider(String id) {\n    final cfg = loadConfig();\n    saveConfig(cfg.copyWith(activeProviderId: id));\n    state = loadConfig();\n  }",purpose:"状态方法“setActiveProvider”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"reload",kind:"方法 / 函数",startLine:57,endLine:58,code:"/// 重新从盘加载（密钥库变更后，主机的 keyId 引用可能被清，需同步刷新）\n  void reload() => state = loadConfig();",purpose:"状态方法“reload”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/connection_provider.dart",layer:"Flutter 状态",summary:"多主机连接池、状态机与 LRU 淘汰",lineCount:197,order:16,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:7,endLine:28,code:"/// 连接阶段\nenum ConnPhase { idle, connecting, connected, error }\n\n/// 连接状态：阶段 + 当前主机 + 错误信息 + 活动 SshClient\n/// 对外仍暴露「当前展示主机」的连接快照，UI 用法不变（conn.client/.isConnected/.host）。\n/// connectedIds：池中所有已连接主机的 id（多连接并存，左栏据此给每台标绿点）。\nclass ConnState {\n  final ConnPhase phase;\n  final Host? host;\n  final String? error;\n  final SshClient? client;\n  final Set<String> connectedIds;\n\n  const ConnState({\n    this.phase = ConnPhase.idle,\n    this.host,\n    this.error,\n    this.client,\n    this.connectedIds = const {},\n  });\n\n  bool get isConnected => phase == ConnPhase.connected && client != null;",purpose:"多主机连接池、状态机与 LRU 淘汰。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:29,endLine:35,code:"ConnState copyWith({\n    ConnPhase? phase,\n    Host? host,\n    String? error,\n    SshClient? client,\n    Set<String>? connectedIds,\n  }) =>",purpose:"状态方法“copyWith”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"ConnState",kind:"方法 / 函数",startLine:36,endLine:57,code:"ConnState(\n        phase: phase ?? this.phase,\n        host: host ?? this.host,\n        error: error,\n        client: client ?? this.client,\n        connectedIds: connectedIds ?? this.connectedIds,\n      );\n}\n\n/// 连接池里的一台主机连接条目\nclass _ConnEntry {\n  final Host host;\n  ConnPhase phase;\n  String? error;\n  SshClient? client;\n  DateTime lastUsed; // LRU：最近一次被选为当前主机的时刻\n\n  _ConnEntry({\n    required this.host,\n    this.phase = ConnPhase.connecting,\n  }) : lastUsed = DateTime.now();\n}",purpose:"状态方法“ConnState”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"Function",kind:"方法 / 函数",startLine:69,endLine:74,code:"/// 判断某主机的 AI 任务是否在跑（LRU 踢人时跳过它）。\n  /// 由 agentProvider 注入回调，避免反向依赖。\n  bool Function(String hostId)? isHostBusy;\n\n  @override\n  ConnState build() => const ConnState();",purpose:"状态方法“Function”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_publish",kind:"方法 / 函数",startLine:82,endLine:91,code:"/// 把某条目投影成对外 state，并带上整池的 connectedIds\n  void _publish(_ConnEntry entry) {\n    state = ConnState(\n      phase: entry.phase,\n      host: entry.host,\n      error: entry.error,\n      client: entry.client,\n      connectedIds: connectedIds,\n    );\n  }",purpose:"状态方法“_publish”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"connect",kind:"方法 / 函数",startLine:93,endLine:140,code:"/// 连接到指定主机：\n  /// - 已在池中且已连 → 直接切为当前（不重连）\n  /// - 否则新建连接，必要时按 LRU 踢掉最久未用的一台\n  Future<void> connect(Host host) async {\n    final existing = _pool[host.id];\n    if (existing != null && existing.phase == ConnPhase.connected) {\n      _select(host.id);\n      return;\n    }\n\n    // 新连接前先腾位置（不含正在连/将要连的这台）\n    _evictIfNeeded(excludeId: host.id);\n\n    final entry = _ConnEntry(host: host, phase: ConnPhase.connecting);\n    _pool[host.id] = entry;\n    _currentId = host.id;\n    _publish(entry); // connecting\n\n    try {\n      final client = SshClient();\n      // 优先密钥认证：主机指定了 keyId 且密钥仍存在则取私钥材料，否则回退密码\n      String password = '';\n      String? pem;\n      String? passphrase;\n      if (host.keyId != null) {\n        final mat = getKeyMaterial(host.keyId!);\n        if (mat != null) {\n          pem = mat.pem;\n          passphrase = mat.passphrase;\n        }\n      }\n      // 没有可用私钥时才解密密码（密钥认证失败也保留密码兜底）\n      password = decrypt(host.passwordEnc) ?? '';\n      await client.connect(host.host, host.port, host.user, password,\n          privateKeyPem: pem, passphrase: passphrase);\n      entry\n        ..client = client\n        ..phase = ConnPhase.connected\n        ..error = null\n        ..lastUsed = DateTime.now();\n    } catch (e) {\n      entry\n        ..phase = ConnPhase.error\n        ..error = e.toString();\n    }\n    // 连接期间用户可能已切到别的主机，只在仍停留此主机时刷新对外 state\n    if (_currentId == host.id) _publish(entry);\n  }",purpose:"建立或复用 SSH 连接，并把预连接升级为可持久化的正式会话。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"_select",kind:"方法 / 函数",startLine:142,endLine:149,code:"/// 切换当前展示主机（点击左栏已连接的主机时）\n  void _select(String hostId) {\n    final entry = _pool[hostId];\n    if (entry == null) return;\n    _currentId = hostId;\n    entry.lastUsed = DateTime.now();\n    _publish(entry);\n  }",purpose:"状态方法“_select”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"switchTo",kind:"方法 / 函数",startLine:151,endLine:158,code:"/// 公开的切换入口：已在池中就切过去并返回 true；否则返回 false（调用方去 connect）\n  bool switchTo(String hostId) {\n    if (_pool.containsKey(hostId)) {\n      _select(hostId);\n      return true;\n    }\n    return false;\n  }",purpose:"状态方法“switchTo”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_evictIfNeeded",kind:"方法 / 函数",startLine:160,endLine:175,code:"/// LRU 腾位：池满时踢掉最久未用、且 AI 任务不在跑、且非当前主机的一台\n  void _evictIfNeeded({String? excludeId}) {\n    while (_pool.length >= kMaxLiveConns) {\n      final candidates = _pool.entries\n          .where((e) =>\n              e.key != excludeId &&\n              e.key != _currentId &&\n              !(isHostBusy?.call(e.key) ?? false))\n          .toList()\n        ..sort((a, b) => a.value.lastUsed.compareTo(b.value.lastUsed));\n      if (candidates.isEmpty) break; // 没有可踢的（都在忙或就剩当前），放弃腾位\n      final victim = candidates.first;\n      victim.value.client?.close();\n      _pool.remove(victim.key);\n    }\n  }",purpose:"状态方法“_evictIfNeeded”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。"],designNotes:[],risks:[]},{name:"disconnect",kind:"方法 / 函数",startLine:177,endLine:192,code:"/// 主动断开当前主机，从池移除，并切到池中另一台（若有）\n  void disconnect() {\n    final id = _currentId;\n    if (id == null) return;\n    _pool[id]?.client?.close();\n    _pool.remove(id);\n    // 切到剩下里最近用过的一台，没有则回到空态\n    if (_pool.isEmpty) {\n      _currentId = null;\n      state = const ConnState();\n    } else {\n      final next = _pool.entries.reduce(\n          (a, b) => a.value.lastUsed.isAfter(b.value.lastUsed) ? a : b);\n      _select(next.key);\n    }\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/forward_provider.dart",layer:"Flutter 状态",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:136,order:16,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:6,endLine:26,code:"/// 一条隧道的 UI 状态（含运行句柄）\nclass ForwardEntry {\n  final String id;\n  final int localPort;\n  final String remoteHost;\n  final int remotePort;\n  final String hostId; //   绑定的主机（隧道依附其 SSH 连接）\n  final bool running;\n  final String? error;\n  final ForwardTunnel? tunnel; // 运行句柄，停止时关闭\n\n  const ForwardEntry({\n    required this.id,\n    required this.localPort,\n    required this.remoteHost,\n    required this.remotePort,\n    required this.hostId,\n    this.running = false,\n    this.error,\n    this.tunnel,\n  });",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:27,endLine:33,code:"ForwardEntry copyWith({\n    bool? running,\n    String? error,\n    ForwardTunnel? tunnel,\n    bool clearError = false,\n    bool clearTunnel = false,\n  }) =>",purpose:"状态方法“copyWith”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"ForwardEntry",kind:"方法 / 函数",startLine:34,endLine:132,code:"ForwardEntry(\n        id: id,\n        localPort: localPort,\n        remoteHost: remoteHost,\n        remotePort: remotePort,\n        hostId: hostId,\n        running: running ?? this.running,\n        error: clearError ? null : (error ?? this.error),\n        tunnel: clearTunnel ? null : (tunnel ?? this.tunnel),\n      );\n}\n\n/// 端口转发 Notifier —— 管理隧道列表，依附当前 SSH 连接启停。\n/// 隧道不落盘（依附连接，重启即失效），符合「连接级资源」语义。\nclass ForwardNotifier extends Notifier<List<ForwardEntry>> {\n  int _seq = 0;\n\n  @override\n  List<ForwardEntry> build() => [];\n\n  /// 添加并立即启动一条隧道。绑定当前已连接主机；未连接则记错误不启动。\n  Future<void> add({\n    required int localPort,\n    required String remoteHost,\n    required int remotePort,\n  }) async {\n    final conn = ref.read(connectionProvider);\n    final id = 'fwd_${_seq++}';\n    final entry = ForwardEntry(\n      id: id,\n      localPort: localPort,\n      remoteHost: remoteHost,\n      remotePort: remotePort,\n      hostId: conn.host?.id ?? '-',\n    );\n    state = [...state, entry];\n\n    if (!conn.isConnected || conn.client == null) {\n      _update(id, (e) => e.copyWith(error: '未连接主机，无法启动'));\n      return;\n    }\n    await _start(id);\n  }\n\n  /// 启动指定隧道\n  Future<void> _start(String id) async {\n    final entry = state.where((e) => e.id == id).firstOrNull;\n    if (entry == null) return;\n    final conn = ref.read(connectionProvider);\n    if (!conn.isConnected || conn.client == null) {\n      _update(id, (e) => e.copyWith(error: '未连接主机，无法启动'));\n      return;\n    }\n    try {\n      final tunnel = await ForwardTunnel.start(\n        conn.client!,\n        localPort: entry.localPort,\n        remoteHost: entry.remoteHost,\n        remotePort: entry.remotePort,\n      );\n      _update(\n          id, (e) => e.copyWith(running: true, tunnel: tunnel, clearError: true));\n    } catch (e) {\n      // 常见：本地端口被占用（bind 失败）\n      _update(id, (e) => e.copyWith(error: _friendly(e.toString())));\n    }\n  }\n\n  /// 启停切换\n  Future<void> toggle(String id) async {\n    final entry = state.where((e) => e.id == id).firstOrNull;\n    if (entry == null) return;\n    if (entry.running) {\n      await entry.tunnel?.stop();\n      _update(id, (e) => e.copyWith(running: false, clearTunnel: true));\n    } else {\n      await _start(id);\n    }\n  }\n\n  /// 删除隧道（先停再移除，防泄漏）\n  Future<void> remove(String id) async {\n    final entry = state.where((e) => e.id == id).firstOrNull;\n    await entry?.tunnel?.stop();\n    state = state.where((e) => e.id != id).toList();\n  }\n\n  // 局部更新某条\n  void _update(String id, ForwardEntry Function(ForwardEntry) fn) {\n    state = state.map((e) => e.id == id ? fn(e) : e).toList();\n  }\n\n  String _friendly(String err) {\n    if (err.contains('errno = 48') || err.contains('Address already in use')) {\n      return '本地端口已被占用';\n    }\n    return err;\n  }\n}",purpose:"状态方法“ForwardEntry”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"clients/app/lib/state/settings_provider.dart",layer:"Flutter 状态",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:60,order:16,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:8,endLine:8,code:"/// 通用设置 Notifier —— 语言等偏好，落盘持久化。\nclass SettingsNotifier extends Notifier<AppSettings> {",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:9,endLine:15,code:"@override\n  AppSettings build() {\n    final s = loadSettings();\n    // 启动即把持久化的配色应用到 AppColors（首帧之前）\n    applyPalette(Palettes.byId(s.themeId));\n    return s;\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"setLang",kind:"方法 / 函数",startLine:17,endLine:22,code:"/// 切换语言（落盘 + 刷新，全应用即时重建）\n  void setLang(AppLang lang) {\n    final next = state.copyWith(lang: lang);\n    saveSettings(next);\n    state = next;\n  }",purpose:"状态方法“setLang”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"setTheme",kind:"方法 / 函数",startLine:24,endLine:30,code:"/// 切换配色方案（应用到 AppColors + 落盘 + 刷新，main 监听后重建 MaterialApp）\n  void setTheme(String themeId) {\n    applyPalette(Palettes.byId(themeId));\n    final next = state.copyWith(themeId: themeId);\n    saveSettings(next);\n    state = next;\n  }",purpose:"状态方法“setTheme”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"updateTerminal",kind:"方法 / 函数",startLine:32,endLine:49,code:"/// 更新终端设置（任一字段，落盘 + 刷新）\n  void updateTerminal({\n    double? termFontSize,\n    bool? selectToCopy,\n    bool? rightClickPaste,\n    CursorStyle? cursorStyle,\n    bool? cursorBlink,\n  }) {\n    final next = state.copyWith(\n      termFontSize: termFontSize,\n      selectToCopy: selectToCopy,\n      rightClickPaste: rightClickPaste,\n      cursorStyle: cursorStyle,\n      cursorBlink: cursorBlink,\n    );\n    saveSettings(next);\n    state = next;\n  }",purpose:"状态方法“updateTerminal”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/sftp_provider.dart",layer:"Flutter 状态",summary:"SFTP API/状态管理与按主机隔离",lineCount:101,order:16,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:6,endLine:18,code:"/// SFTP 浏览状态：当前路径 + 文件列表 + 加载/错误态\nclass SftpState {\n  final String path;\n  final List<RemoteFile> files;\n  final bool loading;\n  final String? error;\n\n  const SftpState({\n    this.path = '/',\n    this.files = const [],\n    this.loading = false,\n    this.error,\n  });",purpose:"SFTP API/状态管理与按主机隔离。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:19,endLine:24,code:"SftpState copyWith({\n    String? path,\n    List<RemoteFile>? files,\n    bool? loading,\n    String? error,\n  }) =>",purpose:"状态方法“copyWith”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"SftpState",kind:"方法 / 函数",startLine:25,endLine:97,code:"SftpState(\n        path: path ?? this.path,\n        files: files ?? this.files,\n        loading: loading ?? this.loading,\n        error: error,\n      );\n}\n\n/// SFTP 浏览 Notifier —— 按主机分桶隔离（每台主机各自的浏览路径/列表）。\n/// 当前展示哪台由 connectionProvider 的 host 决定，切主机自动切快照。\nclass SftpNotifier extends Notifier<SftpState> {\n  final Map<String, SftpState> _byHost = {};\n  String? _currentId;\n\n  @override\n  SftpState build() {\n    ref.listen(connectionProvider.select((s) => s.host?.id), (prev, next) {\n      _currentId = next;\n      state = next == null\n          ? const SftpState()\n          : (_byHost[next] ?? const SftpState());\n    });\n    _currentId = ref.read(connectionProvider).host?.id;\n    return _currentId == null\n        ? const SftpState()\n        : (_byHost[_currentId!] ?? const SftpState());\n  }\n\n  /// 列出指定目录（默认当前路径）。未连接则报错。\n  Future<void> load([String? path]) async {\n    final conn = ref.read(connectionProvider);\n    final hostId = conn.host?.id;\n    if (hostId == null || !conn.isConnected) {\n      _set(hostId, const SftpState(error: '未连接主机'));\n      return;\n    }\n    final prev = _byHost[hostId] ?? const SftpState();\n    final target = path ?? prev.path;\n    _set(hostId, prev.copyWith(loading: true, error: null, path: target));\n    try {\n      final files = await conn.client!.listDir(target);\n      _set(hostId, SftpState(path: target, files: files, loading: false));\n    } catch (e) {\n      _set(hostId, SftpState(path: target, loading: false, error: e.toString()));\n    }\n  }\n\n  /// 进入子目录\n  Future<void> enter(RemoteFile dir) async {\n    if (!dir.isDir) return;\n    await load(dir.path);\n  }\n\n  /// 返回上级目录\n  Future<void> goUp() async {\n    final p = state.path;\n    if (p == '/' || p.isEmpty) return;\n    final trimmed = p.endsWith('/') ? p.substring(0, p.length - 1) : p;\n    final idx = trimmed.lastIndexOf('/');\n    final parent = idx <= 0 ? '/' : trimmed.substring(0, idx);\n    await load(parent);\n  }\n\n  /// 写入某主机的 SFTP 状态；若正是当前展示主机则同步刷新对外 state\n  void _set(String? hostId, SftpState s) {\n    if (hostId == null) {\n      state = s;\n      return;\n    }\n    _byHost[hostId] = s;\n    if (hostId == _currentId) state = s;\n  }\n}",purpose:"状态方法“SftpState”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"clients/app/lib/core/config.dart",layer:"Flutter 核心",summary:"本地配置、主机/模型设置及安全持久化",lineCount:439,order:17,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:15,endLine:47,code:"/// 一台主机的连接信息\nclass Host {\n  final String id;\n  final String? alias;\n  final String host;\n  final int port;\n  final String user;\n\n  /// AES-GCM 加密后的密码；未存密码则为 null\n  final String? passwordEnc;\n\n  /// 指定用哪把密钥认证（SshKey.id）；为 null 走密码认证\n  final String? keyId;\n\n  const Host({\n    required this.id,\n    this.alias,\n    required this.host,\n    this.port = 22,\n    this.user = 'root',\n    this.passwordEnc,\n    this.keyId,\n  });\n\n  factory Host.fromJson(Map<String, dynamic> j) => Host(\n        id: j['id'] as String,\n        alias: j['alias'] as String?,\n        host: j['host'] as String,\n        port: (j['port'] as num?)?.toInt() ?? 22,\n        user: j['user'] as String? ?? 'root',\n        passwordEnc: j['passwordEnc'] as String?,\n        keyId: j['keyId'] as String?,\n      );",purpose:"本地配置、主机/模型设置及安全持久化。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:48,endLine:56,code:"Map<String, dynamic> toJson() => {\n        'id': id,\n        if (alias != null) 'alias': alias,\n        'host': host,\n        'port': port,\n        'user': user,\n        if (passwordEnc != null) 'passwordEnc': passwordEnc,\n        if (keyId != null) 'keyId': keyId,\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:80,endLine:85,code:"Map<String, dynamic> toJson() => {\n        'id': id,\n        'name': name,\n        'privateKeyEnc': privateKeyEnc,\n        if (passphraseEnc != null) 'passphraseEnc': passphraseEnc,\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:106,endLine:110,code:"Map<String, dynamic> toJson() => {\n        'baseURL': baseURL,\n        'apiKey': apiKey,\n        'model': model,\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:112,endLine:112,code:"LlmConfig copyWith({String? baseURL, String? apiKey, String? model}) => LlmConfig(",purpose:"实现“copyWith”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"toLlmConfig",kind:"方法 / 函数",startLine:139,endLine:140,code:"/// 转成 GlmClient 用的 LlmConfig\n  LlmConfig toLlmConfig() =>",purpose:"实现“toLlmConfig”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"LlmConfig",kind:"方法 / 函数",startLine:141,endLine:143,code:"LlmConfig(baseURL: baseURL, apiKey: apiKey, model: model);\n\n  factory LlmProvider.fromJson(Map<String, dynamic> j) => LlmProvider(",purpose:"实现“LlmConfig”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:151,endLine:157,code:"Map<String, dynamic> toJson() => {\n        'id': id,\n        'name': name,\n        'baseURL': baseURL,\n        'apiKey': apiKey,\n        'model': model,\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:159,endLine:159,code:"LlmProvider copyWith({String? apiKey, String? model, String? baseURL}) =>",purpose:"实现“copyWith”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"LlmProvider",kind:"方法 / 函数",startLine:186,endLine:232,code:"LlmProvider(\n      id: 'gpt',\n      name: 'OpenAI GPT',\n      baseURL: 'https://api.openai.com/v1',\n      model: 'gpt-4o'),\n  LlmProvider(\n      id: 'claude',\n      name: 'Claude',\n      baseURL: 'https://api.anthropic.com/v1',\n      model: 'claude-sonnet-4-6'),\n];\n\nclass AppConfig {\n  final List<Host> hosts;\n  final List<SshKey> keys;\n  final List<LlmProvider> providers;\n  final String activeProviderId;\n\n  const AppConfig({\n    required this.hosts,\n    this.keys = const [],\n    this.providers = defaultProviders,\n    this.activeProviderId = 'glm',\n  });\n\n  /// 当前激活的供应商（找不到回退第一个）\n  LlmProvider get activeProvider => providers.firstWhere(\n        (p) => p.id == activeProviderId,\n        orElse: () => providers.isNotEmpty ? providers.first : defaultProviders.first,\n      );\n\n  /// 当前激活供应商的 LlmConfig（给 GlmClient 用，调用方无需改）\n  LlmConfig get llm => activeProvider.toLlmConfig();\n\n  AppConfig copyWith({\n    List<Host>? hosts,\n    List<SshKey>? keys,\n    List<LlmProvider>? providers,\n    String? activeProviderId,\n  }) =>\n      AppConfig(\n        hosts: hosts ?? this.hosts,\n        keys: keys ?? this.keys,\n        providers: providers ?? this.providers,\n        activeProviderId: activeProviderId ?? this.activeProviderId,\n      );\n}",purpose:"实现“LlmProvider”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_emptyConfig",kind:"方法 / 函数",startLine:247,endLine:247,code:"AppConfig _emptyConfig() => const AppConfig(hosts: []);",purpose:"实现“_emptyConfig”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_mergeProviders",kind:"方法 / 函数",startLine:249,endLine:262,code:"/// 合并供应商：以内置预设为基底，用文件里同 id 的配置覆盖（保留用户填的 key/model）。\n/// 保证即使老配置缺供应商，列表也始终是完整的五家。\nList<LlmProvider> _mergeProviders(List<LlmProvider> fromFile) {\n  return defaultProviders.map((preset) {\n    final saved = fromFile.where((p) => p.id == preset.id).firstOrNull;\n    if (saved == null) return preset;\n    // 用户填了什么就用什么，baseURL/model 为空时回退预设\n    return preset.copyWith(\n      apiKey: saved.apiKey,\n      model: saved.model.isNotEmpty ? saved.model : preset.model,\n      baseURL: saved.baseURL.isNotEmpty ? saved.baseURL : preset.baseURL,\n    );\n  }).toList();\n}",purpose:"封装“_mergeProviders”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"loadConfig",kind:"方法 / 函数",startLine:264,endLine:321,code:"/// 读配置；不存在则返回空配置。环境变量 GLM_API_KEY 优先覆盖 GLM 供应商的 apiKey。\nAppConfig loadConfig() {\n  AppConfig cfg;\n  final file = File(configFile);\n  if (!file.existsSync()) {\n    cfg = _emptyConfig();\n  } else {\n    try {\n      final raw = file.readAsStringSync();\n      final parsed = jsonDecode(raw) as Map<String, dynamic>;\n      final hosts = (parsed['hosts'] as List<dynamic>? ?? [])\n          .map((e) => Host.fromJson(e as Map<String, dynamic>))\n          .toList();\n      final keys = (parsed['keys'] as List<dynamic>? ?? [])\n          .map((e) => SshKey.fromJson(e as Map<String, dynamic>))\n          .toList();\n      // 新版：providers 列表 + activeProviderId\n      List<LlmProvider> providers;\n      String activeId;\n      if (parsed['providers'] != null) {\n        final fromFile = (parsed['providers'] as List<dynamic>)\n            .map((e) => LlmProvider.fromJson(e as Map<String, dynamic>))\n            .toList();\n        providers = _mergeProviders(fromFile);\n        activeId = parsed['activeProviderId'] as String? ?? 'glm';\n      } else if (parsed['llm'] != null) {\n        // 向后兼容：旧版单 llm 字段迁移成 glm 供应商\n        final old = LlmConfig.fromJson(parsed['llm'] as Map<String, dynamic>);\n        providers = defaultProviders\n            .map((p) => p.id == 'glm'\n                ? p.copyWith(apiKey: old.apiKey, model: old.model, baseURL: old.baseURL)\n                : p)\n            .toList();\n        activeId = 'glm';\n      } else {\n        providers = defaultProviders;\n        activeId = 'glm';\n      }\n      cfg = AppConfig(\n          hosts: hosts,\n          keys: keys,\n          providers: providers,\n          activeProviderId: activeId);\n    } catch (_) {\n      // 配置损坏不影响启动，退回空配置（用户可重新添加）\n      cfg = _emptyConfig();\n    }\n  }\n  // 环境变量优先：覆盖 GLM 供应商的 apiKey（不写回文件）\n  final envKey = Platform.environment['GLM_API_KEY'];\n  if (envKey != null && envKey.trim().isNotEmpty) {\n    final providers = cfg.providers\n        .map((p) => p.id == 'glm' ? p.copyWith(apiKey: envKey) : p)\n        .toList();\n    cfg = cfg.copyWith(providers: providers);\n  }\n  return cfg;\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"saveConfig",kind:"方法 / 函数",startLine:323,endLine:343,code:"/// 写配置（权限 600）。注意：不会把环境变量注入的 apiKey 持久化回文件。\nvoid saveConfig(AppConfig cfg) {\n  final dir = Directory(_configDir);\n  if (!dir.existsSync()) {\n    dir.createSync(recursive: true);\n  }\n  final json = const JsonEncoder.withIndent('  ').convert({\n    'hosts': cfg.hosts.map((h) => h.toJson()).toList(),\n    'keys': cfg.keys.map((k) => k.toJson()).toList(),\n    'providers': cfg.providers.map((p) => p.toJson()).toList(),\n    'activeProviderId': cfg.activeProviderId,\n  });\n  final file = File(configFile);\n  file.writeAsStringSync(json);\n  // Windows 不支持 chmod，忽略异常\n  try {\n    if (!Platform.isWindows) {\n      Process.runSync('chmod', ['600', configFile]);\n    }\n  } catch (_) {}\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"addHost",kind:"方法 / 函数",startLine:345,endLine:368,code:"/// 新增主机：密码加密后落库，返回带 id 的 Host。\n/// keyId 非空表示用密钥认证（此时通常不存密码）。\nHost addHost({\n  String? alias,\n  required String host,\n  int port = 22,\n  String user = 'root',\n  String? password,\n  String? keyId,\n}) {\n  final cfg = loadConfig();\n  final newHost = Host(\n    id: _uuid.v4(),\n    alias: alias,\n    host: host,\n    port: port,\n    user: user,\n    passwordEnc: (password != null && password.isNotEmpty) ? encrypt(password) : null,\n    keyId: keyId,\n  );\n  final hosts = [...cfg.hosts, newHost];\n  saveConfig(cfg.copyWith(hosts: hosts));\n  return newHost;\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"removeHost",kind:"方法 / 函数",startLine:370,endLine:375,code:"/// 删除主机\nvoid removeHost(String id) {\n  final cfg = loadConfig();\n  final hosts = cfg.hosts.where((h) => h.id != id).toList();\n  saveConfig(cfg.copyWith(hosts: hosts));\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"getHostPassword",kind:"方法 / 函数",startLine:377,endLine:381,code:"/// 取某主机的明文密码（解密）；未存返回 null\nString? getHostPassword(Host host) {\n  if (host.passwordEnc == null) return null;\n  return decrypt(host.passwordEnc);\n}",purpose:"封装“getHostPassword”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"hasPassword",kind:"方法 / 函数",startLine:383,endLine:384,code:"/// 主机是否已存密码\nbool hasPassword(Host host) => host.passwordEnc != null;",purpose:"实现“hasPassword”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"addKey",kind:"方法 / 函数",startLine:386,endLine:404,code:"/// 新增密钥：私钥 PEM 与 passphrase 加密后落库，返回带 id 的 SshKey\nSshKey addKey({\n  required String name,\n  required String privateKeyPem,\n  String? passphrase,\n}) {\n  final cfg = loadConfig();\n  final newKey = SshKey(\n    id: _uuid.v4(),\n    name: name,\n    privateKeyEnc: encrypt(privateKeyPem)!,\n    passphraseEnc: (passphrase != null && passphrase.isNotEmpty)\n        ? encrypt(passphrase)\n        : null,\n  );\n  final keys = [...cfg.keys, newKey];\n  saveConfig(cfg.copyWith(keys: keys));\n  return newKey;\n}",purpose:"封装“addKey”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"removeKey",kind:"方法 / 函数",startLine:406,endLine:425,code:"/// 删除密钥。引用了该密钥的主机回退为「无认证」（keyId 置空），由用户重新配置。\nvoid removeKey(String id) {\n  final cfg = loadConfig();\n  final keys = cfg.keys.where((k) => k.id != id).toList();\n  // 解除引用：把 keyId 指向被删密钥的主机清掉 keyId\n  final hosts = cfg.hosts\n      .map((h) => h.keyId == id\n          ? Host(\n              id: h.id,\n              alias: h.alias,\n              host: h.host,\n              port: h.port,\n              user: h.user,\n              passwordEnc: h.passwordEnc,\n              keyId: null,\n            )\n          : h)\n      .toList();\n  saveConfig(cfg.copyWith(hosts: hosts, keys: keys));\n}",purpose:"实现“removeKey”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/core/events.dart",layer:"Flutter 核心",summary:"跨层事件模型：token、reasoning、工具、拦截、完成与错误",lineCount:62,order:17,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:10,endLine:62,code:"/// 所有 Agent 事件的密封基类（对应 TS 的 discriminated union）\nsealed class AgentEvent {\n  const AgentEvent();\n}\n\n/// 模型增量输出的一段文本 token\nclass TokenEvent extends AgentEvent {\n  final String text;\n  const TokenEvent(this.text);\n}\n\n/// 模型思考过程增量（GLM reasoning_content）\nclass ReasoningEvent extends AgentEvent {\n  final String text;\n  const ReasoningEvent(this.text);\n}\n\n/// 模型决定调用某个工具\nclass ToolCallEvent extends AgentEvent {\n  final String name;\n  final String args;\n  const ToolCallEvent(this.name, this.args);\n}\n\n/// 工具执行结果（executed=false 表示被拦截/拒绝，未真正执行）\nclass ToolResultEvent extends AgentEvent {\n  final String name;\n  final String summary;\n  final bool executed;\n  const ToolResultEvent(this.name, this.summary, this.executed);\n}\n\n/// 命令被安全门禁拦截 / 用户拒绝\nclass BlockedEvent extends AgentEvent {\n  final String command;\n  final String reason;\n  const BlockedEvent(this.command, this.reason);\n}\n\n/// 任务完成，带最终结论文本\nclass DoneEvent extends AgentEvent {\n  final String finalText;\n  const DoneEvent(this.finalText);\n}\n\n/// 出错\nclass ErrorEvent extends AgentEvent {\n  final String message;\n  const ErrorEvent(this.message);\n}\n\n/// ASK 态命令的人工确认入口：返回 true 放行，false 拒绝\ntypedef Confirmer = Future<bool> Function(String command, String reason);",purpose:"跨层事件模型：token、reasoning、工具、拦截、完成与错误。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]}]},{path:"clients/app/lib/core/port_forward.dart",layer:"Flutter 核心",summary:"SSH 本地端口转发与双向 Socket 管道",lineCount:121,order:17,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:17,endLine:33,code:"/// 一条运行中的隧道句柄。持有本地监听 socket 与所有活动转发连接。\nclass ForwardTunnel {\n  final int localPort;\n  final String remoteHost;\n  final int remotePort;\n\n  final ServerSocket _server;\n  // 活动的本地 socket 集合，stop 时统一销毁\n  final Set<Socket> _activeSockets = {};\n  bool _closed = false;\n\n  ForwardTunnel._(\n    this._server, {\n    required this.localPort,\n    required this.remoteHost,\n    required this.remotePort,\n  });",purpose:"SSH 本地端口转发与双向 Socket 管道。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"start",kind:"方法 / 函数",startLine:34,endLine:55,code:"/// 起一条本地端口转发隧道。绑定 127.0.0.1 仅本机可访问（安全：不暴露到局域网）。\n  static Future<ForwardTunnel> start(\n    SshClient ssh, {\n    required int localPort,\n    required String remoteHost,\n    required int remotePort,\n  }) async {\n    final server = await ServerSocket.bind('127.0.0.1', localPort);\n    final tunnel = ForwardTunnel._(\n      server,\n      localPort: localPort,\n      remoteHost: remoteHost,\n      remotePort: remotePort,\n    );\n    // 监听本地连接，每个连接开一条 SSH 转发 channel\n    server.listen(\n      (socket) => tunnel._handle(ssh, socket),\n      onError: (_) {}, // 监听出错不抛，避免 zone 未捕获\n      cancelOnError: false,\n    );\n    return tunnel;\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"_handle",kind:"方法 / 函数",startLine:57,endLine:108,code:"// 处理单个本地连接：开转发 channel 并双向 pipe\n  Future<void> _handle(SshClient ssh, Socket socket) async {\n    if (_closed) {\n      socket.destroy();\n      return;\n    }\n    _activeSockets.add(socket);\n    SSHForwardChannel? channel;\n    try {\n      channel = await ssh.forwardLocal(remoteHost, remotePort);\n    } catch (_) {\n      // 开 channel 失败（如连接已断），直接断掉本地连接\n      _activeSockets.remove(socket);\n      socket.destroy();\n      return;\n    }\n\n    // 远端 → 本地\n    final remoteSub = channel.stream.listen(\n      (data) {\n        try {\n          socket.add(data);\n        } catch (_) {}\n      },\n      onError: (_) => socket.destroy(),\n      onDone: () => socket.destroy(),\n      cancelOnError: false,\n    );\n\n    // 本地 → 远端\n    socket.listen(\n      (data) {\n        try {\n          channel!.sink.add(data);\n        } catch (_) {}\n      },\n      onError: (_) {\n        remoteSub.cancel();\n        channel?.close();\n      },\n      onDone: () {\n        remoteSub.cancel();\n        channel?.close();\n      },\n      cancelOnError: false,\n    );\n\n    // 本地 socket 彻底关闭后从活动集合移除\n    socket.done.whenComplete(() {\n      _activeSockets.remove(socket);\n    });\n  }",purpose:"封装“_handle”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","发送类型化事件，驱动调用方或界面实时更新。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"stop",kind:"方法 / 函数",startLine:110,endLine:119,code:"/// 关闭隧道：停止监听 + 销毁所有活动连接\n  Future<void> stop() async {\n    if (_closed) return;\n    _closed = true;\n    await _server.close();\n    for (final s in _activeSockets.toList()) {\n      s.destroy();\n    }\n    _activeSockets.clear();\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/core/config.ts",layer:"CLI",summary:"本地配置、主机/模型设置及安全持久化",lineCount:125,order:17,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:15,endLine:46,code:"/** 一台主机的连接信息 */\nexport interface Host {\n  id: string\n  alias?: string\n  host: string\n  port: number\n  user: string\n  /** AES-GCM 加密后的密码；未存密码则为空 */\n  passwordEnc?: string\n}\n\n/** GLM/OpenAI 兼容接入设置 */\nexport interface LlmConfig {\n  baseURL: string\n  apiKey: string\n  model: string\n}\n\nexport interface AppConfig {\n  hosts: Host[]\n  llm: LlmConfig\n}\n\nconst CONFIG_DIR = join(homedir(), '.lowenssh')\nconst CONFIG_FILE = join(CONFIG_DIR, 'config.json')\n\n/** 默认 LLM 设置：GLM。apiKey 留空，首次运行提示用户填或从环境变量读 */\nconst DEFAULT_LLM: LlmConfig = {\n  baseURL: 'https://open.bigmodel.cn/api/paas/v4',\n  apiKey: '',\n  model: 'glm-4.6',\n}",purpose:"本地配置、主机/模型设置及安全持久化。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"emptyConfig",kind:"方法 / 函数",startLine:47,endLine:49,code:"function emptyConfig(): AppConfig {\n  return { hosts: [], llm: { ...DEFAULT_LLM } }\n}",purpose:"封装“emptyConfig”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"loadConfig",kind:"方法 / 函数",startLine:51,endLine:75,code:"/** 读配置；不存在则返回空配置。环境变量 GLM_API_KEY 优先覆盖文件里的 apiKey。 */\nexport function loadConfig(): AppConfig {\n  let cfg: AppConfig\n  if (!existsSync(CONFIG_FILE)) {\n    cfg = emptyConfig()\n  } else {\n    try {\n      const raw = readFileSync(CONFIG_FILE, 'utf8')\n      const parsed = JSON.parse(raw) as Partial<AppConfig>\n      cfg = {\n        hosts: parsed.hosts ?? [],\n        llm: { ...DEFAULT_LLM, ...parsed.llm },\n      }\n    } catch {\n      // 配置损坏不影响启动，退回空配置（用户可重新添加）\n      cfg = emptyConfig()\n    }\n  }\n  // 环境变量优先：方便 CI / 临时覆盖，且不把 key 写进文件\n  const envKey = process.env.GLM_API_KEY\n  if (envKey && envKey.trim() !== '') {\n    cfg.llm.apiKey = envKey\n  }\n  return cfg\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"saveConfig",kind:"方法 / 函数",startLine:77,endLine:88,code:"/** 写配置（权限 600）。注意：不会把环境变量注入的 apiKey 持久化回文件。 */\nexport function saveConfig(cfg: AppConfig): void {\n  if (!existsSync(CONFIG_DIR)) {\n    mkdirSync(CONFIG_DIR, { recursive: true, mode: 0o700 })\n  }\n  writeFileSync(CONFIG_FILE, JSON.stringify(cfg, null, 2), { mode: 0o600 })\n  try {\n    chmodSync(CONFIG_FILE, 0o600)\n  } catch {\n    // Windows 不支持 chmod，忽略\n  }\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"addHost",kind:"方法 / 函数",startLine:90,endLine:104,code:"/** 新增主机：密码加密后落库，返回带 id 的 Host */\nexport function addHost(input: Omit<Host, 'id' | 'passwordEnc'> & { password?: string }): Host {\n  const cfg = loadConfig()\n  const host: Host = {\n    id: randomUUID(),\n    alias: input.alias,\n    host: input.host,\n    port: input.port || 22,\n    user: input.user || 'root',\n    passwordEnc: input.password ? encrypt(input.password) ?? undefined : undefined,\n  }\n  cfg.hosts.push(host)\n  saveConfig(cfg)\n  return host\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"removeHost",kind:"方法 / 函数",startLine:106,endLine:111,code:"/** 删除主机 */\nexport function removeHost(id: string): void {\n  const cfg = loadConfig()\n  cfg.hosts = cfg.hosts.filter((h) => h.id !== id)\n  saveConfig(cfg)\n}",purpose:"读取或更新本地配置，并维护主机与模型接入信息。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"getHostPassword",kind:"方法 / 函数",startLine:113,endLine:117,code:"/** 取某主机的明文密码（解密）；未存返回 null */\nexport function getHostPassword(host: Host): string | null {\n  if (!host.passwordEnc) return null\n  return decrypt(host.passwordEnc)\n}",purpose:"封装“getHostPassword”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"hasPassword",kind:"方法 / 函数",startLine:119,endLine:122,code:"/** 主机是否已存密码 */\nexport function hasPassword(host: Host): boolean {\n  return !!host.passwordEnc\n}",purpose:"封装“hasPassword”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/core/events.ts",layer:"CLI",summary:"跨层事件模型：token、reasoning、工具、拦截、完成与错误",lineCount:67,order:17,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:11,endLine:67,code:"/**\n * Agent 事件 —— 对外流式输出的带类型事件流。\n * 移植自 Java 版 AgentEvent（sealed interface → discriminated union）。\n *\n * 为什么用带类型事件而不是纯字符串流：运维 Agent 输出有多种语义——模型在说话、\n * 要调命令、命令出结果、命令被拦、任务完成。UI 据此区别渲染。语义色是记忆点核心，\n * 与 Web 版 / App 端必须对齐。\n */\n\n/** 模型增量输出的一段文本 token */\nexport interface TokenEvent {\n  type: 'token'\n  text: string\n}\n\n/** 模型思考过程增量（GLM reasoning_content） */\nexport interface ReasoningEvent {\n  type: 'reasoning'\n  text: string\n}\n\n/** 模型决定调用某个工具 */\nexport interface ToolCallEvent {\n  type: 'tool_call'\n  name: string\n  args: string\n}\n\n/** 工具执行结果（executed=false 表示被拦截/拒绝，未真正执行） */\nexport interface ToolResultEvent {\n  type: 'tool_result'\n  name: string\n  summary: string\n  executed: boolean\n}\n\n/** 命令被安全门禁拦截 / 用户拒绝 */\nexport interface BlockedEvent {\n  type: 'blocked'\n  command: string\n  reason: string\n}\n\n/** 任务完成，带最终结论文本 */\nexport interface DoneEvent {\n  type: 'done'\n  finalText: string\n}\n\n/** 出错 */\nexport interface ErrorEvent {\n  type: 'error'\n  message: string\n}\n\nexport type AgentEvent =\n  | TokenEvent\n  | ReasoningEvent\n  | ToolCallEvent\n  | ToolResultEvent\n  | BlockedEvent\n  | DoneEvent\n  | ErrorEvent\n\n/** ASK 态命令的人工确认入口：返回 true 放行，false 拒绝 */\nexport type Confirmer = (command: string, reason: string) => Promise<boolean>",purpose:"跨层事件模型：token、reasoning、工具、拦截、完成与错误。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]}]},{path:"clients/app/lib/ui/ai_pane.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:816,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:16,endLine:18,code:"/// AI 对话面板 —— 对话流 + 工具卡片 + 门禁卡片 + 输入框\n/// 对应设计稿 .pane.ai。三种卡片(tool/ask/blocked)是门禁可视化核心。\n/// 数据来自 agentProvider，输入框发送任务，ASK 卡片桥接确认。\nclass AiPane extends ConsumerStatefulWidget {\n  const AiPane({super.key});",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"createState",kind:"UI 生命周期",startLine:19,endLine:20,code:"@override\n  ConsumerState<AiPane> createState() => _AiPaneState();",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"dispose",kind:"方法 / 函数",startLine:28,endLine:34,code:"@override\n  void dispose() {\n    _controller.dispose();\n    _scrollCtrl.dispose();\n    _focusNode.dispose();\n    super.dispose();\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_send",kind:"方法 / 函数",startLine:36,endLine:42,code:"void _send() {\n    final text = _controller.text.trim();\n    if (text.isEmpty) return;\n    _controller.clear();\n    ref.read(agentProvider.notifier).send(text);\n    _scrollToBottom();\n  }",purpose:"接收用户输入并触发对应业务流程，同时管理忙碌、错误和结果状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_scrollToBottom",kind:"方法 / 函数",startLine:44,endLine:50,code:"void _scrollToBottom() {\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (_scrollCtrl.hasClients) {\n        _scrollCtrl.jumpTo(_scrollCtrl.position.maxScrollExtent);\n      }\n    });\n  }",purpose:"交互方法“_scrollToBottom”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:52,endLine:122,code:"@override\n  Widget build(BuildContext context) {\n    final st = ref.watch(agentProvider);\n    final l = ref.watch(l10nProvider);\n    // 新消息进来自动滚到底\n    ref.listen(agentProvider, (prev, next) => _scrollToBottom());\n    // 命令片段等外部请求：把文本填进输入框并聚焦末尾\n    ref.listen(composerProvider, (prev, next) {\n      if (next == null) return;\n      _controller.text = next.text;\n      _controller.selection = TextSelection.fromPosition(\n          TextPosition(offset: _controller.text.length));\n      _focusNode.requestFocus();\n      ref.read(composerProvider.notifier).clear();\n    });\n\n    final children = <Widget>[];\n    for (var i = 0; i < st.items.length; i++) {\n      final item = st.items[i];\n      // reasoning 是否「真正在思考」：运行中 + 是最后一项（否则是已结束/历史块）\n      final live = st.running && i == st.items.length - 1;\n      children.add(_renderItem(item, live: live));\n      children.add(const SizedBox(height: 12));\n    }\n    // 末尾插入待确认卡片（ASK 态）\n    if (st.pendingAsk != null) {\n      children.add(_askCard(\n        cmd: st.pendingAsk!.command,\n        why: l.t('ai.gateVerdict', {'reason': st.pendingAsk!.reason}),\n      ));\n      children.add(const SizedBox(height: 12));\n    }\n\n    return Container(\n      color: AppColors.base,\n      child: Column(\n        crossAxisAlignment: CrossAxisAlignment.stretch,\n        children: [\n          // 顶部模型切换条\n          _modelBar(),\n          // 对话流\n          Expanded(\n            child: st.items.isEmpty && st.pendingAsk == null\n                ? Center(\n                    child: Text(l.t('ai.empty'),\n                        style: TextStyle(\n                            fontSize: 12, color: AppColors.overlay)),\n                  )\n                : SingleChildScrollView(\n                    controller: _scrollCtrl,\n                    padding: const EdgeInsets.all(12),\n                    child: Column(\n                      crossAxisAlignment: CrossAxisAlignment.stretch,\n                      children: children,\n                    ),\n                  ),\n          ),\n          if (st.error != null)\n            Container(\n              width: double.infinity,\n              padding:\n                  const EdgeInsets.symmetric(horizontal: 12, vertical: 6),\n              color: AppColors.red.withValues(alpha: .12),\n              child: Text(l.t('ai.error', {'err': '${st.error}'}),\n                  style: TextStyle(fontSize: 11, color: AppColors.red)),\n            ),\n          _inputBox(st.running, l),\n        ],\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_renderItem",kind:"方法 / 函数",startLine:124,endLine:150,code:"// 按 ChatItem 类型分发渲染\n  Widget _renderItem(ChatItem it, {bool live = false}) {\n    switch (it.kind) {\n      case ChatItemKind.user:\n        return _userBubble(it.text);\n      case ChatItemKind.reasoning:\n        return _ReasoningTile(\n            text: it.text,\n            seconds: it.reasoningSec ?? 0,\n            live: live,\n            l: ref.read(l10nProvider));\n      case ChatItemKind.assistant:\n        return _assistantMsg(text: it.text);\n      case ChatItemKind.tool:\n        return _ToolTile(\n          name: it.toolName ?? '',\n          running: it.toolResult == null,\n          executed: it.toolExecuted,\n          cmd: it.toolArgs ?? '',\n          result: it.toolResult ?? '',\n        );\n      case ChatItemKind.blocked:\n        return _blockedCard(cmd: it.command ?? '', why: it.reason ?? '');\n      case ChatItemKind.ask:\n        return _askCard(cmd: it.command ?? '', why: it.reason ?? '');\n    }\n  }",purpose:"交互方法“_renderItem”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_userBubble",kind:"方法 / 函数",startLine:153,endLine:154,code:"// 用户气泡（右对齐，圆角缺右下）\n  Widget _userBubble(String text) => Align(",purpose:"交互方法“_userBubble”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_modelBar",kind:"方法 / 函数",startLine:173,endLine:273,code:"// 顶部模型切换条：显示当前模型，下拉切换已配置 key 的供应商\n  Widget _modelBar() {\n    final cfg = ref.watch(configProvider);\n    final l = ref.watch(l10nProvider);\n    final active = cfg.activeProvider;\n    // 只列已配置 key 的供应商；当前激活的即使没 key 也显示\n    final selectable = cfg.providers\n        .where((p) => p.configured || p.id == active.id)\n        .toList();\n\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 7),\n      decoration: BoxDecoration(\n        color: AppColors.mantle,\n        border: Border(bottom: BorderSide(color: AppColors.surface0)),\n      ),\n      child: Row(\n        children: [\n          Icon(Icons.auto_awesome,\n              size: 14, color: AppColors.subtext),\n          const SizedBox(width: 7),\n          Text(l.t('ai.agent'),\n              style: TextStyle(fontSize: 12, color: AppColors.subtext)),\n          const SizedBox(width: 8),\n          // 模型下拉\n          Expanded(\n            child: Align(\n              alignment: Alignment.centerLeft,\n              child: PopupMenuButton<String>(\n                initialValue: active.id,\n                tooltip: l.t('ai.switchModel'),\n                color: AppColors.mantle,\n                onSelected: (id) =>\n                    ref.read(configProvider.notifier).setActiveProvider(id),\n                itemBuilder: (_) => [\n                  for (final p in selectable)\n                    PopupMenuItem(\n                      value: p.id,\n                      height: 38,\n                      child: Row(\n                        children: [\n                          Icon(\n                              p.id == active.id\n                                  ? Icons.check\n                                  : Icons.circle_outlined,\n                              size: 13,\n                              color: p.id == active.id\n                                  ? AppColors.green\n                                  : AppColors.overlay),\n                          const SizedBox(width: 8),\n                          Text('${p.name} · ${p.model}',\n                              style: TextStyle(\n                                  fontSize: 12, color: AppColors.text)),\n                        ],\n                      ),\n                    ),\n                ],\n                child: Container(\n                  padding:\n                      const EdgeInsets.symmetric(horizontal: 8, vertical: 3),\n                  decoration: BoxDecoration(\n                    color: AppColors.surface0,\n                    borderRadius: BorderRadius.circular(6),\n                  ),\n                  child: Row(\n                    mainAxisSize: MainAxisSize.min,\n                    children: [\n                      Text(active.model,\n                          style: TextStyle(\n                              fontSize: 11.5,\n                              fontWeight: FontWeight.w600,\n                              color: AppColors.text)),\n                      const SizedBox(width: 4),\n                      Icon(Icons.expand_more,\n                          size: 14, color: AppColors.subtext),\n                    ],\n                  ),\n                ),\n              ),\n            ),\n          ),\n          // 历史会话：点击弹出历史列表，可恢复/删除\n          _barIcon(\n            icon: Icons.history,\n            tooltip: l.t('ai.history'),\n            onTap: () => _showHistory(context),\n          ),\n          const SizedBox(width: 2),\n          // 关闭面板：归档当前会话 + 清空，然后隐藏面板\n          _barIcon(\n            icon: Icons.close,\n            tooltip: l.t('ai.close'),\n            onTap: () {\n              ref.read(agentProvider.notifier).archiveAndClear();\n              ref.read(agentPanelProvider.notifier).hide();\n            },\n          ),\n        ],\n      ),\n    );\n  }",purpose:"交互方法“_modelBar”：处理界面渲染、用户操作或视觉状态。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_barIcon",kind:"方法 / 函数",startLine:275,endLine:279,code:"// 模型条上的小图标按钮\n  Widget _barIcon(\n          {required IconData icon,\n          required String tooltip,\n          required VoidCallback onTap}) =>",purpose:"交互方法“_barIcon”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"Tooltip",kind:"方法 / 函数",startLine:280,endLine:393,code:"Tooltip(\n        message: tooltip,\n        child: InkWell(\n          onTap: onTap,\n          borderRadius: BorderRadius.circular(6),\n          child: Padding(\n            padding: const EdgeInsets.all(4),\n            child: Icon(icon, size: 16, color: AppColors.subtext),\n          ),\n        ),\n      );\n\n  // 历史会话面板：列出当前主机的归档会话，点击恢复，垃圾桶删除\n  void _showHistory(BuildContext context) {\n    final l = ref.read(l10nProvider);\n    final entries = ref.read(agentProvider.notifier).historyEntries();\n    showDialog(\n      context: context,\n      builder: (ctx) => Dialog(\n        backgroundColor: AppColors.mantle,\n        child: ConstrainedBox(\n          constraints: const BoxConstraints(maxWidth: 420, maxHeight: 460),\n          child: Column(\n            mainAxisSize: MainAxisSize.min,\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n            children: [\n              Padding(\n                padding: const EdgeInsets.fromLTRB(16, 14, 16, 8),\n                child: Text(l.t('ai.history'),\n                    style: TextStyle(\n                        fontSize: 14,\n                        fontWeight: FontWeight.w700,\n                        color: AppColors.text)),\n              ),\n              if (entries.isEmpty)\n                Padding(\n                  padding: const EdgeInsets.symmetric(\n                      horizontal: 16, vertical: 24),\n                  child: Text(l.t('ai.historyEmpty'),\n                      style:\n                          TextStyle(fontSize: 12, color: AppColors.overlay)),\n                )\n              else\n                Flexible(\n                  child: ListView.builder(\n                    shrinkWrap: true,\n                    padding: const EdgeInsets.symmetric(horizontal: 8),\n                    itemCount: entries.length,\n                    itemBuilder: (_, i) {\n                      final e = entries[i];\n                      final dt = DateTime.fromMillisecondsSinceEpoch(e.ts);\n                      final ds =\n                          '$ 状态栏\n/// 所有面板(主机/终端/SFTP/智能体/侧面板)均为独立 DockingItem，\n/// 可自由拖拽、合并成 tab、分屏。顶栏下方整块交给 Docking，左栏因此自然顶起。\nclass AppShell extends ConsumerStatefulWidget {\n  const AppShell({super.key});",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"createState",kind:"UI 生命周期",startLine:23,endLine:24,code:"@override\n  ConsumerState<AppShell> createState() => _AppShellState();",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_buildLayout",kind:"方法 / 函数",startLine:32,endLine:85,code:"// 按当前语言构建布局。语言切换时重建（会重置拖拽布局，低频可接受）。\n  // agentVisible 控制智能体面板是否加入布局（仿 VSCode 插件显隐）。\n  DockingLayout _buildLayout(L10n l, bool agentVisible) {\n    final items = <DockingArea>[\n      // 左：主机树\n      DockingItem(\n        name: l.t('panel.hosts'),\n        widget: const LeftBar(),\n        weight: 0.17,\n        minimalSize: 200, // 防拖到过窄导致内容溢出\n        closable: false,\n        keepAlive: true,\n      ),\n      // 中：终端与 SFTP 合并成 tab 组（不可关闭）\n      DockingTabs([\n        DockingItem(\n          id: 'terminal',\n          name: l.t('panel.terminal'),\n          widget: const TerminalPane(),\n          minimalSize: 200,\n          closable: false,\n          keepAlive: true,\n        ),\n        DockingItem(\n          id: 'sftp',\n          name: 'SFTP',\n          widget: const SftpView(),\n          minimalSize: 200,\n          closable: false,\n          keepAlive: true,\n        ),\n      ], weight: agentVisible ? 0.32 : 0.55),\n      // 中右：智能体（仅在显示时加入，× 关闭走 agentPanelProvider.hide）\n      if (agentVisible)\n        DockingItem(\n          name: l.t('panel.agent'),\n          widget: const AiPane(),\n          weight: 0.30,\n          minimalSize: 240, // 智能体内含输入框+多按钮，留宽一点\n          closable: false, // 关闭走面板内 × 按钮，不用 docking 自带关闭\n          keepAlive: true,\n        ),\n      // 右：安全/文件/监控侧面板\n      DockingItem(\n        name: l.t('panel.side'),\n        widget: const RightBar(),\n        weight: 0.21,\n        minimalSize: 220,\n        closable: false,\n        keepAlive: true,\n      ),\n    ];\n    return DockingLayout(root: DockingRow(items));\n  }",purpose:"交互方法“_buildLayout”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_isTerminalGroup",kind:"方法 / 函数",startLine:87,endLine:93,code:"// 判断某 tab 组是否为终端/SFTP 组（组内含 id=='terminal' 的项）\n  bool _isTerminalGroup(DockingTabs tabs) {\n    for (var i = 0; i < tabs.childrenCount; i++) {\n      if (tabs.childAt(i).id == 'terminal') return true;\n    }\n    return false;\n  }",purpose:"交互方法“_isTerminalGroup”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"dispose",kind:"方法 / 函数",startLine:95,endLine:99,code:"@override\n  void dispose() {\n    _layout?.dispose();\n    super.dispose();\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:101,endLine:159,code:"@override\n  Widget build(BuildContext context) {\n    // 监听语言 + 智能体显隐：任一变化都重建 layout\n    final lang = ref.watch(settingsProvider.select((s) => s.lang));\n    final agentVisible = ref.watch(agentPanelProvider);\n    final l = ref.watch(l10nProvider);\n    if (_layout == null ||\n        _builtLang != lang ||\n        _builtAgentVisible != agentVisible) {\n      _layout?.dispose();\n      _layout = _buildLayout(l, agentVisible);\n      _builtLang = lang;\n      _builtAgentVisible = agentVisible;\n    }\n    return Scaffold(\n      backgroundColor: AppColors.base,\n      body: Column(\n        children: [\n          const TopBar(),\n          Expanded(\n            child: DockingTheme(\n              data: DockingThemeData(),\n              // tab 栏样式\n              child: TabbedViewTheme(\n                data: buildTabbedTheme(),\n                // 分隔条样式（docking 内部 MultiSplitView 从 context 取）\n                child: MultiSplitViewTheme(\n                  data: buildSplitTheme(),\n                  // 关掉三个最大化入口（去掉 tab 上的最大化方块按钮）\n                  child: Docking(\n                    layout: _layout,\n                    maximizableItem: false,\n                    maximizableTab: false,\n                    maximizableTabsArea: false,\n                    // 终端/SFTP tab 组右侧放「打开智能体」按钮；\n                    // 智能体已展开时不显示（此时由智能体面板自己的顶栏控制）。\n                    dockingButtonsBuilder: (ctx, tabs, item) {\n                      if (agentVisible) return [];\n                      if (tabs == null || !_isTerminalGroup(tabs)) return [];\n                      return [\n                        TabButton(\n                          icon: IconProvider.data(Icons.auto_awesome),\n                          toolTip: l.t('panel.agent'),\n                          color: AppColors.subtext,\n                          onPressed: () =>\n                              ref.read(agentPanelProvider.notifier).show(),\n                        ),\n                      ];\n                    },\n                  ),\n                ),\n              ),\n            ),\n          ),\n          const StatusBar(),\n        ],\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/lib/ui/audit_dialog.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:197,order:18,logicBlocks:[{name:"showAuditDialog",kind:"方法 / 函数",startLine:8,endLine:27,code:"/// 审计日志对话框 —— 全局命令审计列表，支持按决策筛选 + 清空。\nFuture<void> showAuditDialog(BuildContext context) {\n  return showDialog<void>(\n    context: context,\n    builder: (_) => Dialog(\n      backgroundColor: AppColors.mantle,\n      shape: RoundedRectangleBorder(\n               style: TextStyle(fontSize: 12, color: AppColors.red)),\n              ),\n          ],\n        ),\n        const SizedBox(height: 8),\n        // 筛选标签\n        Row(\n          children: [\n            _chip('all', l.t('common.all')),\n            _chip('deny', l.t('state.denied')),\n            _chip('ask', l.t('state.ask')),\n            _chip('allow', l.t('state.allowed')),\n          ],\n        ),\n        const SizedBox(height: 12),\n        // 列表\n        Flexible(\n          child: list.isEmpty\n              ? Padding(\n                  padding: const EdgeInsets.symmetric(vertical: 30),\n                  child: Text(l.t('audit.empty'),\n                      textAlign: TextAlign.center,\n                      style: TextStyle(\n                          fontSize: 12, color: AppColors.overlay)),\n                )\n              : ListView.separated(\n                  shrinkWrap: true,\n                  itemCount: list.length,\n                  separatorBuilder: (context, index) =>\n                      const SizedBox(height: 5),\n                  itemBuilder: (ctx, i) => _row(list[i]),\n                ),\n        ),\n      ],\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_chip",kind:"方法 / 函数",startLine:107,endLine:131,code:"Widget _chip(String id, String label) {\n    final active = _filter == id;\n    return Padding(\n      padding: const EdgeInsets.only(right: 8),\n      child: MouseRegion(\n        cursor: SystemMouseCursors.click,\n        child: GestureDetector(\n          onTap: () => setState(() => _filter = id),\n          child: Container(\n            padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 5),\n            decoration: BoxDecoration(\n              color: active ? AppColors.surface1 : AppColors.base,\n              borderRadius: BorderRadius.circular(20),\n              border: Border
