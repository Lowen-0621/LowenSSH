v, Uint8List(0)),\n    );\n  final plain = cipher.process(Uint8List.fromList(ctWithTag));\n  return utf8.decode(plain);\n}",purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["选择认证加密，既保护机密性，也能发现密文篡改。"],risks:[]}]},{path:"clients/cli/src/core/crypto.test.ts",layer:"CLI",summary:"AES-GCM 凭据加密与密钥派生",lineCount:35,order:11,logicBlocks:[]},{path:"clients/cli/src/core/crypto.ts",layer:"CLI",summary:"AES-GCM 凭据加密与密钥派生",lineCount:56,order:11,logicBlocks:[{name:"deriveKey",kind:"方法 / 函数",startLine:18,endLine:21,code:"/** 任意密钥串经 SHA-256 派生成固定 32 字节 */\nfunction deriveKey(raw: string): Buffer {\n  return createHash('sha256').update(raw, 'utf8').digest()\n}",purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"resolveKey",kind:"方法 / 函数",startLine:23,endLine:30,code:"function resolveKey(): Buffer {\n  const raw = process.env.XWSSH_CRYPTO_KEY\n  if (!raw || raw.trim() === '') {\n    // 没配密钥退到开发默认值，仅保证能跑；生产务必设 XWSSH_CRYPTO_KEY\n    return deriveKey(DEV_DEFAULT_KEY)\n  }\n  return deriveKey(raw)\n}",purpose:"封装“resolveKey”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"encrypt",kind:"方法 / 函数",startLine:32,endLine:42,code:"/** 加密：明文 → Base64(iv + 密文 + tag)。空串返回 null。 */\nexport function encrypt(plain: string | null): string | null {\n  if (!plain) return null\n  const key = resolveKey()\n  const iv = randomBytes(IV_LEN)\n  const cipher = createCipheriv(ALGO, key, iv, { authTagLength: TAG_LEN })\n  const ct = Buffer.concat([cipher.update(plain, 'utf8'), cipher.final()])\n  const tag = cipher.getAuthTag()\n  // 布局与 Java 版对齐：iv + 密文 + tag\n  return Buffer.concat([iv, ct, tag]).toString('base64')\n}",purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["根据输入、连接或业务状态选择处理分支。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:["选择认证加密，既保护机密性，也能发现密文篡改。"],risks:[]},{name:"decrypt",kind:"方法 / 函数",startLine:44,endLine:55,code:"/** 解密：Base64(iv + 密文 + tag) → 明文。空串返回 null。 */\nexport function decrypt(enc: string | null): string | null {\n  if (!enc) return null\n  const key = resolveKey()\n  const all = Buffer.from(enc, 'base64')\n  const iv = all.subarray(0, IV_LEN)\n  const tag = all.subarray(all.length - TAG_LEN)\n  const ct = all.subarray(IV_LEN, all.length - TAG_LEN)\n  const decipher = createDecipheriv(ALGO, key, iv, { authTagLength: TAG_LEN })\n  decipher.setAuthTag(tag)\n  return Buffer.concat([decipher.update(ct), decipher.final()]).toString('utf8')\n}",purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["根据输入、连接或业务状态选择处理分支。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/util/CryptoUtil.java",layer:"Java 后端",summary:"AES-GCM 凭据加密与密钥派生",lineCount:90,order:11,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:28,endLine:36,code:'/**\n * 密码加密工具 —— 主机簿密码落库前用 AES-GCM 加密，绝不存明文。\n *\n * 为什么 AES-GCM：对称加密里 GCM 自带完整性校验（认证标签），密文被篡改解密会失败，\n * 比 AES-CBC 安全。密钥从环境变量 XWSSH_CRYPTO_KEY 读，遵循本项目「密钥走环境变量」惯例。\n *\n * 密文格式：Base64( iv[12] + cipherText + tag[16] )，IV 每次随机生成同密文一起存，\n * 解密时切出来用。同一明文每次加密结果不同（IV 随机），符合预期。\n *\n * 注意：这是演示/面试项目的够用方案。生产应上 KMS / Vault 管密钥，不靠单个环境变量。\n */\n@Component\npublic class CryptoUtil {\n\n    private static final Logger log = LoggerFactory.getLogger(CryptoUtil.class);\n    private static final String ALGO = "AES/GCM/NoPadding";\n    private static final int IV_LEN = 12;       // GCM 推荐 12 字节 IV\n    private static final int TAG_BITS = 128;     // 认证标签 128 位\n    private final SecretKeySpec key;\n    private final SecureRandom random = new SecureRandom();',purpose:"AES-GCM 凭据加密与密钥派生。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"CryptoUtil",kind:"方法 / 函数",startLine:37,endLine:45,code:'public CryptoUtil(@Value("${XWSSH_CRYPTO_KEY:}") String rawKey) {\n        if (rawKey == null || rawKey.isBlank()) {\n            // 没配密钥时退到开发默认值，仅保证能跑；生产务必设 XWSSH_CRYPTO_KEY\n            rawKey = "xwssh-dev-default-key-change-me";\n            log.warn("未设置环境变量 XWSSH_CRYPTO_KEY，主机密码用开发默认密钥加密，生产环境请务必配置！");\n        }\n        // 任意长度的密钥串经 SHA-256 派生成固定 32 字节，得到 AES-256 密钥\n        this.key = new SecretKeySpec(sha256(rawKey), "AES");\n    }',purpose:"实现“CryptoUtil”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"encrypt",kind:"方法 / 函数",startLine:47,endLine:64,code:'/** 加密：明文 → Base64(iv + 密文 + tag)。入参为空返回 null。 */\n    public String encrypt(String plain) {\n        if (plain == null || plain.isEmpty()) return null;\n        try {\n            byte[] iv = new byte[IV_LEN];\n            random.nextBytes(iv);\n            Cipher cipher = Cipher.getInstance(ALGO);\n            cipher.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(TAG_BITS, iv));\n            byte[] ct = cipher.doFinal(plain.getBytes(StandardCharsets.UTF_8));\n            // iv 拼在密文前一起 Base64\n            byte[] out = new byte[iv.length + ct.length];\n            System.arraycopy(iv, 0, out, 0, iv.length);\n            System.arraycopy(ct, 0, out, iv.length, ct.length);\n            return Base64.getEncoder().encodeToString(out);\n        } catch (Exception e) {\n            throw new IllegalStateException("密码加密失败", e);\n        }\n    }',purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"decrypt",kind:"方法 / 函数",startLine:66,endLine:80,code:'/** 解密：Base64(iv + 密文 + tag) → 明文。入参为空返回 null。 */\n    public String decrypt(String enc) {\n        if (enc == null || enc.isEmpty()) return null;\n        try {\n            byte[] all = Base64.getDecoder().decode(enc);\n            byte[] iv = new byte[IV_LEN];\n            System.arraycopy(all, 0, iv, 0, IV_LEN);\n            Cipher cipher = Cipher.getInstance(ALGO);\n            cipher.init(Cipher.DECRYPT_MODE, key, new GCMParameterSpec(TAG_BITS, iv));\n            byte[] plain = cipher.doFinal(all, IV_LEN, all.length - IV_LEN);\n            return new String(plain, StandardCharsets.UTF_8);\n        } catch (Exception e) {\n            throw new IllegalStateException("密码解密失败（密钥变更或密文损坏）", e);\n        }\n    }',purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"sha256",kind:"方法 / 函数",startLine:82,endLine:88,code:'private static byte[] sha256(String s) {\n        try {\n            return MessageDigest.getInstance("SHA-256").digest(s.getBytes(StandardCharsets.UTF_8));\n        } catch (Exception e) {\n            throw new IllegalStateException(e);\n        }\n    }',purpose:"处理敏感凭据：派生密钥并使用 AES-GCM 加解密。",steps:["捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"src/main/java/com/lowenssh/persistence/AuditService.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:64,order:12,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:20,endLine:25,code:"/**\n * 审计服务 —— 每条命令落一笔 t_audit，可追溯。Agent 安全卖点的证据链。\n *\n * 记两类：\n *  - 已执行：命令真落到服务器、带 stdout/stderr/exitCode（{@link #logExecuted}）\n *  - 被拦截：deny 拒掉 / ask 被拒，没执行、无结果（{@link #logBlocked}）\n *\n * 铁律：审计失败绝不能拖垮主任务。所有写库 try/catch 兜住，只记日志不抛。\n */\n@Service\npublic class AuditService {\n\n    private static final Logger log = LoggerFactory.getLogger(AuditService.class);\n\n    private final AuditMapper auditMapper;",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"AuditService",kind:"方法 / 函数",startLine:26,endLine:28,code:"public AuditService(AuditMapper auditMapper) {\n        this.auditMapper = auditMapper;\n    }",purpose:"实现“AuditService”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"logExecuted",kind:"方法 / 函数",startLine:30,endLine:42,code:"/** 记录一条已执行的命令（带执行结果） */\n    public void logExecuted(Long sessionId, String command, ExecResult result,\n                            boolean dangerous, boolean confirmed) {\n        AuditEntity e = new AuditEntity();\n        e.setSessionId(sessionId);\n        e.setCommand(command);\n        e.setStdout(result.stdout());\n        e.setStderr(result.stderr());\n        e.setExitCode(result.exitCode());\n        e.setDangerous(dangerous);\n        e.setConfirmed(confirmed);\n        save(e);\n    }",purpose:"记录命令执行或安全拦截事件，形成可追溯审计。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"logBlocked",kind:"方法 / 函数",startLine:44,endLine:53,code:"/** 记录一条被门禁拦截 / 用户拒绝的命令（未执行，exitCode 留空，原因记进 stderr） */\n    public void logBlocked(Long sessionId, String command, boolean dangerous, String reason) {\n        AuditEntity e = new AuditEntity();\n        e.setSessionId(sessionId);\n        e.setCommand(command);\n        e.setStderr(reason);          // 拦截原因借 stderr 字段存，便于审计查阅\n        e.setDangerous(dangerous);\n        e.setConfirmed(false);        // 被拦截 = 未经确认放行\n        save(e);\n    }",purpose:"记录命令执行或安全拦截事件，形成可追溯审计。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"save",kind:"方法 / 函数",startLine:55,endLine:62,code:'private void save(AuditEntity e) {\n        try {\n            auditMapper.insert(e);\n        } catch (Exception ex) {\n            // 审计写库失败不影响主流程，只告警\n            log.warn("审计写库失败 command={}: {}", e.getCommand(), ex.getMessage());\n        }\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"src/main/java/com/lowenssh/persistence/MessageService.java",layer:"Java 后端",summary:"对话持久化及 Spring AI 消息对象重建",lineCount:253,order:12,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:27,endLine:33,code:"/**\n * 对话消息服务 —— 把 agentic loop 的每轮消息落 t_message，按 session_id 可还原完整对话。\n *\n * 不落 system prompt：它每次固定，捞历史时代码里加回去即可，存了是冗余。\n *\n * 铁律同 AuditService：落库失败绝不能拖垮主任务，写库 try/catch 兜住，只告警不抛。\n */\n@Service\npublic class MessageService {\n\n    private static final Logger log = LoggerFactory.getLogger(MessageService.class);\n\n    private final MessageMapper messageMapper;\n    private final ObjectMapper objectMapper = new ObjectMapper();",purpose:"对话持久化及 Spring AI 消息对象重建。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"MessageService",kind:"方法 / 函数",startLine:34,endLine:36,code:"public MessageService(MessageMapper messageMapper) {\n        this.messageMapper = messageMapper;\n    }",purpose:"实现“MessageService”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"saveUser",kind:"方法 / 函数",startLine:38,endLine:45,code:'/** 落一条用户消息（loop 开始时的 task） */\n    public void saveUser(Long sessionId, String content) {\n        MessageEntity e = new MessageEntity();\n        e.setSessionId(sessionId);\n        e.setRole("user");\n        e.setContent(content);\n        save(e);\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"saveAssistant",kind:"方法 / 函数",startLine:47,endLine:59,code:'/**\n     * 落一条 assistant 消息。\n     * @param content    模型的文字回复（可能为空，纯工具调用时）\n     * @param toolCalls  本轮发起的工具调用 JSON（无则传 null）\n     */\n    public void saveAssistant(Long sessionId, String content, String toolCalls) {\n        MessageEntity e = new MessageEntity();\n        e.setSessionId(sessionId);\n        e.setRole("assistant");\n        e.setContent(content);\n        e.setToolCalls(toolCalls);\n        save(e);\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"saveToolResult",kind:"方法 / 函数",startLine:61,endLine:73,code:'/**\n     * 落一条工具结果消息（含被门禁拒绝的"拒绝结果"，这样历史能还原"模型想跑啥被拦了"）。\n     * @param toolCallId 对应的工具调用 id\n     * @param content    工具返回内容 / 拒绝原因\n     */\n    public void saveToolResult(Long sessionId, String toolCallId, String content) {\n        MessageEntity e = new MessageEntity();\n        e.setSessionId(sessionId);\n        e.setRole("tool");\n        e.setToolCallId(toolCallId);\n        e.setContent(content);\n        save(e);\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"save",kind:"方法 / 函数",startLine:75,endLine:82,code:'private void save(MessageEntity e) {\n        try {\n            messageMapper.insert(e);\n        } catch (Exception ex) {\n            // 落库失败不影响主流程，只告警\n            log.warn("消息写库失败 sessionId={} role={}: {}", e.getSessionId(), e.getRole(), ex.getMessage());\n        }\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"loadHistory",kind:"方法 / 函数",startLine:84,endLine:137,code:'/**\n     * 按 sessionId 还原历史对话为 Spring AI 的 Message 列表（供多轮续聊回灌给模型）。\n     *\n     * 不含 system prompt（捞回去由 AgentService 自己加）。还原规则：\n     *  - user  -> UserMessage\n     *  - assistant -> AssistantMessage（带 tool_calls 反序列化，id/name 必须和后续 tool 结果配对）\n     *  - tool  -> ToolResponseMessage；同一轮可能有多条 tool 行，连续的 tool 合并进一个\n     *            ToolResponseMessage，符合 OpenAI 协议「一个 assistant.tool_calls 对应一组 tool 结果」\n     *\n     * 任一条解析失败只跳过该条，不拖垮续聊。\n     */\n    public List<Message> loadHistory(Long sessionId) {\n        List<Message> messages = new ArrayList<>();\n        if (sessionId == null) {\n            return messages;\n        }\n\n        List<MessageEntity> rows;\n        try {\n            LambdaQueryWrapper<MessageEntity> wrapper = new LambdaQueryWrapper<MessageEntity>()\n                    .eq(MessageEntity::getSessionId, sessionId)\n                    .orderByAsc(MessageEntity::getId);  // 按落库顺序还原\n            rows = messageMapper.selectList(wrapper);\n        } catch (Exception ex) {\n            log.warn("加载历史失败 sessionId={}: {}", sessionId, ex.getMessage());\n            return messages;\n        }\n\n        // 连续的 tool 行要合并成一个 ToolResponseMessage，先攒着，遇到非 tool 行再 flush\n        List<ToolResponseMessage.ToolResponse> pendingTool = new ArrayList<>();\n\n        for (MessageEntity row : rows) {\n            String role = row.getRole();\n            if ("tool".equals(role)) {\n                // 工具结果先攒进 pending，name 历史没单独存，回灌不影响模型理解，用占位即可\n                pendingTool.add(new ToolResponseMessage.ToolResponse(\n                        row.getToolCallId(), "", nullToEmpty(row.getContent())));\n                continue;\n            }\n\n            // 遇到非 tool 行，先把攒着的工具结果 flush 成一条 ToolResponseMessage\n            flushTool(messages, pendingTool);\n\n            switch (role) {\n                case "user" -> messages.add(new UserMessage(nullToEmpty(row.getContent())));\n                case "assistant" -> messages.add(toAssistant(row));\n                default -> { /* system 等不还原 */ }\n            }\n        }\n        // 收尾 flush（历史以工具结果结尾的情况）\n        flushTool(messages, pendingTool);\n\n        return messages;\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","读写持久化状态，使会话、配置或审计能够恢复。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"loadHistoryForView",kind:"方法 / 函数",startLine:139,endLine:188,code:'/**\n     * 按 sessionId 把历史转成前端可直接渲染的消息列表（左栏点开旧会话回看用）。\n     *\n     * 与 loadHistory 不同：这里不是回灌给模型，而是给人看，所以：\n     *  - user      -> {type:user, text}\n     *  - assistant -> 文字非空时产出 {type:assistant, text}；带 tool_calls 时每个调用\n     *                 额外产出一条 {type:tool_call, name, summary=命令}（从 arguments 提取 command）\n     *  - tool      -> {type:tool_result, summary=结果内容}\n     *\n     * 任一条解析失败只跳过该条，不影响整体回看。\n     */\n    public List<com.lowenssh.agent.SessionDto.HistoryMessage> loadHistoryForView(Long sessionId) {\n        List<com.lowenssh.agent.SessionDto.HistoryMessage> out = new ArrayList<>();\n        if (sessionId == null) {\n            return out;\n        }\n\n        List<MessageEntity> rows;\n        try {\n            LambdaQueryWrapper<MessageEntity> wrapper = new LambdaQueryWrapper<MessageEntity>()\n                    .eq(MessageEntity::getSessionId, sessionId)\n                    .orderByAsc(MessageEntity::getId);\n            rows = messageMapper.selectList(wrapper);\n        } catch (Exception ex) {\n            log.warn("回看历史失败 sessionId={}: {}", sessionId, ex.getMessage());\n            return out;\n        }\n\n        for (MessageEntity row : rows) {\n            String role = row.getRole();\n            switch (role == null ? "" : role) {\n                case "user" -> out.add(new com.lowenssh.agent.SessionDto.HistoryMessage(\n                        "user", nullToEmpty(row.getContent()), null, null));\n                case "assistant" -> {\n                    // 文字部分（纯工具调用时为空，不产出空气泡）\n                    String text = nullToEmpty(row.getContent());\n                    if (!text.isBlank()) {\n                        out.add(new com.lowenssh.agent.SessionDto.HistoryMessage(\n                                "assistant", text, null, null));\n                    }\n                    // 工具调用部分：每个 call 转一条 tool_call，展示命令\n                    appendToolCalls(out, row.getToolCalls());\n                }\n                case "tool" -> out.add(new com.lowenssh.agent.SessionDto.HistoryMessage(\n                        "tool_result", null, null, nullToEmpty(row.getContent())));\n                default -> { /* system 等不回看 */ }\n            }\n        }\n        return out;\n    }',purpose:"持久化或重建对话消息，维持多轮会话与历史回看的连续性。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","读写持久化状态，使会话、配置或审计能够恢复。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"appendToolCalls",kind:"方法 / 函数",startLine:190,endLine:205,code:'/** 解析 assistant 的 tool_calls JSON，每个调用产出一条 tool_call 历史项（命令从 arguments 提取） */\n    private void appendToolCalls(List<com.lowenssh.agent.SessionDto.HistoryMessage> out, String toolCallsJson) {\n        if (toolCallsJson == null || toolCallsJson.isBlank()) {\n            return;\n        }\n        try {\n            List<AssistantMessage.ToolCall> calls = objectMapper.readValue(\n                    toolCallsJson, new TypeReference<List<AssistantMessage.ToolCall>>() {});\n            for (AssistantMessage.ToolCall call : calls) {\n                out.add(new com.lowenssh.agent.SessionDto.HistoryMessage(\n                        "tool_call", null, call.name(), extractCommand(call.arguments())));\n            }\n        } catch (Exception ex) {\n            log.warn("回看解析 tool_calls 失败: {}", ex.getMessage());\n        }\n    }',purpose:"封装“appendToolCalls”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"extractCommand",kind:"方法 / 函数",startLine:207,endLine:221,code:'/** 从工具参数 JSON 里取 command 字段；取不到就原样返回 */\n    private String extractCommand(String arguments) {\n        if (arguments == null || arguments.isBlank()) {\n            return "";\n        }\n        try {\n            var node = objectMapper.readTree(arguments);\n            if (node.has("command")) {\n                return node.get("command").asText();\n            }\n        } catch (Exception ignored) {\n            // 解析失败原样返回\n        }\n        return arguments;\n    }',purpose:"封装“extractCommand”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"flushTool",kind:"方法 / 函数",startLine:223,endLine:229,code:"/** 把攒着的工具结果合并成一条 ToolResponseMessage 加入历史，并清空缓冲 */\n    private void flushTool(List<Message> messages, List<ToolResponseMessage.ToolResponse> pending) {\n        if (!pending.isEmpty()) {\n            messages.add(ToolResponseMessage.builder().responses(new ArrayList<>(pending)).build());\n            pending.clear();\n        }\n    }",purpose:"实现“flushTool”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"toAssistant",kind:"方法 / 函数",startLine:231,endLine:247,code:'/** 还原一条 assistant 消息：文字 + tool_calls（JSON 反序列化回 ToolCall 列表） */\n    private AssistantMessage toAssistant(MessageEntity row) {\n        String content = nullToEmpty(row.getContent());\n        String toolCallsJson = row.getToolCalls();\n        if (toolCallsJson == null || toolCallsJson.isBlank()) {\n            return new AssistantMessage(content);\n        }\n        try {\n            List<AssistantMessage.ToolCall> calls = objectMapper.readValue(\n                    toolCallsJson, new TypeReference<List<AssistantMessage.ToolCall>>() {});\n            return AssistantMessage.builder().content(content).toolCalls(calls).build();\n        } catch (Exception ex) {\n            // 反序列化失败：退化成纯文字 assistant，至少保住对话连续性\n            log.warn("还原 tool_calls 失败，退化为纯文字 sessionId={}: {}", row.getSessionId(), ex.getMessage());\n            return new AssistantMessage(content);\n        }\n    }',purpose:"封装“toAssistant”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"nullToEmpty",kind:"方法 / 函数",startLine:249,endLine:251,code:'private static String nullToEmpty(String s) {\n        return s == null ? "" : s;\n    }',purpose:"封装“nullToEmpty”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/test/java/com/lowenssh/persistence/MessageServiceTest.java",layer:"Java 测试",summary:"对话持久化及 Spring AI 消息对象重建",lineCount:120,order:12,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:24,endLine:25,code:"/**\n * MessageService.loadHistory 单测 —— 多轮对话的核心：把 t_message 还原成\n * Spring AI 的 Message 列表，再回灌给模型。这里重点验证还原规则正确。\n */\nclass MessageServiceTest {",purpose:"对话持久化及 Spring AI 消息对象重建。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"row",kind:"方法 / 函数",startLine:26,endLine:34,code:"/** 造一条 MessageEntity 行 */\n    private MessageEntity row(String role, String content, String toolCalls, String toolCallId) {\n        MessageEntity e = new MessageEntity();\n        e.setRole(role);\n        e.setContent(content);\n        e.setToolCalls(toolCalls);\n        e.setToolCallId(toolCallId);\n        return e;\n    }",purpose:"测试场景“row”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"serviceReturning",kind:"方法 / 函数",startLine:36,endLine:41,code:'@SuppressWarnings("unchecked")\n    private MessageService serviceReturning(List<MessageEntity> rows) {\n        MessageMapper mapper = mock(MessageMapper.class);\n        when(mapper.selectList(any())).thenReturn(rows);\n        return new MessageService(mapper);\n    }',purpose:"测试场景“serviceReturning”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/persistence/SchemaInitializer.java",layer:"Java 后端",summary:"数据库幂等初始化与轻量迁移",lineCount:144,order:13,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:24,endLine:28,code:"/**\n * 启动时自动建表 + 轻量迁移 —— 让首次部署 / 升级无需手动跑 schema.sql。\n *\n * 做两件事（都幂等，重复启动安全）：\n *  1. CREATE TABLE IF NOT EXISTS：建齐 t_host / t_session / t_message / t_audit。\n *  2. 给 t_session 补 host_id 列（老库没有），并把历史会话按 host/port/user 去重，\n *     自动生成对应主机、回填 host_id —— 老对话不丢，能归到主机簿对应主机下。\n *\n * 为什么不用 Flyway：项目刻意保持轻量（无额外依赖），迁移逻辑简单，手写幂等 SQL 够用。\n * 用 JdbcTemplate 直接执行 DDL；列是否存在查 information_schema，避开 MySQL\n * 不支持「ADD COLUMN IF NOT EXISTS」的问题。\n */\n@Component\npublic class SchemaInitializer {\n\n    private static final Logger log = LoggerFactory.getLogger(SchemaInitializer.class);\n    private final JdbcTemplate jdbc;",purpose:"数据库幂等初始化与轻量迁移。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"SchemaInitializer",kind:"方法 / 函数",startLine:29,endLine:31,code:"public SchemaInitializer(DataSource dataSource) {\n        this.jdbc = new JdbcTemplate(dataSource);\n    }",purpose:"实现“SchemaInitializer”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"init",kind:"方法 / 函数",startLine:33,endLine:37,code:"@jakarta.annotation.PostConstruct\n    public void init() {\n        createTables();\n        migrateSessionHostId();\n    }",purpose:"初始化或迁移数据库结构，保证新旧环境均可启动。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"createTables",kind:"方法 / 函数",startLine:39,endLine:96,code:'/** 建齐所有表（幂等） */\n    private void createTables() {\n        jdbc.execute("""\n            CREATE TABLE IF NOT EXISTS t_host (\n                id           BIGINT       NOT NULL AUTO_INCREMENT,\n                alias        VARCHAR(128)          DEFAULT NULL,\n                ssh_host     VARCHAR(128) NOT NULL,\n                ssh_port     INT                   DEFAULT 22,\n                ssh_user     VARCHAR(64)  NOT NULL,\n                password_enc VARCHAR(512)          DEFAULT NULL,\n                created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                updated_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n                PRIMARY KEY (id)\n            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT=\'主机簿\'\n            """);\n        jdbc.execute("""\n            CREATE TABLE IF NOT EXISTS t_session (\n                id           BIGINT       NOT NULL AUTO_INCREMENT,\n                host_id      BIGINT                DEFAULT NULL,\n                title        VARCHAR(255)          DEFAULT NULL,\n                ssh_host     VARCHAR(128)          DEFAULT NULL,\n                ssh_port     INT                   DEFAULT 22,\n                ssh_user     VARCHAR(64)           DEFAULT NULL,\n                created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                updated_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n                PRIMARY KEY (id),\n                KEY idx_host (host_id)\n            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT=\'会话\'\n            """);\n        jdbc.execute("""\n            CREATE TABLE IF NOT EXISTS t_message (\n                id           BIGINT       NOT NULL AUTO_INCREMENT,\n                session_id   BIGINT       NOT NULL,\n                role         VARCHAR(16)  NOT NULL,\n                content      MEDIUMTEXT            DEFAULT NULL,\n                tool_calls   MEDIUMTEXT            DEFAULT NULL,\n                tool_call_id VARCHAR(64)           DEFAULT NULL,\n                created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                PRIMARY KEY (id),\n                KEY idx_session (session_id)\n            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT=\'对话消息\'\n            """);\n        jdbc.execute("""\n            CREATE TABLE IF NOT EXISTS t_audit (\n                id           BIGINT       NOT NULL AUTO_INCREMENT,\n                session_id   BIGINT       NOT NULL,\n                command      TEXT         NOT NULL,\n                stdout       MEDIUMTEXT            DEFAULT NULL,\n                stderr       MEDIUMTEXT            DEFAULT NULL,\n                exit_code    INT                   DEFAULT NULL,\n                dangerous    TINYINT      NOT NULL DEFAULT 0,\n                confirmed    TINYINT      NOT NULL DEFAULT 0,\n                created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                PRIMARY KEY (id),\n                KEY idx_session (session_id)\n            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT=\'命令执行审计\'\n            """);\n    }',purpose:"初始化或迁移数据库结构，保证新旧环境均可启动。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:[],risks:[]},{name:"migrateSessionHostId",kind:"方法 / 函数",startLine:98,endLine:133,code:'/**\n     * 给 t_session 补 host_id 列并迁移老数据。\n     * 仅当列不存在时执行加列 + 迁移，已迁移过的库再启动是空操作。\n     */\n    private void migrateSessionHostId() {\n        if (columnExists("t_session", "host_id")) {\n            return;  // 新库建表时已带 host_id，或已迁移过，跳过\n        }\n        log.info("检测到老版 t_session 无 host_id 列，开始迁移历史会话到主机簿…");\n        jdbc.execute("ALTER TABLE t_session ADD COLUMN host_id BIGINT DEFAULT NULL AFTER id");\n        jdbc.execute("ALTER TABLE t_session ADD KEY idx_host (host_id)");\n\n        // 把历史会话里出现过的 (host,port,user) 去重，每组生成一台主机\n        List<java.util.Map<String, Object>> groups = jdbc.queryForList("""\n            SELECT ssh_host, ssh_port, ssh_user\n            FROM t_session\n            WHERE ssh_host IS NOT NULL\n            GROUP BY ssh_host, ssh_port, ssh_user\n            """);\n        int migrated = 0;\n        for (var g : groups) {\n            String host = (String) g.get("ssh_host");\n            Integer port = g.get("ssh_port") == null ? 22 : ((Number) g.get("ssh_port")).intValue();\n            String user = (String) g.get("ssh_user");\n            // 老会话没存密码，迁移出的主机 password_enc 留空，首次连接时让用户补填\n            jdbc.update("INSERT INTO t_host (alias, ssh_host, ssh_port, ssh_user) VALUES (?,?,?,?)",\n                    null, host, port, user);\n            Long hostId = jdbc.queryForObject("SELECT LAST_INSERT_ID()", Long.class);\n            jdbc.update("""\n                UPDATE t_session SET host_id = ?\n                WHERE ssh_host = ? AND ssh_port = ? AND ssh_user = ?\n                """, hostId, host, port, user);\n            migrated++;\n        }\n        log.info("历史会话迁移完成，自动生成主机 {} 台", migrated);\n    }',purpose:"初始化或迁移数据库结构，保证新旧环境均可启动。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"columnExists",kind:"方法 / 函数",startLine:135,endLine:142,code:'/** 查 information_schema 判断列是否存在 */\n    private boolean columnExists(String table, String column) {\n        Integer cnt = jdbc.queryForObject("""\n            SELECT COUNT(*) FROM information_schema.COLUMNS\n            WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ? AND COLUMN_NAME = ?\n            """, Integer.class, table, column);\n        return cnt != null && cnt > 0;\n    }',purpose:"封装“columnExists”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/resources/schema.sql",layer:"后端配置",summary:"MySQL 表结构、索引与字段语义",lineCount:59,order:13,logicBlocks:[{name:"SQL 1",kind:"数据库结构",startLine:1,endLine:1,code:"-- LowenSSH 建表 SQL（手动执行：mysql -u root -p lowenssh < schema.sql）\n-- 库已建：CREATE DATABASE lowenssh DEFAULT CHARACTER SET utf8mb4;",purpose:"执行数据库结构迁移或数据更新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["结构设计围绕主机、会话、消息和审计四个核心实体展开。"],risks:[]},{name:"SQL 2",kind:"数据库结构",startLine:1,endLine:1,code:"-- 注：应用启动时 SchemaInitializer 会自动跑这些建表/加列，平时无需手动执行此文件。\n\n-- 主机表：主机簿里的一台常用服务器，password_enc 存 AES-GCM 密文\nCREATE TABLE IF NOT EXISTS t_host (\n    id           BIGINT       NOT NULL AUTO_INCREMENT COMMENT '主键',\n    alias        VARCHAR(128)          DEFAULT NULL COMMENT '主机别名',\n    ssh_host     VARCHAR(128) NOT NULL COMMENT '目标服务器 host',\n    ssh_port     INT                   DEFAULT 22   COMMENT '端口',\n    ssh_user     VARCHAR(64)  NOT NULL COMMENT 'SSH 用户名',\n    password_enc VARCHAR(512)          DEFAULT NULL COMMENT 'SSH 密码密文（AES-GCM）',\n    created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',\n    updated_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',\n    PRIMARY KEY (id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='主机簿';",purpose:"定义一张业务表、字段约束和查询索引。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:["结构设计围绕主机、会话、消息和审计四个核心实体展开。"],risks:[]},{name:"SQL 3",kind:"数据库结构",startLine:1,endLine:1,code:"-- 会话表：一次对话 = 一个 session，绑定一台目标服务器（host_id 关联 t_host）\nCREATE TABLE IF NOT EXISTS t_session (\n    id           BIGINT       NOT NULL AUTO_INCREMENT COMMENT '主键',\n    host_id      BIGINT                DEFAULT NULL COMMENT '所属主机 t_host.id',\n    title        VARCHAR(255)          DEFAULT NULL COMMENT '会话标题',\n    ssh_host     VARCHAR(128)          DEFAULT NULL COMMENT '目标服务器 host',\n    ssh_port     INT                   DEFAULT 22   COMMENT '目标服务器端口',\n    ssh_user     VARCHAR(64)           DEFAULT NULL COMMENT 'SSH 用户名',\n    created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',\n    updated_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP COMMENT '更新时间',\n    PRIMARY KEY (id),\n    KEY idx_host (host_id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='会话';",purpose:"定义一张业务表、字段约束和查询索引。",steps:["读写持久化状态，使会话、配置或审计能够恢复。"],designNotes:["结构设计围绕主机、会话、消息和审计四个核心实体展开。"],risks:[]},{name:"SQL 4",kind:"数据库结构",startLine:1,endLine:1,code:"-- 消息表：对话历史，agentic loop 的上下文来源\nCREATE TABLE IF NOT EXISTS t_message (\n    id           BIGINT       NOT NULL AUTO_INCREMENT COMMENT '主键',\n    session_id   BIGINT       NOT NULL COMMENT '所属会话',\n    role         VARCHAR(16)  NOT NULL COMMENT '角色: user/assistant/tool/system',\n    content      MEDIUMTEXT            DEFAULT NULL COMMENT '消息内容',\n    tool_calls   MEDIUMTEXT            DEFAULT NULL COMMENT '工具调用 JSON（assistant 发起时）',\n    tool_call_id VARCHAR(64)           DEFAULT NULL COMMENT '工具结果对应的调用 id（role=tool 时）',\n    created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',\n    PRIMARY KEY (id),\n    KEY idx_session (session_id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='对话消息';",purpose:"定义一张业务表、字段约束和查询索引。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["结构设计围绕主机、会话、消息和审计四个核心实体展开。"],risks:[]},{name:"SQL 5",kind:"数据库结构",startLine:1,endLine:1,code:"-- 审计表：每条实际执行的命令都记一笔，可追溯\nCREATE TABLE IF NOT EXISTS t_audit (\n    id           BIGINT       NOT NULL AUTO_INCREMENT COMMENT '主键',\n    session_id   BIGINT       NOT NULL COMMENT '所属会话',\n    command      TEXT         NOT NULL COMMENT '执行的命令',\n    stdout       MEDIUMTEXT            DEFAULT NULL COMMENT '标准输出',\n    stderr       MEDIUMTEXT            DEFAULT NULL COMMENT '错误输出',\n    exit_code    INT                   DEFAULT NULL COMMENT '退出码',\n    dangerous    TINYINT      NOT NULL DEFAULT 0 COMMENT '是否危险命令: 0否 1是',\n    confirmed    TINYINT      NOT NULL DEFAULT 0 COMMENT '是否经人工确认: 0否 1是',\n    created_at   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '执行时间',\n    PRIMARY KEY (id),\n    KEY idx_session (session_id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='命令执行审计';",purpose:"定义一张业务表、字段约束和查询索引。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["结构设计围绕主机、会话、消息和审计四个核心实体展开。"],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/AgentEvent.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:56,order:14,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:13,endLine:56,code:'/**\n * Agent 事件 —— 对外流式输出的带类型事件流。\n *\n * 为什么用带类型事件而不是纯 Flux<String>：运维 Agent 的输出有多种语义——\n * 模型在说话、模型要调命令、命令出结果、命令被拦、任务完成。前端要据此区别渲染\n * （token 追加、工具调用展开、拦截高亮、完成收尾）。纯字符串流分不出这些。\n *\n * sealed + record（Java 17）：限定子类集合，消费方 switch 表达式时编译器保证穷尽，\n * 加事件类型不会漏处理。\n */\npublic sealed interface AgentEvent {\n\n    /** 会话就绪：首轮建会话后回传 sessionId，前端存下来用于后续多轮续聊 */\n    record SessionReady(Long sessionId) implements AgentEvent {}\n\n    /** 模型增量输出的一段文本 token */\n    record Token(String text) implements AgentEvent {}\n\n    /** 模型的思考过程增量（GLM reasoning_content），前端实时展示"在想什么" */\n    record Reasoning(String text) implements AgentEvent {}\n\n    /** 模型决定调用某个工具 */\n    record ToolCall(String name, String args) implements AgentEvent {}\n\n    /** 工具执行结果（executed=false 表示被拦截/拒绝，未真正执行） */\n    record ToolResult(String name, String summary, boolean executed) implements AgentEvent {}\n\n    /** 命令被安全门禁拦截 / 用户拒绝 */\n    record Blocked(String command, String reason) implements AgentEvent {}\n\n    /** 任务完成，带最终结论文本 */\n    record Done(String finalText) implements AgentEvent {}\n\n    /** 出错 */\n    record Error(String message) implements AgentEvent {}\n\n    /** 续聊时常驻连接已被回收/不存在：前端据此锁输入并切到断线态，提示开新会话重连 */\n    record SessionExpired(Long sessionId, String message) implements AgentEvent {}\n\n    /** 事件类型名，用作 SSE 的 event 字段，方便前端按类型监听 */\n    default String type() {\n        if (this instanceof SessionReady) return "session_ready";\n        if (this instanceof Token) return "token";\n        if (this instanceof Reasoning) return "reasoning";\n        if (this instanceof ToolCall) return "tool_call";\n        if (this instanceof ToolResult) return "tool_result";\n        if (this instanceof Blocked) return "blocked";\n        if (this instanceof Done) return "done";\n        if (this instanceof Error) return "error";\n        if (this instanceof SessionExpired) return "session_expired";\n        return "unknown";\n    }\n}',purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/HostDto.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:27,order:14,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:6,endLine:7,code:"/**\n * 主机簿相关 DTO。密码绝不出现在响应里（只在 connect 入参里临时补填）。\n */\npublic final class HostDto {",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"HostDto",kind:"方法 / 函数",startLine:8,endLine:9,code:"private HostDto() {\n    }",purpose:"实现“HostDto”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/SessionDto.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:30,order:14,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:9,endLine:10,code:"/**\n * 左侧历史栏用的只读 DTO 集合。\n * 这些接口只查库 + 查常驻连接状态，不碰 SSH 执行，给前端会话列表/历史回看用。\n */\npublic final class SessionDto {",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"SessionDto",kind:"方法 / 函数",startLine:11,endLine:12,code:"private SessionDto() {\n    }",purpose:"实现“SessionDto”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/persistence/entity/AuditEntity.java",layer:"Java 后端",summary:"MyBatis-Plus 数据实体：映射数据库表字段",lineCount:30,order:14,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:16,endLine:30,code:'/**\n * 命令执行审计实体 —— 对应 t_audit\n * 每条实际下发到服务器的命令都落一笔，可追溯（危险命令、是否人工确认）\n */\n@Data\n@TableName("t_audit")\npublic class AuditEntity {\n\n    @TableId(type = IdType.AUTO)\n    private Long id;\n\n    private Long sessionId;\n    private String command;\n    private String stdout;\n    private String stderr;\n    private Integer exitCode;\n    private Boolean dangerous;   // TINYINT 0/1 自动映射 Boolean\n    private Boolean confirmed;\n    private LocalDateTime createdAt;\n}',purpose:"MyBatis-Plus 数据实体：映射数据库表字段。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]}]},{path:"src/main/java/com/lowenssh/persistence/entity/HostEntity.java",layer:"Java 后端",summary:"MyBatis-Plus 数据实体：映射数据库表字段",lineCount:34,order:14,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:21,endLine:34,code:'/**\n * 主机实体 —— 对应 t_host，主机簿里的一台常用服务器。\n *\n * 与 t_session 的关系：一台主机下可有多个历史会话（session.host_id 外键关联），\n * 进入某主机后只看该主机的会话历史（按主机隔离）。\n *\n * passwordEnc 存的是 AES-GCM 密文（CryptoUtil 加密），绝不存明文；\n * 对外 DTO 也不回传密码，只在 connect 时解密用一次。\n */\n@Data\n@TableName("t_host")\npublic class HostEntity {\n\n    @TableId(type = IdType.AUTO)\n    private Long id;\n\n    private String alias;        // 用户起的别名，如「京东云」，可空\n    private String sshHost;      // 驼峰自动映射下划线 ssh_host\n    private
