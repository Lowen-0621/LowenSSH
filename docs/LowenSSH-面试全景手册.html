,risks:[]},{name:"FilledButton",kind:"方法 / 函数",startLine:128,endLine:206,code:"FilledButton(\n          onPressed: onOk,\n          style: FilledButton.styleFrom(\n              backgroundColor: AppColors.blue,\n              foregroundColor: AppColors.crust),\n          child: Text(okLabel ?? l.t('common.save')),\n        ),\n      ],\n    );\n\n/// 新建主机对话框\nFuture<void> showAddHostDialog(BuildContext context, WidgetRef ref) {\n  final alias = TextEditingController();\n  final host = TextEditingController();\n  final port = TextEditingController(text: '22');\n  final user = TextEditingController(text: 'root');\n  final pwd = TextEditingController();\n  // 认证方式：password / key\n  String authMode = 'password';\n  String? selectedKeyId;\n  final keys = ref.read(keyProvider);\n  final l = ref.watch(l10nProvider);\n\n  return _showDark(\n    context,\n    StatefulBuilder(\n      builder: (ctx, setState) => Column(\n        mainAxisSize: MainAxisSize.min,\n        crossAxisAlignment: CrossAxisAlignment.stretch,\n        children: [\n          _title(Icons.dns_outlined, l.t('host.new')),\n          _field(alias, l.t('host.alias'), hint: 'web01'),\n          _field(host, l.t('host.address'), hint: l.t('host.addressHint')),\n          _field(port, l.t('host.port'), hint: '22'),\n          _field(user, l.t('host.user'), hint: 'root'),\n          // 认证方式切换\n          Padding(\n            padding: const EdgeInsets.only(bottom: 4),\n            child: Text(l.t('host.authMode'),\n                style: TextStyle(fontSize: 11, color: AppColors.subtext)),\n          ),\n          Row(\n            children: [\n              _authTab('password', l.t('host.password'), authMode,\n                  () => setState(() => authMode = 'password')),\n              const SizedBox(width: 8),\n              _authTab('key', l.t('host.key'), authMode,\n                  () => setState(() => authMode = 'key')),\n            ],\n          ),\n          const SizedBox(height: 12),\n          // 密码模式：密码框；密钥模式：密钥下拉\n          if (authMode == 'password')\n            _field(pwd, l.t('host.password'), obscure: true)\n          else\n            _keyDropdown(l, keys, selectedKeyId,\n                (id) => setState(() => selectedKeyId = id)),\n          const SizedBox(height: 4),\n          _actions(ctx, l, okLabel: l.t('common.add'), onOk: () {\n            if (host.text.trim().isEmpty) return;\n            // 密钥模式必须选中一把密钥\n            if (authMode == 'key' && selectedKeyId == null) return;\n            ref.read(configProvider.notifier).addHostEntry(\n                  alias: alias.text.trim().isEmpty ? null : alias.text.trim(),\n                  host: host.text.trim(),\n                  port: int.tryParse(port.text.trim()) ?? 22,\n                  user: user.text.trim().isEmpty ? 'root' : user.text.trim(),\n                  password: authMode == 'password' && pwd.text.isNotEmpty\n                      ? pwd.text\n                      : null,\n                  keyId: authMode == 'key' ? selectedKeyId : null,\n                );\n            Navigator.pop(ctx);\n          }),\n        ],\n      ),\n    ),\n  );\n}",purpose:"交互方法“FilledButton”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_authTab",kind:"方法 / 函数",startLine:208,endLine:209,code:"// 认证方式切换标签\nWidget _authTab(String id, String label, String current, VoidCallback onTap) =>",purpose:"交互方法“_authTab”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_keyDropdown",kind:"方法 / 函数",startLine:234,endLine:282,code:"// 密钥下拉选择\nWidget _keyDropdown(L10n l,\n    List<SshKey> keys, String? selectedId, ValueChanged<String?> onChanged) {\n  if (keys.isEmpty) {\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 12),\n      decoration: BoxDecoration(\n        color: AppColors.base,\n        borderRadius: BorderRadius.circular(6),\n        border: Border.all(color: AppColors.surface0),\n      ),\n      child: Text(l.t('host.keyEmpty'),\n          style: TextStyle(fontSize: 11.5, color: AppColors.overlay)),\n    );\n  }\n  return Column(\n    crossAxisAlignment: CrossAxisAlignment.start,\n    children: [\n      Padding(\n        padding: const EdgeInsets.only(bottom: 4),\n        child: Text(l.t('host.selectKey'),\n            style: TextStyle(fontSize: 11, color: AppColors.subtext)),\n      ),\n      Container(\n        padding: const EdgeInsets.symmetric(horizontal: 10),\n        decoration: BoxDecoration(\n          color: AppColors.base,\n          borderRadius: BorderRadius.circular(6),\n          border: Border.all(color: AppColors.surface0),\n        ),\n        child: DropdownButtonHideUnderline(\n          child: DropdownButton<String>(\n            value: selectedId,\n            isExpanded: true,\n            dropdownColor: AppColors.mantle,\n            hint: Text(l.t('host.pleaseSelect'),\n                style: TextStyle(fontSize: 12, color: AppColors.overlay)),\n            style: TextStyle(fontSize: 13, color: AppColors.text),\n            items: [\n              for (final k in keys)\n                DropdownMenuItem(value: k.id, child: Text(k.name)),\n            ],\n            onChanged: onChanged,\n          ),\n        ),\n      ),\n    ],\n  );\n}",purpose:"交互方法“_keyDropdown”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/lib/ui/dock_theme.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:66,order:18,logicBlocks:[{name:"buildTabbedTheme",kind:"方法 / 函数",startLine:5,endLine:49,code:"/// VS Code 风格的 dock 主题 —— 扁平、细线、无圆角\n/// 统一 tab 栏(tabbed_view) 与 分隔条(multi_split_view) 视觉。\n\n/// tab 主题：扁平 tab，选中态顶部 2px 蓝线，内容区无边框\nTabbedViewThemeData buildTabbedTheme() {\n  final theme = TabbedViewThemeData();\n\n  // tab 栏整体\n  theme.tabsArea\n    ..color = AppColors.mantle\n    ..border = Border(\n        bottom: BorderSide(color: AppColors.surface0)) // 底部一条细分隔\n    ..initialGap = 0\n    ..middleGap = 0\n    // 右侧按钮区：留右边距避免贴边被遮，加垂直 padding 让按钮与 tab 文字垂直对齐\n    ..buttonsAreaPadding = const EdgeInsets.symmetric(horizontal: 10, vertical: 8)\n    ..buttonIconSize = 15\n    ..normalButtonColor = AppColors.subtext\n    ..hoverButtonColor = AppColors.text;\n\n  // 单个 tab：无圆角无边框，紧凑\n  theme.tab\n    ..textStyle = TextStyle(fontSize: 12, color: AppColors.subtext)\n    ..padding = const EdgeInsets.symmetric(horizontal: 14, vertical: 8)\n    ..decoration = BoxDecoration(color: AppColors.mantle)\n    ..normalButtonColor = AppColors.overlay\n    ..hoverButtonColor = AppColors.text;\n\n  // 选中态：背景提亮 + 顶部 2px 蓝线（VS Code 活动 tab 标志）\n  theme.tab.selectedStatus\n    ..fontColor = AppColors.text\n    ..decoration = BoxDecoration(\n      color: AppColors.base,\n      border: Border(top: BorderSide(color: AppColors.blue, width: 2)),\n    );\n\n  // hover 态：轻微提亮\n  theme.tab.highlightedStatus.decoration =\n      BoxDecoration(color: AppColors.surface0);\n\n  // 内容区：去掉默认粗边框\n  theme.contentArea.decoration = BoxDecoration(color: AppColors.base);\n\n  return theme;\n}",purpose:"交互方法“buildTabbedTheme”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"buildSplitTheme",kind:"方法 / 函数",startLine:51,endLine:65,code:"/// 分隔条主题：VS Code 式 sash\n/// 命中区 9px(鼠标易对准)，平时只画 1px 浅灰细线，hover 加粗变蓝。\nMultiSplitViewThemeData buildSplitTheme() {\n  return MultiSplitViewThemeData(\n    dividerThickness: 9, // 命中区 9px，便于拖拽\n    dividerPainter: DividerPainters.dashed(\n      size: 100000, // 单段超长 → 铺满整条，渲染为实线\n      gap: 1, // gap 必须 >0，因 size 极大永不触发间隙\n      color: AppColors.surface0, // 平时：1px 浅灰细线\n      highlightedColor: AppColors.blue, // hover/拖拽：蓝色\n      thickness: 1, // 平时线宽 1px\n      highlightedThickness: 3, // hover 加粗到 3px\n    ),\n  );\n}",purpose:"交互方法“buildSplitTheme”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/lib/ui/forward_dialog.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:336,order:18,logicBlocks:[{name:"showForwardDialog",kind:"方法 / 函数",startLine:8,endLine:28,code:"/// 端口转发对话框 —— 管理本地端口转发隧道（增删 + 启停）。\n/// 隧道依附当前 SSH 连接（等价 ssh -L），绑定 127.0.0.1 仅本机可访问。\nFuture<void> showForwardDialog(BuildContext context) {\n  return showDialog<void>(\n    context: context,\n    builder: (_) => Dialog(\n      backgroundColor: AppColors.mantle,\n      shape: RoundedRectangleBorder(\n        borderRadius: BorderRadius.circular(10),\n        side: BorderSide(color: AppColors.surface0),\n      ),\n      child: ConstrainedBox(\n        constraints: const BoxConstraints(maxWidth: 560, maxHeight: 620),\n        child: const Padding(\n          padding: EdgeInsets.all(18),\n          child: _ForwardBody(),\n        ),\n      ),\n    ),\n  );\n}",purpose:"交互方法“showForwardDialog”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:33,endLine:124,code:"@override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final list = ref.watch(forwardProvider);\n    final conn = ref.watch(connectionProvider);\n    final l = ref.watch(l10nProvider);\n    final hostName = conn.host?.alias?.isNotEmpty == true\n        ? conn.host!.alias!\n        : (conn.host?.host ?? '-');\n\n    return Column(\n      mainAxisSize: MainAxisSize.min,\n      crossAxisAlignment: CrossAxisAlignment.stretch,\n      children: [\n        // 标题 + 添加\n        Row(\n          children: [\n            Icon(Icons.swap_horiz_outlined,\n                size: 16, color: AppColors.text),\n            const SizedBox(width: 8),\n            Text(l.t('fwd.title'),\n                style: TextStyle(\n                    fontSize: 15,\n                    fontWeight: FontWeight.w600,\n                    color: AppColors.text)),\n            const SizedBox(width: 8),\n            Text(l.t('fwd.count', {'n': '${list.length}'}),\n                style: TextStyle(fontSize: 11, color: AppColors.overlay)),\n            const Spacer(),\n            TextButton.icon(\n              onPressed: conn.isConnected\n                  ? () => _showAddDialog(context, ref)\n                  : null,\n              icon: Icon(Icons.add,\n                  size: 15,\n                  color: conn.isConnected\n                      ? AppColors.blue\n                      : AppColors.overlay),\n              label: Text(l.t('fwd.addTunnel'),\n                  style: TextStyle(\n                      fontSize: 12,\n                      color: conn.isConnected\n                          ? AppColors.blue\n                          : AppColors.overlay)),\n            ),\n          ],\n        ),\n        const SizedBox(height: 4),\n        // 当前连接提示\n        Container(\n          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7),\n          decoration: BoxDecoration(\n            color: AppColors.base,\n            borderRadius: BorderRadius.circular(6),\n          ),\n          child: Row(\n            children: [\n              Icon(conn.isConnected ? Icons.link : Icons.link_off,\n                  size: 13,\n                  color:\n                      conn.isConnected ? AppColors.green : AppColors.overlay),\n              const SizedBox(width: 7),\n              Expanded(\n                child: Text(\n                    conn.isConnected\n                        ? l.t('fwd.boundHint', {'host': hostName})\n                        : l.t('fwd.notConnected'),\n                    style: TextStyle(\n                        fontSize: 10.5, height: 1.4, color: AppColors.subtext)),\n              ),\n            ],\n          ),\n        ),\n        const SizedBox(height: 12),\n        Flexible(\n          child: list.isEmpty\n              ? Padding(\n                  padding: const EdgeInsets.symmetric(vertical: 40),\n                  child: Text(l.t('fwd.empty'),\n                      textAlign: TextAlign.center,\n                      style: TextStyle(\n                          fontSize: 12, color: AppColors.overlay)),\n                )\n              : ListView.separated(\n                  shrinkWrap: true,\n                  itemCount: list.length,\n                  separatorBuilder: (_, _) => const SizedBox(height: 6),\n                  itemBuilder: (ctx, i) => _row(ref, list[i]),\n                ),\n        ),\n      ],\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_row",kind:"方法 / 函数",startLine:126,endLine:200,code:"Widget _row(WidgetRef ref, ForwardEntry e) {\n    final l = ref.watch(l10nProvider);\n    return Container(\n        padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),\n        decoration: BoxDecoration(\n          color: AppColors.base,\n          borderRadius: BorderRadius.circular(8),\n          border: Border.all(color: AppColors.surface0),\n        ),\n        child: Row(\n          children: [\n            // 运行状态点\n            Container(\n              width: 8,\n              height: 8,\n              decoration: BoxDecoration(\n                color: e.running ? AppColors.green : AppColors.overlay,\n                shape: BoxShape.circle,\n                boxShadow: e.running\n                    ? [\n                        BoxShadow(\n                            color: AppColors.green.withValues(alpha: .6),\n                            blurRadius: 6)\n                      ]\n                    : null,\n              ),\n            ),\n            const SizedBox(width: 10),\n            Expanded(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n                  Text(\n                      'localhost:${e.localPort}  →  ${e.remoteHost}:${e.remotePort}',\n                      style: TextStyle(\n                          fontFamily: kMonoFont,\n                          fontSize: 12,\n                          color: AppColors.text)),\n                  const SizedBox(height: 2),\n                  Text(\n                      e.error != null\n                          ? e.error!\n                          : (e.running ? l.t('fwd.running') : l.t('fwd.stopped')),\n                      style: TextStyle(\n                          fontSize: 10,\n                          color: e.error != null\n                              ? AppColors.red\n                              : AppColors.overlay)),\n                ],\n              ),\n            ),\n            // 启停\n            IconButton(\n              icon: Icon(\n                  e.running\n                      ? Icons.stop_circle_outlined\n                      : Icons.play_circle_outline,\n                  size: 18,\n                  color: e.running ? AppColors.yellow : AppColors.green),\n              splashRadius: 16,\n              tooltip: e.running ? l.t('fwd.stop') : l.t('fwd.start'),\n              onPressed: () => ref.read(forwardProvider.notifier).toggle(e.id),\n            ),\n            // 删除\n            IconButton(\n              icon: Icon(Icons.delete_outline,\n                  size: 16, color: AppColors.red),\n              splashRadius: 16,\n              tooltip: l.t('common.delete'),\n              onPressed: () => ref.read(forwardProvider.notifier).remove(e.id),\n            ),\n          ],\n        ),\n      );\n  }",purpose:"交互方法“_row”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_showAddDialog",kind:"方法 / 函数",startLine:203,endLine:307,code:"// 添加隧道子对话框：本地端口 + 远程地址 + 远程端口\nvoid _showAddDialog(BuildContext context, WidgetRef ref) {\n  final localPort = TextEditingController();\n  final remoteHost = TextEditingController(text: '127.0.0.1');\n  final remotePort = TextEditingController();\n  String? errorText;\n  final l = ref.watch(l10nProvider);\n\n  showDialog<void>(\n    context: context,\n    builder: (_) => StatefulBuilder(\n      builder: (ctx, setState) => Dialog(\n        backgroundColor: AppColors.mantle,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(10),\n          side: BorderSide(color: AppColors.surface0),\n        ),\n        child: ConstrainedBox(\n          constraints: const BoxConstraints(maxWidth: 440),\n          child: Padding(\n            padding: const EdgeInsets.all(20),\n            child: Column(\n              mainAxisSize: MainAxisSize.min,\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                Row(\n                  children: [\n                    Icon(Icons.swap_horiz_outlined,\n                        size: 18, color: AppColors.blue),\n                    const SizedBox(width: 8),\n                    Text(l.t('fwd.addTunnel'),\n                        style: TextStyle(\n                            fontSize: 15,\n                            fontWeight: FontWeight.w600,\n                            color: AppColors.text)),\n                  ],\n                ),\n                const SizedBox(height: 6),\n                Text(l.t('fwd.addDesc'),\n                    style: TextStyle(\n                        fontSize: 10.5, height: 1.4, color: AppColors.overlay)),\n                const SizedBox(height: 14),\n                _label(l.t('fwd.localPort')),\n                _input(localPort, hint: l.t('fwd.localPortHint')),\n                const SizedBox(height: 12),\n                _label(l.t('fwd.remoteHost')),\n                _input(remoteHost, hint: l.t('fwd.remoteHostHint')),\n                const SizedBox(height: 12),\n                _label(l.t('fwd.remotePort')),\n                _input(remotePort, hint: l.t('fwd.remotePortHint')),\n                if (errorText != null) ...[\n                  const SizedBox(height: 8),\n                  Text(errorText!,\n                      style:\n                          TextStyle(fontSize: 11, color: AppColors.red)),\n                ],\n                const SizedBox(height: 16),\n                Row(\n                  mainAxisAlignment: MainAxisAlignment.end,\n                  children: [\n                    TextButton(\n                      onPressed: () => Navigator.pop(ctx),\n                      child: Text(l.t('common.cancel'),\n                          style: TextStyle(color: AppColors.subtext)),\n                    ),\n                    const SizedBox(width: 8),\n                    FilledButton(\n                      style: FilledButton.styleFrom(\n                          backgroundColor: AppColors.blue,\n                          foregroundColor: AppColors.crust),\n                      onPressed: () {\n                        final lp = int.tryParse(localPort.text.trim());\n                        final rp = int.tryParse(remotePort.text.trim());\n                        final rh = remoteHost.text.trim();\n                        if (lp == null || lp < 1 || lp > 65535) {\n                          setState(() => errorText = l.t('fwd.errLocalPort'));\n                          return;\n                        }\n                        if (rp == null || rp < 1 || rp > 65535) {\n                          setState(() => errorText = l.t('fwd.errRemotePort'));\n                          return;\n                        }\n                        if (rh.isEmpty) {\n                          setState(() => errorText = l.t('fwd.errRemoteHost'));\n                          return;\n                        }\n                        ref.read(forwardProvider.notifier).add(\n                              localPort: lp,\n                              remoteHost: rh,\n                              remotePort: rp,\n                            );\n                        Navigator.pop(ctx);\n                      },\n                      child: Text(l.t('fwd.addStart')),\n                    ),\n                  ],\n                ),\n              ],\n            ),\n          ),\n        ),\n      ),\n    ),\n  );\n}",purpose:"交互方法“_showAddDialog”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_label",kind:"方法 / 函数",startLine:309,endLine:309,code:"Widget _label(String text) => Padding(",purpose:"交互方法“_label”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_input",kind:"方法 / 函数",startLine:315,endLine:315,code:"Widget _input(TextEditingController c, {String? hint}) => TextField(",purpose:"交互方法“_input”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/lib/ui/keys_dialog.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:313,order:18,logicBlocks:[{name:"showKeysDialog",kind:"方法 / 函数",startLine:9,endLine:29,code:"/// 密钥库对话框 —— 管理 SSH 私钥（列表 + 粘贴 PEM 添加 + 删除）。\n/// 私钥与 passphrase 加密落盘（复用 crypto.dart），绝不存明文。\nFuture<void> showKeysDialog(BuildContext context) {\n  return showDialog<void>(\n    context: context,\n    builder: (_) => Dialog(\n      backgroundColor: AppColors.mantle,\n      shape: RoundedRectangleBorder(\n        borderRadius: BorderRadius.circular(10),\n        side: BorderSide(color: AppColors.surface0),\n      ),\n      child: ConstrainedBox(\n        constraints: const BoxConstraints(maxWidth: 560, maxHeight: 620),\n        child: const Padding(\n          padding: EdgeInsets.all(18),\n          child: _KeysBody(),\n        ),\n      ),\n    ),\n  );\n}",purpose:"交互方法“showKeysDialog”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:34,endLine:91,code:"@override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final keys = ref.watch(keyProvider);\n    final hosts = ref.watch(configProvider).hosts;\n    final l = ref.watch(l10nProvider);\n\n    return Column(\n      mainAxisSize: MainAxisSize.min,\n      crossAxisAlignment: CrossAxisAlignment.stretch,\n      children: [\n        // 标题 + 添加\n        Row(\n          children: [\n            Icon(Icons.vpn_key_outlined, size: 16, color: AppColors.text),\n            const SizedBox(width: 8),\n            Text(l.t('keys.title'),\n                style: TextStyle(\n                    fontSize: 15,\n                    fontWeight: FontWeight.w600,\n                    color: AppColors.text)),\n            const SizedBox(width: 8),\n            Text(l.t('keys.count', {'n': '${keys.length}'}),\n                style: TextStyle(fontSize: 11, color: AppColors.overlay)),\n            const Spacer(),\n            TextButton.icon(\n              onPressed: () => _showAddKeyDialog(context, ref),\n              icon: Icon(Icons.add, size: 15, color: AppColors.blue),\n              label: Text(l.t('keys.add'),\n                  style: TextStyle(fontSize: 12, color: AppColors.blue)),\n            ),\n          ],\n        ),\n        const SizedBox(height: 8),\n        Flexible(\n          child: keys.isEmpty\n              ? Padding(\n                  padding: const EdgeInsets.symmetric(vertical: 40),\n                  child: Text(l.t('keys.empty'),\n                      textAlign: TextAlign.center,\n                      style: TextStyle(\n                          fontSize: 12, color: AppColors.overlay)),\n                )\n              : ListView.separated(\n                  shrinkWrap: true,\n                  itemCount: keys.length,\n                  separatorBuilder: (_, _) => const SizedBox(height: 6),\n                  itemBuilder: (ctx, i) {\n                    final k = keys[i];\n                    // 统计引用该密钥的主机数\n                    final usedBy =\n                        hosts.where((h) => h.keyId == k.id).length;\n                    return _keyRow(context, ref, k, usedBy);\n                  },\n                ),\n        ),\n      ],\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_keyRow",kind:"方法 / 函数",startLine:93,endLine:133,code:"Widget _keyRow(\n          BuildContext context, WidgetRef ref, SshKey k, int usedBy) {\n    final l = ref.watch(l10nProvider);\n    return Container(\n        padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),\n        decoration: BoxDecoration(\n          color: AppColors.base,\n          borderRadius: BorderRadius.circular(8),\n          border: Border.all(color: AppColors.surface0),\n        ),\n        child: Row(\n          children: [\n            Icon(Icons.vpn_key, size: 15, color: AppColors.yellow),\n            const SizedBox(width: 10),\n            Expanded(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n                  Text(k.name,\n                      style: TextStyle(\n                          fontSize: 13, color: AppColors.text)),\n                  const SizedBox(height: 2),\n                  Text(\n                      '${k.passphraseEnc != null ? l.t('keys.withPassphrase') : ''}'\n                      '${usedBy > 0 ? l.t('keys.usedBy', {'n': '$usedBy'}) : l.t('keys.unused')}',\n                      style: TextStyle(\n                          fontSize: 10, color: AppColors.overlay)),\n                ],\n              ),\n            ),\n            IconButton(\n              icon: Icon(Icons.delete_outline,\n                  size: 16, color: AppColors.red),\n              splashRadius: 16,\n              tooltip: l.t('common.delete'),\n              onPressed: () => _confirmDelete(context, ref, k, usedBy),\n            ),\n          ],\n        ),\n      );\n  }",purpose:"交互方法“_keyRow”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_confirmDelete",kind:"方法 / 函数",startLine:135,endLine:172,code:"void _confirmDelete(\n      BuildContext context, WidgetRef ref, SshKey k, int usedBy) {\n    final l = ref.watch(l10nProvider);\n    showDialog<void>(\n      context: context,\n      builder: (ctx) => AlertDialog(\n        backgroundColor: AppColors.mantle,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(10),\n          side: BorderSide(color: AppColors.surface0),\n        ),\n        title: Text(l.t('keys.deleteKey'),\n            style: TextStyle(fontSize: 15, color: AppColors.text)),\n        content: Text(\n            usedBy > 0\n                ? l.t('keys.deleteUsed', {'name': k.name, 'n': '$usedBy'})\n                : l.t('keys.deleteConfirm', {'name': k.name}),\n            style: TextStyle(fontSize: 13, color: AppColors.subtext)),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.pop(ctx),\n            child: Text(l.t('common.cancel'),\n                style: TextStyle(color: AppColors.subtext)),\n          ),\n          FilledButton(\n            style: FilledButton.styleFrom(\n                backgroundColor: AppColors.red,\n                foregroundColor: AppColors.crust),\n            onPressed: () {\n              ref.read(keyProvider.notifier).remove(k.id);\n              Navigator.pop(ctx);\n            },\n            child: Text(l.t('common.delete')),\n          ),\n        ],\n      ),\n    );\n  }",purpose:"交互方法“_confirmDelete”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_showAddKeyDialog",kind:"方法 / 函数",startLine:175,endLine:274,code:"// 添加密钥子对话框：名称 + 粘贴 PEM + 可选 passphrase\nvoid _showAddKeyDialog(BuildContext context, WidgetRef ref) {\n  final name = TextEditingController();\n  final pem = TextEditingController();\n  final passphrase = TextEditingController();\n  String? errorText;\n  final l = ref.watch(l10nProvider);\n\n  showDialog<void>(\n    context: context,\n    builder: (_) => StatefulBuilder(\n      builder: (ctx, setState) => Dialog(\n        backgroundColor: AppColors.mantle,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(10),\n          side: BorderSide(color: AppColors.surface0),\n        ),\n        child: ConstrainedBox(\n          constraints: const BoxConstraints(maxWidth: 480),\n          child: Padding(\n            padding: const EdgeInsets.all(20),\n            child: Column(\n              mainAxisSize: MainAxisSize.min,\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                Row(\n                  children: [\n                    Icon(Icons.vpn_key_outlined,\n                        size: 18, color: AppColors.blue),\n                    const SizedBox(width: 8),\n                    Text(l.t('keys.add'),\n                        style: TextStyle(\n                            fontSize: 15,\n                            fontWeight: FontWeight.w600,\n                            color: AppColors.text)),\n                  ],\n                ),\n                const SizedBox(height: 16),\n                _label(l.t('keys.name')),\n                _input(name, hint: 'id_ed25519'),\n                const SizedBox(height: 12),\n                _label(l.t('keys.pem')),\n                _input(pem,\n                    hint: '-----BEGIN OPENSSH PRIVATE KEY-----\\n...',\n                    maxLines: 6, mono: true),\n                const SizedBox(height: 12),\n                _label(l.t('keys.passphrase')),\n                _input(passphrase, obscure: true),\n                if (errorText != null) ...[\n                  const SizedBox(height: 8),\n                  Text(errorText!,\n                      style:\n                          TextStyle(fontSize: 11, color: AppColors.red)),\n                ],\n                const SizedBox(height: 16),\n                Row(\n                  mainAxisAlignment: MainAxisAlignment.end,\n                  children: [\n                    TextButton(\n                      onPressed: () => Navigator.pop(ctx),\n                      child: Text(l.t('common.cancel'),\n                          style: TextStyle(color: AppColors.subtext)),\n                    ),\n                    const SizedBox(width: 8),\n                    FilledButton(\n                      style: FilledButton.styleFrom(\n                          backgroundColor: AppColors.blue,\n                          foregroundColor: AppColors.crust),\n                      onPressed: () {\n                        final pemText = pem.text.trim();\n                        // 基本校验：必须像 PEM\n                        if (!pemText.contains('-----BEGIN')) {\n                          setState(() =>\n                              errorText = l.t('keys.errPem'));\n                          return;\n                        }\n                        final nm = name.text.trim().isEmpty\n                            ? l.t('keys.unnamed')\n                            : name.text.trim();\n                        ref.read(keyProvider.notifier).add(\n                              name: nm,\n                              privateKeyPem: pemText,\n                              passphrase: passphrase.text.isEmpty\n                                  ? null\n                                  : passphrase.text,\n                            );\n                        Navigator.pop(ctx);\n                      },\n                      child: Text(l.t('common.save')),\n                    ),\n                  ],\n                ),\n              ],\n            ),\n          ),\n        ),\n      ),\n    ),\n  );\n}",purpose:"交互方法“_showAddKeyDialog”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。 ),\n            _navTitle(context, ref, l.t('panel.hosts')),\n            if (hosts.isEmpty)\n              Padding(\n                padding: const EdgeInsets.fromLTRB(14, 8, 14, 8),\n                child: Text(\n                    query.isEmpty\n                        ? l.t('left.noHosts')\n                        : l.t('left.noMatch', {'q': query}),\n                    style: TextStyle(\n                        fontSize: 11, color: AppColors.overlay)),\n              )\n            else\n              for (final h in hosts) _hostItem(context, ref, h, conn),\n            // 连接错误显示（定位失败原因）\n            if (conn.phase == ConnPhase.error && conn.error != null)\n              Container(\n                margin: const EdgeInsets.fromLTRB(14, 4, 14, 4),\n                padding: const EdgeInsets.all(8),\n                decoration: BoxDecoration(\n                  color: AppColors.red.withValues(alpha: .12),\n                  borderRadius: BorderRadius.circular(6),\n                ),\n                child: Text(l.t('left.connectFail', {'err': '${conn.error}'}),\n                    style: TextStyle(\n                        fontSize: 10.5, color: AppColors.red)),\n              ),\n            _divider(),\n            // 命令片段：真实功能，点击弹片段面板，badge 显示真实数量\n            _navLink(Icons.content_paste_outlined, l.t('left.snippets'),\n                '${ref.watch(snippetProvider).length}',\n                onTap: () => showSnippetsDialog(context)),\n            // 密钥库：真实功能，点击弹密钥管理，badge 显示真实数量\n            _navLink(Icons.vpn_key_outlined, l.t('left.keys'),\n                _keyBadge(ref),\n                onTap: () => showKeysDialog(context)),\n            // 端口转发：真实功能，点击弹隧道管理，badge 显示运行中隧道数\n            _navLink(Icons.swap_horiz_outlined, l.t('left.forward'),\n                _forwardBadge(ref),\n                onTap: () => showForwardDialog(context)),\n            // 安全策略：真实功能，点击弹策略面板，badge 显示累计拦截数（deny+ask）\n            _navLink(Icons.shield_outlined, l.t('left.security'),\n                _guardBadge(ref),\n                onTap: () => showSecurityDialog(context)),\n            // 审计日志：真实功能，点击弹审计面板，badge 显示总条数\n            _navLink(Icons.receipt_long_outlined, l.t('left.audit'),\n                '${ref.watch(auditProvider).length}',\n                onTap: () => showAuditDialog(context)),\n          ],\n        ),\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_navTitle",kind:"方法 / 函数",startLine:101,endLine:102,code:"// 区块标题（带 + 添加主机）\n  Widget _navTitle(BuildContext context, WidgetRef ref, String title) =>",purpose:"交互方法“_navTitle”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"Padding",kind:"方法 / 函数",startLine:103,endLine:114,code:"Padding(\n        padding: const EdgeInsets.fromLTRB(14, 4, 14, 4),\n        child: Row(\n          children: [\n            Text(title.toUpperCase(),\n                style: TextStyle(\n                    fontSize: 10.5,\n                    letterSpacing: 1,\n                    color: AppColors.overlay)),\n            const Spacer(),\n            InkWell(\n              onTap: () => showAddHostDialog(context, ref),",purpose:"交互方法“Padding”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_hostItem",kind:"方法 / 函数",startLine:121,endLine:123,code:"// 主机条目：点击连接。当前主机左侧蓝条高亮，已连绿点/连接中转圈。右键删除。\n  Widget _hostItem(\n          BuildContext context, WidgetRef ref, Host h, ConnState conn) =>",purpose:"交互方法“_hostItem”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_showHostMenu",kind:"方法 / 函数",startLine:131,endLine:158,code:"// 主机右键菜单：目前仅删除\n  void _showHostMenu(\n      BuildContext context, WidgetRef ref, Host h, Offset pos) {\n    final l = ref.read(l10nProvider) yleFrom(\n                backgroundColor: AppColors.red,\n                foregroundColor: AppColors.crust),\n            onPressed: () {\n              // 正连着这台就先断开，避免操作已删主机\n              final conn = ref.read(connectionProvider);\n              if (conn.host?.id == h.id) {\n                ref.read(connectionProvider.notifier).disconnect();\n              }\n              ref.read(configProvider.notifier).deleteHost(h.id);\n              Navigator.pop(ctx);\n            },\n            child: Text(l.t('common.delete')),\n          ),\n        ],\n      ),\n    );\n  }",purpose:"交互方法“_confirmDelete”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_divider",kind:"方法 / 函数",startLine:204,endLine:204,code:"Widget _divider() => Container(",purpose:"交互方法“_divider”：处理界面渲染、用户操作或视觉状态。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_guardBadge",kind:"方法 / 函数",startLine:210,endLine:215,code:"// 安全策略 badge：累计拦截数（deny+ask），为 0 时不显示\n  String? _guardBadge(WidgetRef ref) {\n    final s = ref.watch(guardProvider);\n    final n = s.denyCount + s.askCount;\n    return n > 0 ? '$n' : null;\n  }",purpose:"交互方法“_guardBadge”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_keyBadge",kind:"方法 / 函数",startLine:217,endLine:221,code:"// 密钥库 badge：密钥数量，为 0 时不显示\n  String? _keyBadge(WidgetRef ref) {\n    final n = ref.watch(keyProvider).length;\n    return n > 0 ? '$n' : null;\n  }",purpose:"交互方法“_keyBadge”：处理界面渲染、用户操作或视觉状态。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_forwardBadge",kind:"方法 / 函数",startLine:223,endLine:227,code:"// 端口转发 badge：运行中的隧道数，为 0 时不显示\n  String? _forwardBadge(WidgetRef ref) {\n    final n = ref.watch(forwardProvider).where((e) => e.running).length;\n    return n > 0 ? '$n' : null;\n  }",purpose:"交互方法“_forwardBadge”：处理界面渲染、用户操作或视觉状态。",steps: \n      WidgetsBinding.instance.addPostFrameCallback((_) {\n        final c = ref.read(connectionProvider);\n        final s = ref.read(sftpProvider);\n        if (c.isConnected && s.files.isEmpty && !s.loading) {\n          ref.read(sftpProvider.notifier).load('/');\n        }\n      });\n    });\n\n    if (!conn.isConnected) {\n      return Padding(\n        padding: const EdgeInsets.symmetric(vertical: 20),\n        child: Text(l.t('right.filesEmpty'),\n            textAlign: TextAlign.center,\n            style: TextStyle(fontSize: 11, color: AppColors.overlay)),\n      );\n    }\n\n    return Column(\n      crossAxisAlignment: CrossAxisAlignment.stretch,\n      children: [\n        // 路径条 + 刷新\n        Container(\n          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),\n          decoration: BoxDecoration(\n            color: AppColors.base,\n            borderRadius: BorderRadius.circular(6),\n          ),\n          child: Row(\n            children: [\n              Expanded(\n                child: Text(sftp.path,\n                    overflow: TextOverflow.ellipsis,\n                    style: TextStyle(\n                        fontFamily: kMonoFont,\n                        fontSize: 11,\n                        color: AppColors.subtext)),\n              ),\n              InkWell(\n                onTap: () => ref.read(sftpProvider.notifier).load(),\n                child: Icon(Icons.refresh,\n                    size: 13, color: AppColors.blue),\n              ),\n            ],\n          ),\n        ),\n        const SizedBox(height: 8),\n        if (sftp.loading)\n          Padding(\n            padding: EdgeInsets.symmetric(vertical: 16),\n            child: Center(\n              child: SizedBox(\n                width: 16,\n                height: 16,\n                child: CircularProgressIndicator(\n                    strokeWidth: 2, color: AppColors.blue),\n              ),\n            ),\n          )\n        else if (sftp.error != null)\n          Padding(\n            padding: const EdgeInsets.symmetric(vertical: 8),\n            child: Text(l.t('right.loadFail', {'err': '${sftp.error}'}),\n                style: TextStyle(fontSize: 11, color: AppColors.red)),\n          )\n        else ...[\n          // 顶部 .. 返回上级（非根目录时）\n          if (sftp.path != '/' && sftp.path.isNotEmpty)\n            InkWell(\n              onTap: () => ref.read(sftpProvider.notifier).goUp(),\n              child: _fileRow(Icons.folder_outlined, '..', null, true),\n            ),\n          for (final f in sftp.files)\n            InkWell(\n              onTap: f.isDir\n                  ? () => ref.read(sftpProvider.notifier).enter(f)\n                  : null,\n              child: _fileRow(\n                f.isDir\n                    ? Icons.folder_outlined\n                    : Icons.description_outlined,\n                f.name,\n                f.isDir ? f.perms : _fmtSize(f.size),\n                f.isDir,\n              ),\n            ),\n          if (sftp.files.isEmpty)\n            Padding(\n              padding: const EdgeInsets.symmetric(vertical: 8),\n              child: Text(l.t('right.emptyDir'),\n                  style: TextStyle(fontSize: 11, color: AppColors.overlay)),\n            ),\n        ],\n      ],\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_fmtSize",kind:"方法 / 函数",startLine:406,endLine:414,code:"// 文件大小友好显示\n  static String _fmtSize(int bytes) {\n    if (bytes < 1024) return '${bytes}B';\n    if (bytes < 1024 * 1024) return '${(bytes / 1024).toStringAsFixed(1)}K';\n    if (bytes < 1024 * 1024 * 1024) {\n      return '${(bytes / 1024 / 1024).toStringAsFixed(1)}M';\n    }\n    return '${(bytes / 1024 / 1024 / 1024).toStringAsFixed(1)}G';\n  }",purpose:"交互方法“_fmtSize”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当 n        } catch (_) {\n          // 选区超出当前 buffer 范围，忽略本次复制\n        }\n      };\n      controller.addListener(_selListener!);\n    } else if (!on && _selListener != null) {\n      controller.removeListener(_selListener!);\n      _selListener = null;\n    }\n  }",purpose:"交互方法“setAutoCopy”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"dispose",kind:"方法 / 函数",startLine:46,endLine:51,code:"void dispose() {\n    if (_selListener != null) controller.removeListener(_selListener!);\n    controller.dispose();\n    shell?.close();\n    shell = null;\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"createState",kind:"UI 生命周期",startLine:60,endLine:61,code:"@override\n  ConsumerState<TerminalPane> createState() => _TerminalPaneState();",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_paste",kind:"方法 / 函数",startLine:78,endLine:85,code:"/// 右键：把剪贴板内容写进 shell（桌面终端常见的粘贴交互）\n  Future<void> _paste(_TermSession s) async {\n    final data = await Clipboard.getData(Clipboard.kTextPlain);\n    final text = data?.text;\n    if (text != null && text.isNotEmpty) {\n      s.shell?.write(utf8.encode(text));\n    }\n  }",purpose:"交互方法“_paste”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"_startShell",kind:"方法 / 函数",startLine:87,endLine:112,code:"/// 为指定主机开交互 shell，把 SSH stdout/stderr 灌进它的终端\n  Future<void> _startShell(String hostId, SshClient client) async {\n    final s = _sessionFor(hostId);\n    if (s.starting || s.shell != null) return;\n    s.starting = true;\n    try {\n      final session = await client.shell(\n        width: s.terminal.viewWidth,\n        height: s.terminal.viewHeight,\n      );\n      s.shell = session;\n      session.stdout\n          .cast<List<int>>()\n          .transform(const Utf8Decoder(allowMalformed: true))\n          .listen(s.terminal.write);\n      session.stderr\n          .cast<List<int>>()\n          .transform(const Utf8Decoder(allowMalformed: true))\n          .listen(s.terminal.write);\n    } catch (e) {\n      final l = ref.read(l10nProvider);\n      s.terminal.write('\\r\\n${l.t('term.startFail', {'err': '$e'})}\\r\\n');\n    } finally {\n      s.starting = false;\n    }\n  }",purpose:"交互方法“_startShell”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"dispose",kind:"方法 / 函数",startLine:114,endLine:120,code:"@override\n  void dispose() {\n    for (final s in _sessions.values) {\n      s.dispose();\n    }\n    super.dispose();\n  }",purpose:"管理资源生命周期：启动、停止、取消或释放连接、计时器和控制器。",steps:["遍历集合或持续推进循环，直到满足退出条件。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:122,endLine:181,code:"@override\n  Widget build(BuildContext context) {\n    final conn = ref.watch(connectionProvider);\n    final cfg = ref.watch(settingsProvider); // 终端设置\n    final l = ref.watch(l10nProvider);\n    final hostId = conn.host?.id;\n\n    // 池里已不存在的主机（被 LRU 踢掉/断开），清理其终端会话\n    _sessions.keys\n        .where((id) => !conn.connectedIds.contains(id))\n        .toList()\n        .forEach((id) {\n      _sessions.remove(id)?.dispose();\n    });\n\n    if (!conn.isConnected || hostId == null) {\n      return Container(\n        color: AppColors.crust,\n        alignment: Alignment.center,\n        child: Text(l.t('term.connectFirst'),\n            style: TextStyle(fontSize: 12, color: AppColors.overlay)),\n      );\n    }\n\n    // 当前主机：没 shell 就开一个（按主机隔离，互不影响）\n    final s = _sessionFor(hostId);\n    if (s.shell == null && !s.starting) {\n      WidgetsBinding.instance\n          .addPostFrameCallback((_) => _startShell(hostId, conn.client!));\n    }\n    // 按设置同步「选中即复制」开关\n    s.setAutoCopy(cfg.selectToCopy);\n\n    // 光标样式映射\n    final cursorType = switch (cfg.cursorStyle) {\n      CursorStyle.underline => TerminalCursorType.underline,\n      CursorStyle.bar => TerminalCursorType.verticalBar,\n      _ => TerminalCursorType.block,\n    };\n\n    return Container(\n      color: AppColors.crust,\n      child: TerminalView(\n        s.terminal,\n        controller: s.controller,\n        // 右键粘贴：按设置开关\n        onSecondaryTapDown:\n            cfg.rightClickPaste ? (details, offset) => _paste(s) : null,\n        cursorType: cursorType,\n        // alwaysShowCursor=true 即不闪烁；闪烁则 false\n        alwaysShowCursor: !cfg.cursorBlink,\n        textStyle: TerminalStyle(\n          fontSize: cfg.termFontSize,\n          fontFamily: kMonoFont,\n        ),\n        theme: _termTheme,\n        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/lib/ui/top_bar.dart",layer:"Flutter UI",summary:"Flutter 展示层组件与用户交互",lineCount:141,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:11,endLine:13,code:"/// 顶栏 —— 搜索框 + 操作按钮\n/// macOS 下标题栏透明、内容顶到最上方，故左侧留出红绿灯位置。\nclass TopBar extends ConsumerWidget {\n  const TopBar({super.key});",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:14,endLine:40,code:"@override\n  Widget build(BuildContext context, WidgetRef ref) {\n    return Container(\n      height: 52,\n      decoration: BoxDecoration(\n        color: AppColors.mantle,\n        border: Border(bottom: BorderSide(colo izedBox(width: 5),\n                Text(widget.label!,\n                    style: TextStyle(fontSize: 12, color: AppColors.text)),\n              ],\n            ],\n          ),\n        ),\n      ),\n    );\n  }",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/cli/src/ui/AddHost.tsx",layer:"CLI",summary:"Flutter 展示层组件与用户交互",lineCount:109,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:16,endLine:31,code:"/** 表单字段定义：按 steps 顺序逐个填写 */\ninterface FieldDef {\n  key: 'alias' | 'host' | 'port' | 'user' | 'password'\n  label: string\n  placeholder: string\n  mask?: boolean\n  required?: boolean\n}\n\nconst FIELDS: FieldDef[] = [\n  { key: 'alias', label: '别名（可选）', placeholder: '如 生产-web01，可留空' },\n  { key: 'host', label: '主机地址', placeholder: 'IP 或域名', required: true },\n  { key: 'port', label: '端口', placeholder: '22' },\n  { key: 'user', label: '用户名', placeholder: 'root' },\n  { key: 'password', label: '密码（可选）', placeholder: '留空则连接时不带密码', mask: true },\n]",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"AddHost",kind:"方法 / 函数",startLine:32,endLine:102,code:"export function AddHost() {\n  const { exit } = useApp()\n  const [step, setStep] = useState(0)\n  const [value, setValue] = useState('')\n  const [draft, setDraft] = useState<Record<string, string>>({})\n  const [saved, setSaved] = useState<string | null>(null)\n\n  const onSubmit = () => {\n    const field = FIELDS[step]!\n    const v = value.trim()\n    // 必填字段空则不放行\n    if (field.required && v === '') return\n\n    const nextDraft = { ...draft, [field.key]: v }\n    setDraft(nextDraft)\n    setValue('')\n\n    if (step < FIELDS.length - 1) {\n      setStep(step + 1)\n      return\n    }\n\n    // 最后一项：保存\n    const host = addHost({\n      alias: nextDraft.alias || undefined,\n      host: nextDraft.host!,\n      port: nextDraft.port ? Number(nextDraft.port) : 22,\n      user: nextDraft.user || 'root',\n      password: nextDraft.password || undefined,\n    })\n    const label = host.alias ? `${host.alias} (${host.user}@${host.host}:${host.port})` : `${host.user}@${host.host}:${host.port}`\n    setSaved(label)\n    // 渲染成功提示后退出\n    setTimeout(() => exit(), 50)\n  }\n\n  if (saved) {\n    return (\n      <Box flexDirection=\"column\" padding={1}>\n        <Text color=\"green\">✓ 已添加主机：{saved}</Text>\n        <Text dimColor>密码已加密存入 ~/.lowenssh/config.json，直接运行 lowenssh 即可连接。</Text>\n      </Box>\n    )\n  }\n\n  const field = FIELDS[step]!\n  return (\n    <Box flexDirection=\"column\" padding={1}>\n      <Text color=\"cyan\">▰ 添加主机（回车下一项，Ctrl+C 取消）</Text>\n      {/* 已填字段回显 */}\n      <Box flexDirection=\"column\" marginTop={1}>\n        {FIELDS.slice(0, step).map((f) => (\n          <Text key={f.key} dimColor>\n            {f.label}：{f.mask ? maskValue(draft[f.key]) : draft[f.key] || '（默认）'}\n          </Text>\n        ))}\n      </Box>\n      {/* 当前字段输入 */}\n      <Box marginTop={step > 0 ? 1 : 0}>\n        <Text color=\"cyan\">{field.label}：</Text>\n        <TextInput\n          value={value}\n          onChange={setValue}\n          onSubmit={onSubmit}\n          placeholder={field.placeholder}\n          mask={field.mask ? '*' : undefined}\n        />\n      </Box>\n    </Box>\n  )\n}",purpose:"交互方法“AddHost”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"maskValue",kind:"方法 / 函数",startLine:104,endLine:108,code:"/** 密码回显成等长星号，空值显示\"（无）\" */\nfunction maskValue(v?: string): string {\n  if (!v) return '（无）'\n  return '*'.repeat(v.length)\n}",purpose:"交互方法“maskValue”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/cli/src/ui/App.tsx",layer:"CLI",summary:"Flutter 展示层组件与用户交互",lineCount:117,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:26,endLine:29,code:"export interface AppProps {\n  config: AppConfig\n}",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"App",kind:"方法 / 函数",startLine:30,endLine:116,code:"export function App({ config }: AppProps) {\n  const [stage, setStage] = useState<Stage>('select')\n  const [error, setError] = useState<string | null>(null)\n  const [host, setHost] = useState<Host | null>(null)\n\n  // 连接产物：连上后才有 ssh / llm 实例\n  const sshRef = useRef<SshClient | null>(null)\n  const llmRef = useRef<GlmClient | null>(null)\n\n  // 当前挂起的确认请求（ASK 态）；null 表示没有待确认\n  const [pendingConfirm, setPendingConfirm] = useState<PendingConfirm | null>(null)\n\n  /** Confirmer：被 agent loop 调用，返回一个 Promise，UI 按键后 resolve */\n  const confirmer = useCallback<Confirmer>((command, reason) => {\n    return new Promise<boolean>((resolve) => {\n      setPendingConfirm({ command, reason, resolve })\n    })\n  }, [])\n\n  /** 用户在确认框按了 y/n */\n  const onConfirm = useCallback((approved: boolean) => {\n    setPendingConfirm((cur) => {\n      cur?.resolve(approved)\n      return null\n    })\n  }, [])\n\n  /** 选定主机后建立连接 */\n  const onPickHost = useCallback(\n    async (picked: Host) => {\n      setHost(picked)\n      setStage('connect')\n      try {\n        const password = getHostPassword(picked)\n        if (!password) {\n          setError(`主机 ${picked.host} 未保存密码，请先在配置里补充。`)\n          setStage('fatal')\n          return\n        }\n        const ssh = new SshClient()\n        await ssh.connect(picked.host, picked.port, picked.user, password)\n        sshRef.current = ssh\n        llmRef.current = new GlmClient(config.llm)\n        setStage('chat')\n      } catch (e) {\n        setError(`连接失败: ${(e as Error).message}`)\n        setStage('fatal')\n      }\n    },\n    [config.llm],\n  )\n\n  if (stage === 'fatal') {\n    return (\n      <Box flexDirection=\"column\" padding={1}>\n        <Text color=\"red\">✗ {error}</Text>\n        <Text dimColor>按 Ctrl+C 退出。</Text>\n      </Box>\n    )\n  }\n\n  if (stage === 'select') {\n    return <HostSelect hosts={config.hosts} onPick={onPickHost} />\n  }\n\n  if (stage === 'connect') {\n    return (\n      <Box padding={1}>\n        <Text color=\"cyan\">◇ 正在连接 {host?.host} …</Text>\n      </Box>\n    )\n  }\n\n  // chat\n  return (\n    <Box flexDirection=\"column\">\n      <Chat\n        host={host!}\n        ssh={sshRef.current!}\n        llm={llmRef.current!}\n        confirmer={confirmer}\n        inputLocked={pendingConfirm !== null}\n      />\n      {pendingConfirm && <ConfirmPrompt pending={pendingConfirm} onAnswer={onConfirm} />}\n    </Box>\n  )\n}",purpose:"交互方法“App”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","跨越异步/流式边界，等待外部 I/O 或增量结果。","在副作用发生前执行安全策略判断。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/cli/src/ui/Chat.tsx",layer:"CLI",summary:"Flutter 展示层组件与用户交互",lineCount:164,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:23,endLine:36,code:"/** 屏幕上的一条消息块（按语义渲染） */\ninterface Line {\n  kind: 'user' | 'token' | 'reasoning' | 'tool_call' | 'tool_result' | 'blocked' | 'error'\n  text: string\n}\n\nexport interface ChatProps {\n  host: Host\n  ssh: SshClient\n  llm: GlmClient\n  confirmer: Confirmer\n  /** ASK 确认框弹出时锁住输入，避免按键串进 TextInput */\n  inputLocked: boolean\n}",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"Chat",kind:"方法 / 函数",startLine:37,endLine:131,code:"export function Chat({ host, ssh, llm, confirmer, inputLocked }: ChatProps) {\n  const [lines, setLines] = useState<Line[]>([])\n  const [input, setInput] = useState('')\n  const [busy, setBusy] = useState(false)\n  // 多轮续聊历史：loop 之间累积（system 由 agent 内部加，这里只存 user/assistant/tool）\n  const [history, setHistory] = useState<ChatMessage[]>([])\n\n  const push = useCallback((line: Line) => {\n    setLines((prev) => [...prev, line])\n  }, [])\n\n  /** 把流式 token 累积到最后一条 token 行，避免每个字一行 */\n  const appendToken = useCallback((kind: 'token' | 'reasoning', text: string) => {\n    setLines((prev) => {\n      const last = prev[prev.length - 1]\n      if (last && last.kind === kind) {\n        const copy = prev.slice(0, -1)\n        copy.push({ kind, text: last.text + text })\n        return copy\n      }\n      return [...prev, { kind, text }]\n    })\n  }, [])\n\n  const onSubmit = useCallback(async () => {\n    const task = input.trim()\n    if (!task || busy) return\n    setInput('')\n    setBusy(true)\n    push({ kind: 'user', text: task })\n\n    try {\n      for await (const ev of runAgent(task, { llm, ssh, confirmer, history })) {\n        switch (ev.type) {\n          case 'token':\n            appendToken('token', ev.text)\n            break\n          case 'reasoning':\n            appendToken('reasoning', ev.text)\n            break\n          case 'tool_call':\n            push({ kind: 'tool_call', text: `${ev.name}(${shorten(ev.args)})` })\n            break\n          case 'tool_result':\n            push({ kind: 'tool_result', text: oneLine(ev.summary) })\n            break\n          case 'blocked':\n            push({ kind: 'blocked', text: `⛔ 已拦截: ${ev.command}  —— ${ev.reason}` })\n            break\n          case 'done':\n            // 最终结论作为一条 token 行收尾（若正文已流式输出过，done 文本可能与其重复，仍补一条确保完整）\n            push({ kind: 'token', text: '\\n' + ev.finalText })\n            break\n          case 'error':\n            push({ kind: 'error', text: `✗ ${ev.message}` })\n            break\n        }\n      }\n      // 续聊：把本轮 user 追进历史（assistant/tool 由下一轮 agent 内部 messages 重建，\n      // 这里保留 user 提问让模型有上下文）\n      setHistory((h) => [...h, { role: 'user', content: task }])\n    } catch (e) {\n      push({ kind: 'error', text: `✗ ${(e as Error).message}` })\n    } finally {\n      setBusy(false)\n    }\n  }, [input, busy, llm, ssh, confirmer, history, push, appendToken])\n\n  return (\n    <Box flexDirection=\"column\" padding={1}>\n      <Text color=\"cyan\">▰ {host.alias ?? host.host}</Text>\n      <Box flexDirection=\"column\" marginTop={1}>\n        {lines.map((l, i) => (\n          <LineView key={i} line={l} />\n        ))}\n      </Box>\n      <Box marginTop={1}>\n        {busy ? (\n          <Text color=\"cyan\">◇ 处理中…</Text>\n        ) : (\n          <>\n            <Text color=\"cyan\">❯ </Text>\n            <TextInput\n              value={input}\n              onChange={setInput}\n              onSubmit={onSubmit}\n              focus={!inputLocked}\n              placeholder=\"描述要排查/执行的任务，回车发送\"\n            />\n          </>\n        )}\n      </Box>\n    </Box>\n  )\n}",purpose:"交互方法“Chat”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","跨越异步/流式边界，等待外部 I/O 或增量结果。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。","展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]},{name:"LineView",kind:"方法 / 函数",startLine:133,endLine:151,code:"/** 单行渲染：按语义上色 */\nfunction LineView({ line }: { line: Line }) {\n  switch (line.kind) {\n    case 'user':\n      return <Text color=\"green\">❯ {line.text}</Text>\n    case 'token':\n      return <Text>{line.text}</Text>\n    case 'reasoning':\n      return <Text dimColor>{line.text}</Text>\n    case 'tool_call':\n      return <Text color=\"cyan\">⚙ {line.text}</Text>\n    case 'tool_result':\n      return <Text dimColor>↳ {line.text}</Text>\n    case 'blocked':\n      return <Text color=\"red\">{line.text}</Text>\n    case 'error':\n      return <Text color=\"red\">{line.text}</Text>\n  }\n}",purpose:"交互方法“LineView”：处理界面渲染、用户操作或视觉状态。",steps:["
