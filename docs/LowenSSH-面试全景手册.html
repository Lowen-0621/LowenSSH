$ </Text>\n        <Text color="white">{pending.command}</Text>\n      </Text>\n      <Text dimColor>执行？ [y] 批准 / [n] 拒绝</Text>\n    </Box>\n  )\n}',purpose:"交互方法“ConfirmPrompt”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/cli/src/ui/HostSelect.tsx",layer:"CLI",summary:"Flutter 展示层组件与用户交互",lineCount:55,order:18,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:10,endLine:14,code:"export interface HostSelectProps {\n  hosts: Host[]\n  onPick: (host: Host) => void\n}",purpose:"Flutter 展示层组件与用户交互。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"HostSelect",kind:"方法 / 函数",startLine:15,endLine:54,code:"export function HostSelect({ hosts, onPick }: HostSelectProps) {\n  const [cursor, setCursor] = useState(0)\n\n  useInput((input, key) => {\n    if (hosts.length === 0) return\n    if (key.upArrow || input === 'k') {\n      setCursor((c) => (c - 1 + hosts.length) % hosts.length)\n    } else if (key.downArrow || input === 'j') {\n      setCursor((c) => (c + 1) % hosts.length)\n    } else if (key.return) {\n      onPick(hosts[cursor]!)\n    }\n  })\n\n  return (\n    <Box flexDirection=\"column\" padding={1}>\n      <Text color=\"cyan\">▰ LowenSSH</Text>\n      <Text dimColor>选择要连接的主机（↑↓ 移动，回车连接，Ctrl+C 退出）</Text>\n      <Box marginTop={1} flexDirection=\"column\">\n        {hosts.length === 0 ? (\n          <Box flexDirection=\"column\">\n            <Text color=\"yellow\">还没有主机。</Text>\n            <Text dimColor>请编辑配置文件添加：{CONFIG_FILE}</Text>\n          </Box>\n        ) : (\n          hosts.map((h, i) => {\n            const active = i === cursor\n            const label = h.alias ? `${h.alias} (${h.user}@${h.host}:${h.port})` : `${h.user}@${h.host}:${h.port}`\n            return (\n              <Text key={h.id} color={active ? 'cyan' : undefined}>\n                {active ? '❯ ' : '  '}\n                {label}\n              </Text>\n            )\n          })\n        )}\n      </Box>\n    </Box>\n  )\n}",purpose:"交互方法“HostSelect”：处理界面渲染、用户操作或视觉状态。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:["展示层只消费状态和语义事件，不承担底层 SSH 或模型协议细节。"],risks:[]}]},{path:"clients/app/test/config_test.dart",layer:"Flutter 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:52,order:19,logicBlocks:[{name:"main",kind:"方法 / 函数",startLine:4,endLine:51,code:"void main() {\n  group('Config 序列化', () {\n    test('Host toJson/fromJson 往返', () {\n      const h = Host(\n        id: 'abc-123',\n        alias: 'web01',\n        host: '10.0.1.21',\n        port: 2222,\n        user: 'deploy',\n        passwordEnc: 'ENCRYPTED==',\n      );\n      final round = Host.fromJson(h.toJson());\n      expect(round.id, h.id);\n      expect(round.alias, h.alias);\n      expect(round.host, h.host);\n      expect(round.port, h.port);\n      expect(round.user, h.user);\n      expect(round.passwordEnc, h.passwordEnc);\n    });\n\n    test('Host 默认值：port 22 / user root', () {\n      final h = Host.fromJson({'id': 'x', 'host': '1.2.3.4'});\n      expect(h.port, 22);\n      expect(h.user, 'root');\n      expect(h.passwordEnc, isNull);\n    });\n\n    test('无密码主机 toJson 不含 passwordEnc 字段', () {\n      const h = Host(id: 'x', host: '1.2.3.4');\n      expect(h.toJson().containsKey('passwordEnc'), false);\n    });\n\n    test('LlmConfig 缺字段回退默认 GLM', () {\n      final c = LlmConfig.fromJson({});\n      expect(c.baseURL, contains('bigmodel.cn'));\n      expect(c.model, 'glm-4.6');\n      expect(c.apiKey, '');\n    });\n\n    test('LlmConfig copyWith 只改指定字段', () {\n      const c = LlmConfig(baseURL: 'u', apiKey: 'k', model: 'm');\n      final c2 = c.copyWith(apiKey: 'new');\n      expect(c2.baseURL, 'u');\n      expect(c2.apiKey, 'new');\n      expect(c2.model, 'm');\n    });\n  });\n}",purpose:"应用入口：完成框架初始化并启动顶层应用。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/test/context_test.dart",layer:"Flutter 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:59,order:19,logicBlocks:[{name:"main",kind:"方法 / 函数",startLine:6,endLine:58,code:"void main() {\n  // 用一个不真正发请求的占位 client（这些测试只覆盖纯逻辑：截断 + token 估算）\n  final cm = ContextManager(\n    GlmClient(const LlmConfig(baseURL: 'http://x', apiKey: 'k', model: 'm')),\n  );\n\n  group('ContextManager Layer 0 截断', () {\n    test('短工具结果不截断', () {\n      final msgs = [ChatMessage.tool('c1', '短结果')];\n      final out = cm.truncateToolResponses(msgs);\n      expect(out[0].content, '短结果');\n    });\n\n    test('近区长结果按大阈值截断并含哨兵', () {\n      final huge = 'x' * 9000; // > toolResultMaxChars(8000)\n      final out = cm.truncateToolResponses([ChatMessage.tool('c1', huge)]);\n      expect(out[0].content!.length, lessThan(9000));\n      expect(out[0].content, contains('完整结果见历史记录'));\n    });\n\n    test('截断幂等：二次截断不再变化', () {\n      final huge = 'y' * 9000;\n      final once = cm.truncateToolResponses([ChatMessage.tool('c1', huge)]);\n      final twice = cm.truncateToolResponses(once);\n      expect(twice[0].content, once[0].content);\n    });\n\n    test('非 tool 消息原样保留', () {\n      final msgs = [ChatMessage.user('hi'), ChatMessage.system('sys')];\n      final out = cm.truncateToolResponses(msgs);\n      expect(out[0].content, 'hi');\n      expect(out[1].content, 'sys');\n    });\n  });\n\n  group('ContextManager token 估算', () {\n    test('按 2.5 字符/token 粗估', () {\n      // 10 个字符 → floor(10/2.5)=4\n      final msgs = [ChatMessage.user('0123456789')];\n      expect(cm.estimateTokens(msgs), 4);\n    });\n\n    test('assistant 的 tool_calls arguments 计入字符数', () {\n      final msgs = [\n        ChatMessage.assistant('ab', toolCalls: [\n          const ToolCall(id: 'i', name: 'n', arguments: '12345'),\n        ]),\n      ];\n      // 'ab'(2) + '12345'(5) = 7 → floor(7/2.5)=2\n      expect(cm.estimateTokens(msgs), 2);\n    });\n  });\n}",purpose:"应用入口：完成框架初始化并启动顶层应用。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]}]},{path:"clients/app/test/crypto_test.dart",layer:"Flutter 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:47,order:19,logicBlocks:[{name:"main",kind:"方法 / 函数",startLine:4,endLine:46,code:"void main() {\n  group('CryptoUtil AES-GCM', () {\n    test('加密后能解回原文', () {\n      const plain = 'my-secret-password-123';\n      final enc = encrypt(plain);\n      expect(enc, isNotNull);\n      expect(enc, isNot(plain));\n      expect(decrypt(enc), plain);\n    });\n\n    test('同一明文每次密文不同（IV 随机）', () {\n      expect(encrypt('same'), isNot(encrypt('same')));\n    });\n\n    test('空值返回 null', () {\n      expect(encrypt(''), isNull);\n      expect(encrypt(null), isNull);\n      expect(decrypt(''), isNull);\n      expect(decrypt(null), isNull);\n    });\n\n    test('中文密码往返正确', () {\n      const plain = '密码测试🔐';\n      expect(decrypt(encrypt(plain)), plain);\n    });\n\n    test('密文被篡改解密抛错（GCM 完整性校验）', () {\n      final enc = encrypt('data')!;\n      final tampered =\n          enc.substring(0, enc.length - 4) + (enc.endsWith('AAAA') ? 'BBBB' : 'AAAA');\n      expect(() => decrypt(tampered), throwsA(anything));\n    });\n\n    // 跨端互通：解密由 TS 端（CLI）用密钥 test-shared-key 加密的密文。\n    // 仅当运行时设了同一密钥才校验，否则跳过（避免本地默认密钥下误失败）。\n    test('跨端互通：解密 TS 端密文', () {\n      const tsEnc =\n          'L+y98S44UB3MnUKWkQZoNFRKgVjlmUwwfIAIDL+SXNxzJsPKY202TtkECUlCPRHlBPikSJ9o';\n      const expected = 'cross-platform-test-密码';\n      expect(decrypt(tsEnc), expected);\n    }, skip: 'TS 与 Dart 已手工互通验证；需 XWSSH_CRYPTO_KEY=test-shared-key 才能跑');\n  });\n}",purpose:"应用入口：完成框架初始化并启动顶层应用。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/test/guard_test.dart",layer:"Flutter 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:87,order:19,logicBlocks:[{name:"main",kind:"方法 / 函数",startLine:4,endLine:86,code:"void main() {\n  group('CommandGuard 门禁三态', () {\n    group('DENY —— 毁灭性操作直接拒', () {\n      const cases = [\n        'rm -rf /',\n        'rm -fr /var/data',\n        'rm -r -f /tmp',\n        'mkfs.ext4 /dev/sdb',\n        'dd if=/dev/zero of=/dev/sda',\n        'shutdown -h now',\n        'reboot',\n        'halt',\n        'echo x > /dev/sda',\n        ':(){ :|:& };:',\n        'mv /important /dev/null',\n        'find /tmp -name \"*.log\" -delete',\n        'find / -name core -exec rm {} \\\\;',\n      ];\n      for (final cmd in cases) {\n        test('拒绝: $cmd', () {\n          expect(evaluate(cmd).decision, Decision.deny);\n        });\n      }\n    });\n\n    group('ASK —— 有副作用需确认', () {\n      const cases = [\n        'rm /tmp/old.log',\n        'kill 1234',\n        'systemctl stop nginx',\n        'systemctl restart docker',\n        'service mysql stop',\n        'chmod 777 /etc/passwd',\n        'chown root:root /opt',\n        'apt-get install vim',\n        'yum remove httpd',\n        'truncate -s 0 app.log',\n        'echo data > /etc/config',\n      ];\n      for (final cmd in cases) {\n        test('询问: $cmd', () {\n          expect(evaluate(cmd).decision, Decision.ask);\n        });\n      }\n    });\n\n    group('ALLOW —— 只读/安全命令放行', () {\n      const cases = [\n        'df -h',\n        'free -m',\n        'ps aux | grep java',\n        'cat /etc/nginx/nginx.conf',\n        'tail -n 100 /var/log/syslog',\n        'ls -la',\n        'add-apt-repository ppa:x', // \\b 不应误伤 add\n      ];\n      for (final cmd in cases) {\n        test('放行: $cmd', () {\n          expect(evaluate(cmd).decision, Decision.allow);\n        });\n      }\n    });\n\n    group('复合命令取最严', () {\n      test('ls && rm -rf / —— 整条 DENY', () {\n        expect(evaluate('ls && rm -rf /').decision, Decision.deny);\n      });\n      test('df -h ; kill 1 —— 整条 ASK', () {\n        expect(evaluate('df -h ; kill 1').decision, Decision.ask);\n      });\n      test('cat a | grep b —— 全只读 ALLOW', () {\n        expect(evaluate('cat a | grep b').decision, Decision.allow);\n      });\n    });\n\n    group('边界', () {\n      test('空命令 ALLOW', () {\n        expect(evaluate('').decision, Decision.allow);\n        expect(evaluate('   ').decision, Decision.allow);\n      });\n    });\n  });\n}",purpose:"应用入口：完成框架初始化并启动顶层应用。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","在副作用发生前执行安全策略判断。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。","安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/ContextOptimizationBenchmarkTest.java",layer:"Java 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:201,order:19,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:35,endLine:36,code:'/**\n * 上下文优化效果基准测试（确定性、可复现，不连真模型）。\n *\n * 目的：用项目自己的 ContextManager.truncateToolResponses + estimateTokens，\n * 在一个仿真的多轮 SSH 运维对话上，量化 Layer 0 分级截断带来的 token 降幅。\n *\n * 场景贴近真实：每轮 AI 调一条命令，命令输出有大有小（cat 配置、tail 日志、\n * ps aux 全进程、ls -laR 等），多轮滚下来未截断的上下文会线性膨胀。\n *\n * 这是离线的字符级估算（2.5 字符/token，与生产同一公式），衡量的是\n * "回灌给模型的副本"的体积差，不是真实账单 token，但口径一致、可复现。\n */\nclass ContextOptimizationBenchmarkTest {',purpose:"自动化测试：验证核心规则、边界与回归行为。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"prod",kind:"方法 / 函数",startLine:37,endLine:40,code:"/** 生产同款默认配置：近区 8000 / 旧区 800 / 保留最近 6 条 */\n    private ContextManager prod() {\n        return new ContextManager(null, 8000, 800, 32000, 6, 3);\n    }",purpose:"测试场景“prod”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toolMsg",kind:"方法 / 函数",startLine:42,endLine:46,code:"private ToolResponseMessage toolMsg(String id, String name, String data) {\n        return ToolResponseMessage.builder()\n                .responses(List.of(new ToolResponseMessage.ToolResponse(id, name, data)))\n                .build();\n    }",purpose:"测试场景“toolMsg”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"opsConversation",kind:"方法 / 函数",startLine:48,endLine:69,code:'/** 仿真一段 N 轮运维对话：system + 每轮(user 任务 + assistant 调用 + 大命令结果) */\n    private List<Message> opsConversation(int rounds) {\n        List<Message> msgs = new ArrayList<>();\n        msgs.add(new SystemMessage("你是 SSH 智能运维助手，可调用 execCommand 执行命令。" + "规则说明".repeat(40)));\n        // 仿真各类命令的真实输出体积（字符数）：日志/进程列表/配置文件等普遍几 KB ~ 几十 KB\n        String[] cmds = {"tail -n 2000 /var/log/nginx/access.log", "ps aux", "cat /etc/nginx/nginx.conf",\n                "ls -laR /var/www", "dmesg", "journalctl -u app -n 1000"};\n        int[] sizes = {28000, 16000, 9000, 22000, 14000, 31000};\n        for (int i = 0; i < rounds; i++) {\n            String cmd = cmds[i % cmds.length];\n            int size = sizes[i % sizes.length];\n            msgs.add(new UserMessage("第" + (i + 1) + "步排查：请检查服务状态"));\n            msgs.add(AssistantMessage.builder()\n                    .content("我执行一下命令看看")\n                    .toolCalls(List.of(new AssistantMessage.ToolCall(\n                            "c" + i, "function", "execCommand", "{\\"command\\":\\"" + cmd + "\\"}")))\n                    .build());\n            // 大命令输出\n            msgs.add(toolMsg("c" + i, "execCommand", "OUTPUT".repeat(size / 6)));\n        }\n        return msgs;\n    }',purpose:"测试场景“opsConversation”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"mockSummaryModel",kind:"方法 / 函数",startLine:89,endLine:99,code:'// ============================ 压测扩展 ============================\n\n    /** mock 摘要模型：返回固定长度摘要文本（模拟 LLM 把一大段压成几百字） */\n    private OpenAiChatModel mockSummaryModel() {\n        OpenAiChatModel m = mock(OpenAiChatModel.class);\n        String summary = "【摘要】已排查 nginx/磁盘/进程，发现日志异常与磁盘偏高，结论见各步。" + "要点".repeat(60);\n        ChatResponse resp = new ChatResponse(List.of(\n                new Generation(new AssistantMessage(summary), ChatGenerationMetadata.NULL)));\n        when(m.call(any(Prompt.class))).thenReturn(resp);\n        return m;\n    }',purpose:"测试场景“mockSummaryModel”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:["核心目标是控制多轮上下文成本，同时尽量保留最新细节和早期结论。"],risks:[]}]},{path:"src/test/java/com/lowenssh/agent/RealTokenBillingTest.java",layer:"Java 测试",summary:"自动化测试：验证核心规则、边界与回归行为",lineCount:202,order:19,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:31,endLine:37,code:'/**\n * 真实账单 token 测试 —— 直连 GLM API 读 usage.prompt_tokens（真实计费 token）。\n *\n * 与离线 benchmark 的区别：这里把「截断前 / 截断后」两版上下文分别真发给 GLM，\n * 读回真实的 prompt_tokens 做对比，是真实账单口径，不是字符估算。\n *\n * 用 ContextManager 做截断（项目真实逻辑）。内容用带变化的拟真运维输出\n * （变化的时间戳/IP/PID），避免重复串被 BPE 分词压没导致数字失真。\n *\n * 仅在设置了 GLM_API_KEY 环境变量时运行，避免 CI 空跑。\n */\n@EnabledIfEnvironmentVariable(named = "GLM_API_KEY", matches = ".+")\nclass RealTokenBillingTest {\n\n    private static final String API = "https://open.bigmodel.cn/api/paas/v4/chat/completions";\n    private static final String MODEL = "glm-4.7";\n    private final HttpClient http = HttpClient.newHttpClient();\n    private final Random rnd = new Random(42);',purpose:"自动化测试：验证核心规则、边界与回归行为。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"prod",kind:"方法 / 函数",startLine:38,endLine:41,code:"/** 生产同款配置（对齐 application.yml）：近区 3000 / 旧区 800 / 保留最近 4 条 */\n    private ContextManager prod() {\n        return new ContextManager(null, 3000, 800, 12000, 4, 3);\n    }",purpose:"测试场景“prod”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toolMsg",kind:"方法 / 函数",startLine:43,endLine:47,code:'private ToolResponseMessage toolMsg(String id, String data) {\n        return ToolResponseMessage.builder()\n                .responses(List.of(new ToolResponseMessage.ToolResponse(id, "execCommand", data)))\n                .build();\n    }',purpose:"测试场景“toolMsg”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"fakeNginxLog",kind:"方法 / 函数",startLine:49,endLine:61,code:'/** 拟真 nginx 访问日志（每行不同：IP/时间/路径/状态码都变化，分词有代表性） */\n    private String fakeNginxLog(int lines) {\n        StringBuilder sb = new StringBuilder();\n        String[] paths = {"/api/user/login", "/api/order/list", "/static/app.js", "/health", "/api/pay/callback"};\n        for (int i = 0; i < lines; i++) {\n            sb.append(String.format("%d.%d.%d.%d - - [%02d/Jun/2026:%02d:%02d:%02d +0800] \\"GET %s HTTP/1.1\\" %d %d\\n",\n                    rnd.nextInt(255), rnd.nextInt(255), rnd.nextInt(255), rnd.nextInt(255),\n                    rnd.nextInt(28) + 1, rnd.nextInt(24), rnd.nextInt(60), rnd.nextInt(60),\n                    paths[rnd.nextInt(paths.length)], new int[]{200, 200, 404, 500, 302}[rnd.nextInt(5)],\n                    rnd.nextInt(50000)));\n        }\n        return sb.toString();\n    }',purpose:"测试场景“fakeNginxLog”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"fakePs",kind:"方法 / 函数",startLine:63,endLine:74,code:'/** 拟真 ps aux 进程列表 */\n    private String fakePs(int lines) {\n        StringBuilder sb = new StringBuilder("USER  PID %CPU %MEM    VSZ   RSS TTY STAT START   TIME COMMAND\\n");\n        String[] procs = {"nginx", "java -jar app.jar", "mysqld", "sshd", "redis-server", "python3 worker.py"};\n        for (int i = 0; i < lines; i++) {\n            sb.append(String.format("root %5d %.1f %.1f %7d %6d ?  Ss %02d:%02d %d:%02d %s\\n",\n                    rnd.nextInt(30000), rnd.nextDouble() * 100, rnd.nextDouble() * 20,\n                    rnd.nextInt(2000000), rnd.nextInt(500000), rnd.nextInt(24), rnd.nextInt(60),\n                    rnd.nextInt(100), rnd.nextInt(60), procs[rnd.nextInt(procs.length)]));\n        }\n        return sb.toString();\n    }',purpose:"测试场景“fakePs”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"opsConversation",kind:"方法 / 函数",startLine:76,endLine:91,code:'/** 仿真 N 轮运维对话，命令输出是拟真日志/进程列表 */\n    private List<Message> opsConversation(int rounds) {\n        List<Message> msgs = new ArrayList<>();\n        msgs.add(new SystemMessage("你是 SSH 智能运维助手，可调用 execCommand 执行命令排查服务器问题。"));\n        for (int i = 0; i < rounds; i++) {\n            msgs.add(new UserMessage("第" + (i + 1) + "步：检查服务状态"));\n            String cmd = i % 2 == 0 ? "tail -n 300 access.log" : "ps aux";\n            msgs.add(AssistantMessage.builder().content("执行 " + cmd)\n                    .toolCalls(List.of(new AssistantMessage.ToolCall(\n                            "c" + i, "function", "execCommand", "{\\"command\\":\\"" + cmd + "\\"}")))\n                    .build());\n            String out = i % 2 == 0 ? fakeNginxLog(300) : fakePs(200);\n            msgs.add(toolMsg("c" + i, out));\n        }\n        return msgs;\n    }',purpose:"测试场景“opsConversation”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"toRequestJson",kind:"方法 / 函数",startLine:93,endLine:114,code:'/** 把 messages 渲染成 GLM chat 请求的 messages JSON（system/user/assistant 都拍平成文本，够测 prompt token） */\n    private String toRequestJson(List<Message> msgs) {\n        StringBuilder arr = new StringBuilder("[");\n        for (int i = 0; i < msgs.size(); i++) {\n            Message m = msgs.get(i);\n            String role, content;\n            if (m instanceof SystemMessage) { role = "system"; content = m.getText(); }\n            else if (m instanceof UserMessage) { role = "user"; content = m.getText(); }\n            else if (m instanceof ToolResponseMessage trm) {\n                role = "user"; // 测 prompt token 用，工具结果拍平成 user 文本即可\n                content = "工具结果:\\n" + trm.getResponses().get(0).responseData();\n            } else if (m instanceof AssistantMessage am) {\n                role = "assistant";\n                content = am.getText() == null ? "" : am.getText();\n            } else { role = "user"; content = m.getText() == null ? "" : m.getText(); }\n            if (i > 0) arr.append(",");\n            arr.append("{\\"role\\":\\"").append(role).append("\\",\\"content\\":")\n               .append(jsonStr(content)).append("}");\n        }\n        arr.append("]");\n        return "{\\"model\\":\\"" + MODEL + "\\",\\"messages\\":" + arr + ",\\"max_tokens\\":1,\\"stream\\":false}";\n    }',purpose:"测试场景“toRequestJson”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"jsonStr",kind:"方法 / 函数",startLine:116,endLine:129,code:'private String jsonStr(String s) {\n        StringBuilder sb = new StringBuilder("\\"");\n        for (char c : s.toCharArray()) {\n            switch (c) {\n                case \'"\' -> sb.append("\\\\\\"");\n                case \'\\\\\' -> sb.append("\\\\\\\\");\n                case \'\\n\' -> sb.append("\\\\n");\n                case \'\\r\' -> sb.append("\\\\r");\n                case \'\\t\' -> sb.append("\\\\t");\n                default -> sb.append(c);\n            }\n        }\n        return sb.append("\\"").toString();\n    }',purpose:"测试场景“jsonStr”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"callGlm",kind:"方法 / 函数",startLine:131,endLine:148,code:'/** 发一次真实请求，返回 [prompt_tokens, cached_tokens] */\n    private int[] callGlm(List<Message> msgs) throws Exception {\n        String body = toRequestJson(msgs);\n        HttpRequest req = HttpRequest.newBuilder(URI.create(API))\n                .header("Authorization", "Bearer " + System.getenv("GLM_API_KEY"))\n                .header("Content-Type", "application/json")\n                .POST(HttpRequest.BodyPublishers.ofString(body))\n                .build();\n        HttpResponse<String> resp = http.send(req, HttpResponse.BodyHandlers.ofString());\n        String r = resp.body();\n        int prompt = extractInt(r, "prompt_tokens");\n        int cached = extractCached(r);\n        if (prompt < 0) {\n            System.out.println("  [警告] 未解析到 prompt_tokens，响应片段: "\n                    + r.substring(0, Math.min(300, r.length())));\n        }\n        return new int[]{prompt, cached};\n    }',purpose:"测试场景“callGlm”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"extractInt",kind:"方法 / 函数",startLine:150,endLine:159,code:'private int extractInt(String json, String key) {\n        int k = json.indexOf("\\"" + key + "\\"");\n        if (k < 0) return -1;\n        int colon = json.indexOf(\':\', k);\n        int end = colon + 1;\n        while (end < json.length() && !Character.isDigit(json.charAt(end))) end++;\n        int start = end;\n        while (end < json.length() && Character.isDigit(json.charAt(end))) end++;\n        return start < end ? Integer.parseInt(json.substring(start, end)) : -1;\n    }',purpose:"测试场景“extractInt”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"extractCached",kind:"方法 / 函数",startLine:161,endLine:165,code:'/** cached_tokens 在 prompt_tokens_details 里，可能不存在 */\n    private int extractCached(String json) {\n        int v = extractInt(json, "cached_tokens");\n        return v < 0 ? 0 : v;\n    }',purpose:"测试场景“extractCached”：构造输入并断言核心行为，防止边界逻辑回归。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"docker-compose.yml",layer:"工程与文档",summary:"容器化构建、运行编排、健康检查与密钥注入",lineCount:39,order:20,logicBlocks:[{name:"services",kind:"配置分组",startLine:3,endLine:36,code:'services:\n  mysql:\n    image: mysql:8.4\n    environment:\n      # root 密码 + 自动建库 lowenssh\n      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}\n      MYSQL_DATABASE: lowenssh\n    ports:\n      - "3306:3306"\n    volumes:\n      # 容器首次启动时在 lowenssh 库执行建表脚本\n      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro\n      - mysql-data:/var/lib/mysql\n    healthcheck:\n      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n\n  app:\n    build: .\n    ports: String? ?? '${j['ts'] ?? 0}',",purpose:"实现“AgentHistoryEntry”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"loadAgentHistory",kind:"方法 / 函数",startLine:57,endLine:71,code:"/// 读取某主机的全部历史会话（按时间倒序，最新在前）；无文件返回空。\nList<AgentHistoryEntry> loadAgentHistory(String hostId) {\n  final file = File(_historyFile(hostId));\n  if (!file.existsSync()) return [];\n  try {\n    final list = jsonDecode(file.readAsStringSync()) as List<dynamic>;\n    final entries = list\n        .map((e) => AgentHistoryEntry.fromJson(e as Map<String, dynamic>))\n        .toList();\n    entries.sort((a, b) => b.ts.compareTo(a.ts)); // 最新在前\n    return entries;\n  } catch (_) {\n    return [];\n  }\n}",purpose:"封装“loadAgentHistory”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"appendAgentHistory",kind:"方法 / 函数",startLine:73,endLine:104,code:"/// 追加一条历史会话存档（写整文件）。items 为空则跳过（不存空会话）。\nvoid appendAgentHistory(\n    String hostId, List<ChatItem> items, List<ChatMessage> history) {\n  if (items.isEmpty) return;\n  final dir = Directory(_historyDir);\n  if (!dir.existsSync()) dir.createSync(recursive: true);\n\n  final now = DateTime.now().millisecondsSinceEpoch;\n  // 标题取首条用户消息，截断 30 字；无则用「未命名会话」\n  String title = '';\n  for (final it in items) {\n    if (it.kind == ChatItemKind.user && it.text.trim().isNotEmpty) {\n      title = it.text.trim();\n      break;\n    }\n  }\n  if (title.isEmpty) title = items.first.text.trim();\n  if (title.length > 30) title = '${title.substring(0, 30)}…';\n\n  final entry = AgentHistoryEntry(\n    id: '$now',\n    title: title,\n    ts: now,\n    items: items,\n    history: history,\n  );\n\n  final existing = loadAgentHistory(hostId);\n  existing.insert(0, entry); // 最新在前\n  File(_historyFile(hostId))\n      .writeAsStringSync(jsonEncode(existing.map((e) => e.toJson()).toList()));\n}",purpose:"封装“appendAgentHistory”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","遍历集合或持续推进循环，直到满足退出条件。","读写持久化状态，使会话、配置或审计能够恢复。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"deleteAgentHistoryEntry",kind:"方法 / 函数",startLine:106,endLine:114,code:"/// 删除某主机某条历史会话。\nvoid deleteAgentHistoryEntry(String hostId, String entryId) {\n  final existing = loadAgentHistory(hostId);\n  existing.removeWhere((e) => e.id == entryId);\n  final dir = Directory(_historyDir);\n  if (!dir.existsSync()) dir.createSync(recursive: true);\n  File(_historyFile(hostId))\n      .writeAsStringSync(jsonEncode(existing.map((e) => e.toJson()).toList()));\n}",purpose:"实现“deleteAgentHistoryEntry”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/core/audit_store.dart",layer:"Flutter 核心",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:79,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:10,endLine:32,code:"/// 一条审计记录\nclass AuditEntry {\n  final String command;\n  final String decision; // deny / ask / allow\n  final bool executed; // 是否真正执行（deny/拒绝为 false）\n  final String host; // 来源主机显示名（别名或 host）\n  final DateTime time;\n\n  const AuditEntry({\n    required this.command,\n    required this.decision,\n    required this.executed,\n    required this.host,\n    required this.time,\n  });\n\n  factory AuditEntry.fromJson(Map<String, dynamic> j) => AuditEntry(\n        command: j['command'] as String? ?? '',\n        decision: j['decision'] as String? ?? 'allow',\n        executed: j['executed'] as bool? ?? false,\n        host: j['host'] as String? ?? '-',\n        time: DateTime.tryParse(j['time'] as String? ?? '') ?? DateTime.now(),\n      );",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"toJson",kind:"方法 / 函数",startLine:33,endLine:39,code:"Map<String, dynamic> toJson() => {\n        'command': command,\n        'decision': decision,\n        'executed': executed,\n        'host': host,\n        'time': time.toIso8601String(),\n      };",purpose:"实现“toJson”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"loadAudit",kind:"方法 / 函数",startLine:48,endLine:60,code:"/// 读全部审计记录（最新在前）。文件不存在/损坏返回空。\nList<AuditEntry> loadAudit() {\n  final file = File(_file);\n  if (!file.existsSync()) return [];\n  try {\n    final list = jsonDecode(file.readAsStringSync()) as List<dynamic>;\n    return list\n        .map((e) => AuditEntry.fromJson(e as Map<String, dynamic>))\n        .toList();\n  } catch (_) {\n    return [];\n  }\n}",purpose:"封装“loadAudit”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"appendAudit",kind:"方法 / 函数",startLine:62,endLine:68,code:"/// 追加一条审计记录（写整文件，超过上限丢弃最旧的）。返回更新后的列表。\nList<AuditEntry> appendAudit(AuditEntry entry) {\n  final list = [entry, ...loadAudit()];\n  if (list.length > _maxEntries) list.removeRange(_maxEntries, list.length);\n  _write(list);\n  return list;\n}",purpose:"封装“appendAudit”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"clearAudit",kind:"方法 / 函数",startLine:70,endLine:71,code:"/// 清空审计\nvoid clearAudit() => _write(const []);",purpose:"实现“clearAudit”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"_write",kind:"方法 / 函数",startLine:73,endLine:78,code:"void _write(List<AuditEntry> list) {\n  final dir = Directory(File(_file).parent.path);\n  if (!dir.existsSync()) dir.createSync(recursive: true);\n  File(_file).writeAsStringSync(\n      jsonEncode(list.map((e) => e.toJson()).toList()));\n}",purpose:"实现“_write”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/core/chat_store.dart",layer:"Flutter 核心",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:70,order:999,logicBlocks:[{name:"_chatFile",kind:"方法 / 函数",startLine:20,endLine:20,code:"String _chatFile(String hostId) => '$_chatsDir/$hostId.json';",purpose:"实现“_chatFile”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"loadChat",kind:"方法 / 函数",startLine:29,endLine:48,code:"/// 读取某主机的对话存档；文件不存在或损坏则返回空存档。\nChatArchive loadChat(String hostId) {\n  final file = File(_chatFile(hostId));\n  if (!file.existsSync()) {\n    return const ChatArchive(items: [], history: []);\n  }\n  try {\n    final parsed = jsonDecode(file.readAsStringSync()) as Map<String, dynamic>;\n    final items = (parsed['items'] as List<dynamic>? ?? [])\n        .map((e) => ChatItem.fromJson(e as Map<String, dynamic>))\n        .toList();\n    final history = (parsed['history'] as List<dynamic>? ?? [])\n        .map((e) => ChatMessage.fromJson(e as Map<String, dynamic>))\n        .toList();\n    return ChatArchive(items: items, history: history);\n  } catch (_) {\n    // 存档损坏不影响使用，退回空存档\n    return const ChatArchive(items: [], history: []);\n  }\n}",purpose:"封装“loadChat”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"saveChat",kind:"方法 / 函数",startLine:50,endLine:59,code:"/// 写入某主机的对话存档（覆盖整文件）。\nvoid saveChat(String hostId, List<ChatItem> items, List<ChatMessage> history) {\n  final dir = Directory(_chatsDir);\n  if (!dir.existsSync()) dir.createSync(recursive: true);\n  final json = jsonEncode({\n    'items': items.map((e) => e.toJson()).toList(),\n    'history': history.map((e) => e.toJson()).toList(),\n  });\n  File(_chatFile(hostId)).writeAsStringSync(json);\n}",purpose:"实现“saveChat”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"deleteChat",kind:"方法 / 函数",startLine:61,endLine:69,code:"/// 删除某主机的对话存档（删主机时调用）。\nvoid deleteChat(String hostId) {\n  final file = File(_chatFile(hostId));\n  if (file.existsSync()) {\n    try {\n      file.deleteSync();\n    } catch (_) {}\n  }\n}",purpose:"实现“deleteChat”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"clients/app/lib/core/i18n.dart",layer:"Flutter 核心",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:311,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:7,endLine:300,code:"/// 支持的语言\nenum AppLang { zh, en }\n\n/// 文案字典。外层 key 是文案标识，内层按语言取值。\n/// 约定：key 用点分命名空间（settings.title / common.save）。\nconst Map<String, Map<AppLang, String>> _dict = {\n  // 通用动作\n  'common.save': {AppLang.zh: '保存', AppLang.en: 'Save'},\n  'common.cancel': {AppLang.zh: '取消', AppLang.en: 'Cancel'},\n  'common.delete': {AppLang.zh: '删除', AppLang.en: 'Delete'},\n  'common.add': {AppLang.zh: '添加', AppLang.en: 'Add'},\n  'common.close': {AppLang.zh: '关闭', AppLang.en: 'Close'},\n  'common.version': {AppLang.zh: '版本', AppLang.en: 'Version'},\n\n  // 设置中心 - 导航\n  'settings.title': {AppLang.zh: '设置', AppLang.en: 'Settings'},\n  'settings.nav.aiModel': {AppLang.zh: 'AI 模型', AppLang.en: 'AI Model'},\n  'settings.nav.common': {AppLang.zh: '通用', AppLang.en: 'Common'},\n  'settings.nav.terminal': {AppLang.zh: '终端', AppLang.en: 'Terminal'},\n  'settings.nav.theme': {AppLang.zh: '外观', AppLang.en: 'Appearance'},\n  'settings.theme.scheme': {AppLang.zh: '配色方案', AppLang.en: 'Color Scheme'},\n  'settings.theme.hint': {\n    AppLang.zh: '选择应用的整体配色，立即生效。',\n    AppLang.en: 'Pick the app color scheme. Applies instantly.'\n  },\n  'settings.nav.security': {AppLang.zh: '安全', AppLang.en: 'Security'},\n  'settings.nav.shortcuts': {AppLang.zh: '快捷键', AppLang.en: 'Shortcuts'},\n\n  // 通用页\n  'settings.common.title': {AppLang.zh: '通用设置', AppLang.en: 'Common Settings'},\n  'settings.common.language': {AppLang.zh: '语言', AppLang.en: 'Language'},\n  'settings.common.langZh': {AppLang.zh: '简体中文', AppLang.en: 'Simplified Chinese'},\n  'settings.common.langEn': {AppLang.zh: '英文', AppLang.en: 'English'} inal b = Uint8List(_saltLen);\n  for (var i = 0; i < _saltLen; i++) {\n    b[i] = rnd.nextInt(256);\n  }\n  return b;\n}",purpose:"封装“_randomSalt”对应的业务计算，并向调用方返回处理结果。",steps:["遍历集合或持续推进循环，直到满足退出条件。","返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]},{name:"hasMasterPassword",kind:"方法 / 函数",startLine:41,endLine:42,code:"/// 是否已设置主密码\nbool hasMasterPassword() => File(_lockFile).existsSync();",purpose:"实现“hasMasterPassword”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"setMasterPassword",kind:"方法 / 函数",startLine:44,endLine:61,code:"/// 设置/修改主密码（覆盖写）\nvoid setMasterPassword(String pwd) {\n  final salt = _randomSalt();\n  final data = {\n    'salt': base64.encode(salt),\n    'hash': _hash(pwd, salt),\n    'rounds': _rounds,\n  };\n  final dir = Directory(\n      '${Platform.environment['HOME'] ?? Platform.environment['USERPROFILE'] ?? '.'}/.lowenssh');\n  if (!dir.existsSync()) dir.createSync(recursive: true);\n  final f = File(_lockFile);\n  f.writeAsStringSync(const JsonEncoder.withIndent('  ').convert(data));\n  // 权限 600（仅本人可读写）\n  try {\n    Process.runSync('chmod', ['600', _lockFile]);\n  } catch (_) {/* Windows 无 chmod，忽略 */}\n}",purpose:"实现“setMasterPassword”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]},{name:"clearMasterPassword",kind:"方法 / 函数",startLine:63,endLine:67,code:"/// 取消主密码（删除锁文件）\nvoid clearMasterPassword() {\n  final f = File(_lockFile);\n  if (f.existsSync()) f.deleteSync();\n}",purpose:"实现“clearMasterPassword”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["根据输入、连接或业务状态选择处理分支。"],designNotes:[],risks:[]},{name:"verifyMasterPassword",kind:"方法 / 函数",startLine:69,endLine:80,code:"/// 校验主密码是否正确\nbool verifyMasterPassword(String pwd) {\n  final f = File(_lockFile);\n  if (!f.existsSync()) return true; // 没设锁视为通过\n  try {\n    final j = jsonDecode(f.readAsStringSync()) as Map<String, dynamic>;\n    final salt = base64.decode(j['salt'] as String);\n    return _hash(pwd, Uint8List.fromList(salt)) == j['hash'] as String;\n  } catch (_) {\n    return false;\n  }\n}",purpose:"封装“verifyMasterPassword”对应的业务计算，并向调用方返回处理结果。",steps:["根据输入、连接或业务状态选择处理分支。","捕获外部调用失败，将异常转换成可控错误或降级结果。","返回领域结果或提前结束当前控制流。"],designNotes:["外部 I/O 被包在异常边界内，避免单次失败拖垮整个 Agent 循环。"],risks:[]}]},{path:"clients/app/lib/core/palette.dart",layer:"Flutter 核心",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:226,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:5,endLine:221,code:"/// 一套配色方案的数据载体。字段与 theme.dart 的 AppColors 一一对应。\n/// 新增配色只需 new 一个 AppPalette 实例，不必改调用点。\nclass AppPalette {\n  final String id; //        持久化用的稳定标识\n  final String nameZh; //    显示名（中）\n  final String nameEn; //    显示名（英）\n  final Brightness brightness; // 亮/暗，给 Flutter ThemeData 用\n\n  final Color base; //       主背景\n  final Color mantle; //     次背景（侧栏）\n  final Color crust; //      最深（终端/状态栏）\n  final Color surface0; //   边框/分隔\n  final Color surface1; //   高亮边框\n  final Color surface2;\n  final Color text; //       主文字\n  final Color subtext; //    次文字\n  final Color overlay; //    暗淡文字\n  final Color blue;\n  final Color lavender;\n  final Color sapphire;\n  final Color green;\n  final Color yellow;\n  final Color peach;\n  final Color red;\n  final Color mauve;\n  final Color teal;\n  final Color pink;\n\n  const AppPalette({\n    required this.id,\n    required this.nameZh,\n    required this.nameEn,\n    required this.brightness,\n    required this.base,\n    required this.mantle,\n    required this.crust,\n    required this.surface0,\n    required this.surface1,\n    required this.surface2,\n    required this.text,\n    required this.subtext,\n    required this.overlay,\n    required this.blue,\n    required this.lavender,\n    required this.sapphire,\n    required this.green,\n    required this.yellow,\n    required this.peach,\n    required this.red,\n    required this.mauve,\n    required this.teal,\n    required this.pink,\n  });\n}\n\n/// 内置配色 门禁统计：三态计数 + 阻止历史。供右栏安全面板可视化。\nclass GuardStats {\n  final int denyCount; // 已阻止（DENY 命中 + 用户拒绝）\n  final int askCount; // 待确认（ASK 触发次数）\n  final int allowCount; // 已放行（只读/安全命令执行）\n  final List<GuardRecord> blocked; // 阻止历史（最新在前）\n\n  const GuardStats({\n    this.denyCount = 0,\n    this.askCount = 0,\n    this.allowCount = 0,\n    this.blocked = const [],\n  });",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达事件和传输对象，降低状态意外变化。"],risks:[]},{name:"copyWith",kind:"方法 / 函数",startLine:26,endLine:31,code:"GuardStats copyWith({\n    int? denyCount,\n    int? askCount,\n    int? allowCount,\n    List<GuardRecord>? blocked,\n  }) =>",purpose:"状态方法“copyWith”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"GuardStats",kind:"方法 / 函数",startLine:32,endLine:71,code:"GuardStats(\n        denyCount: denyCount ?? this.denyCount,\n        askCount: askCount ?? this.askCount,\n        allowCount: allowCount ?? this.allowCount,\n        blocked: blocked ?? this.blocked,\n      );\n}\n\n/// 门禁统计 Notifier —— agent 执行命令时由 agent_provider 记账。\n/// 每条命令同时落审计盘（auditProvider）。\nclass GuardNotifier extends Notifier<GuardStats> {\n  @override\n  GuardStats build() => const GuardStats();\n\n  /// 命令被 DENY 拦截 / 用户拒绝\n  void recordDeny(String command, {String host = '-'}) {\n    state = state.copyWith(\n      denyCount: state.denyCount + 1,\n      blocked: [GuardRecord(command, 'deny', DateTime.now()), ...state.blocked],\n    );\n    _audit(command, 'deny', false, host);\n  }\n\n  /// 命令触发 ASK（待人工确认）\n  void recordAsk() {\n    state = state.copyWith(askCount: state.askCount + 1);\n  }\n\n  /// 命令放行执行（只读/安全）\n  void recordAllow(String command, {String host = '-'}) {\n    state = state.copyWith(allowCount: state.allowCount + 1);\n    _audit(command, 'allow', true, host);\n  }\n\n  /// 落审计盘并刷新审计 provider\n  void _audit(String command, String decision, bool executed, String host) {\n    ref.read(auditProvider.notifier).record(\n        command: command, decision: decision, executed: executed, host: host);\n  }\n}",purpose:"状态方法“GuardStats”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["在副作用发生前执行安全策略判断。"],designNotes:["安全判定保持为独立、确定性代码路径，不依赖模型自觉。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:78,endLine:79,code:"@override\n  List<AuditEntry> build() => loadAudit();",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"record",kind:"方法 / 函数",startLine:81,endLine:95,code:"/// 记一条审计（落盘 + 刷新）\n  void record({\n    required String command,\n    required String decision,\n    required bool executed,\n    required String host,\n  }) {\n    state = appendAudit(AuditEntry(\n      command: command,\n      decision: decision,\n      executed: executed,\n      host: host,\n      time: DateTime.now(),\n    ));\n  }",purpose:"状态方法“record”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"clear",kind:"方法 / 函数",startLine:97,endLine:101,code:"/// 清空审计\n  void clear() {\n    clearAudit();\n    state = [];\n  }",purpose:"状态方法“clear”：更新当前功能状态，并通知依赖该状态的界面刷新。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]}]},{path:"clients/app/lib/state/key_provider.dart",layer:"Flutter 状态",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:38,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:7,endLine:7,code:"/// 密钥库 Notifier —— 增删 SSH 私钥，落盘持久化。\n/// 复用 config.json（与 hosts 同文件），变更后刷新 configProvider 让主机表单也能取到最新密钥。\nclass KeyNotifier extends Notifier<List<SshKey>> {",purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"build",kind:"UI 生命周期",startLine:8,endLine:9,code:"@override\n  List<SshKey> build() => loadConfig().keys;",purpose:"构建界面或状态对象，把响应式状态映射为当前可见 UI。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"add",kind:"方法 / 函数",startLine:11,endLine:21,code:"/// 新增密钥（私钥/passph .sapphire;\n  AppColors.green = p.green;\n  AppColors.yellow = p.yellow;\n  AppColors.peach = p.peach;\n  AppColors.red = p.red;\n  AppColors.mauve = p.mauve;\n  AppColors.teal = p.teal;\n  AppColors.pink = p.pink;\n}",purpose:"实现“applyPalette”对应的功能逻辑，封装当前模块的一项可复用行为。",steps:["按声明顺序完成数据转换或状态更新。"],designNotes:[],risks:[]},{name:"buildTheme",kind:"方法 / 函数",startLine:62,endLine:80,code:"ThemeData buildTheme() {\n  final base = ThemeData(brightness: _current.brightness, useMaterial3: true);\n  return base.copyWith(\n    scaffoldBackgroundColor: AppColors.base,\n    colorScheme: base.colorScheme.copyWith(\n      surface: AppColors.base,\n      primary: AppColors.blue,\n      secondary: AppColors.sapphire,\n      error: AppColors.red,\n      onSurface: AppColors.text,\n    ),\n    textTheme: base.textTheme.apply(\n      bodyColor: AppColors.text,\n      displayColor: AppColors.text,\n      fontFamily: '-apple-system',\n    ),\n    dividerColor: AppColors.surface0,\n  );\n}",purpose:"封装“buildTheme”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"clients/cli/src/cli.tsx",layer:"CLI",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:30,order:999,logicBlocks:[]},{path:"clients/cli/tsconfig.json",layer:"CLI 配置",summary:"本地配置、主机/模型设置及安全持久化",lineCount:21,order:999,logicBlocks:[]},{path:"clients/cli/tsup.config.ts",layer:"CLI 配置",summary:"本地配置、主机/模型设置及安全持久化",lineCount:16,order:999,logicBlocks:[]},{path:"clients/cli/vitest.config.ts",layer:"CLI 配置",summary:"本地配置、主机/模型设置及安全持久化",lineCount:9,order:999,logicBlocks:[]},{path:"src/main/java/com/lowenssh/agent/guard/AutoConfirmationHandler.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:18,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:10,endLine:11,code:'/**\n * 自动确认实现 —— REST/自动化测试场景用：ask 态默认放行。\n *\n * 注意：这不削弱安全。deny 态命令在门禁那层就被拦死了，根本到不了这里；\n * 这里只处理 ask 态（"可疑但不致命"），自动场景下选择放行以便自动化跑通。\n * 真要人盯着的高危场景用 ConsoleConfirmationHandler 走真人 y/n。\n */\npublic class AutoConfirmationHandler implements ConfirmationHandler {',purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]},{name:"confirm",kind:"方法 / 函数",startLine:12,endLine:16,code:"@Override\n    public boolean confirm(String command, String reason) {\n        // 自动放行 ask 态命令（deny 已在门禁拦截）\n        return true;\n    }",purpose:"封装“confirm”对应的业务计算，并向调用方返回处理结果。",steps:["返回领域结果或提前结束当前控制流。"],designNotes:[],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/guard/ConfirmationHandler.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:20,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:9,endLine:20,code:'/**\n * 人工确认抽象 —— ask 态命令在执行前问一句"干不干"。\n *\n * 为什么抽象成接口：不同入口的确认方式不一样。控制台走 System.in 真敲 y/n；\n * 将来 WebSocket 走前端弹窗。loop 只依赖这个接口，换入口不动核心逻辑。\n */\npublic interface ConfirmationHandler {\n\n    /**\n     * 请求用户确认是否执行某条命令。\n     *\n     * @param command 待执行的完整命令\n     * @param reason  为什么需要确认（门禁给出的原因，例如"涉及写操作 rm"）\n     * @return true=批准执行，false=拒绝\n     */\n    boolean confirm(String command, String reason);\n}',purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["字段集中展示了该模块的依赖关系与生命周期状态。"],risks:[]}]},{path:"src/main/java/com/lowenssh/agent/guard/ConsoleConfirmationHandler.java",layer:"Java 后端",summary:"项目组成文件；按功能代码块解释其结构与作用",lineCount:25,order:999,logicBlocks:[{name:"类型结构与核心状态",kind:"类型 / 数据模型",startLine:11,endLine:15,code:'/**\n * 控制台确认实现 —— 前台运行时走 System.in，真人敲 y/n。\n *\n * 用于 CLI 交互入口（CommandLineRunner 模式）演示"执行前人工确认"这一刀。\n * Web 后台进程没有终端，别用这个，用 AutoConfirmationHandler。\n */\npublic class ConsoleConfirmationHandler implements ConfirmationHandler {\n\n    // System.in 全局只有一个，复用同一个 Scanner，别每次 new（会吃掉缓冲）\n    private final Scanner scanner = new Scanner(System.in);',purpose:"项目组成文件；按功能代码块解释其结构与作用。这里定义模块持有的依赖、状态字段、数据结构或协议类型。",steps:["声明模块边界与数据形状。","保存后续方法执行所需的依赖和可变/不可变状态。"],designNotes:["优先使用不可变数据结构表达 "clients/cli/src/ui/Chat.tsx",method:"Chat",title:"输入提交回调",why:"onSubmit 是 Chat 函数内部闭包；检查 task、busy、history，然后 for await 消费 AgentEvent。",watch:["task","busy","history.length"],stack:["Ink input event","Chat.onSubmit"],result:"调用 runAgent 返回 AsyncGenerator，不会一次返回最终文本。"},{op:"INTO",file:"clients/cli/src/core/agent.ts",method:"runAgent",title:"进入 CLI Agent Loop",why:"逻辑与 Java 同源，但用 async generator yield 事件。",watch:["round","messages","result.toolCalls"],stack:["Chat.onSubmit","runAgent AsyncGenerator"],result:"每次 next() 推进到下一个 yield；最终 return 结束生成器。"},{op:"INTO",file:"clients/cli/src/core/agent.ts",method:"screenAndRun",title:"CLI 门禁与工具执行",why:"非 execCommand 直接执行；execCommand 调 evaluate，ASK 则 await confirmer。",watch:["name","verdict.decision","content"],stack:["runAgent","screenAndRun"],result:"返回 {content,rejected}，同时产生 blocked/tool_result 事件。"},{op:"OUT",file:"clients/cli/src/ui/Chat.tsx",method:"Chat",title:"事件回到 UI 渲染",why:"switch(ev.type) 追加/合并文本、工具和拦截行；生成器结束后 finally 清 busy。",stack:["Chat.onSubmit"],result:"Ink 重新渲染终端界面。注意当前 CLI 历史只追加 user，是已识别技术债。"}]},{id:"flutter",order:"09",title:"Flutter：连接、Agent、ASK 人工确认",trigger:"桌面端选择主机 → 连接 → 输入任务 → 命中 ASK 命令 → 用户允许/拒绝",goal:"理解 Riverpod 状态、Stream 订阅、Completer 确认桥和 UI 事件映射。",example:"命令 systemctl restart nginx 命中 ASK",steps:[{op:"BREAK",file:"clients/app/lib/main.dart",method:"main",title:"Flutter 应用入口",why:"ProviderScope 建立全局 Riverpod 容器，LowenSshApp 决定先显示锁屏还是主界面。",stack:["Dart main","runApp"],result:"创建 Flutter widget tree。",config:[{file:"clients/app/pubspec.yaml",block:"dependencies",why:"Riverpod、dartssh2、Dio、加密和终端依赖。"}]},{op:"INTO",file:"clients/app/lib/state/connection_provider.dart",method:"connect",title:"连接状态机",why:"先查连接池，再按 LRU 腾位；优先私钥，密码作为回退。",watch:["existing","_pool.length","pem","password","entry.phase"],stack:["UI click handler","ConnectionNotifier.connect"],result:"成功后 entry.phase=connected、client 非空，并发布 ConnState。"},{op:"BREAK",file:"clients/app/lib/state/agent_provider.dart",method:"send",title:"发送任务入口",why:"检查当前主机、连接状态与 s.running；创建 AgentDeps 后订阅 runAgent Stream。",watch:["hostId","s.running","s.history.length","s.undoMark"],stack:["AiPane._send","AgentNotifier.send"],result:"立即保存 StreamSubscription；事件随后异步回调 _onEvent。"},{op:"INTO",file:"clients/app/lib/core/agent.dart",method:"_runLoop",title:"桌面端 Agent Loop",why:"GlmClient.stream 的 onToken/onReasoning 直接 controller.add；工具调用逐个进入 _screenAndRun。",watch:["round","messages.length","newTurn","result.toolCalls"],stack:["StreamController.onListen","_runLoop"],result:"Stream<AgentEvent> 持续发事件；结束时把 newTurn 回写 history。"},{op:"BRANCH",file:"clients/app/lib/core/agent.dart",method:"_screenAndRun",title:"ASK 分支挂起执行",why:"systemctl restart 命中 Decision.ask；代码 await confirmer，SSH 尚未执行。",watch:["verdict.decision","verdict.reason"],stack:["_runLoop","_screenAndRun","AgentNotifier._confirm"],result:"等待 Future<bool>，当前 async 栈挂起。"},{op:"INTO",file:"clients/app/lib/state/agent_provider.dart",method:"_confirm",title:"Completer 桥接到 UI",why:"创建 PendingAsk 放入当前主机会话并刷新界面；返回 completer.future。",watch:["ask.completer.isCompleted","pendingAsk"],stack:["AgentNotifier._confirm"],result:"Future<bool> 未完成，UI 显示允许/拒绝卡片。"},{op:"BREAK",file:"clients/app/lib/state/agent_provider.dart",method:"resolveAsk",title:"用户点击后恢复异步栈",why:"complete(allow) 让先前 await confirmer 继续；随后清理 pendingAsk。",input:["allow=true 或 false"],watch:["ask.completer.isCompleted"],stack:["UI click","AgentNotifier.resolveAsk"],result:"true：继续 SSH 执行；false：发 Blocked/ToolResult(executed=false) 并回灌拒绝。"},{op:"ASYNC",file:"clients/app/lib/state/agent_provider.dart",method:"_onEvent",title:"事件进入对应主机会话",why:"每个回调携带 hostId，避免用户切换主机后把旧任务事件写到新主机。",watch:["hostId","ev.runtimeType","s.items.last"],stack:["Stream subscription callback","AgentNotifier._onEvent"],result:"更新 ChatItem、门禁统计和审计，Riverpod 通知 AiPane 重建。"},{op:"RETURN",file:"clients/app/lib/state/agent_provider.dart",method:"send",title:"流结束并持久化",why:"onDone 把 running 设为 false、刷新 UI、保存历史；abort 则取消订阅并回滚到 undoMark。",stack:["StreamSubscription.onDone"],result:"本轮对话、工具卡和结论留在对应 hostId 的会话中。"}]}],T=[{title:"三种形态，理念对齐、运行独立",detail:"Java 后端通过 REST + SSE 服务化；Node CLI 用 Ink 在终端内直接连接 SSH 与模型；Flutter 桌面端内置完整能力。三端不互相调用，因此部署灵活，但门禁规则、事件协议和上下文策略需要手动保持一致。",tags:["Spring Boot","Node + Ink","Flutter + Riverpod"]},{title:"手写 Agentic Loop",detail:"核心状态机是“模型决策 → tool_call → 门禁预检 → 工具执行 → tool_result 回灌 → 再请求”。后端关闭 Spring AI 的 internalToolExecutionEnabled，拿回工具执行控制权，才能在不可绕过的位置插入安全门禁。",tags:["Spring AI","Function Calling","状态机"]},{title:"Deny / Ask / Allow 安全硬边界",detail:"命令先匹配不可逆 deny，再匹配有副作用 ask，默认 allow；复合命令按分隔符拆段并取最严结果。安全逻辑不依赖模型自觉，体现“不信任模型输出”的纵深防御。",tags:["正则规则","人工确认","审计"]},{title:"上下文成本治理",detail:"Layer 0 对工具大结果保留头尾并分级截断；Layer 4 超阈值后让 LLM 摘要早期历史，同时避免拆散 tool_call/tool_result。幂等截断和稳定 system/tool schema 有助于命中模型前缀缓存。",tags:["Token 优化","熔断","缓存友好"]},{title:"流式事件驱动 UI",detail:"token、reasoning、tool_call、tool_result、blocked、done、error 等事件被类型化。Java 用 Reactor Flux + SSE，CLI 用 AsyncGenerator，Flutter 用 StreamController；展示层只消费语义事件。",tags:["SSE","Reactor","Async Stream"]},{title:"会话、持久化与审计",detail:"MySQL 保存主机、会话、消息和命令审计；MyBatis-Plus 提供 CRUD。主机密码经 AES-GCM 加密，正式会话采用 lazy-create，避免只进入主机就产生空会话。",tags:["MyBatis-Plus","MySQL","AES-GCM"]}],_=[["1","用户任务","自然语言任务进入当前 SSH 会话"],["2","组装上下文","system prompt + 历史 + 本轮 user，并执行截断/压缩"],["3","模型流式响应","增量输出 token/reasoning，聚合完整 tool_call"],["4","安全门禁","对真实命令执行 DENY → ASK → ALLOW 评估"],["5","工具与审计","SSH/SFTP 执行，记录 stdout、stderr、exitCode 与决策"],["6","结果回灌","tool_result 进入历史；若仍有工具调用则继续循环"],["7","终态输出","无 tool_call 时生成中文结论并发出 done"]],E=[["为什么不用 Spring AI 自动工具循环？","自动执行会把 tool_call 藏在框架内部，无法可靠插入“执行前”门禁。关闭自动执行后，应用能先判定、确认、审计，再显式调用 ToolCallingManager。代价是自己维护状态机、消息配对与异常处理。"],["Agent 的本质是什么？","模型、工具和循环组成的受控状态机。模型负责提出下一步，工具连接真实世界，循环用执行结果修正后续决策；最大轮数、门禁与上下文管理决定它是否可控。"],["为什么门禁不能交给另一个模型？","模型输出是非确定且可被提示注入影响的，不能把硬安全边界交给被防护对象同类。确定性规则适合兜底；生产可叠加沙箱、最小权限、策略引擎和审批流。"],["DENY、ASK、ALLOW 的顺序为什么固定？","先 DENY 保证高危规则拥有最高优先级；再 ASK 处理合法但有副作用的动作；最后才默认 ALLOW。若 ASK 先匹配，rm -rf 可能被降级成人工可批准。"],["上下文为什么会出现 O(N²) 成本？","第 N 轮需要重发前 N-1 轮历史，累计输入量近似 1+2+…+N。工具输出越大，增长越明显，所以要尽早截断旧结果并在阈值后压缩历史。"],["为什么截断保留头 60% 和尾 40%？","命令输出开头常含表头/环境，结尾常含错误总结/最新日志；保留两端比只保留前部更稳。比例是工程启发式，应通过任务集评测调参。"],["为什么 tool_call 与 tool_result 必须成对？","OpenAI 兼容协议要求工具结果通过 tool_call_id 对应助手调用。压缩切割若留下孤儿 tool 消息，模型端会拒绝请求或误解上下文。"],["SSE 为什么适合这里？","服务端到客户端是单向持续推送，天然匹配模型增量输出；基于 HTTP，浏览器和代理支持好，比轮询实时、比 WebSocket 简单。交互式确认若从前端回传则仍需额外 HTTP/WS 通道。"],["Reactor 与阻塞 SSH 如何共存？","对外暴露 Flux，但命令式循环和阻塞调用放到工作线程。这样不占用 Reactor 事件线程；生产更应使用受控线程池、取消传播和背压策略，而不是每请求裸建线程。"],["为什么用 AES-GCM？","GCM 同时提供机密性和完整性，密文被改动会在认证标签校验时失败。12 字节随机 IV 与密文一起存储；同一密钥下 IV 不能重复。"],["为什么还需要审计表？","运维动作影响真实服务器，必须回答谁的会话、何时、想执行什么、是否被拦、最终结果是什么。审计还可复盘门禁规则遗漏。"],["为什么使用 lazy-create 会话？","进入主机只建立预连接，首条任务到来才写 t_session，避免产生大量无标题、无消息的空会话；代价是预连接与正式会话之间需要明确状态迁移。"],["为什么选择 MyBatis-Plus？","实体简单、查询以 CRUD 和条件构造器为主，BaseMapper 能减少 XML 样板，同时保留 SQL 可控性。复杂报表或迁移仍需显式 SQL。"],["三端重复实现的利弊？","优点是 CLI/桌面可离线于后端独立运行、发布边界清楚；缺点是安全规则与协议容易漂移。应以共享测试向量/协议文档/生成代码控制一致性。"],["怎么验证门禁没有被绕过？","建立攻击语料：复合命令、换行、变量展开、base64 解码执行、shell 子命令、find -delete、绝对路径与别名；做跨三端参数化测试，并在受限容器中动态验证。"],["项目最值得讲的取舍是什么？","为了可插拔安全而放弃框架自动循环；为了成本控制而做分层上下文；为了独立客户端而接受三端重复实现。这三处都有明确问题、决策、收益与代价。"]],I=[["P0","SSH 主机指纹校验被关闭","JSch 设置 StrictHostKeyChecking=no，CLI/Flutter 也未体现 known_hosts 校验，存在中间人攻击风险。","引入 known_hosts、首次连接指纹确认与变更告警；生产默认拒绝未知指纹。"],["P0","后端接口与 Actuator 无鉴权","主机管理、Agent 执行、SFTP 和详细健康信息均可能暴露在 8081。","接入 Spring Security、用户/租户隔离、RBAC、CSRF/CORS 策略，并限制管理端点网络边界。"],["P0","路径拼接可形成 Shell 注入","readRemoteFile/tailLog 使用 cat ' + path + '；若路径含单引号即可逃逸。只读工具也因此可能变成写命令。","不要拼 Shell；优先 SFTP 读文件。确需 shell 时使用可靠 shell escaping，并对所有工具输入做策略检查。"],["P1","“长连接保留 cd 上下文”并不成立","JSch 每次 exec 都创建新的 ChannelExec/远端 shell，上一条命令的 cd 通常不会影响下一条。当前注释和会话设计对此有错误假设。","维护显式 workingDirectory 并为每条命令加 cd -- <dir> &&，或使用持久化交互 shell 并处理提示符/并发。"],["P1","后端多工具调用整批拒绝可能破坏消息配对","一批 tool_call 中只要一个被拒，代码仅回灌被拒调用的 tool_result；其余调用没有对应结果，兼容端可能报协议错误。","为本批每个调用都生成结果：被拒项写原因，未执行项写“因同批拦截未执行”；或逐个执行并保持顺序。"],["P1","CLI 流式事件可能重复","runAgent 在第一次 yield pending 后没有清空；执行工具后再次遍历 pending，会重复输出上一批 token/reasoning。","第一次输出后立即 pending.length=0，或改成真正的异步事件通道实时转发。"],["P1","CLI 多轮历史不完整","Chat 结束后只把 user 加入 history；runAgent 内部新增的 assistant/tool 未回写，因此续聊模型看不到完整上一轮。","让 runAgent 返回/原地更新完整历史，参考 Flutter 版 newTurn.addAll 的处理。"],["P1","SSH 命令无超时且输出全量驻内存","JSch 轮询直到 channel 关闭；卡住的命令会永久占线程，大输出会持续增长 ByteArrayOutputStream。","增加命令超时、取消、最大输出字节、流式读取与通道 finally 关闭。"],["P1","并发锁覆盖不完整","SshTools 的 SFTP 写操作使用 LiveSession.lock，但 execCommand/readRemoteFile/tailLog 的 runAndAudit 没有进入同一把锁，仍可能与监控/SFTP争用非线程安全客户端。","所有 SSH/SFTP 操作统一经 withLock；对长 Agent 任务定义锁粒度与公平性。"],["P2","开发默认加密密钥可被误带入生产","未配置 XWSSH_CRYPTO_KEY 时使用源码内固定默认值；SHA-256 直接派生也缺少 salt/成本参数。","生产配置启动时 fail-fast；使用 KMS/Vault 或 Argon2/PBKDF2 派生，支持密钥版本与轮换。"],["P2","规则型门禁可被 Shell 语义绕过","简单正则与 &&/||/|/; 拆分无法覆盖 $()、反引号、变量、编码、别名、脚本文件等语义。","将 SSH 账户最小权限、容器/沙箱、命令白名单、AST 解析、系统调用限制与人工审批组合使用。"],["P2","裸线程 + 无界事件缓冲影响伸缩性","每个流式任务 new Thread，Sinks unicast onBackpressureBuffer 未设明确上限；客户端慢或任务多时会放大资源占用。","使用有界 Executor/Scheduler、限流、队列上限、断连取消与超时。"],["P2","持久化采用 best-effort 可能丢审计","消息/审计写入失败仅告警，主任务继续；体验稳定但合规场景无法保证审计完整。","区分普通消息和强制审计：审计失败时阻止危险执行，配合事务、重试、Outbox 或持久队列。"],["P3","三端规则与默认参数已经漂移","Java maxRounds 默认/配置为 25，CLI/Flutter 常量为 40；上下文阈值也不同，事件种类数量不完全一致。","抽出版本化协议和共享规则测试向量，CI 对三端跑一致性测试。"]];function N({value:e,label:n}){return(0,i.jsxs)("div",{className:"stat",children:[(0,i.jsx)("strong",{children:e}),(0,i.jsx)("span",{children:n})]})}function M(){return(0,i.jsxs)("div",{className:"page",children:[(0,i.jsxs)("section",{className:"hero",children:[(0,i.jsx)("p",{className:"eyebrow",children:"LOWENSSH · 面试准备手册"}),(0,i.jsxs)("h1",{children:["把 AI 的下一步，",(0,i.jsx)("br",{}),(0,i.jsx)("em",{children:"关进可审计的执行链。"})]}),(0,i.jsx)("p",{className:"lead",children:"这不是一份 README 扩写，而是覆盖后端、CLI、Flutter 三端的源码级拆解。适合从项目陈述一路准备到架构追问、源码细节和技术债反思。"}),(0,i.jsxs)("div",{className:"stats",children:[(0,i.jsx)(N,{value:123,label:"纳入文件"}),(0,i.jsx)(N,{value:17322..toLocaleString(),label:"源码总规模"}),(0,i.jsx)(N,{value:680,label:"逻辑代码块"}),(0,i.jsx)(N,{value:"3",label:"独立运行形态"})]})]}),(0,i.jsxs)("section",{children:[
